<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>板标重打 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view pda-view-reprint active" aria-label="板标重打">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" id="rpBackBtn" aria-label="返回">‹</button>
        <span class="pda-subnav-title" id="rpSubnavTitle">板标重打</span>
      </div>

      <!-- 步骤 1：扫板标码 -->
      <div class="pda-scroll" id="view-locate">
        <div class="pda-card">
          <div class="pda-card-title">输入板标码</div>
          <div class="pda-scan-row" style="margin-bottom: 8px;">
            <input type="text" class="pda-input-scan" id="rpScanInput" name="rpScanInput" placeholder="扫码或手输板标码" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
            <span class="pda-btn-cam" aria-hidden="true">📷</span>
          </div>
          <p class="pda-hint" style="margin: 0;">输入任意板标码，回车或扫码后进入确认重打</p>
        </div>

      </div>

      <!-- 步骤 2：确认 + 选原因 + 打印 -->
      <div class="pda-scroll pda-scroll--rp-footer" id="view-confirm" style="display: none;">
        <div class="pda-card pda-rp-plt-card">
          <span class="pda-rp-status-tag pda-rp-st-done" id="cfStatus">已上架</span>
          <div class="pda-rp-card-head" style="padding-right: 64px;">
            <span class="pda-rp-card-plt" id="cfPltNo">PLT-LAX-018</span>
          </div>
          <dl class="pda-meas-meta pda-rp-card-meta">
            <div class="pda-meas-meta-row pda-meas-meta-row--mono"><dt>系统单号</dt><dd id="cfSysNo">SYS20260515018</dd></div>
            <div class="pda-meas-meta-row pda-meas-meta-row--mono"><dt>柜号</dt><dd id="cfContainer">COSU628190</dd></div>
            <div class="pda-meas-meta-row"><dt>客户</dt><dd id="cfCustomer">华东跨境贸易</dd></div>
            <div class="pda-meas-meta-row"><dt>REF</dt><dd id="cfRef">CRN-2026-018</dd></div>
            <div class="pda-meas-meta-row"><dt>件数</dt><dd id="cfPieces">22 件</dd></div>
            <div class="pda-meas-meta-row"><dt>库位</dt><dd id="cfLocation">A-12-03</dd></div>
            <div class="pda-meas-meta-row"><dt>仓库分区</dt><dd id="cfWarehouseZone">A区拣货区</dd></div>
          </dl>
        </div>

        <div class="pda-card" style="margin-top: 12px;">
          <div class="pda-ret-form-field">
            <label class="pda-label">重打原因 <span class="pda-req">*</span></label>
            <div class="pda-rp-reason-grid" id="rpReasonGrid">
              <button type="button" class="pda-rp-reason" data-reason="标签污损">标签污损</button>
              <button type="button" class="pda-rp-reason" data-reason="标签破损">标签破损</button>
              <button type="button" class="pda-rp-reason" data-reason="标签丢失">标签丢失</button>
              <button type="button" class="pda-rp-reason" data-reason="打印失败">打印失败</button>
              <button type="button" class="pda-rp-reason" data-reason="信息变更">信息变更</button>
              <button type="button" class="pda-rp-reason" data-reason="其他">其他</button>
            </div>
          </div>

          <div class="pda-ret-form-field" id="rpRemarkField" style="margin-bottom: 0;">
            <label class="pda-label" for="rpRemark">补充说明<span id="rpRemarkReq" class="pda-req" hidden> *</span></label>
            <textarea id="rpRemark" name="rpRemark" class="pda-input-scan pda-ret-textarea" rows="3" placeholder="可选；如选「其他」请说明原因"></textarea>
          </div>
        </div>
      </div>

      <!-- 底部操作栏 -->
      <div class="pda-footer-actions pda-outpick-confirm-footer" id="rpFooter" style="display: none;">
        <div class="pda-rp-footer-row" id="rpConfirmFooter">
          <button type="button" class="btn btn-default" id="rpCancelBtn">取消</button>
          <button type="button" class="btn btn-primary pda-outpick-btn-finish" id="rpPrintBtn">确认打印</button>
        </div>
      </div>
    </section>
  </main>

  <div class="pda-toast" id="toast" role="status"></div>

  <script src="pda-docs-shared.js"></script>
  <script>
  (function () {
    function $(id) { return document.getElementById(id); }
    function toast(msg) {
      var e = $('toast');
      if (!e) return;
      e.textContent = msg;
      e.classList.add('show');
      clearTimeout(e._t);
      e._t = setTimeout(function () { e.classList.remove('show'); }, 2400);
    }
    function nowStr() {
      var d = new Date();
      function p(n) { return n < 10 ? '0' + n : '' + n; }
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function refreshTime() {
      document.querySelectorAll('.pda-wb-time').forEach(function (el) {
        var d = new Date();
        var hh = d.getHours() < 10 ? '0' + d.getHours() : d.getHours();
        var mm = d.getMinutes() < 10 ? '0' + d.getMinutes() : d.getMinutes();
        el.textContent = hh + ':' + mm;
      });
    }
    refreshTime();
    setInterval(refreshTime, 30000);

    // ---- 固定演示数据 ----
    var DEMO_PALLET = {
      sysNo: 'SYS20260515018',
      container: 'COSU628190',
      customer: '华东跨境贸易',
      ref: 'CRN-2026-018',
      destCode: 'SMF3',
      destType: 'FBA',
      pieces: 22,
      location: 'A-12-03',
      warehouseZone: 'A区拣货区',
      status: '已上架',
      reprintCount: 1,
      lastReprintAt: '2026-05-15 14:22'
    };

    function statusCls(s) {
      if (s === '已上架') return 'pda-rp-st-done';
      if (s === '待出库') return 'pda-rp-st-wait';
      if (s === '已装车') return 'pda-rp-st-loaded';
      return '';
    }

    function buildPalletFromInput(raw) {
      var v = (raw || '').trim();
      if (!v) return null;
      var p = {};
      for (var k in DEMO_PALLET) if (DEMO_PALLET.hasOwnProperty(k)) p[k] = DEMO_PALLET[k];
      p.pltNo = v;
      return p;
    }

    // ---- 状态 ----
    var currentPallet = null;
    var currentReason = '';

    // ---- 视图切换 ----
    function showView(name) {
      ['view-locate', 'view-confirm'].forEach(function (id) {
        $(id).style.display = id === name ? 'block' : 'none';
      });
      var footer = $('rpFooter');
      if (name === 'view-confirm') {
        footer.style.display = 'flex';
        $('rpSubnavTitle').textContent = '确认重打';
      } else {
        footer.style.display = 'none';
        $('rpSubnavTitle').textContent = '板标重打';
      }
    }

    // ---- 步骤 2：确认 ----
    function openPallet(p) {
      if (!p) return;
      currentPallet = p;
      currentReason = '';
      $('cfPltNo').textContent = p.pltNo;
      $('cfSysNo').textContent = p.sysNo;
      $('cfContainer').textContent = p.container;
      $('cfCustomer').textContent = p.customer;
      $('cfRef').textContent = p.ref;
      $('cfPieces').textContent = p.pieces + ' 件';
      $('cfLocation').textContent = p.location;
      $('cfWarehouseZone').textContent = p.warehouseZone;
      $('cfStatus').textContent = p.status;
      $('cfStatus').className = 'pda-rp-status-tag ' + statusCls(p.status);

      $('rpReasonGrid').querySelectorAll('.pda-rp-reason').forEach(function (b) { b.classList.remove('is-on'); });
      $('rpRemark').value = '';
      $('rpRemarkReq').hidden = true;
      showView('view-confirm');
    }

    // ---- 步骤 3：打印完成 ----
    function doPrint() {
      if (!currentPallet) return;
      if (!currentReason) { toast('请选择重打原因'); return; }
      var remark = ($('rpRemark').value || '').trim();
      if (currentReason === '其他' && !remark) { toast('选择「其他」需填写说明'); $('rpRemark').focus(); return; }
      var p = currentPallet;
      var now = nowStr();
      p.reprintCount = (p.reprintCount || 0) + 1;
      p.lastReprintAt = now;
      if (window.PdaDocsShared && window.PdaDocsShared.appendReprintLog) {
        window.PdaDocsShared.appendReprintLog(p.pltNo, {
          time: now,
          reason: currentReason,
          remark: remark,
          printer: 'PRN-LAX-01',
          operator: '小明'
        });
      }

      toast('✅ 打印任务已发送');
      backToLocate();
    }

    function backToLocate() {
      currentPallet = null;
      currentReason = '';
      $('rpScanInput').value = '';
      showView('view-locate');
      setTimeout(function () { $('rpScanInput').focus(); }, 50);
    }

    // ---- 事件绑定 ----
    function onScan() {
      var raw = ($('rpScanInput').value || '').trim();
      if (!raw) { toast('请扫码或输入板标码'); return; }
      openPallet(buildPalletFromInput(raw));
    }

    $('rpScanInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); onScan(); }
    });

    $('rpReasonGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.pda-rp-reason');
      if (!btn) return;
      currentReason = btn.getAttribute('data-reason') || '';
      $('rpReasonGrid').querySelectorAll('.pda-rp-reason').forEach(function (b) { b.classList.remove('is-on'); });
      btn.classList.add('is-on');
      $('rpRemarkReq').hidden = currentReason !== '其他';
    });

    $('rpCancelBtn').addEventListener('click', backToLocate);
    $('rpPrintBtn').addEventListener('click', doPrint);

    $('rpBackBtn').addEventListener('click', function () {
      if ($('view-confirm').style.display !== 'none') {
        backToLocate();
        return;
      }
      window.location.href = 'wms-pda.html';
    });

    // ---- 初始化 ----
    var initPlt = new URLSearchParams(window.location.search).get('plt');
    if (initPlt) {
      $('rpScanInput').value = initPlt;
      openPallet(buildPalletFromInput(initPlt));
    } else {
      setTimeout(function () { $('rpScanInput').focus(); }, 80);
    }
  })();
  </script>
</body>
</html>
