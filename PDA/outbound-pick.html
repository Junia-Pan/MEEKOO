<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>出库备货 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view active" aria-label="出库备货">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" id="pdaBackBtn" aria-label="返回">‹</button>
        <span class="pda-subnav-title">出库备货</span>
      </div>
      <div class="pda-scroll">
        <div style="display: flex; gap: 4px; margin-bottom: 15px;" id="stepIndicator">
            <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--primary);" id="dot-1"></div>
            <div style="flex: 1; height: 4px; border-radius: 2px; background: #e2e8f0;" id="dot-2"></div>
        </div>

        <!-- 步骤 1 -->
        <div id="step-1" style="display: block;">
            <div class="pda-card">
                <div class="pda-card-title">第一步：定位备货单</div>
                <div class="pda-scan-row" style="margin-bottom: 10px;">
                    <input type="text" class="pda-input-scan" id="outPickScan" placeholder="扫码或手输后回车" autocomplete="off" style="height: 42px;">
                    <button type="button" class="btn btn-primary" style="flex-shrink: 0; padding: 0 16px; height: 42px;" onclick="toStep2()">确认</button>
                </div>
            </div>
            <div class="pda-card" style="margin-top: 12px;">
                <div class="pda-card-title" style="margin-bottom: 10px;">待备货任务（点击直接开始）</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div class="pda-wb-tile" onclick="fillAndGo('OUT-20260514-01')" style="min-height: auto; padding: 12px 14px; align-items: flex-start; text-align: left; border-color: #c2dbff; background: #f0f7ff;">
                        <div style="font-size: 13px; font-weight: 700; color: var(--primary); font-family: ui-monospace, Consolas, monospace;">OUT-20260514-01</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">需下架 2 行 · 沃尔玛备货</div>
                    </div>
                    <div class="pda-wb-tile" onclick="fillAndGo('OUT-20260514-02')" style="min-height: auto; padding: 12px 14px; align-items: flex-start; text-align: left;">
                        <div style="font-size: 13px; font-weight: 700; color: var(--text-primary); font-family: ui-monospace, Consolas, monospace;">OUT-20260514-02</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">需下架 5 行 · FBA直送</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 步骤 2 -->
        <div id="step-2" style="display: none;">
            <div class="pda-card">
                <div class="pda-card-title" style="margin-bottom: 4px;">第二步：核对并确认下架行</div>
                <div class="pda-hint" style="margin-bottom: 12px;">系统已推荐下架库位，支持临时扫描其他库位作为补充。</div>
                <ul id="outPickLocSuggest" style="margin:8px 0 12px 18px;font-size: 12px;line-height:1.7;color:var(--text-secondary);">
                   <li>A-02-11（重型货架）</li>
                   <li>B-大件暂存-03</li>
                </ul>
                <div class="pda-card-title" style="margin-bottom: 8px;">本单下架行</div>
                <div id="outPickLines" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;"></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button type="button" class="btn btn-default btn-xs" id="outPickAddLine">＋ 补充临时库位</button>
                  <button type="button" class="btn btn-default btn-xs" id="outPickClearLines">清空调整</button>
                </div>
                <button class="btn btn-primary" style="width: 100%; height: 46px; background: var(--success); border-color: var(--success); font-size: 13px; margin-top: 16px; border-radius: 12px;" onclick="confirmOutPick()">确认备货完成</button>
            </div>
        </div>
      </div>
      <div class="pda-footer-actions" id="bottom-bar" style="display: none; justify-content: space-between; align-items: center; background: var(--sidebar-bg); color: white; border-top: none;">
          <span style="font-size: 12px;">当前单: <span id="stat-pick">OUT-20260514-01</span></span>
          <span id="stat-total" style="font-size: 12px; font-weight: 700;">共 <span id="stat-line-cnt">2</span> 行</span>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>
  
  <!-- 自定义确认弹窗 -->
  <div class="pda-modal-overlay" id="modalPdaConfirm" aria-hidden="true">
    <div class="pda-modal" role="dialog" style="max-width: 300px;">
      <div class="pda-modal-h" id="pdaConfirmTitle" style="text-align: center; border-bottom: none; padding: 20px 16px 0; font-size: 15px;">提示</div>
      <div class="pda-modal-b" id="pdaConfirmBody" style="font-size: 12px; text-align: center; padding: 12px 20px 24px; line-height: 1.5; color: var(--text-secondary);"></div>
      <div class="pda-modal-f" style="display: flex; gap: 10px; border-top: 1px solid var(--border-light); padding: 12px 16px; background: transparent;">
        <button type="button" class="btn btn-default" id="pdaConfirmCancel" style="flex: 1; height: 42px; border-radius: 8px; font-size: 13px;">取消</button>
        <button type="button" class="btn btn-primary" id="pdaConfirmOk" style="flex: 1; height: 42px; border-radius: 8px; font-size: 13px;">确认</button>
      </div>
    </div>
  </div>
  <script>
  (function(){
    function $(id){return document.getElementById(id);}
    function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);}
    function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);

    window.pdaConfirm = function(title, html, cb) {
        var m = $('modalPdaConfirm');
        $('pdaConfirmTitle').textContent = title || '提示';
        $('pdaConfirmBody').innerHTML = html || '';
        m.classList.add('show'); m.setAttribute('aria-hidden', 'false');
        $('pdaConfirmOk').onclick = function() { m.classList.remove('show'); m.setAttribute('aria-hidden', 'true'); if (cb) cb(true); };
        $('pdaConfirmCancel').onclick = function() { m.classList.remove('show'); m.setAttribute('aria-hidden', 'true'); if (cb) cb(false); };
    };

    var outPickLinesData = []; function renderOutPickLines() { var wrap = $('outPickLines'); wrap.innerHTML = ''; outPickLinesData.forEach(function (line) { var b = document.createElement('button'); b.type = 'button'; b.className = 'pda-wb-op-tool'; b.textContent = line + ' ×'; b.addEventListener('click', function () { outPickLinesData = outPickLinesData.filter(function (x) { return x !== line; }); renderOutPickLines(); toast('已移除下架行（原型）'); }); wrap.appendChild(b); }); }
    
    window.toStep1 = function() {
        $('step-1').style.display = 'block'; $('step-2').style.display = 'none';
        $('bottom-bar').style.display = 'none'; $('outPickScan').value = '';
        $('dot-1').style.background = 'var(--primary)'; $('dot-2').style.background = '#e2e8f0';
    };

    window.toStep2 = function() {
        var tkt = ($('outPickScan').value || '').trim();
        if(!tkt) { toast('请输入备货单'); focusSoon('outPickScan'); return; }
        $('stat-pick').textContent = tkt;
        outPickLinesData = ['SKU拣选区-1-1', 'FBA混箱临时位-03'];
        renderOutPickLines(); $('stat-line-cnt').textContent = outPickLinesData.length;
        $('step-1').style.display = 'none'; $('step-2').style.display = 'block';
        $('bottom-bar').style.display = 'flex';
        $('dot-1').style.background = 'var(--primary)'; $('dot-2').style.background = 'var(--primary)';
    };

    window.fillAndGo = function(tkt) { var el = $('outPickScan'); if (el) el.value = tkt; window.toStep2(); };

    $('outPickAddLine').addEventListener('click', function () { outPickLinesData.push('补充下架库位-' + (outPickLinesData.length + 1)); renderOutPickLines(); $('stat-line-cnt').textContent = outPickLinesData.length; toast('已补充下架行'); }); 
    $('outPickClearLines').addEventListener('click', function () { outPickLinesData = []; renderOutPickLines(); $('stat-line-cnt').textContent = 0; toast('已清空下架行调整'); }); 
    window.confirmOutPick = function () { 
        pdaConfirm('确认备货', '当前单共计下架：<strong style="color:var(--primary);">' + outPickLinesData.length + '</strong> 行<br><span style="color:var(--text-muted);font-size: 11px;margin-top:6px;display:block;">确认后将完成此单备货任务。</span>', function(ok) {
            if (ok) { toast('✅ 备货完成'); window.toStep1(); }
        });
    };

    $('pdaBackBtn').addEventListener('click', function() { if ($('step-2').style.display === 'block') window.toStep1(); else window.location.href = 'wms-pda.html'; });

    focusSoon('outPickScan');
  })();
  </script>
</body>
</html>
