<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>货件详情 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view pda-view-docs-ship active" aria-label="货件详情">
      <div class="pda-wb-status" aria-hidden="true"><span class="pda-wb-time">09:41</span></div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" id="backBtn" aria-label="返回">‹</button>
        <span class="pda-subnav-title" id="navTitle">货件详情</span>
      </div>

      <div class="pda-docs-ship-detail" id="view-detail">
        <div class="pda-docs-ship-summary-wrap">
          <div class="pda-card pda-docs-ship-hero" id="dtHero">
            <div class="pda-docs-ship-status-bar" id="dtStatusBar">
              <span class="pda-docs-ship-status" id="dtShipStatus">—</span>
              <button type="button" class="pda-docs-ship-ref pda-docs-ship-copyable" id="dtRef" title="点击复制">—</button>
              <span class="pda-docs-ship-badge pda-docs-ship-badge--split" id="dtSplitBadge" hidden>拆分</span>
            </div>

            <div class="pda-docs-ship-metrics" id="dtMetrics" hidden>
              <div class="pda-docs-ship-metric">
                <span class="pda-docs-ship-metric-n" id="dtKvCount">—</span>
                <span class="pda-docs-ship-metric-u">板数 / 件数</span>
              </div>
              <div class="pda-docs-ship-metric pda-docs-ship-metric--grow">
                <span class="pda-docs-ship-metric-n pda-docs-ship-metric-n--sm pda-docs-ship-stock" id="dtKvStock">
                  <span class="pda-docs-ship-stock-wh">—</span>
                  <span class="pda-docs-ship-stock-sep" aria-hidden="true"></span>
                  <span class="pda-docs-ship-stock-zones">—</span>
                </span>
                <span class="pda-docs-ship-metric-u">仓库 / 库区</span>
              </div>
            </div>

            <div class="pda-docs-ship-base" aria-label="基础信息">
              <div class="pda-docs-ship-base-grid">
                <div class="pda-docs-ship-field">
                  <span class="pda-docs-ship-field-k">客户名称</span>
                  <span class="pda-docs-ship-field-v" id="dtKvCustomer">—</span>
                </div>
                <div class="pda-docs-ship-field">
                  <span class="pda-docs-ship-field-k">拆柜日期</span>
                  <span class="pda-docs-ship-field-v pda-docs-ship-field-v--mono" id="dtKvDevan">—</span>
                </div>
                <div class="pda-docs-ship-field">
                  <span class="pda-docs-ship-field-k">Move Type</span>
                  <span class="pda-docs-ship-field-v" id="dtKvMove">—</span>
                </div>
                <div class="pda-docs-ship-field" id="dtMoveOrigField">
                  <span class="pda-docs-ship-field-k">原 Move Type</span>
                  <span class="pda-docs-ship-field-v" id="dtKvMoveOrig">—</span>
                </div>
                <div class="pda-docs-ship-field">
                  <span class="pda-docs-ship-field-k">FBA Code</span>
                  <span class="pda-docs-ship-field-v pda-docs-ship-field-v--mono" id="dtKvFba">—</span>
                </div>
                <div class="pda-docs-ship-field">
                  <span class="pda-docs-ship-field-k">柜号</span>
                  <span class="pda-docs-ship-field-v pda-docs-ship-field-v--mono" id="dtKvContainer">—</span>
                </div>
                <div class="pda-docs-ship-field pda-docs-ship-field--span2">
                  <span class="pda-docs-ship-field-k">系统单号</span>
                  <span class="pda-docs-ship-field-v pda-docs-ship-field-v--mono" id="dtKvSysNo">—</span>
                </div>
              </div>
            </div>
          </div>

          <div id="dtBlock" class="pda-docs-ship-block" hidden></div>
          <button type="button" id="dtMergeEntry" class="pda-docs-ship-merge-entry" hidden>
            <span class="pda-docs-ship-merge-entry-t" id="dtMergeEntryLabel">合并打板单号（0）</span>
            <span class="pda-docs-ship-merge-entry-go" aria-hidden="true">›</span>
          </button>
          <div id="dtSplit" class="pda-docs-ship-split" hidden></div>
        </div>

        <div class="pda-docs-ship-sticky" id="dtSticky">
          <div class="pda-docs-ship-tabs" id="dtTabs" role="tablist">
            <button type="button" class="pda-docs-ship-tab active" data-tab="pallet" role="tab" aria-selected="true">板标 <span class="pda-docs-ship-tab-count" id="dtTabPltCount">0</span></button>
            <button type="button" class="pda-docs-ship-tab" data-tab="ticket" role="tab" aria-selected="false">工单 <span class="pda-docs-ship-tab-count" id="dtTabTkCount">0</span></button>
            <button type="button" class="pda-docs-ship-tab" data-tab="issue" role="tab" aria-selected="false">问题件 <span class="pda-docs-ship-tab-count" id="dtTabIssCount">0</span></button>
          </div>
          <div class="pda-docs-ship-plt-filter" id="dtPltFilter" role="group" aria-label="板标筛选">
            <button type="button" class="pda-docs-ship-plt-chip active" data-plt-filter="all">全部 <span id="dtPltCntAll">0</span></button>
            <button type="button" class="pda-docs-ship-plt-chip" data-plt-filter="pending">待上架 <span id="dtPltCntPending">0</span></button>
            <button type="button" class="pda-docs-ship-plt-chip" data-plt-filter="shelved">已上架 <span id="dtPltCntShelved">0</span></button>
            <button type="button" class="pda-docs-ship-plt-chip" data-plt-filter="outbound">已出库 <span id="dtPltCntOutbound">0</span></button>
          </div>
        </div>

        <div class="pda-docs-ship-body">
          <div id="dtPalletPanel" class="pda-docs-ship-panel active" role="tabpanel">
            <div class="pda-docs-ship-list-scroll">
              <div id="dtPalletList" class="pda-meas-pending-list"></div>
              <p id="dtPalletEmpty" class="pda-hint pda-docs-ship-empty" hidden>该筛选下暂无板标</p>
            </div>
          </div>

          <div id="dtTicketPanel" class="pda-docs-ship-panel" role="tabpanel" hidden>
            <div class="pda-docs-ship-list-scroll">
              <div id="dtTicketList" class="pda-docs-ship-rel-list"></div>
              <p id="dtTicketEmpty" class="pda-hint pda-docs-ship-empty" hidden>暂无关联工单</p>
            </div>
          </div>

          <div id="dtIssuePanel" class="pda-docs-ship-panel" role="tabpanel" hidden>
            <div class="pda-docs-ship-list-scroll">
              <div id="dtIssueList" class="pda-docs-ship-rel-list"></div>
              <p id="dtIssueEmpty" class="pda-hint pda-docs-ship-empty" hidden>暂无关联问题件</p>
            </div>
          </div>
        </div>

        <div id="dtNotFound" class="pda-card pda-docs-ship-notfound" style="display: none;">
          <p class="pda-hint" style="margin: 0; text-align: center;">未找到该 Customer REF No</p>
        </div>
      </div>
    </section>
  </main>
  <div class="pda-modal-overlay pda-sheet-overlay pda-docs-ship-merge-sheet" id="modalMergeRefs" aria-hidden="true">
    <div class="pda-sheet" role="dialog" aria-labelledby="mergeSheetTitle">
      <div class="pda-sheet-handle" aria-hidden="true"></div>
      <div class="pda-sheet-hd">
        <div class="pda-sheet-title" id="mergeSheetTitle">合并打板单号</div>
        <button type="button" class="pda-sheet-close" id="mergeSheetClose" aria-label="关闭">×</button>
      </div>
      <div class="pda-sheet-body pda-docs-ship-merge-sheet-list" id="mergeSheetList"></div>
    </div>
  </div>
  <div class="pda-toast" id="toast" role="status"></div>
  <script src="pda-docs-shared.js"></script>
  <script>
  (function () {
    var S = window.PdaDocsShared;
    if (!S) return;
    function $(id) { return document.getElementById(id); }

    function toast(msg) {
      var e = $('toast');
      e.textContent = msg;
      e.classList.add('show');
      clearTimeout(e._t);
      e._t = setTimeout(function () { e.classList.remove('show'); }, 2600);
    }

    function refreshTime() {
      document.querySelectorAll('.pda-wb-time').forEach(function (el) {
        var d = new Date();
        el.textContent = (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
      });
    }
    refreshTime();
    setInterval(refreshTime, 30000);

    var queryRef = '';
    var activeTab = 'pallet';
    var palletFilter = 'all';
    var currentShipment = null;

    function fmtDateField(raw) {
      var t = String(raw || '').trim();
      if (!t) return '';
      var m = t.match(/^(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : t;
    }

    /** 板标状态归入三大类：pending / shelved / outbound */
    function palletBucket(status) {
      var s = String(status || '').trim();
      if (s === '已出库' || s === '已装车' || s === '已送达' || s === '已签收') return 'outbound';
      if (s === '待上架' || s === '待测量' || s === '测量中' || s === '拆柜中') return 'pending';
      return 'shelved';
    }

    function palletBucketLabel(status) {
      var b = palletBucket(status);
      if (b === 'pending') return '待上架';
      if (b === 'outbound') return '已出库';
      return '已上架';
    }

    function palletBucketCls(status) {
      var b = palletBucket(status);
      if (b === 'pending') return 'pda-rp-st-wait';
      if (b === 'outbound') return 'pda-rp-st-loaded';
      return 'pda-rp-st-done';
    }

    function filterPallets(pallets, filter) {
      var list = pallets || [];
      if (filter === 'all') return list.slice();
      return list.filter(function (p) { return palletBucket(p.status) === filter; });
    }

    function palletEmptyText(filter, total) {
      if (!total) return '该 REF 下暂无板标';
      if (filter === 'pending') return '暂无待上架板标';
      if (filter === 'shelved') return '暂无已上架板标';
      if (filter === 'outbound') return '暂无已出库板标';
      return '该筛选下暂无板标';
    }

    function syncPltFilterUi() {
      document.querySelectorAll('.pda-docs-ship-plt-chip').forEach(function (btn) {
        var on = btn.getAttribute('data-plt-filter') === palletFilter;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function renderPalletList(shipment) {
      var list = $('dtPalletList');
      var empty = $('dtPalletEmpty');
      var all = (shipment && shipment.pallets) || [];
      var pending = filterPallets(all, 'pending');
      var shelved = filterPallets(all, 'shelved');
      var outbound = filterPallets(all, 'outbound');
      $('dtPltCntAll').textContent = String(all.length);
      $('dtPltCntPending').textContent = String(pending.length);
      $('dtPltCntShelved').textContent = String(shelved.length);
      $('dtPltCntOutbound').textContent = String(outbound.length);
      $('dtTabPltCount').textContent = String(all.length);
      syncPltFilterUi();

      var shown = filterPallets(all, palletFilter);
      if (!shown.length) {
        list.innerHTML = '';
        empty.textContent = palletEmptyText(palletFilter, all.length);
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      list.innerHTML = shown.map(function (p) {
        return palletRowHtml(p);
      }).join('');
    }

    function setText(id, val) {
      var el = $(id);
      if (!el) return;
      el.textContent = val && String(val).trim() ? String(val) : '—';
    }

    function setStock(warehouse, zones) {
      var root = $('dtKvStock');
      if (!root) return;
      var whEl = root.querySelector('.pda-docs-ship-stock-wh');
      var znEl = root.querySelector('.pda-docs-ship-stock-zones');
      var wh = String(warehouse || '').trim() || '—';
      var zn = String(zones || '').trim() || '—';
      if (whEl) whEl.textContent = wh;
      if (znEl) znEl.textContent = zn;
    }

    function applyHeroTone(shipment) {
      var hero = $('dtHero');
      var bar = $('dtStatusBar');
      var tone = 'default';
      if (shipment && shipment.block) tone = 'alert';
      else if (shipment && shipment.shipStatus) {
        tone = S.shipStatusCls(shipment.shipStatus).replace('pda-docs-ship-st--', '') || 'default';
      }
      hero.className = 'pda-card pda-docs-ship-hero pda-docs-ship-hero--' + tone;
      bar.className = 'pda-docs-ship-status-bar pda-docs-ship-status-bar--' + tone;
    }

    function blockKindLabel(kind) {
      if (kind === 'hold') return '留仓拦截';
      if (kind === 'issue') return '问题件';
      if (kind === 'ticket') return '待处理工单';
      return '需关注';
    }

    function renderBlock(block) {
      var el = $('dtBlock');
      if (!block || !block.text) {
        el.hidden = true;
        el.innerHTML = '';
        el.className = 'pda-docs-ship-block';
        return;
      }
      var kind = block.kind || 'issue';
      el.hidden = false;
      el.className = 'pda-docs-ship-block pda-docs-ship-block--' + kind;
      var ticket = block.ticketId
        ? '<a class="pda-docs-ship-block-ticket" href="work-order.html?tk=' + encodeURIComponent(block.ticketId) + '">' +
            S.escapeHtml(block.ticketId) + '</a>'
        : '';
      el.innerHTML =
        '<div class="pda-docs-ship-block-head">' +
          '<span class="pda-docs-ship-block-kind">' + S.escapeHtml(block.label || blockKindLabel(kind)) + '</span>' +
          ticket +
        '</div>' +
        '<div class="pda-docs-ship-block-text">' + S.escapeHtml(block.text) + '</div>';
    }

    function openMergeSheet() {
      var modal = $('modalMergeRefs');
      if (!modal) return;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeMergeSheet() {
      var modal = $('modalMergeRefs');
      if (!modal) return;
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
    }

    function renderMerge(shipment) {
      var entry = $('dtMergeEntry');
      var list = $('mergeSheetList');
      if (!shipment || !shipment.mergePallet) {
        entry.hidden = true;
        list.innerHTML = '';
        closeMergeSheet();
        return;
      }
      var refs = shipment.mergeRefs || [];
      var count = refs.length || 1;
      var selfRef = String(shipment.ref || '').toUpperCase();
      entry.hidden = false;
      $('dtMergeEntryLabel').textContent = '合并打板单号（' + count + '）';
      $('mergeSheetTitle').textContent = '合并打板单号（' + count + '）';
      list.innerHTML = refs.map(function (r) {
        var isSelf = String(r).toUpperCase() === selfRef;
        return '<button type="button" class="pda-docs-ship-merge-ref pda-docs-ship-copyable" data-copy="' +
          S.escapeHtml(r) + '" title="点击复制">' +
          '<span class="pda-docs-ship-merge-ref-no">' + S.escapeHtml(r) + '</span>' +
          (isSelf ? '<span class="pda-docs-ship-merge-self">本票</span>' : '') +
        '</button>';
      }).join('');
    }

    function renderSplit(split) {
      var el = $('dtSplit');
      var badge = $('dtSplitBadge');
      if (!split || !split.bol) {
        el.hidden = true;
        el.innerHTML = '';
        badge.hidden = true;
        return;
      }
      badge.hidden = false;
      el.hidden = false;
      var count = (split.palletCount != null && split.totalPallets != null)
        ? '（' + split.palletCount + '/' + split.totalPallets + ' 板）'
        : '';
      var siblings = (split.siblings || []).map(function (s) {
        return S.escapeHtml(s.bol) + (s.palletCount != null ? ' · ' + s.palletCount + ' 板' : '');
      }).filter(Boolean);
      var sibHtml = siblings.length
        ? '<div class="pda-docs-ship-split-sibs">其他子单：' + siblings.join('；') + '</div>'
        : '';
      el.innerHTML =
        '<div class="pda-docs-ship-split-title">拆分发货 · 本票 <span class="pda-docs-ship-split-bol">' +
          S.escapeHtml(split.bol) + '</span> ' + count + '</div>' + sibHtml;
    }

    function renderBaseInfo(shipment) {
      var metrics = $('dtMetrics');
      if (!shipment) {
        metrics.hidden = true;
        setText('dtKvCustomer', '—');
        setText('dtKvDevan', '—');
        setText('dtKvMove', '—');
        setText('dtKvMoveOrig', '—');
        $('dtMoveOrigField').hidden = true;
        setText('dtKvFba', '—');
        setText('dtKvCount', '—');
        setStock('—', '—');
        setText('dtKvContainer', '—');
        setText('dtKvSysNo', '—');
        return;
      }
      metrics.hidden = false;
      setText('dtKvCustomer', shipment.customer);
      setText('dtKvDevan', fmtDateField(shipment.milestones && shipment.milestones.devanningReportAt) || '—');
      setText('dtKvMove', shipment.moveType);
      var move = String(shipment.moveType || '').trim();
      var moveOrig = String(shipment.originalMoveType || '').trim();
      var showMoveOrig = !!(moveOrig && moveOrig !== move);
      $('dtMoveOrigField').hidden = !showMoveOrig;
      setText('dtKvMoveOrig', showMoveOrig ? moveOrig : '—');
      setText('dtKvFba', shipment.fbaCode);
      setText('dtKvCount', (shipment.palletCount != null ? shipment.palletCount : '—') + ' 板 · ' +
        (shipment.totalPieces != null ? shipment.totalPieces : '—') + ' 件');
      setStock(shipment.warehouse || '—', shipment.zoneSummary || '—');
      setText('dtKvContainer', shipment.container);
      setText('dtKvSysNo', shipment.sysNo);
    }

    function palletRowHtml(p) {
      var isOut = palletBucket(p.status) === 'outbound';
      var timeLabel = isOut ? '出库时间' : '上架时间';
      var timeVal = isOut ? S.fmtDateTime(p.outboundAt) : S.fmtDateTime(p.inboundAt);
      return '<div class="pda-meas-pending-item pda-docs-ship-plt-row">' +
        '<div class="pda-docs-ship-plt-top">' +
          '<span class="pda-docs-ship-plt-no">' + S.escapeHtml(p.pltNo || '—') + '</span>' +
          '<span class="pda-docs-ship-plt-st ' + palletBucketCls(p.status) + '">' + S.escapeHtml(palletBucketLabel(p.status)) + '</span>' +
        '</div>' +
        '<div class="pda-docs-ship-plt-grid">' +
          '<div class="pda-docs-ship-field">' +
            '<span class="pda-docs-ship-field-k">所在分区</span>' +
            '<span class="pda-docs-ship-field-v">' + S.escapeHtml(p.zone || '—') + '</span>' +
          '</div>' +
          '<div class="pda-docs-ship-field">' +
            '<span class="pda-docs-ship-field-k">所在库位</span>' +
            '<span class="pda-docs-ship-field-v pda-docs-ship-field-v--mono">' + S.escapeHtml(p.location || '—') + '</span>' +
          '</div>' +
          '<div class="pda-docs-ship-field">' +
            '<span class="pda-docs-ship-field-k">件数</span>' +
            '<span class="pda-docs-ship-field-v">' + S.escapeHtml(p.pieces != null ? p.pieces : '—') + ' 件</span>' +
          '</div>' +
          '<div class="pda-docs-ship-field">' +
            '<span class="pda-docs-ship-field-k">' + timeLabel + '</span>' +
            '<span class="pda-docs-ship-field-v pda-docs-ship-field-v--mono">' + S.escapeHtml(timeVal) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function relRowHtml(item) {
      return '<div class="pda-docs-ship-rel-item">' +
        '<div class="pda-docs-ship-rel-head">' +
          '<span class="pda-docs-ship-rel-id">' + S.escapeHtml(item.id || '—') + '</span>' +
          '<span class="pda-docs-ship-rel-status">' + S.escapeHtml(item.status || '—') + '</span>' +
        '</div>' +
        '<div class="pda-docs-ship-rel-title">' + S.escapeHtml(item.title || '—') + '</div>' +
        (item.desc ? '<div class="pda-docs-ship-rel-desc">' + S.escapeHtml(item.desc) + '</div>' : '') +
        (item.at ? '<div class="pda-docs-ship-rel-time">' + S.escapeHtml(S.fmtDateTime(item.at)) + '</div>' : '') +
      '</div>';
    }

    function renderRelList(listId, emptyId, tabCountId, items) {
      var list = $(listId);
      var empty = $(emptyId);
      var count = (items || []).length;
      $(tabCountId).textContent = String(count);
      if (!count) {
        list.innerHTML = '';
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      list.innerHTML = items.map(function (it) {
        return relRowHtml(it);
      }).join('');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.pda-docs-ship-tab').forEach(function (btn) {
        var on = btn.getAttribute('data-tab') === tab;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      $('dtPalletPanel').classList.toggle('active', tab === 'pallet');
      $('dtPalletPanel').hidden = tab !== 'pallet';
      $('dtTicketPanel').classList.toggle('active', tab === 'ticket');
      $('dtTicketPanel').hidden = tab !== 'ticket';
      $('dtIssuePanel').classList.toggle('active', tab === 'issue');
      $('dtIssuePanel').hidden = tab !== 'issue';
      $('dtPltFilter').hidden = tab !== 'pallet';
      $('dtSticky').classList.toggle('pda-docs-ship-sticky--pallet', tab === 'pallet');
    }

    function renderDetail(shipment) {
      currentShipment = shipment;
      var summaryWrap = $('view-detail').querySelector('.pda-docs-ship-summary-wrap');
      if (!shipment) {
        $('dtRef').textContent = queryRef || '—';
        $('dtRef').removeAttribute('data-copy');
        $('dtShipStatus').textContent = '—';
        $('dtShipStatus').className = 'pda-docs-ship-status';
        $('dtSplitBadge').hidden = true;
        applyHeroTone(null);
        renderBaseInfo(null);
        renderBlock(null);
        renderMerge(null);
        renderSplit(null);
        $('dtTabPltCount').textContent = '0';
        $('dtPltCntAll').textContent = '0';
        $('dtPltCntPending').textContent = '0';
        $('dtPltCntShelved').textContent = '0';
        $('dtPltCntOutbound').textContent = '0';
        $('dtTabTkCount').textContent = '0';
        $('dtTabIssCount').textContent = '0';
        $('dtPalletList').innerHTML = '';
        $('dtPalletEmpty').hidden = true;
        $('dtTicketList').innerHTML = '';
        $('dtTicketEmpty').hidden = true;
        $('dtIssueList').innerHTML = '';
        $('dtIssueEmpty').hidden = true;
        $('dtNotFound').style.display = 'block';
        $('dtSticky').style.display = 'none';
        $('view-detail').querySelector('.pda-docs-ship-body').style.display = 'none';
        summaryWrap.style.display = 'none';
        return;
      }

      $('dtNotFound').style.display = 'none';
      summaryWrap.style.display = 'block';
      $('dtSticky').style.display = '';
      $('view-detail').querySelector('.pda-docs-ship-body').style.display = '';

      $('dtRef').textContent = shipment.ref;
      $('dtRef').setAttribute('data-copy', shipment.ref);
      var stEl = $('dtShipStatus');
      stEl.textContent = shipment.shipStatus || '—';
      stEl.className = 'pda-docs-ship-status ' + S.shipStatusCls(shipment.shipStatus);
      applyHeroTone(shipment);

      renderBaseInfo(shipment);
      renderBlock(shipment.block);
      renderMerge(shipment);
      renderSplit(shipment.split);

      renderRelList('dtTicketList', 'dtTicketEmpty', 'dtTabTkCount', shipment.tickets);
      renderRelList('dtIssueList', 'dtIssueEmpty', 'dtTabIssCount', shipment.issues);
      renderPalletList(shipment);

      switchTab(activeTab);
    }

    function loadShipment(raw) {
      queryRef = (raw || '').trim();
      palletFilter = 'all';
      var route = S.routeDocsQuery(queryRef);
      if (!route.ok) {
        toast(route.message);
        return;
      }
      renderDetail(S.getShipmentByRef(queryRef));
    }

    function onCopyClick(el) {
      var text = el.getAttribute('data-copy') || el.textContent;
      S.copyText(text).then(function (ok) {
        toast(ok ? '已复制' : '复制失败');
      });
    }

    $('backBtn').addEventListener('click', function () {
      window.location.href = 'wms-pda.html?tab=docs';
    });
    document.querySelectorAll('.pda-docs-ship-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        switchTab(btn.getAttribute('data-tab'));
      });
    });
    $('dtMergeEntry').addEventListener('click', function () {
      openMergeSheet();
    });
    $('mergeSheetClose').addEventListener('click', closeMergeSheet);
    $('modalMergeRefs').addEventListener('click', function (e) {
      if (e.target === $('modalMergeRefs')) closeMergeSheet();
    });
    $('mergeSheetList').addEventListener('click', function (e) {
      var t = e.target.closest('.pda-docs-ship-copyable');
      if (!t || !t.getAttribute('data-copy')) return;
      e.preventDefault();
      onCopyClick(t);
    });
    $('dtPltFilter').addEventListener('click', function (e) {
      var chip = e.target.closest('.pda-docs-ship-plt-chip');
      if (!chip) return;
      var next = chip.getAttribute('data-plt-filter');
      if (!next || next === palletFilter) return;
      palletFilter = next;
      renderPalletList(currentShipment);
    });
    $('view-detail').addEventListener('click', function (e) {
      var t = e.target.closest('.pda-docs-ship-copyable');
      if (!t || !t.getAttribute('data-copy')) return;
      e.preventDefault();
      onCopyClick(t);
    });

    var q = new URLSearchParams(window.location.search).get('q') || '';
    if (!q) {
      window.location.replace('wms-pda.html?tab=docs');
    } else {
      loadShipment(q);
    }
  })();
  </script>
</body>
</html>
