<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meekoo 美库转运系统 - 首页</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <header class="pda-topbar">
    <div class="pda-topbar-brand">
      <div class="pda-topbar-icon">M</div>
      <div>
        <div class="pda-topbar-title">仓库 PDA</div>
        <div class="pda-topbar-sub">MEEKOO · WMS</div>

    <div class="pda-lang-wrap">

      <div class="pda-lang-pop" id="langPop" role="menu">
        <button type="button" data-lang-action="current">中文（当前）</button>
        <button type="button" class="muted" data-lang-action="stub-en">English</button>
        <button type="button" class="muted" data-lang-action="stub-jp">日本語</button>
      </div>
    </div>
  </header>

  <main class="pda-main">
    <!-- 工作台首页 -->

      <div class="pda-wb-scroll pda-wb-scroll--floor">

            </div>
            <div class="pda-wb-tile-grid pda-wb-tile-grid--3">

                <span class="pda-wb-tile-name">到仓确认</span>
                <span class="pda-wb-tile-desc">扫柜号/单号<br>拍到仓照片</span>

              <button type="button" class="pda-wb-tile" data-go="print-pallet">

  <script src="pda-docs-shared.js"></script>
  <script>
(function () {
  var STORAGE_WH = 'pda.prototype.warehouseId';

  var warehouses = [
    { id: 'wh-lax1', name: '美库洛杉矶仓' },
    { id: 'wh-nj1', name: '美东 NJ 集货仓' },
    { id: 'wh-yiwu', name: '义乌监管仓' }
  ];

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function formatNow() {
    var d = new Date();
    function z(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' +
      z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
  }

  function refreshWbTime() {
    var nodes = document.querySelectorAll('.pda-wb-time');
    if (!nodes.length) return;
    var d = new Date();
    function z(n) { return n < 10 ? '0' + n : '' + n; }
    var t = z(d.getHours()) + ':' + z(d.getMinutes());
    nodes.forEach(function (el) { el.textContent = t; });
  }

  function setWbTab(tab) {
    document.querySelectorAll('[data-wb-tab]').forEach(function (btn) {
      var is = btn.getAttribute('data-wb-tab') === tab;
      btn.classList.toggle('pda-wb-tab--active', is);
      if (is) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
  }

  function showView(id) {
    document.querySelectorAll('.pda-view').forEach(function (v) {
      v.classList.toggle('active', v.id === id);
    });
    if (id === 'view-home') {
      setWbTab('home');
      refreshWbTime();
    } else if (id === 'view-docs') {
      setWbTab('docs');
      refreshWbTime();
    } else if (id === 'view-me') {
      setWbTab('me');
      refreshWbTime();
          syncMeProfile();
    }
  }

  function syncMeProfile() {
    var els = [$('meUserName'), $('pdaUserNameHome'), $('pdaUserNameDocs')];
    var u = '小明';
    try {
      var saved = localStorage.getItem('pda.login.username');
      if (saved && saved.trim()) u = saved.trim();
    } catch (e) {}
    els.forEach(function (el) {
      if (el) el.textContent = u;
    });
  }

  function currentWarehouse() {
    var sel = $('warehouseSelect') || $('warehouseSelectDocs');
    if (!sel) return warehouses[0];
    var id = sel.value || warehouses[0].id;
    for (var i = 0; i < warehouses.length; i++) {
      if (warehouses[i].id === id) return warehouses[i];
    }
    return warehouses[0];
  }

  function syncWarehouseSelects(sourceId, value) {
    var a = $('warehouseSelect');
    var b = $('warehouseSelectDocs');
    if (a && a.id !== sourceId) a.value = value;
    if (b && b.id !== sourceId) b.value = value;
  }

  function initWarehouse() {
    var opts = warehouses.map(function (w) {
      return '<option value="' + w.id + '">' + w.name + '</option>';
    }).join('');
    var selHome = $('warehouseSelect');
    var selDocs = $('warehouseSelectDocs');
    if (selHome) selHome.innerHTML = opts;
    if (selDocs) selDocs.innerHTML = opts;
    try {
      var saved = localStorage.getItem(STORAGE_WH);
      var ok = false;
      if (saved) {
        for (var j = 0; j < warehouses.length; j++) { if (warehouses[j].id === saved) { ok = true; break; } }
      }
      if (ok) {
        if (selHome) selHome.value = saved;
        if (selDocs) selDocs.value = saved;
      }
    } catch (e) {}
    function onWhChange(el) {
      try { localStorage.setItem(STORAGE_WH, el.value); } catch (e2) {}
      syncWarehouseSelects(el.id, el.value);
      toast('已切换仓库：' + currentWarehouse().name);
    }
    if (selHome) selHome.addEventListener('change', function () { onWhChange(selHome); });
    if (selDocs) selDocs.addEventListener('change', function () { onWhChange(selDocs); });
  }

  function setHomeWorkbenchSeg(seg) {
    var opsPanel = $('homePanelOps');
    var exPanel = $('homePanelEx');
    var isEx = seg === 'ex';
    document.querySelectorAll('[data-home-seg]').forEach(function (btn) {
      var on = btn.getAttribute('data-home-seg') === seg;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (opsPanel) {
      opsPanel.hidden = isEx;
    }
    if (exPanel) {
      exPanel.hidden = !isEx;
    }
  }

  function initWorkbench() {
    refreshWbTime();
    setInterval(refreshWbTime, 30000);

    document.querySelectorAll('[data-home-seg]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setHomeWorkbenchSeg(btn.getAttribute('data-home-seg') || 'ops');
      });
    });
    setHomeWorkbenchSeg('ops');

    document.querySelectorAll('[data-wb-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.getAttribute('data-wb-action') !== 'stub') return;
        toast((btn.getAttribute('data-stub') || '该功能') + '建设中');
      });
    });

    document.querySelectorAll('[data-wb-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tab = btn.getAttribute('data-wb-tab');
        if (tab === 'home') showView('view-home');
        else if (tab === 'docs') showView('view-docs');
        else if (tab === 'me') showView('view-me');
      });
    });
  }

  function docsNavigate(page, q) {
    var url = page + (q ? ('?q=' + encodeURIComponent(q)) : '');
    window.location.href = url;
  }

  function runDocsQuery(q) {
    q = (q || '').trim();
    if (!q) { toast('请输入 Customer Ref No'); return; }
    if (window.PdaDocsShared && window.PdaDocsShared.routeDocsQuery) {
      var route = window.PdaDocsShared.routeDocsQuery(q);
      if (!route.ok) {
        toast(route.message);
        return;
      }
      docsNavigate(route.page, route.ref);
      return;
    }
    docsNavigate('docs-shipment.html', q);
  }

  function initDocsAndMe() {
    var refBtn = $('docsRefQuery');
    var refInput = $('docsRefInput');
    if (refBtn && refInput) {
      refBtn.addEventListener('click', function () { runDocsQuery(refInput.value); });
      refInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); refBtn.click(); }
      });
    }

    document.querySelectorAll('[data-me-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var a = btn.getAttribute('data-me-action');
        if (a === 'about') toast('Meekoo PDA VERSION 2.4.0');
      });
    });
  }

  /* ── 语言占位 ── */
  var langBtn = $('langBtn');
  var langPop = $('langPop');
  langBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = langPop.classList.toggle('open');
    langBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function () {
    langPop.classList.remove('open');
    langBtn.setAttribute('aria-expanded', 'false');
  });
  langPop.addEventListener('click', function (e) { e.stopPropagation(); });
  langPop.querySelectorAll('button[data-lang-action]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var act = btn.getAttribute('data-lang-action');
      langPop.classList.remove('open');
      langBtn.setAttribute('aria-expanded', 'false');
      if (act === 'current') {
        toast('当前语言：中文');
        return;
      }
      $('modalLang').classList.add('show');
      $('modalLang').setAttribute('aria-hidden', 'false');
    });
  });

  document.querySelectorAll('[data-close-modal]').forEach(function (b) {
    b.addEventListener('click', function () {
      $('modalLang').classList.remove('show');
      $('modalLang').setAttribute('aria-hidden', 'true');
    });
  });

  /* ── 首页导航 ── */
  document.querySelectorAll('[data-go]').forEach(function (tile) {
    tile.addEventListener('click', function () {
      var go = tile.getAttribute('data-go');
          window.location.href = go + '.html';
    });
  });
  initWarehouse();
  initWorkbench();
  initDocsAndMe();
  syncMeProfile();
  var tabParam = new URLSearchParams(window.location.search).get('tab');
  if (tabParam === 'docs') showView('view-docs');
  else showView('view-home');
})();
  </script>
</body>
</html>
