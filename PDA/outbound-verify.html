<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>装车复核 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view active" aria-label="装车复核">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" data-back aria-label="返回">‹</button>
        <span class="pda-subnav-title">装车复核</span>
      </div>
      <div class="pda-scroll">
        <div class="pda-card">
          <div class="pda-label">备货单号</div>
          <div class="pda-scan-row">
            <input type="text" class="pda-input-scan" id="verPickScan" placeholder="扫描备货单…" autocomplete="off">
            <button type="button" class="pda-btn-cam" data-cam-placeholder="装车复核-备货单">📷</button>
          </div>
        </div>
        <div class="pda-card" id="verPlateCard" style="display:none;">
          <div class="pda-label">应扫板标</div>
          <div id="verExpected" style="font-size:13px;color:var(--text-muted);margin-bottom:10px;"></div>
          <div class="pda-label">扫实物板标核销</div>
          <div class="pda-scan-row">
            <input type="text" class="pda-input-scan" id="verPlateScan" placeholder="逐一扫描板标…" autocomplete="off">
            <button type="button" class="pda-btn-cam" data-cam-placeholder="装车复核-板标">📷</button>
          </div>
          <div class="pda-label" style="margin-top:12px;">已核销</div>
          <div id="verScannedList" style="font-size:14px;line-height:1.8;color:var(--text-primary);min-height:2em;"></div>
        </div>
      </div>
      <div class="pda-footer-actions">
        <button type="button" class="btn btn-default" id="verReset">重置</button>
        <button type="button" class="btn btn-primary" id="verSubmit" disabled>提交装车复核</button>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>
  <div class="pda-modal-overlay" id="modalCam" aria-hidden="true"><div class="pda-modal" role="dialog"><div class="pda-modal-h" id="modalCamTitle"></div><div class="pda-modal-b" id="modalCamBody"></div><div class="pda-modal-f"><button type="button" class="btn btn-default" data-close-modal>关闭</button></div></div></div>
  <script>
  (function(){
    function $(id){return document.getElementById(id);}
    function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);}
    function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);
    function openCamModal(t){var m=$('modalCam'),mt=$('modalCamTitle'),mb=$('modalCamBody');if(!m)return;if(mt)mt.textContent=t||'摄像头扫码';if(mb)mb.innerHTML='';m.classList.add('show');m.setAttribute('aria-hidden','false');}
    document.querySelectorAll('[data-cam-placeholder]').forEach(function(b){b.addEventListener('click',function(){openCamModal(b.getAttribute('data-cam-placeholder'));});});
    document.querySelectorAll('[data-close-modal]').forEach(function(b){b.addEventListener('click',function(){var m=$('modalCam');if(m){m.classList.remove('show');m.setAttribute('aria-hidden','true');}});});

    var verExpectedPlates = ['PLT-LAX-01', 'PLT-LAX-02', 'PLT-LAX-03']; var verScanned = []; function resetVerify() { $('verPickScan').value = ''; $('verPlateScan').value = ''; $('verPlateCard').style.display = 'none'; verScanned = []; $('verScannedList').textContent = '（尚无）'; $('verSubmit').disabled = true; } $('verReset').addEventListener('click', function () { resetVerify(); focusSoon('verPickScan'); }); $('verPickScan').addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; e.preventDefault(); if (!($('verPickScan').value || '').trim()) return; $('verPlateCard').style.display = 'block'; $('verExpected').textContent = verExpectedPlates.join('、'); verScanned = []; $('verScannedList').textContent = '（尚无）'; $('verSubmit').disabled = true; focusSoon('verPlateScan'); }); $('verPlateScan').addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; e.preventDefault(); var code = ($('verPlateScan').value || '').trim(); if (!code) return; if (verExpectedPlates.indexOf(code) < 0) { toast('拦截：板标不在本单应扫列表'); $('verPlateScan').value = ''; return; } if (verScanned.indexOf(code) >= 0) { toast('重复扫描'); $('verPlateScan').value = ''; return; } verScanned.push(code); $('verScannedList').textContent = verScanned.join(' → '); $('verPlateScan').value = ''; $('verSubmit').disabled = verScanned.length !== verExpectedPlates.length; }); $('verSubmit').addEventListener('click', function () { if ($('verSubmit').disabled) return; toast('装车复核通过（原型），可进入确认发车'); resetVerify(); focusSoon('verPickScan'); }); focusSoon('verPickScan');
  })();
  </script>
</body>
</html>
