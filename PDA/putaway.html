<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>入库上架 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view active" aria-label="入库上架">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" id="pdaBackBtn" aria-label="返回">‹</button>
        <span class="pda-subnav-title">入库上架</span>
      </div>
      <div class="pda-scroll">
        <div style="display: flex; gap: 4px; margin-bottom: 15px;" id="stepIndicator">
            <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--primary);" id="dot-1"></div>
            <div style="flex: 1; height: 4px; border-radius: 2px; background: #e2e8f0;" id="dot-2"></div>
        </div>

        <!-- 步骤 1 -->
        <div id="step-1" style="display: block;">
            <div class="pda-card">
                <div class="pda-card-title">第一步：定位板标</div>
                <div class="pda-scan-row" style="margin-bottom: 10px;">
                    <input type="text" class="pda-input-scan" id="putPlate" placeholder="扫描或输入板标…" autocomplete="off">
                    <button type="button" class="btn btn-primary" style="flex-shrink: 0; padding: 0 16px;" onclick="toStep2()">确认</button>
                </div>
            </div>
            <div class="pda-card" style="margin-top: 12px;">
                <div class="pda-card-title" style="margin-bottom: 10px;">待上架板标（点击直接开始）</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div class="pda-wb-tile" onclick="fillAndGo('PLT-LAX-001')" style="min-height: auto; padding: 12px 14px; align-items: flex-start; text-align: left; border-color: #c2dbff; background: #f0f7ff;">
                        <div style="font-size: 15px; font-weight: 700; color: var(--primary); font-family: ui-monospace, Consolas, monospace;">PLT-LAX-001</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">推荐大区：B区 · 大件动线</div>
                    </div>
                    <div class="pda-wb-tile" onclick="fillAndGo('PLT-LAX-002')" style="min-height: auto; padding: 12px 14px; align-items: flex-start; text-align: left;">
                        <div style="font-size: 15px; font-weight: 700; color: var(--text-primary); font-family: ui-monospace, Consolas, monospace;">PLT-LAX-002</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">推荐大区：A区 · 标准件货架</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 步骤 2 -->
        <div id="step-2" style="display: none;">
            <div class="pda-card">
                <div class="pda-card-title">第二步：扫描库位码并确认上架</div>
                <div class="pda-scan-row" style="margin-bottom: 12px;">
                    <input type="text" class="pda-input-scan" id="putBin" placeholder="扫描库位码…" autocomplete="off">
                    <button type="button" class="pda-btn-cam" data-cam-placeholder="入库上架-库位">📷</button>
                </div>
                <button class="btn btn-primary" id="putConfirm" style="width: 100%; height: 46px; background: var(--success); border-color: var(--success); font-size: 15px; margin-top: 16px; border-radius: 12px;" disabled>确认上架</button>
            </div>
        </div>
      </div>
      <div class="pda-footer-actions" id="bottom-bar" style="display: none; justify-content: center; align-items: center; background: var(--sidebar-bg); color: white; border-top: none;">
          <span style="font-size: 13px;">当前处理板标: <span id="stat-plate" style="color:var(--success);font-family: ui-monospace, Consolas, monospace;font-weight:700;">PLT-LAX-001</span></span>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>
  <div class="pda-modal-overlay" id="modalCam" aria-hidden="true"><div class="pda-modal" role="dialog"><div class="pda-modal-h" id="modalCamTitle"></div><div class="pda-modal-b" id="modalCamBody"></div><div class="pda-modal-f"><button type="button" class="btn btn-default" data-close-modal>关闭</button></div></div></div>
  <script>
  (function(){
    function $(id){return document.getElementById(id);}
    function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);}
    function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);
    function openCamModal(t){var m=$('modalCam'),mt=$('modalCamTitle'),mb=$('modalCamBody');if(!m)return;if(mt)mt.textContent=t||'摄像头扫码';if(mb)mb.innerHTML='';m.classList.add('show');m.setAttribute('aria-hidden','false');}
    document.querySelectorAll('[data-cam-placeholder]').forEach(function(b){b.addEventListener('click',function(){openCamModal(b.getAttribute('data-cam-placeholder'));});});
    document.querySelectorAll('[data-close-modal]').forEach(function(b){b.addEventListener('click',function(){var m=$('modalCam');if(m){m.classList.remove('show');m.setAttribute('aria-hidden','true');}});});

    window.toStep1 = function() {
        $('step-1').style.display = 'block'; $('step-2').style.display = 'none';
        $('bottom-bar').style.display = 'none'; $('putPlate').value = ''; $('putBin').value = '';
        $('dot-1').style.background = 'var(--primary)'; $('dot-2').style.background = '#e2e8f0';
        $('putConfirm').disabled = true;
    };

    window.toStep2 = function() {
        var plt = ($('putPlate').value || '').trim();
        if(!plt) { toast('请输入板标'); focusSoon('putPlate'); return; }
        $('stat-plate').textContent = plt;
        $('step-1').style.display = 'none'; $('step-2').style.display = 'block';
        $('bottom-bar').style.display = 'flex';
        $('dot-1').style.background = 'var(--primary)'; $('dot-2').style.background = 'var(--primary)';
        focusSoon('putBin');
    };

    window.fillAndGo = function(plt) { var el = $('putPlate'); if (el) el.value = plt; window.toStep2(); };

    $('putBin').addEventListener('input', function () { $('putConfirm').disabled = !($('putBin').value || '').trim(); });
    $('putConfirm').addEventListener('click', function () { if ($('putConfirm').disabled) return; var p = ($('putPlate').value || '').trim(), b = ($('putBin').value || '').trim(); toast('正在上架...'); setTimeout(function() { toast('✅ 上架完成：' + p + ' → ' + b); window.toStep1(); }, 500); });
    $('pdaBackBtn').addEventListener('click', function() { if ($('step-2').style.display === 'block') window.toStep1(); else window.location.href = 'wms-pda.html'; });

    focusSoon('putPlate');
  })();
  </script>
</body>
</html>
