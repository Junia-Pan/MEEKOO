<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>入库上架 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view pda-view-putaway active" aria-label="入库上架">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" id="pdaBackBtn" aria-label="返回">‹</button>
        <span class="pda-subnav-title">入库上架</span>
      </div>
      <div class="pda-scroll">
        <div style="display: flex; gap: 4px; margin-bottom: 15px;" id="stepIndicator">
            <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--primary);" id="dot-1"></div>
            <div style="flex: 1; height: 4px; border-radius: 2px; background: #e2e8f0;" id="dot-2"></div>
        </div>

        <!-- 步骤 1 -->
        <div id="step-1" style="display: block;">
            <div class="pda-card">
                <div class="pda-card-title">第一步：输入板标码</div>
                <div class="pda-scan-row" style="margin-bottom: 10px;">
                    <input type="text" class="pda-input-scan" id="putPlate" placeholder="扫码或手输后回车" autocomplete="off" autocorrect="off" spellcheck="false">
                    <span class="pda-btn-cam" aria-hidden="true">📷</span>
                </div>
            </div>
            <div class="pda-card" style="margin-top: 12px;">
                <div class="pda-card-title" style="margin-bottom: 10px;">待上架板标清单</div>
                <div id="putawayPendingList" class="pda-meas-pending-list"></div>
            </div>
        </div>

        <!-- 步骤 2 -->
        <div id="step-2" style="display: none;">
            <div class="pda-card">
                <div class="pda-card-title">第二步：扫描库位码并确认上架</div>
                <div class="pda-label" style="margin-bottom: 6px;">当前板标</div>
                <div class="pda-scan-row" style="margin-bottom: 12px;">
                    <input type="text" class="pda-input-scan" id="putPlateDisplay" readonly style="background: #edf2f7; color: var(--text-primary); pointer-events: none; border-color: #e2e8f0; font-weight: 700;">
                </div>
                <div class="pda-label" style="margin-bottom: 6px;">库位码</div>
                <div class="pda-scan-row" style="margin-bottom: 12px;">
                    <input type="text" class="pda-input-scan" id="putBin" placeholder="扫码或手输后回车" autocomplete="off">
                    <span class="pda-btn-cam" aria-hidden="true">📷</span>
                </div>
                <button class="btn btn-primary pda-outpick-btn-finish" id="putConfirm" style="margin-top: 16px;" disabled>确认上架</button>
            </div>
        </div>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>
  <script>
  (function(){
    function $(id){return document.getElementById(id);}
    function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);}
    function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);

    var putawayPendingItems = [
      { plate: 'PLT-LAX-001', type: 'FBA', pcs: 24, fbaCode: 'ONT8', sysOrder: 'SYS-IN-240518', container: 'COSU628190', highlight: true },
      { plate: 'PLT-LAX-002', type: '私卡', pcs: 8, sysOrder: 'SYS-IN-240519', container: 'MSCU1234567', highlight: false },
      { plate: 'PLT-LAX-003', type: 'WM', pcs: 12, sysOrder: 'SYS-OUT-240601', container: 'HLCU9988776', highlight: false },
      { plate: 'PLT-LAX-004', type: '自提', pcs: 3, sysOrder: 'SYS-IN-240602', container: '—', highlight: false }
    ];

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatTypeLabel(item) {
      var type = item.type || '—';
      if (type === 'FBA' && item.fbaCode) return type + ' (' + item.fbaCode + ')';
      return type;
    }

    function formatPcsBadge(item) {
      if (item.pcs != null && item.pcs !== '') return item.pcs + ' 件';
      return '—';
    }

    function renderPutawayPendingList() {
      var list = $('putawayPendingList');
      if (!list) return;
      list.innerHTML = putawayPendingItems.map(function (item) {
        var cls = 'pda-meas-pending-item' + (item.highlight ? ' pda-meas-pending-item--highlight' : '');
        return '<button type="button" class="' + cls + '" data-plate="' + escapeHtml(item.plate) + '">' +
          '<div class="pda-putaway-pending-head">' +
            '<div class="pda-meas-plate-code">' + escapeHtml(item.plate) + '</div>' +
            '<span class="pda-putaway-pending-pcs">' + escapeHtml(formatPcsBadge(item)) + '</span>' +
          '</div>' +
          '<dl class="pda-meas-meta">' +
            '<div class="pda-meas-meta-row"><dt>类型</dt><dd>' + escapeHtml(formatTypeLabel(item)) + '</dd></div>' +
            '<div class="pda-meas-meta-row pda-meas-meta-row--mono"><dt>系统单号</dt><dd>' + escapeHtml(item.sysOrder || '—') + '</dd></div>' +
            '<div class="pda-meas-meta-row pda-meas-meta-row--mono"><dt>柜号</dt><dd>' + escapeHtml(item.container || '—') + '</dd></div>' +
          '</dl></button>';
      }).join('');
      list.querySelectorAll('[data-plate]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          fillAndGo(btn.getAttribute('data-plate'));
        });
      });
    }

    window.toStep1 = function() {
        $('step-1').style.display = 'block'; $('step-2').style.display = 'none';
        $('putPlate').value = ''; $('putBin').value = '';
        var putDisplay = $('putPlateDisplay'); if (putDisplay) putDisplay.value = '';
        $('dot-1').style.background = 'var(--primary)'; $('dot-2').style.background = '#e2e8f0';
        $('putConfirm').disabled = true;
    };

    window.toStep2 = function() {
        var plt = ($('putPlate').value || '').trim();
        if(!plt) { toast('请输入板标'); focusSoon('putPlate'); return; }
        var display = $('putPlateDisplay');
        if (display) display.value = plt;
        $('step-1').style.display = 'none'; $('step-2').style.display = 'block';
        $('dot-1').style.background = 'var(--primary)'; $('dot-2').style.background = 'var(--primary)';
        focusSoon('putBin');
    };

    window.fillAndGo = function(plt) { var el = $('putPlate'); if (el) el.value = plt; window.toStep2(); };

    $('putBin').addEventListener('input', function () { $('putConfirm').disabled = !($('putBin').value || '').trim(); });
    $('putConfirm').addEventListener('click', function () { if ($('putConfirm').disabled) return; var p = ($('putPlate').value || '').trim(), b = ($('putBin').value || '').trim(); toast('正在上架...'); setTimeout(function() { toast('✅ 上架完成：' + p + ' → ' + b); window.toStep1(); }, 500); });
    $('pdaBackBtn').addEventListener('click', function() { if ($('step-2').style.display === 'block') window.toStep1(); else window.location.href = 'wms-pda.html'; });

    var putPlateInput = $('putPlate');
    if (putPlateInput) {
      putPlateInput.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        window.toStep2();
      });
    }

    renderPutawayPendingList();
    focusSoon('putPlate');
  })();
  </script>
</body>
</html>
