<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>快递出库 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
  <style>
    .eb-brand-badge {
      font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px; border: 1px solid transparent;
    }
    .eb-summary-card { border-radius: 14px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.06); border: 1px solid var(--border-light); background: #fff; }
    
    /* Step 1: 批次卡片网格 */
    .eb-grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .eb-batch-card {
      display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      text-align: left; padding: 0; transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
      cursor: pointer; font-family: inherit; color: inherit;
    }
    .eb-batch-card:active { transform: scale(0.98); background: #f8fafc; }
    .eb-batch-card--highlight { border-color: #BFDBFE; box-shadow: 0 4px 12px rgba(37,99,235,0.08); }
    .eb-batch-head { padding: 14px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .eb-batch-title { font-size: 16px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--text-primary); word-break: break-all; line-height: 1.1; }
    .eb-batch-body { background: #F8FAFC; border-top: 1px dashed var(--border-light); padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .eb-batch-stat { display: flex; align-items: baseline; gap: 3px; }
    .eb-batch-stat .v { font-size: 16px; font-weight: 800; color: var(--text-primary); }
    .eb-batch-stat .l { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    
    /* Step 2: 包裹芯片网格 */
    .eb-pkg-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px;
      max-height: 280px; overflow-y: auto; padding-right: 4px; padding-bottom: 4px; align-content: start;
    }
    .eb-pkg-chip {
      background: #F8FAFC; border: 1px solid var(--border-light); border-radius: 8px; padding: 10px;
    }
    .eb-pkg-chip .trk { font-size: 13px; font-weight: 700; font-family: ui-monospace, monospace; color: var(--text-primary); margin-bottom: 4px; word-break: break-all; line-height: 1.1; }
    .eb-pkg-chip .ref { font-size: 11px; color: var(--text-secondary); line-height: 1.2; }

    /* 照片凭证网格 */
    .eb-photo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .eb-photo-count { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .eb-photo-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .eb-photo-thumb {
      position: relative;
      width: calc((100% - 20px) / 3);
      aspect-ratio: 1;
      flex-shrink: 0;
    }
    .eb-photo-thumb .pda-photo-item {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      display: block;
      object-fit: cover;
    }
    .eb-photo-del {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .eb-photo-del:active { background: rgba(0, 0, 0, 0.75); }
    .eb-photo-add {
      width: calc((100% - 20px) / 3);
      aspect-ratio: 1;
      margin: 0;
      flex-direction: column;
      gap: 4px;
      border-radius: 8px;
      border: 1px dashed #cbd5e0;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .eb-photo-add:active { background: #f1f5f9; }
    .eb-photo-add-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.2;
      pointer-events: none;
    }
    .eb-photo-add-icon { font-size: 24px; line-height: 1; color: #94a3b8; }
  </style>
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view pda-view-express-outbound active" aria-label="快递出库">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>

      <div class="pda-subnav">
        <button type="button" class="pda-back" id="pdaBackBtn" aria-label="返回">‹</button>
        <span class="pda-subnav-title">快递出库</span>
      </div>

      <div class="pda-scroll">
        <div style="display: flex; gap: 4px; margin-bottom: 15px;" id="stepIndicator">
          <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--primary);" id="eb-dot-1"></div>
          <div style="flex: 1; height: 4px; border-radius: 2px; background: #e2e8f0;" id="eb-dot-2"></div>
        </div>

        <!-- 步骤 1：定位出库批次 -->
        <div id="eb-step-1" style="display: block;">
          <div class="pda-card">
            <div class="pda-card-title">第一步：输入柜号/系统单号</div>
            <div class="pda-scan-row" style="margin-bottom: 0;">
              <input type="text" class="pda-input-scan" id="ebScanInput" placeholder="扫码或手输后回车" autocomplete="off" autocorrect="off" spellcheck="false" style="height: 44px; font-size: 14px;">
              <span class="pda-btn-cam" aria-hidden="true" style="width: 44px; height: 44px;">📷</span>
            </div>
          </div>
          <div class="pda-card" style="margin-top: 16px;">
            <div class="pda-card-title" style="margin-bottom: 10px;">待交接服务商</div>
            <div id="ebPendingList" class="eb-grid-list"></div>
            <p id="ebPendingEmpty" class="pda-hint" style="display: none; margin: 8px 4px 0;">未找到匹配的出库批次</p>
          </div>
        </div>

        <!-- 步骤 2：包裹扫描交接 -->
        <div id="eb-step-2" style="display: none;">
          <div class="pda-card" style="background: transparent; border: none; box-shadow: none; padding: 0;">
            <div class="pda-card-title" style="margin-bottom: 12px; padding-left: 4px;">第二步：核对并交接</div>
            <div class="eb-summary-card">
              <div id="ebSummaryHead" style="padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(0,0,0,0.1);">
                <span id="ebContainer" style="font-size: 19px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--text-primary); letter-spacing: 0.5px;">—</span>
                <span id="ebExpress" class="eb-brand-badge">—</span>
              </div>
              <div style="padding: 16px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 600;">交接总数</span>
                <div style="text-align: right;">
                  <strong id="ebTotalCtns" style="font-size: 24px; color: var(--text-primary); font-weight: 800; line-height: 1;">—</strong> <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">件</span>
                  <span style="color: #cbd5e1; margin: 0 6px;">|</span>
                  <strong id="ebTotalPlts" style="font-size: 16px; color: var(--text-primary); font-weight: 700; line-height: 1;">—</strong> <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">板</span>
                </div>
              </div>
            </div>
          </div>

          <div class="pda-card" style="margin-top: 16px; padding-bottom: 12px;">
            <div class="pda-card-title" style="margin-bottom: 12px;">货件清单</div>
            <div id="ebPendingTrackList" class="eb-pkg-grid">
              <!-- 已扫列表动态生成区 -->
            </div>
          </div>

          <div class="pda-card pda-meas-form" style="margin-top: 16px;">
            <div class="eb-photo-header">
              <div class="pda-card-title" style="margin-bottom: 0;">上传交付凭证 <span class="pda-req">*</span></div>
              <span class="eb-photo-count" id="ebPhotoCount">0/5</span>
            </div>
            <div class="pda-hint" style="margin-bottom: 12px;">建议拍摄：司机签字表、现场包裹堆、取件车辆等。</div>
            <div class="eb-photo-grid" id="ebPhotoGrid">
              <div class="pda-photo-list eb-photo-list" id="ebPhotoList" style="display: contents;"></div>
              <label class="eb-photo-add" id="ebPhotoAddLabel" for="ebPhotoInput">
                <input type="file" id="ebPhotoInput" accept="image/*" multiple capture="environment" style="display: none;">
                <span class="eb-photo-add-inner">
                  <span class="eb-photo-add-icon" aria-hidden="true">📷</span>
                  <span>拍照</span>
                </span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="pda-footer-actions pda-outpick-confirm-footer" id="ebConfirmFooter" style="display: none; padding-top: 12px; padding-bottom: 12px;">
        <button type="button" class="btn btn-primary pda-outpick-btn-finish" id="ebConfirmBtn" style="height: 48px; border-radius: 12px; font-size: 16px; font-weight: 700; letter-spacing: 1px;">确认交接完毕</button>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>

  <div class="pda-modal-overlay" id="modalPdaConfirm" aria-hidden="true">
    <div class="pda-modal" role="dialog" style="max-width: 300px;">
      <div class="pda-modal-h" id="pdaConfirmTitle" style="text-align: center; border-bottom: none; padding: 20px 16px 0; font-size: 15px;">提示</div>
      <div class="pda-modal-b" id="pdaConfirmBody" style="font-size: 12px; text-align: center; padding: 12px 20px 24px; line-height: 1.5; color: var(--text-secondary);"></div>
      <div class="pda-modal-f" style="display: flex; gap: 10px; border-top: 1px solid var(--border-light); padding: 12px 16px; background: transparent;">
        <button type="button" class="btn btn-default" id="pdaConfirmCancel" style="flex: 1; height: 42px; border-radius: 8px; font-size: 13px;">取消</button>
        <button type="button" class="btn btn-primary" id="pdaConfirmOk" style="flex: 1; height: 42px; border-radius: 8px; font-size: 13px;">确认</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    function $(id) { return document.getElementById(id); }
    function toast(msg) {
      var e = $('toast');
      e.textContent = msg;
      e.classList.add('show');
      clearTimeout(e._t);
      e._t = setTimeout(function () { e.classList.remove('show'); }, 2600);
    }
    function focusSoon(id) {
      setTimeout(function () {
        var el = $(id);
        if (el) { el.focus(); if (el.select) el.select(); }
      }, 120);
    }
    function refreshTime() {
      var nodes = document.querySelectorAll('.pda-wb-time');
      if (!nodes.length) return;
      var d = new Date();
      var z = function (x) { return x < 10 ? '0' + x : x; };
      var t = z(d.getHours()) + ':' + z(d.getMinutes());
      nodes.forEach(function (el) { el.textContent = t; });
    }
    refreshTime();
    setInterval(refreshTime, 30000);

    window.pdaConfirm = function (title, html, cb) {
      var m = $('modalPdaConfirm');
      $('pdaConfirmTitle').textContent = title || '提示';
      $('pdaConfirmBody').innerHTML = html || '';
      m.classList.add('show');
      m.setAttribute('aria-hidden', 'false');
      $('pdaConfirmOk').onclick = function () {
        m.classList.remove('show');
        m.setAttribute('aria-hidden', 'true');
        if (cb) cb(true);
      };
      $('pdaConfirmCancel').onclick = function () {
        m.classList.remove('show');
        m.setAttribute('aria-hidden', 'true');
        if (cb) cb(false);
      };
    };

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var expressStyles = {
      'UPS': { bg: '#FFF7ED', border: '#FED7AA', color: '#D97706', headBg: 'linear-gradient(135deg, #FFEDD5 0%, #FFF7ED 100%)' },
      'FedEx': { bg: '#F5F3FF', border: '#DDD6FE', color: '#7C3AED', headBg: 'linear-gradient(135deg, #EDE9FE 0%, #F5F3FF 100%)' },
      'USPS': { bg: '#EFF6FF', border: '#BFDBFE', color: '#2563EB', headBg: 'linear-gradient(135deg, #DBEAFE 0%, #EFF6FF 100%)' },
      'DHL': { bg: '#FEF2F2', border: '#FECACA', color: '#DC2626', headBg: 'linear-gradient(135deg, #FEE2E2 0%, #FEF2F2 100%)' }
    };

    /* --- Mock Data --- */
    var expressBatches = [
      {
        batchId: 'B-MSCU-UPS',
        container: 'MSCU1234567',
        express: 'UPS',
        totalPcs: 120,
        pallets: 3,
        highlight: true,
        custOrders: [
          { orderNo: 'REF-001', pcs: 50 },
          { orderNo: 'REF-002', pcs: 40 },
          { orderNo: 'REF-003', pcs: 30 }
        ]
      },
      {
        batchId: 'B-MSCU-FDX',
        container: 'MSCU1234567',
        express: 'FedEx',
        totalPcs: 45,
        pallets: 1,
        highlight: false,
        custOrders: [
          { orderNo: 'REF-004', pcs: 25 },
          { orderNo: 'REF-005', pcs: 20 }
        ]
      },
      {
        batchId: 'B-OOLU-USPS',
        container: 'OOLU9988776',
        express: 'USPS',
        totalPcs: 30,
        pallets: 1,
        highlight: false,
        custOrders: [
          { orderNo: 'REF-006', pcs: 30 }
        ]
      }
    ];

    var currentBatch = null;
    var ebPhotos = [];

    /* --- Step 1 Logic --- */
    function getSearchQuery() {
      return ($('ebScanInput').value || '').trim().toLowerCase();
    }

    function renderEbPendingList() {
      var list = $('ebPendingList');
      var empty = $('ebPendingEmpty');
      if (!list) return;
      var q = getSearchQuery();
      var items = expressBatches.filter(function (item) {
        if (!q) return true;
        return (item.container || '').toLowerCase().indexOf(q) >= 0;
      });
      
      if (empty) empty.style.display = items.length ? 'none' : 'block';
      list.innerHTML = items.map(function (item) {
        var cls = 'eb-batch-card' + (item.highlight ? ' eb-batch-card--highlight' : '');
        var style = expressStyles[item.express] || { bg: '#F8FAFC', border: '#E2E8F0', color: '#475569', headBg: '#F1F5F9' };
        
        return '<button type="button" class="' + cls + '" data-batch="' + escapeHtml(item.batchId) + '">' +
          '<div class="eb-batch-head">' +
            '<div class="eb-batch-title">' + escapeHtml(item.container) + '</div>' +
            '<span class="eb-brand-badge" style="background:' + style.bg + ';color:' + style.color + ';border-color:' + style.border + ';">' + escapeHtml(item.express) + '</span>' +
          '</div>' +
          '<div class="eb-batch-body">' +
            '<div class="eb-batch-stat"><span class="v">' + item.totalPcs + '</span><span class="l">件</span></div>' +
            '<div style="width:1px;height:12px;background:var(--border-light);"></div>' +
            '<div class="eb-batch-stat"><span class="v">' + (item.pallets || 0) + '</span><span class="l">板</span></div>' +
          '</div></button>';
      }).join('');
      
      list.querySelectorAll('[data-batch]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var batchId = btn.getAttribute('data-batch');
          for (var i=0; i<expressBatches.length; i++) {
            if (expressBatches[i].batchId === batchId) { startBatch(expressBatches[i]); break; }
          }
        });
      });
    }

    /* --- Step 2 Logic --- */
    function renderPendingTracks() {
      var list = $('ebPendingTrackList');
      if (!list) return;
      if (!currentBatch.custOrders || currentBatch.custOrders.length === 0) {
          list.innerHTML = '<div style="font-size:13px; color:var(--text-muted); text-align:center; padding:24px 0;">暂无货件清单明细</div>';
          return;
      }
      var html = currentBatch.custOrders.map(function(o) {
          return '<div class="eb-pkg-chip">' +
                   '<div class="trk">' + escapeHtml(o.orderNo) + '</div>' +
                   '<div class="ref" style="font-size: 13px; font-weight: 600; color: var(--primary);">' + o.pcs + ' 件</div>' +
                 '</div>';
      }).join('');
      list.innerHTML = html;
    }

    /* --- Photos --- */
    var MAX_PHOTOS = 5;

    $('ebPhotoInput').addEventListener('change', function () {
      var files = this.files;
      if (!files || !files.length) return;
      
      var remaining = MAX_PHOTOS - ebPhotos.length;
      if (remaining <= 0) {
        toast('最多只能上传 ' + MAX_PHOTOS + ' 张凭证');
        this.value = '';
        return;
      }

      var added = 0;
      for (var i = 0; i < files.length && added < remaining; i++) {
        (function (file) {
          var url = URL.createObjectURL(file);
          ebPhotos.push({ file: file, url: url });
          added++;
        })(files[i]);
      }
      if (files.length > remaining) {
        toast('最多只能上传 ' + MAX_PHOTOS + ' 张，已截断');
      }
      
      renderPhotos();
      this.value = '';
    });

    function renderPhotos() {
        var list = $('ebPhotoList');
        var addLabel = $('ebPhotoAddLabel');
        var countEl = $('ebPhotoCount');
        
        if (!list) return;
        list.innerHTML = '';
        
        ebPhotos.forEach(function (p, i) {
            var wrap = document.createElement('div');
            wrap.className = 'eb-photo-thumb';
            
            var img = document.createElement('img');
            img.className = 'pda-photo-item';
            img.src = p.url;
            img.alt = '交接凭证';
            
            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'eb-photo-del';
            delBtn.innerHTML = '×';
            delBtn.onclick = function() {
                try { URL.revokeObjectURL(p.url); } catch (e) {}
                ebPhotos.splice(i, 1);
                renderPhotos();
            };
            
            wrap.appendChild(img);
            wrap.appendChild(delBtn);
            list.appendChild(wrap);
        });
        
        if (addLabel) {
            addLabel.style.display = ebPhotos.length >= MAX_PHOTOS ? 'none' : 'flex';
        }
        if (countEl) {
            countEl.textContent = ebPhotos.length + '/' + MAX_PHOTOS;
        }
    }

    function clearPhotos() {
      ebPhotos.forEach(function (p) { try { URL.revokeObjectURL(p.url); } catch (e) {} });
      ebPhotos.length = 0;
      renderPhotos();
      var input = $('ebPhotoInput');
      if (input) input.value = '';
    }

    /* --- Navigation --- */
    window.toStep1 = function () {
      $('eb-step-1').style.display = 'block';
      $('eb-step-2').style.display = 'none';
      $('ebConfirmFooter').style.display = 'none';
      $('ebScanInput').value = '';
      currentBatch = null;
      clearPhotos();
      renderEbPendingList();
      $('eb-dot-1').style.background = 'var(--primary)';
      $('eb-dot-2').style.background = '#e2e8f0';
      focusSoon('ebScanInput');
    };

    function startBatch(batchItem) {
      currentBatch = batchItem;
      
      var style = expressStyles[currentBatch.express] || { bg: '#F8FAFC', border: '#E2E8F0', color: '#475569', headBg: '#F1F5F9' };
      var sumHead = $('ebSummaryHead');
      var expressBadge = $('ebExpress');
      
      if (sumHead) {
          sumHead.style.background = style.headBg;
      }
      if (expressBadge) {
          expressBadge.style.background = style.bg;
          expressBadge.style.borderColor = style.border;
          expressBadge.style.color = style.color;
      }

      $('ebContainer').textContent = currentBatch.container;
      $('ebExpress').textContent = currentBatch.express;
      $('ebTotalCtns').textContent = currentBatch.totalPcs;
      $('ebTotalPlts').textContent = currentBatch.pallets || 0;
      
      renderPendingTracks();

      $('eb-step-1').style.display = 'none';
      $('eb-step-2').style.display = 'block';
      $('ebConfirmFooter').style.display = 'flex';
      $('eb-dot-1').style.background = 'var(--primary)';
      $('eb-dot-2').style.background = 'var(--primary)';
    }

    $('ebScanInput').addEventListener('input', renderEbPendingList);
    $('ebScanInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var raw = ($('ebScanInput').value || '').trim().toLowerCase();
        if (!raw) return;
        var matched = expressBatches.find(function(b) { return (b.container || '').toLowerCase().indexOf(raw) >= 0; });
        if (matched) startBatch(matched);
        else toast('未找到匹配的出库批次');
      }
    });

    $('pdaBackBtn').addEventListener('click', function () {
      if ($('eb-step-2').style.display !== 'none') {
        toStep1();
        return;
      }
      window.location.href = 'wms-pda.html';
    });

    /* --- Submission --- */
    $('ebConfirmBtn').addEventListener('click', function() {
      if (!currentBatch) return;
      
      if (ebPhotos.length === 0) {
        toast('请至少上传一张交付凭证');
        return;
      }

      var doFinish = function() {
        var idx = expressBatches.indexOf(currentBatch);
        if (idx >= 0) expressBatches.splice(idx, 1);
        toast('✅ 快递交接已完成');
        toStep1();
      };

      doFinish();
    });

    // Init
    toStep1();
  })();
  </script>
</body>
</html>
