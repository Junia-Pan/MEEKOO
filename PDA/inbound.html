<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>到仓确认 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view active" aria-label="入库">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" data-back aria-label="返回">‹</button>
        <span class="pda-subnav-title">到仓确认</span>
      </div>
      <div class="pda-scroll">
        <div class="pda-card">
          <div class="pda-label">柜号/提单号/系统单号/FBA/Ref/ICBU</div>
          <div class="pda-scan-row">
            <input type="text" class="pda-input-scan" id="inboundCabinet" placeholder="扫码或手输后回车" autocomplete="off" autocorrect="off" spellcheck="false">
            <span class="pda-btn-cam" aria-hidden="true">📷</span>
          </div>
        </div>
        <div class="pda-card">
          <div class="pda-grid-2">
            <div>
              <div class="pda-label" style="margin-bottom:4px;">预估板数</div>
              <input type="text" class="pda-input-scan" id="inboundEstPlates" value="—" readonly tabindex="-1" aria-readonly="true" style="width:100%;box-sizing:border-box;background:#edf2f7;color:#718096;pointer-events:none;border-color:#e2e8f0;">
            </div>
            <div>
              <div class="pda-label" style="margin-bottom:4px;">实收板数 <span style="color:#e53e3e;">*</span></div>
              <input type="number" class="pda-input-scan" id="inboundActualPlates" placeholder="请输入" min="1" step="1" inputmode="numeric" autocomplete="off" style="width:100%;box-sizing:border-box;">
            </div>
          </div>
        </div>
        <div class="pda-card">
          <div class="pda-label">到仓照片（至少 1 张，可多选）</div>
          <div class="pda-photo-list" id="inboundPhotoList"></div>
          <label class="pda-photo-add">＋<input type="file" id="inboundPhotoInput" accept="image/*" multiple></label>
        </div>
        <div class="pda-card">
          <div class="pda-label">备注（可选）</div>
          <textarea id="inboundRemark" class="pda-input-scan" rows="3" placeholder="填写到仓异常或其他备注..." style="width:100%;resize:vertical;padding:10px 12px;box-sizing:border-box;"></textarea>
        </div>
        <div class="pda-card" id="inboundResult" style="display:none;">
          <div class="pda-card-title">上次提交结果</div>
          <div id="inboundResultBody" style="font-size:13px;color:var(--text-secondary);line-height:1.6;"></div>
        </div>
      </div>
      <div class="pda-footer-actions">
        <button type="button" class="btn btn-default" id="inboundReset">清空</button>
        <button type="button" class="btn btn-primary" id="inboundConfirm">确认到仓</button>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>
  <script>
  (function(){
    function $(id){return document.getElementById(id);}
    function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);}
    function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    function formatNow(){var d=new Date(),z=function(n){return n<10?'0'+n:n;};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
    function currentWarehouse(){var s=localStorage.getItem('pda.prototype.warehouseId');return {id:s||'wh-lax1',name:s==='wh-nj1'?'美东 NJ 集货仓':s==='wh-yiwu'?'义乌监管仓':'美库洛杉矶仓'};}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);
    var inboundPhotos = [];
    function resetEstPlates() { $('inboundEstPlates').value = '—'; }
    function loadEstPlates(cab) { $('inboundEstPlates').value = cab ? '12' : '—'; }
    $('inboundCabinet').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var cab = (this.value || '').trim();
      if (!cab) { resetEstPlates(); return; }
      loadEstPlates(cab);
      focusSoon('inboundActualPlates');
    });
    $('inboundPhotoInput').addEventListener('change', function () {
      var files = this.files; if (!files || !files.length) return;
      var list = $('inboundPhotoList');
      for (var i = 0; i < files.length; i++) {
        (function (file) {
          var url = URL.createObjectURL(file); inboundPhotos.push({ file: file, url: url });
          var img = document.createElement('img'); img.className = 'pda-photo-item'; img.src = url; img.alt = 'photo'; list.appendChild(img);
        })(files[i]);
      }
      this.value = '';
    });
    $('inboundReset').addEventListener('click', function () {
      $('inboundRemark').value = ''; $('inboundCabinet').value = ''; $('inboundActualPlates').value = ''; resetEstPlates();
      inboundPhotos.forEach(function (p) { try { URL.revokeObjectURL(p.url); } catch (e) {} }); inboundPhotos = [];
      $('inboundPhotoList').innerHTML = ''; $('inboundResult').style.display = 'none'; focusSoon('inboundCabinet');
    });
    $('inboundConfirm').addEventListener('click', function () {
      var cab = ($('inboundCabinet').value || '').trim();
      if (!cab) { toast('请先扫描或输入柜号'); focusSoon('inboundCabinet'); return; }
      var actualPlates = ($('inboundActualPlates').value || '').trim();
      if (!actualPlates) { toast('请填写实收板数'); focusSoon('inboundActualPlates'); return; }
      if (!/^[1-9]\d*$/.test(actualPlates)) { toast('实收板数须为正整数'); focusSoon('inboundActualPlates'); return; }
      if (!inboundPhotos.length) { toast('请至少上传一张到仓照片'); return; }
      var arrivedAt = formatNow(); toast('正在提交...'); var btn = this; btn.disabled = true;
      setTimeout(function() {
        btn.disabled = false; var w = currentWarehouse();
        $('inboundResultBody').innerHTML = '柜号：<strong>' + cab + '</strong><br>仓库：<strong>' + w.name + '</strong><br>系统到仓时间：<strong>' + arrivedAt + '</strong><br>备注：' + ($('inboundRemark').value || '无') + '<br>预估板数：<strong>' + ($('inboundEstPlates').value || '—') + '</strong><br>实收板数：<strong>' + actualPlates + '</strong><br>照片张数：' + inboundPhotos.length;
        $('inboundResult').style.display = 'block'; toast('✅ 已确认到仓');
      }, 600);
    });
    focusSoon('inboundCabinet');
  })();
  </script>
</body>
</html>
