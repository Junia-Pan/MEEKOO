<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>到仓确认 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view pda-view-inbound active" aria-label="入库">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" data-back aria-label="返回">‹</button>
        <span class="pda-subnav-title">到仓确认</span>
      </div>
      <div class="pda-scroll">
        <div class="pda-card">
          <div class="pda-label">柜号/提单号/系统单号/FBA/REF</div>
          <div class="pda-scan-row">
            <input type="text" class="pda-input-scan" id="inboundCabinet" placeholder="扫码或手输后回车" autocomplete="off" autocorrect="off" spellcheck="false">
            <span class="pda-btn-cam" aria-hidden="true">📷</span>
          </div>
          <div class="pda-inbound-dup-warn" id="inboundDupWarn" hidden role="alert">
            <span id="inboundDupWarnText">该单号已到仓，请核查是否重复操作。</span>
          </div>
        </div>
        <div class="pda-card">
          <div class="pda-grid-2">
            <div>
              <div class="pda-label">预估板数</div>
              <input type="text" class="pda-input-scan pda-inbound-est" id="inboundEstPlates" value="—" readonly tabindex="-1" aria-readonly="true">
            </div>
            <div>
              <div class="pda-label">实际板数 <span class="pda-req">*</span></div>
              <input type="number" class="pda-input-scan" id="inboundActualPlates" placeholder="请输入" min="1" step="1" inputmode="numeric" autocomplete="off">
            </div>
          </div>
          <div class="pda-inbound-mismatch-warn" id="inboundMismatchWarn" hidden role="alert">
            <p class="pda-inbound-mismatch-text">预估 <strong id="inboundMismatchEst">—</strong> 板，实收 <strong id="inboundMismatchAct">—</strong> 板，板数不一致，请登记问题件。</p>
            <button type="button" class="btn btn-default pda-inbound-problem-btn" id="inboundGoProblem">去登记问题件</button>
          </div>
        </div>
        <div class="pda-card">
          <div class="pda-card-title">到仓照片</div>
          <div class="pda-hint">至少 1 张，可多选</div>
          <div class="pda-meas-photo-wrap">
            <div class="pda-meas-photo-row">
              <div class="pda-photo-list" id="inboundPhotoList"></div>
              <label class="pda-meas-photo-add" for="inboundPhotoInput">
                <span class="pda-meas-photo-add-icon" aria-hidden="true">📷</span>
                <span>添加</span>
                <input type="file" id="inboundPhotoInput" accept="image/*" multiple>
              </label>
            </div>
          </div>
        </div>
        <div class="pda-card">
          <div class="pda-label">备注（可选）</div>
          <textarea id="inboundRemark" class="pda-input-scan pda-inbound-remark" rows="2" placeholder="填写到仓异常或其他备注..."></textarea>
        </div>
      </div>
      <div class="pda-footer-actions pda-outpick-confirm-footer">
        <div class="pda-footer-row">
          <button type="button" class="btn btn-default" id="inboundReset">清空</button>
          <button type="button" class="btn btn-primary pda-outpick-btn-finish" id="inboundConfirm">确认到仓</button>
        </div>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>

  <!-- 快捷异常登记弹窗 -->
  <div class="pda-modal-overlay" id="modalException" aria-hidden="true">
    <div class="pda-modal" role="dialog" style="max-width: 320px; width: 90vw;">
      <div class="pda-modal-h" style="border-bottom: 1px solid var(--border-light); padding: 16px; font-size: 14px;">⚠️ 快捷异常登记</div>
      <div class="pda-modal-b" style="padding: 16px; text-align: left;">
        <div class="pda-label" style="margin-bottom: 6px;">Customer REF No</div>
        <input type="text" class="pda-input-scan" id="exScan" readonly placeholder="—" autocomplete="off" style="width:100%;height:38px;margin-bottom:12px;background:#edf2f7;color:#718096;border-color:#e2e8f0;box-sizing:border-box;">
        <div class="pda-label" style="margin-bottom: 6px;">问题类型</div>
        <select id="exType" class="pda-input-scan" style="width:100%;height:38px;margin-bottom:12px;box-sizing:border-box;">
          <option value="">请选择问题类型</option>
          <option value="箱唛破损">箱唛破损</option>
          <option value="板数不符">板数不符</option>
        </select>
        <div class="pda-label" style="margin-bottom: 6px;">问题描述</div>
        <textarea id="exNote" class="pda-input-scan" rows="3" placeholder="如：外箱破损、水浸、多发少发等…" style="width:100%;resize:vertical;padding:10px;box-sizing:border-box;margin-bottom:12px;"></textarea>
        <div class="ex-photo-header">
          <div class="pda-label" style="margin: 0;">问题照片</div>
          <span class="ex-photo-count" id="exPhotoCount">0/3</span>
        </div>
        <div class="ex-photo-grid" id="exPhotoGrid">
          <div class="pda-photo-list ex-photo-list" id="exPhotoList" style="display: contents;"></div>
          <label class="pda-photo-add ex-photo-add" id="exPhotoAddLabel" for="exPhotoInput">
            <input type="file" id="exPhotoInput" accept="image/*" capture="environment">
            <span class="ex-photo-add-inner">
              <span class="ex-photo-add-icon" aria-hidden="true">📷</span>
              <span>拍照</span>
            </span>
          </label>
        </div>
        <p class="pda-hint" style="margin-top: 8px; margin-bottom: 0;">最多 3 张，点击缩略图右上角可删除</p>
      </div>
      <div class="pda-modal-f" style="display: flex; gap: 10px; border-top: 1px solid var(--border-light); padding: 12px 16px;">
        <button type="button" class="btn btn-default" id="exCancel" style="flex: 1; height: 42px; border-radius: 8px;">取消</button>
        <button type="button" class="btn btn-primary" id="exSubmit" style="flex: 1; height: 42px; border-radius: 8px;">确认提交</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    function $(id){return document.getElementById(id);}
    function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);}
    function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);
    var inboundPhotos = [];
    var exPhotos = [];
    var EX_PHOTO_MAX = 3;
    var problemRegistered = false;
    var STORAGE_INBOUND = 'pda.inbound.arrived';
    function normCab(cab) { return (cab || '').trim().toUpperCase(); }
    function whId() {
      try { return localStorage.getItem('pda.prototype.warehouseId') || 'wh-lax1'; } catch (e) { return 'wh-lax1'; }
    }
    function loadArrivedStore() {
      try {
        var raw = localStorage.getItem(STORAGE_INBOUND);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function getArrivedRecord(cab) {
      var key = normCab(cab);
      if (!key) return null;
      var store = loadArrivedStore();
      var wh = store[whId()] || {};
      return wh[key] || null;
    }
    function saveArrivedRecord(cab, meta) {
      var key = normCab(cab);
      if (!key) return;
      var store = loadArrivedStore();
      if (!store[whId()]) store[whId()] = {};
      store[whId()][key] = meta;
      try { localStorage.setItem(STORAGE_INBOUND, JSON.stringify(store)); } catch (e) {}
    }
    function formatNow() {
      var d = new Date(), z = function (n) { return n < 10 ? '0' + n : '' + n; };
      return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' +
        z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
    }
    function hideDupWarn() {
      var el = $('inboundDupWarn');
      if (el) el.hidden = true;
      $('inboundCabinet').classList.remove('pda-input-scan--warn');
    }
    function showDupWarn(cab) {
      var rec = getArrivedRecord(cab);
      var el = $('inboundDupWarn');
      var text = $('inboundDupWarnText');
      if (!el || !text) return true;
      var msg = '该单号已到仓，请核查是否重复操作。';
      if (rec && rec.at) msg += '（上次到仓：' + rec.at + '）';
      text.textContent = msg;
      el.hidden = false;
      $('inboundCabinet').classList.add('pda-input-scan--warn');
      return true;
    }
    function isDuplicateCab(cab) {
      return !!getArrivedRecord(cab);
    }
    function resetEstPlates() {
      $('inboundEstPlates').value = '—';
    }
    function loadEstPlates(cab) {
      var est = cab ? 12 : null;
      $('inboundEstPlates').value = est ? String(est) : '—';
    }
    function getActualPlatesNum() {
      var n = parseInt(($('inboundActualPlates').value || '').trim(), 10);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }
    function getEstPlatesNum() {
      var n = parseInt(($('inboundEstPlates').value || '').trim(), 10);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }
    function isMismatch() {
      var est = getEstPlatesNum();
      var act = getActualPlatesNum();
      return est > 0 && act > 0 && est !== act;
    }
    function updateMismatchUI() {
      var mismatch = isMismatch();
      var warn = $('inboundMismatchWarn');
      if (!warn) return;
      if (mismatch) {
        $('inboundMismatchEst').textContent = $('inboundEstPlates').value;
        $('inboundMismatchAct').textContent = String(getActualPlatesNum());
        warn.hidden = false;
      } else {
        warn.hidden = true;
        problemRegistered = false;
      }
    }
    function clearExPhotos() {
      exPhotos.forEach(function (p) {
        try { if (p.url) URL.revokeObjectURL(p.url); } catch (e) {}
      });
      exPhotos = [];
      renderExPhotos();
    }
    function renderExPhotos() {
      var list = $('exPhotoList');
      var addLabel = $('exPhotoAddLabel');
      var countEl = $('exPhotoCount');
      if (!list) return;
      list.innerHTML = '';
      exPhotos.forEach(function (p, i) {
        var wrap = document.createElement('div');
        wrap.className = 'ex-photo-thumb';
        var img = document.createElement('img');
        img.className = 'pda-photo-item';
        img.src = p.url;
        img.alt = '异常凭证 ' + (i + 1);
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'ex-photo-del';
        del.setAttribute('aria-label', '删除照片');
        del.textContent = '×';
        del.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var item = exPhotos[i];
          if (item && item.url) try { URL.revokeObjectURL(item.url); } catch (err) {}
          exPhotos.splice(i, 1);
          renderExPhotos();
        });
        wrap.appendChild(img);
        wrap.appendChild(del);
        list.appendChild(wrap);
      });
      if (addLabel) addLabel.style.display = exPhotos.length >= EX_PHOTO_MAX ? 'none' : 'flex';
      if (countEl) countEl.textContent = exPhotos.length + '/' + EX_PHOTO_MAX;
    }
    function openExceptionModal(code) {
      var m = $('modalException');
      $('exScan').value = code || '';
      $('exNote').value = '';
      var typeEl = $('exType');
      if (typeEl) {
        if (isMismatch()) typeEl.value = '板数不符';
        else typeEl.value = '';
      }
      if (isMismatch()) {
        $('exNote').value = '预估 ' + getEstPlatesNum() + ' 板，实收 ' + getActualPlatesNum() + ' 板，板数不一致';
      }
      clearExPhotos();
      m.classList.add('show');
      m.setAttribute('aria-hidden', 'false');
    }
    function closeExceptionModal() {
      var m = $('modalException');
      m.classList.remove('show');
      m.setAttribute('aria-hidden', 'true');
    }
    function submitExceptionModal() {
      var ref = ($('exScan').value || '').trim();
      var type = ($('exType').value || '').trim();
      if (!ref) { toast('请先选择要登记的货件'); return; }
      if (!type) { toast('请选择问题类型'); if ($('exType')) $('exType').focus(); return; }
      problemRegistered = true;
      toast('✅ 异常已登记');
      closeExceptionModal();
    }
    function ensurePlanLoaded() {
      var cab = ($('inboundCabinet').value || '').trim();
      if (!cab || getEstPlatesNum() > 0) return !!cab;
      if (isDuplicateCab(cab)) return false;
      loadEstPlates(cab);
      return true;
    }
    function resolveCabinet(cab) {
      cab = (cab || '').trim();
      if (!cab) { resetEstPlates(); hideDupWarn(); updateMismatchUI(); return false; }
      if (isDuplicateCab(cab)) {
        showDupWarn(cab);
        toast('该单号已到仓，请核查');
        focusSoon('inboundCabinet');
        return false;
      }
      hideDupWarn();
      loadEstPlates(cab);
      updateMismatchUI();
      return true;
    }
    function onActualPlatesChange() {
      var cab = ($('inboundCabinet').value || '').trim();
      if (cab && !getEstPlatesNum()) ensurePlanLoaded();
      updateMismatchUI();
    }
    $('inboundActualPlates').addEventListener('input', onActualPlatesChange);
    $('inboundActualPlates').addEventListener('change', onActualPlatesChange);
    $('inboundActualPlates').addEventListener('focus', function () {
      if (($('inboundCabinet').value || '').trim() && !getEstPlatesNum()) ensurePlanLoaded();
    });
    $('inboundGoProblem').addEventListener('click', function () {
      var cab = ($('inboundCabinet').value || '').trim();
      if (!cab) { toast('请先扫描或输入单号'); focusSoon('inboundCabinet'); return; }
      openExceptionModal(cab);
    });
    $('exCancel').addEventListener('click', closeExceptionModal);
    $('exSubmit').addEventListener('click', submitExceptionModal);
    var exPhotoInput = $('exPhotoInput');
    if (exPhotoInput) {
      exPhotoInput.addEventListener('change', function () {
        var files = this.files;
        if (!files || !files.length) return;
        var remaining = EX_PHOTO_MAX - exPhotos.length;
        if (remaining <= 0) { toast('最多上传 ' + EX_PHOTO_MAX + ' 张照片'); this.value = ''; return; }
        var added = 0;
        for (var i = 0; i < files.length && added < remaining; i++) {
          (function (file) {
            exPhotos.push({ file: file, url: URL.createObjectURL(file) });
            added++;
          })(files[i]);
        }
        if (files.length > remaining) toast('最多 ' + EX_PHOTO_MAX + ' 张，已添加 ' + added + ' 张');
        renderExPhotos();
        this.value = '';
      });
    }
    $('inboundCabinet').addEventListener('input', function () {
      if (!(this.value || '').trim()) {
        hideDupWarn();
        resetEstPlates();
        updateMismatchUI();
      }
    });
    $('inboundCabinet').addEventListener('blur', function () {
      var cab = (this.value || '').trim();
      if (cab) resolveCabinet(cab);
    });
    $('inboundCabinet').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      resolveCabinet(this.value);
      focusSoon('inboundActualPlates');
    });
    $('inboundPhotoInput').addEventListener('change', function () {
      var files = this.files; if (!files || !files.length) return;
      var list = $('inboundPhotoList');
      for (var i = 0; i < files.length; i++) {
        (function (file) {
          var url = URL.createObjectURL(file); inboundPhotos.push({ file: file, url: url });
          var img = document.createElement('img'); img.className = 'pda-photo-item'; img.src = url; img.alt = 'photo'; list.appendChild(img);
        })(files[i]);
      }
      this.value = '';
    });
    function clearForm() {
      $('inboundRemark').value = ''; $('inboundCabinet').value = ''; $('inboundActualPlates').value = ''; resetEstPlates();
      inboundPhotos.forEach(function (p) { try { URL.revokeObjectURL(p.url); } catch (e) {} }); inboundPhotos = [];
      $('inboundPhotoList').innerHTML = ''; hideDupWarn(); clearExPhotos(); problemRegistered = false; updateMismatchUI(); focusSoon('inboundCabinet');
    }
    $('inboundReset').addEventListener('click', clearForm);
    $('inboundConfirm').addEventListener('click', function () {
      var cab = ($('inboundCabinet').value || '').trim();
      if (!cab) { toast('请先扫描或输入柜号'); focusSoon('inboundCabinet'); return; }
      if (!getEstPlatesNum() && !ensurePlanLoaded()) {
        if (isDuplicateCab(cab)) { showDupWarn(cab); toast('该单号已到仓，请核查'); }
        else { toast('请先扫描单号带出预估板数'); }
        focusSoon('inboundCabinet');
        return;
      }
      if (isDuplicateCab(cab)) { showDupWarn(cab); toast('该单号已到仓，请核查'); focusSoon('inboundCabinet'); return; }
      var actualPlates = ($('inboundActualPlates').value || '').trim();
      if (!actualPlates) { toast('请填写实际板数'); focusSoon('inboundActualPlates'); return; }
      if (!/^[1-9]\d*$/.test(actualPlates)) { toast('实际板数须为正整数'); focusSoon('inboundActualPlates'); return; }
      if (!inboundPhotos.length) { toast('请至少上传一张到仓照片'); return; }
      var mismatch = isMismatch();
      toast('正在提交...'); var btn = this; btn.disabled = true;
      setTimeout(function() {
        btn.disabled = false;
        var meta = { at: formatNow(), plates: actualPlates, estPlates: getEstPlatesNum() || null };
        if (mismatch) meta.mismatch = true;
        saveArrivedRecord(cab, meta);
        clearForm();
        toast(mismatch ? (problemRegistered ? '提交成功' : '提交成功，请记得登记问题件') : '提交成功');
      }, 600);
    });
    focusSoon('inboundCabinet');
  })();
  </script>
</body>
</html>
