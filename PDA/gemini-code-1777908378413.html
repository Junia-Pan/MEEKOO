<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meiku Warehouse App</title>
    <!-- 引入 Tailwind CSS 进行快速样式构建 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons 用于图标展示 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* 针对 PDA 设备的全局基础样式优化 */
        body {
            background-color: #f3f4f6; /* 柔和的灰色背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }
        .app-container {
            max-width: 450px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        /* 隐藏滚动条但保留滚动功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .view-section { display: none; flex-grow: 1; flex-direction: column; }
        .view-section.active { display: flex; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 全局顶部导航栏 -->
    <header class="bg-blue-600 text-white p-4 flex items-center justify-between shadow-md z-10 sticky top-0">
        <div class="flex items-center space-x-3">
            <button id="btn-back" class="hidden text-white" onclick="goHome()">
                <i class="ph ph-caret-left text-2xl"></i>
            </button>
            <h1 id="page-title" class="text-lg font-bold">Meiku Warehouse</h1>
        </div>
        <div class="flex items-center space-x-3">
            <i class="ph ph-bell text-xl"></i>
            <i class="ph ph-user-circle text-2xl"></i>
        </div>
    </header>

    <!-- 1. 首页工作台 (Home View) -->
    <main id="view-home" class="view-section active p-4 bg-gray-50 hide-scrollbar overflow-y-auto">
        <!-- 头部货车占位图 -->
        <div class="w-full h-40 bg-gray-800 rounded-lg mb-6 flex items-center justify-center relative overflow-hidden shadow-inner">
            <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80" alt="Warehouse" class="absolute inset-0 w-full h-full object-cover opacity-60">
            <span class="relative text-white font-bold tracking-wider text-xl">MEIKU TRANSIT</span>
        </div>

        <!-- 宫格功能菜单 -->
        <div class="grid grid-cols-3 gap-4">
            <!-- 拆柜入库 -->
            <button onclick="navTo('view-devanning', 'Devanning (拆柜)')" class="flex flex-col items-center justify-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 active:bg-blue-50 transition-colors">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2">
                    <i class="ph ph-package text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-gray-700 text-center">Devanning</span>
            </button>
            <!-- 移库 -->
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 active:bg-blue-50 transition-colors">
                <div class="w-12 h-12 bg-cyan-100 text-cyan-600 rounded-full flex items-center justify-center mb-2">
                    <i class="ph ph-arrows-left-right text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-gray-700 text-center">Move</span>
            </button>
            <!-- 留言板 -->
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 active:bg-blue-50 transition-colors relative">
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>
                <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mb-2">
                    <i class="ph ph-chat-circle-text text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-gray-700 text-center">Message</span>
            </button>
            <!-- 自提出库 -->
            <button onclick="navTo('view-pickup', 'PickUp Out (自提)')" class="flex flex-col items-center justify-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 active:bg-blue-50 transition-colors">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-2">
                    <i class="ph ph-truck text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-gray-700 text-center">PickUp Out</span>
            </button>
            <!-- 快递出库 -->
            <button onclick="navTo('view-express', 'Express Out (快递)')" class="flex flex-col items-center justify-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 active:bg-blue-50 transition-colors">
                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-2">
                    <i class="ph ph-airplane-tilt text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-gray-700 text-center">Express Out</span>
            </button>
        </div>
    </main>

    <!-- 2. 拆柜扫描模块 (Devanning View) -->
    <main id="view-devanning" class="view-section bg-white hide-scrollbar overflow-y-auto relative">
        <div class="p-4 border-b border-gray-200 bg-gray-50">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-gray-500">Container No:</span>
                <span class="font-bold text-gray-800">BEAU618852502</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">Status:</span>
                <span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded">Executing</span>
            </div>
        </div>
        
        <!-- 扫码录入区 -->
        <div class="p-4 shadow-sm z-10 bg-white">
            <label class="block text-sm font-bold text-gray-700 mb-2">Please scan or input pallet No.</label>
            <div class="flex space-x-2">
                <input type="text" id="dev-scan-input" class="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 1_BEAU6188...">
                <button onclick="simulateScan('devanning')" class="bg-blue-600 text-white px-4 py-3 rounded-lg font-bold active:bg-blue-700">
                    <i class="ph ph-barcode text-xl"></i>
                </button>
            </div>
        </div>

        <!-- 已扫列表 -->
        <div class="flex-1 p-2 bg-gray-50">
            <div class="text-xs text-gray-500 mb-2 px-2 flex justify-between">
                <span>FBACODE / Pallet</span>
                <span>CTN / Est.CTN</span>
            </div>
            <!-- 列表项示例 -->
            <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 mb-2 flex items-center justify-between">
                <div>
                    <div class="font-bold text-sm text-gray-800">IND6</div>
                    <div class="text-xs text-gray-400">1_BEAU6188...</div>
                </div>
                <div class="flex items-center space-x-3">
                    <input type="number" value="10" class="w-12 text-center border border-gray-300 rounded py-1 text-sm font-bold">
                    <span class="text-gray-400 text-sm">/ 10</span>
                    <button class="text-red-500 p-1"><i class="ph ph-trash text-lg"></i></button>
                </div>
            </div>
        </div>

        <!-- 底部提交栏 -->
        <div class="p-4 bg-white border-t border-gray-200 sticky bottom-0">
            <button onclick="submitDevanning()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg text-lg shadow-md active:bg-blue-700">
                Devan Submit
            </button>
        </div>
    </main>

    <!-- 3. 快递出库模块 (Express Out View) -->
    <main id="view-express" class="view-section bg-white hide-scrollbar overflow-y-auto relative">
        <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
            <span class="font-bold text-gray-700">*Move Type:</span>
            <select id="carrier-select" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 font-bold">
                <option value="FEDEX">FEDEX</option>
                <option value="UPS">UPS</option>
                <option value="USPS">USPS</option>
            </select>
        </div>

        <!-- 扫码与车牌录入 -->
        <div class="p-4 bg-white shadow-sm z-10 space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Scan Pallet</label>
                <div class="flex space-x-2">
                    <input type="text" id="exp-scan-input" class="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Scan here...">
                    <button onclick="simulateScan('express')" class="bg-blue-600 text-white px-4 py-3 rounded-lg font-bold active:bg-blue-700">
                        OK
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Trailer No (车牌号)</label>
                <input type="text" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Input Trailer No">
            </div>
        </div>

        <!-- 附件上传区 -->
        <div class="p-4 bg-gray-50 flex-1">
            <div class="font-bold text-sm text-gray-700 mb-3">Upload File</div>
            <button class="w-16 h-16 bg-gray-200 border-2 border-dashed border-gray-400 rounded-lg flex items-center justify-center text-gray-500 active:bg-gray-300">
                <i class="ph ph-plus text-2xl"></i>
            </button>
            <p class="text-xs text-gray-400 mt-2">Upload trailer photos & POD</p>
        </div>

        <!-- 底部提交栏 -->
        <div class="p-4 bg-white border-t border-gray-200 sticky bottom-0">
            <button onclick="showToast('Success', 'Successfully completed.', 'success')" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg text-lg shadow-md active:bg-blue-700">
                Submit
            </button>
        </div>
    </main>

    <!-- 占位 View -->
    <main id="view-pickup" class="view-section bg-gray-50 flex items-center justify-center">
        <div class="text-gray-400 text-center">
            <i class="ph ph-wrench text-4xl mb-2"></i>
            <p>PickUp Module under construction</p>
        </div>
    </main>

    <!-- 模拟 Toast / Modal 弹窗 -->
    <div id="toast-overlay" class="absolute inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
            <div id="toast-header" class="p-4 font-bold text-lg text-white text-center">Title</div>
            <div class="p-6 text-center text-gray-700 font-medium" id="toast-message">
                Message content goes here.
            </div>
            <div class="p-4 bg-gray-50 flex justify-center border-t border-gray-100">
                <button onclick="closeToast()" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold w-full active:bg-blue-700">OK</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 页面路由模拟
    function navTo(viewId, title) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('page-title').innerText = title;
        document.getElementById('btn-back').classList.remove('hidden');
    }

    function goHome() {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById('view-home').classList.add('active');
        document.getElementById('page-title').innerText = 'Meiku Warehouse';
        document.getElementById('btn-back').classList.add('hidden');
    }

    // 弹窗控制逻辑
    function showToast(title, message, type) {
        const overlay = document.getElementById('toast-overlay');
        const header = document.getElementById('toast-header');
        document.getElementById('toast-message').innerText = message;
        
        header.innerText = title;
        if(type === 'error') {
            header.className = 'p-4 font-bold text-lg text-white text-center bg-red-500';
        } else if (type === 'warning') {
            header.className = 'p-4 font-bold text-lg text-gray-800 text-center bg-yellow-400';
        } else {
            header.className = 'p-4 font-bold text-lg text-white text-center bg-green-500';
        }
        
        overlay.classList.remove('hidden');
    }

    function closeToast() {
        document.getElementById('toast-overlay').classList.add('hidden');
    }

    // 业务交互模拟
    function simulateScan(module) {
        if(module === 'devanning') {
            showToast('Error', 'The barcode has been scanned. (重复扫描拦截测试)', 'error');
            document.getElementById('dev-scan-input').value = '';
        } else if (module === 'express') {
            const carrier = document.getElementById('carrier-select').value;
            if(carrier !== 'FEDEX') {
                showToast('Carrier Mismatch', 'The scanned pallet label does not match the selected courier channel.', 'error');
            } else {
                showToast('Success', 'Scan matched FEDEX.', 'success');
            }
            document.getElementById('exp-scan-input').value = '';
        }
    }

    function submitDevanning() {
        // 模拟数量不匹配防呆校验
        showToast('Confirm Completion', 'Pallets: 15, CTN: 3606 \n There are unpacked items.', 'warning');
    }
</script>

</body>
</html>
