<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>单项退仓 - Meekoo PDA</title>
  <link rel="stylesheet" href="pda.css">
</head>
<body class="pda-body">
  <main class="pda-main">
    <section class="pda-view active" aria-label="自提退库">
      <div class="pda-wb-status" aria-hidden="true">
        <span class="pda-wb-time">09:41</span>
        <div class="pda-wb-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M2 10h1v1H2zm3-2h1v3H5zm3-3h1v6H8zm3-3h1v9h-1zm3-2h1v11h-1z"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a5.5 5.5 0 0 1 6.94 0M12 19a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"></path></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"></rect><rect x="3" y="3" width="10" height="6" rx="1"></rect><path d="M19 4v4" stroke="currentColor" stroke-linecap="round" stroke-width="2" fill="none"></path></svg>
        </div>
      </div>
      <div class="pda-subnav">
        <button type="button" class="pda-back" data-back aria-label="返回">‹</button>
        <span class="pda-subnav-title">单项退仓</span>
      </div>
      <div class="pda-scroll">
        <div class="pda-card">
          <div class="pda-label">旧板标</div>
          <div class="pda-scan-row">
            <input type="text" class="pda-input-scan" id="selfRetPlate" placeholder="扫描旧板标…" autocomplete="off">
            <button type="button" class="pda-btn-cam" data-cam-placeholder="自提退库-板标">📷</button>
          </div>
        </div>
        <div class="pda-card">
          <div class="pda-label">上架库位</div>
          <div class="pda-scan-row">
            <input type="text" class="pda-input-scan" id="selfRetBin" placeholder="扫描库位码…" autocomplete="off">
            <button type="button" class="pda-btn-cam" data-cam-placeholder="自提退库-库位">📷</button>
          </div>
        </div>
      </div>
      <div class="pda-footer-actions">
        <button type="button" class="btn btn-default" id="selfRetReset">重置</button>
        <button type="button" class="btn btn-primary" id="selfRetSubmit">确认退库上架</button>
      </div>
    </section>
  </main>
  <div class="pda-toast" id="toast" role="status"></div>
  <div class="pda-modal-overlay" id="modalCam" aria-hidden="true"><div class="pda-modal" role="dialog"><div class="pda-modal-h" id="modalCamTitle"></div><div class="pda-modal-b" id="modalCamBody"></div><div class="pda-modal-f"><button type="button" class="btn btn-default" data-close-modal>关闭</button></div></div></div>
  <script>
  (function(){
    function $(id){return document.getElementById(id);} function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2600);} function focusSoon(id){setTimeout(function(){var e=$(id);if(e){e.focus();e.select&&e.select();}},120);}
    document.querySelectorAll('[data-back]').forEach(function(b){b.addEventListener('click',function(){window.location.href='wms-pda.html';});});
    function refreshTime(){var n=document.querySelectorAll('.pda-wb-time');if(!n.length)return;var d=new Date(),z=function(x){return x<10?'0'+x:x;},t=z(d.getHours())+':'+z(d.getMinutes());n.forEach(function(e){e.textContent=t;});} refreshTime(); setInterval(refreshTime, 30000);
    function openCamModal(t){var m=$('modalCam'),mt=$('modalCamTitle'),mb=$('modalCamBody');if(!m)return;if(mt)mt.textContent=t||'摄像头扫码';if(mb)mb.innerHTML='';m.classList.add('show');m.setAttribute('aria-hidden','false');} document.querySelectorAll('[data-cam-placeholder]').forEach(function(b){b.addEventListener('click',function(){openCamModal(b.getAttribute('data-cam-placeholder'));});}); document.querySelectorAll('[data-close-modal]').forEach(function(b){b.addEventListener('click',function(){var m=$('modalCam');if(m){m.classList.remove('show');m.setAttribute('aria-hidden','true');}});});
    $('selfRetReset').addEventListener('click', function () { $('selfRetPlate').value = ''; $('selfRetBin').value = ''; focusSoon('selfRetPlate'); }); $('selfRetSubmit').addEventListener('click', function () { var p = ($('selfRetPlate').value || '').trim(); var b = ($('selfRetBin').value || '').trim(); if (!p) { toast('请扫描旧板标'); focusSoon('selfRetPlate'); return; } if (!b) { toast('请扫描上架库位'); focusSoon('selfRetBin'); return; } toast('自提退库完成（原型）：' + p + ' → 待上架已确认 · 库位 ' + b + '（不重打码）'); }); focusSoon('selfRetPlate');
  })();
  </script>
</body>
</html>
