<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户端 - 工单管理</title>
  <link rel="stylesheet" href="./_styles.css" />
  <style>
    /* Client shell (menu framework) */
    .client-shell{display:flex;min-height:100vh}
    .client-sidenav{
      width:248px;flex:0 0 248px;
      padding:12px 10px;
      position:sticky;top:0;align-self:flex-start;height:100vh;
      background:#fff;
      border-right:1px solid rgba(15,23,42,.06);
      box-shadow:2px 0 12px rgba(2,6,23,.04);
      display:flex;flex-direction:column;
    }
    .client-s-brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      margin-bottom:6px;
      text-decoration:none;color:inherit;
    }
    .client-s-brand:hover{
      background:rgba(37,99,235,.06);
      border-color:transparent;
      color:var(--primary);
    }
    .client-s-brand:hover .client-s-logo{
      background:rgba(37,99,235,.12);
      color:var(--primary);
    }
    .client-divider{
      height:1px;
      background:rgba(15,23,42,.06);
      margin:6px 8px 8px;
      flex:0 0 auto;
    }
    .client-s-logo{
      width:30px;height:30px;border-radius:9px;
      background:rgba(37,99,235,.10);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .client-s-logo svg{width:18px;height:18px;display:block}
    .client-s-title{font-weight:800;font-size:13px;line-height:1.2}
    .client-s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .client-nav{
      display:flex;flex-direction:column;gap:2px;
      flex:1;min-height:0;
      overflow-y:auto;
      padding:2px 4px 10px 2px;
      scrollbar-gutter: auto;
      scrollbar-width: auto;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .client-nav::-webkit-scrollbar{width:6px}
    .client-nav::-webkit-scrollbar-track{background:#eef2f7}
    .client-nav::-webkit-scrollbar-thumb{
      background:rgba(100,116,139,.55);
      border-radius:6px;
    }
    .client-nav:hover::-webkit-scrollbar-thumb{background:rgba(71,85,105,.75)}
    .client-nav a{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:12px;
      text-decoration:none;
      border:1px solid transparent;
      color:rgba(15,23,42,.84);
      font-size:12.5px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-nav a:active{transform:translateY(1px)}
    .client-nav a:hover{background:rgba(37,99,235,.06);border-color:transparent;color:var(--primary)}
    .client-nav a.active{
      background:rgba(37,99,235,.10);
      border-color:transparent;
      color:var(--primary);
      font-weight:650;
    }
    .client-ico{
      width:28px;height:28px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.035);
      font-size:12px;
      color:rgba(100,116,139,.95);
      flex:0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-ico svg{width:14px;height:14px;display:block}
    .client-ico svg path,
    .client-ico svg rect,
    .client-ico svg circle,
    .client-ico svg ellipse{stroke:currentColor}
    .client-nav a:hover .client-ico{
      background:rgba(37,99,235,.12);
      border-color:rgba(37,99,235,.10);
      color:var(--primary);
    }
    .client-nav a.active .client-ico{
      background:var(--primary);
      border-color:transparent;
      color:#fff;
    }
    .client-group{margin-top:6px}
    .client-group details{border:none;background:transparent;overflow:visible}
    .client-group summary{
      list-style:none;cursor:pointer;
      padding:7px 10px;border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:12.5px;font-weight:650;
      color:rgba(15,23,42,.84);
      transition: background .15s ease, color .15s ease;
      user-select:none;
    }
    .client-group summary:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group details[open] summary{background:rgba(37,99,235,.10);color:var(--primary)}
    .client-group summary::-webkit-details-marker{display:none}
    .client-group summary .client-chev{
      width:18px;height:18px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      opacity:.55;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
      background:rgba(15,23,42,.04);
      color:currentColor;
      user-select:none;
    }
    .client-group details[open] summary .client-chev{transform:rotate(180deg);opacity:.9}
    .client-group .subnav{
      display:flex;flex-direction:column;gap:2px;
      padding:6px 0 8px 32px;
      margin:0;border:none;background:transparent;
      max-height:0;opacity:0;transform:translateY(-2px);
      overflow:hidden;
      transition:max-height .22s ease, opacity .18s ease, transform .18s ease;
    }
    .client-group details[open] .subnav{max-height:420px;opacity:1;transform:translateY(0)}
    .client-group .subnav a{
      padding:7px 10px;border-radius:12px;
      color:rgba(15,23,42,.82);
      background:transparent;
    }
    .client-group .subnav a:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group .subnav .client-ico{width:24px;height:24px;border-radius:9px}
    .client-group .subnav .client-ico svg{width:12px;height:12px}
    .client-main{flex:1;min-width:0;display:flex;flex-direction:column}

    /* Top strip nav */
    .client-topnav{
      position:sticky;top:0;z-index:30;
      height:52px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:0 16px;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .client-crumb{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:12.5px;color:var(--muted);
      user-select:none;
    }
    .client-crumb b{color:var(--text);font-weight:750}
    .client-top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;color:var(--text);
      cursor:pointer;
      box-shadow:0 1px 0 rgba(15,23,42,.02);
    }
    .icon-btn:hover{background:#f8fafc}
    .icon-btn svg{width:18px;height:18px}
    .notif-dot{
      position:absolute;top:-6px;right:-6px;
      min-width:16px;height:16px;padding:0 4px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:#ef4444;color:#fff;
      font-size:10px;line-height:16px;font-weight:800;
      border:2px solid #fff;
    }
    .icon-wrap{position:relative;display:inline-flex}
    .avatar-btn{
      width:32px;height:32px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(34,197,94,.14));
      color:rgba(15,23,42,.78);
      cursor:pointer;
      overflow:hidden;
      text-decoration:none;
    }
    .avatar-btn:hover{filter:saturate(110%)}
    .avatar-btn svg{opacity:.9;width:18px;height:18px}

    /* Make existing page container work in shell */
    .client-main .wrap{max-width:none;margin:16px 18px;padding:0}
    @media (max-width: 980px){
      .client-sidenav{display:none}
      .client-main .wrap{margin:12px 12px}
    }

    /* 仅调整本页列表区字号/行高，不改变全局表格线、表头等样式 */
    #woListTable th,
    #woListTable td {
      font-size: 13px;
      line-height: 1.55;
    }
    #woListTable td.col-single { white-space: nowrap; }
    #woListTable .wo-ticket-id {
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
    }
    #woListTable .wo-ticket-id:hover {
      text-decoration: underline;
    }
    .wo-attach-panel .panel-h{padding:10px 14px}
    .wo-attach-panel .panel-b{padding:10px 14px}
    .wo-attach-list{display:flex;flex-wrap:wrap;gap:10px}
    .wo-attach-item{
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 10px;border-radius:999px;
      border:1px solid rgba(37,99,235,.18);
      background:var(--primary-weak);
      color:var(--primary);
      font-size:12.5px;
      max-width: 100%;
      cursor:pointer;
    }
    .wo-attach-item:hover{border-color:rgba(37,99,235,.32)}
    .wo-attach-name{
      display:inline-block;
      max-width: 320px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      vertical-align:bottom;
    }
    .wo-attach-ico{
      width:18px;height:18px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      background:rgba(37,99,235,.12);
      border:1px solid rgba(37,99,235,.16);
      flex:0 0 auto;
      font-size:12px;
      line-height:1;
    }

    /* Ticket detail: one screen, left info / right conversation */
    .wo-ticket-modal{
      width:min(1120px, calc(100vw - 36px)) !important;
      max-width:none !important;
      height:min(860px, calc(100vh - 36px));
      display:flex; flex-direction:column;
    }
    .wo-ticket-modal .modal-body{
      flex:1; min-height:0; max-height:none;
      overflow:hidden; display:flex; flex-direction:column;
      padding:14px 16px 12px;
    }
    .wo-detail-stack{
      display:flex; flex-direction:column; flex:1; min-height:0; width:100%;
    }
    .wo-head-title{display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0}
    .wo-head-id{font-size:15px; font-weight:750; color:#475569; line-height:1.2}
    .wo-head-issue{font-size:16px; font-weight:800; color:var(--text); line-height:1.2}
    .wo-ticket-layout{
      display:grid; grid-template-columns:minmax(0,1fr) 380px;
      gap:14px; align-items:stretch;
      flex:1; min-height:0; width:100%; height:100%;
      grid-template-rows:minmax(0, 1fr);
    }
    .wo-scroll{position:relative; min-width:0; min-height:0}
    .wo-left-wrap{overflow:visible; height:100%}
    .wo-left-wrap .wo-scroll-bar{right:-8px}
    .wo-ticket-left{
      height:100%; min-height:0; overflow-y:auto;
      padding-right:4px; scrollbar-width:none;
    }
    .wo-ticket-left::-webkit-scrollbar,
    .wo-chat-list::-webkit-scrollbar{display:none; width:0; height:0}
    .wo-scroll-bar{
      display:none; position:absolute;
      top:6px; right:2px; bottom:6px; width:6px;
      pointer-events:none;
    }
    .wo-scroll.is-scroll .wo-scroll-bar{display:block}
    .wo-scroll-thumb{
      position:absolute; left:0; width:100%;
      border-radius:8px; background:#94a3b8;
    }
    .wo-chat{
      height:100%; min-height:0;
      display:flex; flex-direction:column;
      border:1px solid rgba(15,23,42,.10);
      border-radius:12px; background:#fff;
      padding:0 16px 12px 12px; box-sizing:border-box;
    }
    .wo-chat-h{
      flex-shrink:0; padding:10px 0;
      border-bottom:1px solid rgba(15,23,42,.08);
      font-weight:750; font-size:12.5px; color:var(--text);
    }
    .wo-chat-scroll{flex:1 1 auto; display:flex; flex-direction:column; min-height:0}
    .wo-chat-scroll .wo-scroll-bar{right:-12px}
    .wo-chat-list{
      flex:1 1 auto; min-height:0; overflow-y:auto;
      display:flex; flex-direction:column; gap:10px;
      padding:12px 4px 8px 0;
    }
    .wo-composer{flex-shrink:0; border-top:1px solid rgba(15,23,42,.08); padding-top:10px}
    .wo-reply-text{
      width:100%; min-height:72px; max-height:140px; resize:vertical;
      border:1px solid rgba(15,23,42,.12); border-radius:10px;
      padding:8px 10px; font:inherit; font-size:13px; color:var(--text);
      box-sizing:border-box; background:#fff;
    }
    .wo-reply-text:focus{outline:none; border-color:rgba(37,99,235,.45); box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .wo-composer .file-drop{margin-top:8px; padding:10px 12px}
    .wo-composer-bar{display:flex; justify-content:flex-end; margin-top:10px}
    .file-drop{
      border:1.5px dashed rgba(15,23,42,.18);
      background:#f8fafc; border-radius:12px;
      padding:14px 12px; text-align:center; cursor:pointer;
      transition:border-color .12s ease, box-shadow .12s ease, background .12s ease;
      user-select:none;
    }
    .file-drop:hover{border-color:rgba(37,99,235,.28); box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .file-drop.is-drag{border-color:rgba(37,99,235,.45); background:#eff6ff; box-shadow:0 0 0 4px rgba(37,99,235,.12)}
    .file-drop:focus{outline:none}
    .file-drop:focus-visible{box-shadow:0 0 0 3px rgba(37,99,235,.18)}
    .file-drop input[type="file"]{display:none}
    .file-drop-title{font-size:13px; font-weight:650; color:var(--text)}
    .file-drop-hint{margin-top:4px; font-size:12px; color:var(--muted)}
    .file-drop-list{display:flex; flex-direction:column; gap:6px; margin-top:8px}
    .file-drop-list:empty{display:none}
    .file-drop-file{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:6px 10px; border:1px solid rgba(15,23,42,.10); border-radius:8px;
      background:#fff; font-size:12px; color:var(--text);
    }
    .wo-file-remove{
      border:none; background:transparent; color:#b42318;
      font-size:12px; cursor:pointer; padding:0 2px; flex:0 0 auto;
    }
    .wo-info-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px 18px}
    .wo-v,.wo-bubble{overflow-wrap:anywhere}
    .wo-empty{color:var(--muted); font-size:12px}
    @media (max-width: 980px){
      .wo-ticket-modal{height:auto; max-height:calc(100vh - 24px)}
      .wo-ticket-modal .modal-body{display:block; overflow-y:auto}
      .wo-ticket-layout{display:flex; flex-direction:column}
      .wo-info-grid{grid-template-columns:1fr 1fr}
      .wo-ticket-left{height:auto; overflow:visible}
      .wo-chat{height:480px}
    }
    .wo-section{
      border:1px solid rgba(15,23,42,.10);
      border-radius:12px;
      background:#fff;
      overflow:hidden;
    }
    .wo-section + .wo-section,
    .wo-section + .wo-fee-card{margin-top:12px}
    .wo-fee-card{
      border:1px solid rgba(15,23,42,.10);
      border-radius:12px;
      background:#fff;
      overflow:hidden;
    }
    .wo-fee-head{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px 14px 8px;
    }
    .wo-fee-title{
      display:inline-flex; align-items:center; gap:8px;
      font-size:13px; font-weight:650; color:var(--text);
    }
    .wo-fee-title::before{
      content:""; width:3px; height:14px; border-radius:2px;
      background:var(--primary); flex-shrink:0;
    }
    .wo-fee-sum{font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap}
    .wo-fee-sum strong{font-size:14px; font-weight:700; color:var(--text); margin-left:4px}
    .wo-fee-body{padding:0 14px 12px}
    .wo-fee-empty{
      min-height:58px; display:flex; align-items:center; justify-content:center;
      border:1px dashed rgba(15,23,42,.12); border-radius:10px;
      color:var(--muted); font-size:13px; background:#f8fafd;
    }
    .wo-fee-table{width:100%; border-collapse:collapse; font-size:13px}
    .wo-fee-table th,.wo-fee-table td{
      padding:10px 12px; border-bottom:1px solid rgba(15,23,42,.08); text-align:left;
    }
    .wo-fee-table th{color:#64748b; font-weight:650; background:#f8fafd; font-size:12px}
    .wo-fee-table td{color:var(--text); font-weight:600}
    .wo-fee-table th:nth-child(n+2),.wo-fee-table td:nth-child(n+2){text-align:right}
    .wo-fee-table tr:last-child td{border-bottom:none}
    .wo-fee-table td:last-child{font-weight:700}
    .wo-section-h{
      padding:10px 12px;
      border-bottom:1px solid rgba(15,23,42,.08);
      font-weight:750;
      color:var(--text);
      background:linear-gradient(#fff,#fafafa);
      font-size:12.5px;
    }
    .wo-section-b{padding:12px}
    .wo-k{font-size:12px;color:var(--muted);margin-bottom:4px}
    .wo-v{font-size:13px;color:var(--text);line-height:1.65;word-break:break-word}
    .wo-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .wo-status-tag{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;font-size:12.5px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;color:var(--text);
      font-weight:650;
    }
    .wo-status-tag.closed{background:#f1f5f9;color:#475569;border-color:rgba(15,23,42,.10)}
    .wo-status-tag.processing{background:rgba(217,119,6,.10);color:#9a3412;border-color:rgba(217,119,6,.22)}
    .wo-status-tag.pending{background:rgba(220,38,38,.10);color:#991b1b;border-color:rgba(220,38,38,.22)}
    .wo-status-tag.resolved{background:rgba(5,150,105,.10);color:#065f46;border-color:rgba(5,150,105,.22)}

    /* Attachments: customer files and warehouse files stack, each with its own download */
    .wo-file-group + .wo-file-group{
      margin-top:14px; padding-top:14px;
      border-top:1px solid rgba(15,23,42,.08);
    }
    .wo-file-group-head{
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; margin-bottom:8px; min-height:24px;
    }
    .wo-file-group-title{font-size:12px; font-weight:650; color:var(--muted)}
    .wo-file-dl{height:24px; padding:0 8px; font-size:12px; border-radius:8px}
    .wo-file-row{display:flex; flex-wrap:wrap; gap:8px}
    .wo-file-empty-line{font-size:12px; color:var(--muted); line-height:32px}
    .wo-empty-slot{
      min-height:58px; display:flex; align-items:center; justify-content:center;
      box-sizing:border-box; border:1px dashed rgba(15,23,42,.16); border-radius:10px;
      color:var(--muted); font-size:13px; background:#f8fafc;
    }
    .wo-file-card{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:10px;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      cursor:pointer;
      text-align:left;
      width:220px;
      box-sizing:border-box;
    }
    .wo-file-card:hover{border-color:rgba(37,99,235,.26)}
    .wo-file-ico{
      width:34px;height:34px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:#fff;border:1px solid rgba(15,23,42,.10);
      flex:0 0 auto;font-size:16px;
    }
    .wo-file-name{font-size:12.5px;color:var(--primary);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wo-file-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

    /* Conversation */
    .wo-msg{display:flex;flex-direction:column;gap:4px; max-width:100%}
    .wo-msg-meta{font-size:11.5px;color:var(--muted)}
    .wo-bubble{
      max-width: 92%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;
      font-size:13px;line-height:1.65;color:var(--text);
      box-shadow:0 8px 18px rgba(2,6,23,.06);
      white-space:pre-wrap;
    }
    .wo-msg.is-client{align-items:flex-end}
    .wo-msg.is-staff{align-items:flex-start}
    .wo-msg.is-client .wo-bubble{background:linear-gradient(180deg,#fff,var(--primary-weak));border-color:rgba(37,99,235,.16)}
    .wo-msg.is-staff .wo-bubble{background:#f8fafc;border-color:rgba(15,23,42,.10)}
    .wo-bubble-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .wo-bubble-file{
      display:inline-flex;align-items:center;gap:4px;max-width:100%;
      padding:3px 8px;border-radius:999px;cursor:pointer;
      background:#fff;border:1px solid rgba(37,99,235,.22);
      color:var(--primary);font:inherit;font-size:12px;line-height:1.4;
    }
    .wo-bubble-file span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Table cell alignment & Operation column */
    .table th.op-col,
    .table td.op-col{
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      min-width: 248px;
      width: 248px;
      white-space: nowrap;
    }
    .table th.op-col{ z-index: 3; }
    .op-btns{
      display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    }
    .table td.op-col .btn,
    .table td.op-col .btn-ghost-lite{

    const STATUSES = ["全部","待处理","处理中","已处理","已关闭"];
    function pad2(n){ return String(n).padStart(2,"0"); }
    function uniq(arr){
      const out=[]; const seen=new Set();
      (arr||[]).forEach((x)=>{
        const v=String(x||"").trim();
        if (!v) return;
        const key=v.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        out.push(v);
      });
      return out;
    }
    function formatDT(iso){
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso || "");
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;

          ],
        },
      ];
    })();
    const state = { status:"全部", rows:mock, filtered:mock };
    const pager = { page: 1, pageSize: 10 };
    const { getSlice } = wireTablePager(
      pager,
      { count: "countPill", pageSize: "pgPageSize", page: "pgPage", totalPages: "pgTotalPages", prev: "pgPrev", next: "pgNext" },
      () => state.filtered.length,
      () => render()
    );

    function statusDot(s){
      if (s === "已关闭") return "";
      if (s === "已处理") return "success";
      if (s === "处理中") return "warn";
      if (s === "待处理") return "danger";
      return "";
    }

    function countForStatus(s){
      if (s==="全部") return state.rows.length;
      return state.rows.filter((r)=>r.status===s).length;
    }

    function renderStatusTabs(){
      const host=document.getElementById("statusTabs");
      if (!host) return;
      host.innerHTML="";
      STATUSES.forEach((s)=>{
        const pressed=s===state.status;
        const n=countForStatus(s);
        host.appendChild(el("button",{
          class:"status-tab",
          type:"button",
          "aria-pressed":pressed?"true":"false",
          title:`筛选：${s}（${n}）`,
          onClick:()=>{ state.status=s; runSearch(); },
        },
        el("span",{},s),
        el("span",{class:"cnt"},`(${n})`)));
      });
    }

    function runSearch(){
      const qTid=(document.getElementById("q_tid")?.value||"").trim().toUpperCase();
      const qOrder=(document.getElementById("q_order")?.value||"").trim().toUpperCase();
      const qContainer=(document.getElementById("q_container")?.value||"").trim().toUpperCase();
      const qCustomerRefNo=(document.getElementById("q_customerRefNo")?.value||"").trim().toUpperCase();
      const filtered=state.rows.filter((r)=>{
        if (state.status!=="全部" && r.status!==state.status) return false;
        if (qTid && !String(r.id||"").toUpperCase().includes(qTid)) return false;
        if (qOrder && !String(r.orderNo||"").toUpperCase().includes(qOrder)) return false;
        if (qContainer && !String(r.containerNo||"").toUpperCase().includes(qContainer)) return false;
        if (qCustomerRefNo && !String(r.customerRefNo||"").toUpperCase().includes(qCustomerRefNo)) return false;
        return true;
      });
      state.filtered=filtered;
      pager.page = 1;
      render();
      renderStatusTabs();
    }

    function cellText(val){
      const text = String(val || "").trim();
      return text || "-";
    }
    function cellStatus(s){
      return el("span",{class:"badge"}, el("span",{class:`dot ${statusDot(s)}`}), s);
    }
    function render(){
      const tbody=document.getElementById("tbody");
      tbody.innerHTML="";
      const all=state.filtered;
      document.getElementById("empty").style.display=all.length?"none":"block";
      const rows=getSlice(all);
      const rowStart=(pager.page-1)*pager.pageSize;
      rows.forEach((r, idx)=>{
        const actions = [];
        const replyBtn = el("button",{class:"btn",type:"button",onClick:(ev)=>{ ev.stopPropagation(); openDetail(r, { focusReply:true }); }}, "回复");
        if(r.status === "待处理"){
          actions.push(el("button",{class:"btn",type:"button",onClick:(ev)=>{ ev.stopPropagation(); editTicket(r); }}, "编辑"));
          actions.push(replyBtn);
          actions.push(el("button",{class:"btn op-btn-cancel",type:"button",onClick:(ev)=>{ ev.stopPropagation(); closeTicket(r); }}, "关闭工单"));
        } else if(r.status === "处理中" || r.status === "已处理"){
          actions.push(replyBtn);
        } else if(r.status === "已关闭"){
          actions.push(el("button",{class:"btn btn-ghost-lite",type:"button",onClick:(ev)=>{ ev.stopPropagation(); openDetail(r); }}, "查看详情"));
        }
        tbody.appendChild(el("tr",{},
          el("td",{}, String(rowStart + idx + 1)),
          el("td",{}, el("span",{
            class:"wo-ticket-id",
            title:"查看详情",
            onClick:(ev)=>{ ev.stopPropagation(); openDetail(r); },
          }, r.id)),
          el("td",{class:"col-single"}, cellText(r.orderNo)),
          el("td",{class:"col-single"}, cellText(r.containerNo)),
          el("td",{class:"col-single"}, cellText(r.customerRefNo)),
          el("td",{}, r.type),
          el("td",{}, r.issue),
          el("td",{}, r.detail),
          el("td",{}, cellStatus(r.status)),
          el("td",{}, r.lastUpdate || "-"),
          el("td",{class:"col-single"}, formatDT(r.createdAt)),
          el("td",{class:"col-single"}, formatDT(r.updatedAt)),
          el("td",{class:"op-col"}, el("div",{class:"op-btns"}, ...actions))
        ));
      });
    }

    let detailHandle = null;

    function dismissDetail(){
      if (!detailHandle) return;
      const h = detailHandle;
      detailHandle = null;
      h.close();
      if (h.overlay && h.overlay.parentNode) h.overlay.remove();
    }

    function personName(by){
      const b = String(by || "").trim();
      if (!b) return "-";
      if (/^client$/i.test(b) || b === "客户") return "客户";
      if (/^warehouse$/i.test(b) || b === "仓库") return "仓库";
      if (/^system$/i.test(b) || b === "系统") return "系统";
      return b;
    }

    function syncWoScroll(pane){
      const scroller = pane.querySelector(".wo-ticket-left, .wo-chat-list");
      const bar = pane.querySelector(".wo-scroll-bar");
      const thumb = pane.querySelector(".wo-scroll-thumb");
      if (!scroller || !bar || !thumb) return;
      const overflow = scroller.scrollHeight - scroller.clientHeight > 2;
      pane.classList.toggle("is-scroll", overflow);
      if (!overflow) return;
      const track = bar.clientHeight;
      const thumbH = Math.max(28, track * (scroller.clientHeight / scroller.scrollHeight));
      const maxTop = Math.max(0, track - thumbH);
      const range = scroller.scrollHeight - scroller.clientHeight;
      thumb.style.height = thumbH + "px";
      thumb.style.top = (range > 0 ? maxTop * (scroller.scrollTop / range) : 0) + "px";
    }

    function bindWoScrolls(root){
      root.querySelectorAll(".wo-scroll").forEach((pane)=>{
        const scroller = pane.querySelector(".wo-ticket-left, .wo-chat-list");
        if (!scroller || scroller.dataset.bound === "1") return;
        scroller.dataset.bound = "1";
        scroller.addEventListener("scroll", () => syncWoScroll(pane), { passive: true });
        if (window.ResizeObserver) {
          const observer = new ResizeObserver(() => syncWoScroll(pane));
          observer.observe(scroller);
        }
      });
    }

    function openDetail(row, opts){
      dismissDetail();
      function extOf(name){
        const s=String(name||"");
        const i=s.lastIndexOf(".");
        return i>=0 ? s.slice(i+1).toLowerCase() : "";
      }
      function fileIcon(name){
        const ext=extOf(name);
        if (["pdf"].includes(ext)) return "PDF";
        if (["jpg","jpeg","png","gif","webp"].includes(ext)) return "IMG";
        if (["xls","xlsx","csv"].includes(ext)) return "XLS";
        if (["doc","docx"].includes(ext)) return "DOC";
        if (["zip","rar","7z"].includes(ext)) return "ZIP";
        if (["txt","log"].includes(ext)) return "TXT";
        return "FILE";
      }
      function downloadByName(name){
        const safe = String(name || "file").replace(/[\\/:*?"<>|]/g, "_");
        const blob = new Blob([""], { type: "application/octet-stream" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = safe;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
      function tsOf(t){
        const n = Date.parse(String(t||""));
        return Number.isFinite(n) ? n : 0;
      }
      function isClientSpeaker(by){
        const b = String(by || "");
        return /client/i.test(b) || b.includes("客户");
      }
      function statusTag(s){
        const cls = s==="已关闭" ? "closed" : s==="处理中" ? "processing" : s==="待处理" ? "pending" : s==="已处理" ? "resolved" : "";
        return el("span",{class:`wo-status-tag ${cls}`}, s);
      }
      function infoItem(k, v){
        return el("div",{},
          el("div",{class:"wo-k"}, k),
          el("div",{class:"wo-v"}, v || "-")
        );
      }

      function asFile(file){
        if (!file) return null;
        if (typeof file === "string") return { name:file, size:"" };
        if (!file.name) return null;
        return { name:file.name, size:file.size || "" };
      }
      function pushUnique(bucket, seen, file){
        const item = asFile(file);
        if (!item || seen.has(item.name)) return;
        seen.add(item.name);
        bucket.push(item);
      }
      function collectFiles(ticket){
        const customer = [];
        const warehouse = [];
        const seenCustomer = new Set();
        const seenWarehouse = new Set();
        (ticket.files || []).forEach((file)=>pushUnique(customer, seenCustomer, file));
        (ticket.msgs || []).forEach((msg)=>{
          const mine = isClientSpeaker(msg.by);
          (msg.files || []).forEach((file)=>{
            pushUnique(mine ? customer : warehouse, mine ? seenCustomer : seenWarehouse, file);
          });
        });
        return { customer, warehouse };
      }
      function fileCards(files){
        if (!files.length) return el("div",{class:"wo-file-empty-line"}, "暂无");
        return el("div",{class:"wo-file-row"},
          ...files.map((f)=>el("button",{
            class:"wo-file-card",
            type:"button",
            title:"点击下载",
            onClick:()=>downloadByName(f.name),
          },
            el("div",{class:"wo-file-ico","aria-hidden":"true"}, fileIcon(f.name)),
            el("div",{style:"min-width:0"},
              el("div",{class:"wo-file-name"}, f.name),
              el("div",{class:"wo-file-sub"}, f.size || "点击下载")
            )
          ))
        );
      }
      function fileGroup(title, files, label){
        return el("div",{class:"wo-file-group"},
          el("div",{class:"wo-file-group-head"},
            el("div",{class:"wo-file-group-title"}, title),
            files.length
              ? el("button",{
                  class:"btn wo-file-dl",
                  type:"button",
                  onClick:()=>{
                    files.forEach((f)=>downloadByName(f.name));
                    toast(`已开始下载 ${files.length} 个${label}`,"success");
                  },
                }, "批量下载")
              : null
          ),
          fileCards(files)
        );
      }
      const grouped = collectFiles(row);
      const fileTotal = grouped.customer.length + grouped.warehouse.length;
      function money(n){
        const num = Number(n);
        return "$" + (Number.isFinite(num) ? (Math.round(num * 100) / 100).toFixed(2) : "0.00");
      }
      function feeBlock(ticket){
        const fees = Array.isArray(ticket.fees) ? ticket.fees : [];
        const total = fees.reduce((sum, fee)=> sum + Number(fee.amount || 0), 0);
        return el("div",{class:"wo-fee-card"},
          el("div",{class:"wo-fee-head"},
            el("div",{class:"wo-fee-title"},"处理费用"),
            el("div",{class:"wo-fee-sum"}, "合计", el("strong",{}, money(total)))
          ),
          el("div",{class:"wo-fee-body"},
            fees.length
              ? el("table",{class:"wo-fee-table"},
                  el("thead",{}, el("tr",{},
                    el("th",{},"费用项"), el("th",{},"单价"), el("th",{},"数量"), el("th",{},"小计")
                  )),
                  el("tbody",{}, ...fees.map((fee)=>el("tr",{},
                    el("td",{}, fee.name || "-"),
                    el("td",{}, money(fee.price)),
                    el("td",{}, fee.qty == null ? "-" : String(fee.qty)),
                    el("td",{}, money(fee.amount))
                  )))
                )
              : el("div",{class:"wo-fee-empty"},"暂无处理费用")
          )
        );
      }
      const fileBlock = el("div",{class:"wo-section"},
        el("div",{class:"wo-section-h"},"附件"),
        el("div",{class:"wo-section-b"},
          fileTotal
            ? el("div",{},
                fileGroup("客户附件", grouped.customer, "客户附件"),
                fileGroup("仓库处理附件", grouped.warehouse, "仓库处理附件")
              )
            : el("div",{class:"wo-empty-slot"},"暂无附件")
        )
      );

      function bubbleFiles(files){
        const items = (files || []).map(asFile).filter(Boolean);
        if (!items.length) return null;
        return el("div",{class:"wo-bubble-files"},
          ...items.map((f)=>el("button",{
            class:"wo-bubble-file",
            type:"button",
            title:f.name,
            onClick:()=>downloadByName(f.name),
          }, fileIcon(f.name), el("span",{}, f.size ? `${f.name} · ${f.size}` : f.name)))
        );
      }
      const messages = [...(row.msgs || [])].sort((a,b)=>tsOf(a?.t)-tsOf(b?.t));
      const chatList = el("div",{class:"wo-chat-list"},
        messages.length
          ? messages.map((m)=>el("div",{class:`wo-msg ${isClientSpeaker(m.by) ? "is-client" : "is-staff"}`},
              el("div",{class:"wo-msg-meta"}, `${formatDT(m.t)} · ${personName(m.by)}`),
              el("div",{class:"wo-bubble"}, m.text || "", bubbleFiles(m.files))
            ))
          : el("div",{class:"wo-empty"},"暂无沟通记录")
      );

      const canReply = row.status === "待处理" || row.status === "处理中" || row.status === "已处理";
      let replyText = null;
      let picked = [];
      let pickedList = null;
      const composer = canReply ? el("div",{class:"wo-composer"},
        replyText = el("textarea",{class:"wo-reply-text", rows:"3", placeholder:"请输入回复内容"}),
        (()=>{
          const input = el("input",{type:"file", accept:".jpg,.jpeg,.png,.pdf", multiple:true});
          const zone = el("div",{class:"file-drop", tabindex:"0", role:"button", "aria-label":"上传附件"},
            input,
            el("div",{class:"file-drop-title"},"点击或拖拽文件到此处上传"),
            el("div",{class:"file-drop-hint"},"支持 JPG / PNG / PDF，可多选")
          );
          pickedList = el("div",{class:"file-drop-list"});
          function renderPicked(){
            pickedList.replaceChildren(...picked.map((f, i)=>el("div",{class:"file-drop-file"},
              el("span",{}, f.name),
              el("button",{class:"wo-file-remove", type:"button", onClick:()=>{ picked.splice(i, 1); renderPicked(); }}, "移除")
            )));
          }
          function takeFiles(list){
            const rejected = [];
            Array.from(list || []).forEach((f)=>{
              if (!/\.(jpg|jpeg|png|pdf)$/i.test(f.name || "")) { rejected.push(f.name); return; }
              if (picked.some((p)=>p.name === f.name && p.size === f.size)) return;
              picked.push(f);
            });
            if (rejected.length) toast("仅支持 JPG / PNG / PDF","warn");
            renderPicked();
          }
          const openPicker = () => input.click();
          zone.addEventListener("click", (e)=>{ if (e.target !== input) openPicker(); });
          zone.addEventListener("keydown", (e)=>{
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPicker(); }
          });
          input.addEventListener("change", ()=>{ takeFiles(input.files); input.value = ""; });
          ["dragenter","dragover"].forEach((type)=>{
            zone.addEventListener(type, (e)=>{ e.preventDefault(); zone.classList.add("is-drag"); });
          });
          zone.addEventListener("dragleave", (e)=>{
            if (!zone.contains(e.relatedTarget)) zone.classList.remove("is-drag");
          });
          zone.addEventListener("drop", (e)=>{
            e.preventDefault();
            zone.classList.remove("is-drag");
            takeFiles(e.dataTransfer && e.dataTransfer.files);
          });
          return el("div",{}, zone, pickedList);
        })(),
        el("div",{class:"wo-composer-bar"},
          el("button",{class:"btn btn-primary", type:"button", onClick:()=>{
            const text = (replyText.value || "").trim();
            if (!text) return toast("请输入回复内容","warn");
            const names = picked.map((f)=>f.name);
            row.msgs = row.msgs || [];
            row.msgs.push({ t:new Date().toISOString(), by:"Client", text, files: names.length ? names : undefined });
            if (row.status === "待处理") row.status = "处理中";
            row.updatedAt = new Date().toISOString();
            row.lastUpdate = text.length > 80 ? text.slice(0, 80) + "…" : text;
            toast("已发送","success");
            runSearch();
            openDetail(row);
          }}, "发送回复")
        )
      ) : null;

      const issue = String(row.issue || "").trim();
      const detail = String(row.detail || "").trim();
      const mRef = modal({
        title: el("span",{class:"wo-head-title"},
          el("span",{class:"wo-head-id"}, row.id),
          el("span",{class:"wo-head-issue"}, row.type || "-"),
          statusTag(row.status)
        ),
        width: 1120,
        content: el("div",{class:"wo-detail-stack"},
          el("div",{class:"wo-ticket-layout"},
          el("div",{class:"wo-scroll wo-left-wrap"},
            el("div",{class:"wo-ticket-left"},
              el("div",{class:"wo-section"},
                el("div",{class:"wo-section-h"},"基本信息"),
                el("div",{class:"wo-section-b"},
                  el("div",{class:"wo-info-grid"},
                    infoItem("工单类型", row.type),
                    infoItem("系统单号", row.orderNo),
                    infoItem("柜号", row.containerNo),
                    infoItem("Customer Ref No", row.customerRefNo),
                    infoItem("货件ID", row.shipNo),
                    infoItem("创建时间", formatDT(row.createdAt)),
                    infoItem("创建人", personName(row.by))
                  )
                )
              ),
              el("div",{class:"wo-section"},
                el("div",{class:"wo-section-h"},"工单标题"),
                el("div",{class:"wo-section-b"},
                  issue
                    ? el("div",{class:"wo-v"}, issue)
                    : el("div",{class:"wo-empty"},"暂无工单标题")
                )
              ),
              el("div",{class:"wo-section"},
                el("div",{class:"wo-section-h"},"问题描述"),
                el("div",{class:"wo-section-b"},
                  detail
                    ? el("div",{class:"wo-v"}, detail)
                    : el("div",{class:"wo-empty"},"暂无问题描述")
                )
              ),
              fileBlock,
              feeBlock(row)
            ),
            el("div",{class:"wo-scroll-bar","aria-hidden":"true"}, el("div",{class:"wo-scroll-thumb"}))
          ),
          el("div",{class:"wo-chat"},
            el("div",{class:"wo-chat-h"},"沟通记录"),
            el("div",{class:"wo-scroll wo-chat-scroll"},
              chatList,
              el("div",{class:"wo-scroll-bar","aria-hidden":"true"}, el("div",{class:"wo-scroll-thumb"}))
            ),
            composer
          )
          )
        ),
        cancelText: null,
        confirmText: null
      });
      detailHandle = mRef;
      if (mRef && mRef.panel) {
        mRef.panel.classList.add("wo-ticket-modal");
        requestAnimationFrame(()=>{
          if (chatList) chatList.scrollTop = chatList.scrollHeight;
          bindWoScrolls(mRef.panel);
          mRef.panel.querySelectorAll(".wo-scroll").forEach(syncWoScroll);
          if (opts && opts.focusReply && replyText) replyText.focus();
        });
      }
    }

    function closeTicket(row, reopen){
      if (row.status === "已处理") return toast("已处理的工单不能关闭","warn");
      if (row.status === "已关闭") return toast("工单已关闭","warn");
      const { root, controls } = formGrid([
        { name:"text", label:"关闭原因/备注", type:"textarea", col:12, rows:3, required:true, placeholder:"请填写关闭工单的原因或备注" }
      ], { text:"" });

      modal({
        title:`关闭工单（${row.id}）`,
        content: el("div",{},
          el("div",{class:"muted",style:"font-size:12px;line-height:1.6;margin-bottom:12px"},"关闭后将进入“已关闭”状态。您填写的关闭原因/备注将作为系统消息自动追加到会话记录中。"),
          root
        ),
        confirmText:"确认关闭",
        cancelText:"取消",
        onConfirm: ({ close }) => {
          const text = (controls.text.value || "").trim();
          if (!text) return toast("请填写关闭原因/备注", "warn");
          
          row.status="已关闭";
          row.updatedAt=new Date().toISOString();
          row.lastUpdate="已由用户关闭";
          
          row.msgs = row.msgs || [];
          row.msgs.push({ t:new Date().toISOString(), by:"System", text: `[工单已关闭] ${text}` });

          close();
          toast("已关闭","success");
          runSearch();
          if (reopen) openDetail(row);
        }
      });
    }

    const TICKET_TYPES = ["换标","出库","转FBA/WM卡派","转私卡派","转快递","转自提","转留仓"];

    function openTicketForm(mode, row){
      const isEdit = mode === "edit";
      if (isEdit && row?.status !== "待处理") return toast("仅待处理工单可编辑","warn");

      const { root, controls } = formGrid([
        { name:"type", label:"工单类型", type:"select", col:6, required:true, options: TICKET_TYPES.map((v)=>({ value:v, label:v })) },
        { name:"subject", label:"问题标题", type:"text", col:6, required:true },
        { name:"text", label:"详细描述", type:"textarea", col:12, rows:4, required:true },
        { name:"orderNo", label:"系统单号", type:"text", col:6, required:true, placeholder:"MKO…" },
        { name:"shipNo", label:"货件ID（可选）", type:"text", col:6, placeholder:"请输入货件ID" },
        { name:"containerNo", label:"柜号", type:"text", col:6, readonly:true, placeholder:"系统自动带出" },
        { name:"customerRefNo", label:"Customer Ref No", type:"text", col:6, readonly:true, placeholder:"系统自动带出" },
        { name:"files", label:"附件上传（可选）", type:"file", col:12 },
      ], isEdit ? {
        type: row.type || TICKET_TYPES[0],
        subject: row.issue || "",
        text: row.detail || "",
        orderNo: row.orderNo || "",
        shipNo: row.shipNo || "",
        containerNo: row.containerNo || "",
        customerRefNo: row.customerRefNo || "",
      } : { type: TICKET_TYPES[0] });
      if (controls.files) controls.files.setAttribute("multiple", "");

      ["containerNo", "customerRefNo"].forEach((k)=>{
        const n = controls[k];
        if (!n) return;
        n.style.background = "#f8fafc";
        n.style.color = "#94a3b8";
        n.style.borderColor = "rgba(15,23,42,.12)";
      });

      function autoFill() {
        const sysNo = (controls.orderNo.value || "").trim();
        const shipNo = (controls.shipNo.value || "").trim();
        if (sysNo || shipNo) {
          const hash = (sysNo || shipNo).replace(/\D/g, '') || '1234567';
          controls.containerNo.value = 'MSCU' + hash.substring(0, 7).padEnd(7, '0');
          controls.customerRefNo.value = 'CRN-' + (sysNo.slice(-4) || shipNo.slice(-4) || '001').toUpperCase();
        } else {
          controls.containerNo.value = '';
          controls.customerRefNo.value = '';
        }
      }
      controls.orderNo.addEventListener('input', autoFill);
      controls.shipNo.addEventListener('input', autoFill);

      modal({
        title: isEdit ? `编辑工单（${row.id}）` : "发起工单",
        content: root,
        confirmText: isEdit ? "保存" : "提交",
        cancelText:"取消",
        onConfirm: ({ close }) => {
          const type=(controls.type.value||"").trim();
          const subject=(controls.subject.value||"").trim();
          const text=(controls.text.value||"").trim();
          const orderNo=(controls.orderNo.value||"").trim();
          const shipNo=(controls.shipNo.value||"").trim();
          const containerNo=(controls.containerNo.value||"").trim();
          const customerRefNo=(controls.customerRefNo.value||"").trim();
          const newFiles = Array.from((controls.files && controls.files.files) ? controls.files.files : []).map((f)=>f.name);
          if (!type || !subject || !text) return toast("请填写工单类型、问题标题与详细描述","warn");
          if (!orderNo) return toast("请填写系统单号", "warn");
          const nowIso=new Date().toISOString();

          if (isEdit) {
            row.type = type;
            row.issue = subject;
            row.detail = text;
            row.orderNo = orderNo;
            row.shipNo = shipNo;
            row.containerNo = containerNo;
            row.customerRefNo = customerRefNo;
            if (newFiles.length) row.files = uniq([...(row.files || []), ...newFiles]);
            row.updatedAt = nowIso;
            row.lastUpdate = "客户修改工单";
            row.msgs = row.msgs || [];
            row.msgs.push({ t:nowIso, by:"Client", text:`[已修改工单] ${subject}`, files: newFiles.length ? newFiles : undefined });
            close();
            toast("已保存","success");
            runSearch();
            return;
          }

          const ymd=`${new Date().getFullYear()}${pad2(new Date().getMonth()+1)}${pad2(new Date().getDate())}`;
          const id=`MKWO${ymd}${String(Math.floor(Math.random()*9000)+1000).padStart(4,"0")}`;
          state.rows=[{
            id, orderNo, shipNo, containerNo, customerRefNo, type, issue:subject, detail:text,
            status:"待处理", lastUpdate:"客户提交工单", createdAt:nowIso, updatedAt:nowIso,
            by:"Client", files:newFiles, msgs:[{t:nowIso, by:"Client", text}],
          }, ...state.rows];
          close();
          toast("已提交","success");
          runSearch();
        }
      });
    }

    function newTicket(){ openTicketForm("new"); }
    function editTicket(row){ openTicketForm("edit", row); }

    document.getElementById("btnSearch").addEventListener("click",runSearch);
    document.getElementById("btnReset").addEventListener("click",()=>{
      document.getElementById("q_tid").value="";
      document.getElementById("q_order").value="";
      document.getElementById("q_container").value="";
      document.getElementById("q_customerRefNo").value="";
      state.status="全部";
      runSearch();
    });
    document.getElementById("btnNew").addEventListener("click",newTicket);

    runSearch();
  </script>
  <script>
    (function(){
      try {
        const nav = document.querySelector('.client-nav');
        if (!nav) return;
        const file = decodeURIComponent((location.pathname || '').split('/').pop() || '');
        nav.querySelectorAll('a.active').forEach((a) => a.classList.remove('active'));
        const match = file ? nav.querySelector(`a[href$="${CSS.escape(file)}"]`) : null;
        if (match) match.classList.add('active');
        const activeSub = nav.querySelector('.client-group .subnav a.active');
        if (activeSub) {
          const d = activeSub.closest('details');
          if (d) d.open = true;
        }
      } catch {}
    })();
  </script>
</body>
