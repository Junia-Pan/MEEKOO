<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户端 - 提拆派计划</title>
  <link rel="stylesheet" href="./_styles.css" />
  <style>
    /* Client shell (menu framework) */
    .client-shell{display:flex;min-height:100vh}
    .client-sidenav{
      width:248px;flex:0 0 248px;
      padding:12px 10px;
      position:sticky;top:0;align-self:flex-start;height:100vh;
      background:#fff;
      border-right:1px solid rgba(15,23,42,.06);
      box-shadow:2px 0 12px rgba(2,6,23,.04);
      display:flex;flex-direction:column;
    }
    .client-s-brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      margin-bottom:6px;
      text-decoration:none;color:inherit;
    }
    .client-s-brand:hover{
      background:rgba(37,99,235,.06);
      border-color:transparent;
      color:var(--primary);
    }
    .client-s-brand:hover .client-s-logo{
      background:rgba(37,99,235,.12);
      color:var(--primary);
    }
    .client-divider{
      height:1px;
      background:rgba(15,23,42,.06);
      margin:6px 8px 8px;
      flex:0 0 auto;
    }
    .client-s-logo{
      width:30px;height:30px;border-radius:9px;
      background:rgba(37,99,235,.10);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .client-s-logo svg{width:18px;height:18px;display:block}
    .client-s-title{font-weight:800;font-size:13px;line-height:1.2}
    .client-s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .client-nav{
      display:flex;flex-direction:column;gap:2px;
      flex:1;min-height:0;
      overflow-y:auto;
      padding:2px 4px 10px 2px;
      scrollbar-gutter: auto;
      scrollbar-width: auto;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .client-nav::-webkit-scrollbar{width:6px}
    .client-nav::-webkit-scrollbar-track{background:#eef2f7}
    .client-nav::-webkit-scrollbar-thumb{
      background:rgba(100,116,139,.55);
      border-radius:6px;
    }
    .client-nav:hover::-webkit-scrollbar-thumb{background:rgba(71,85,105,.75)}
    .client-nav a{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:12px;
      text-decoration:none;
      border:1px solid transparent;
      color:rgba(15,23,42,.84);
      font-size:12.5px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-nav a:active{transform:translateY(1px)}
    .client-nav a:hover{background:rgba(37,99,235,.06);border-color:transparent;color:var(--primary)}
    .client-nav a.active{
      background:rgba(37,99,235,.10);
      border-color:transparent;
      color:var(--primary);
      font-weight:650;
    }
    .client-ico{
      width:28px;height:28px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.035);
      font-size:12px;
      color:rgba(100,116,139,.95);
      flex:0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-ico svg{width:14px;height:14px;display:block}
    .client-ico svg path,
    .client-ico svg rect,
    .client-ico svg circle,
    .client-ico svg ellipse{stroke:currentColor}
    .client-nav a:hover .client-ico{
      background:rgba(37,99,235,.12);
      border-color:rgba(37,99,235,.10);
      color:var(--primary);
    }
    .client-nav a.active .client-ico{
      background:var(--primary);
      border-color:transparent;
      color:#fff;
    }
    .client-group{margin-top:6px}
    .client-group details{border:none;background:transparent;overflow:visible}
    .client-group summary{
      list-style:none;cursor:pointer;
      padding:7px 10px;border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:12.5px;font-weight:650;
      color:rgba(15,23,42,.84);
      transition: background .15s ease, color .15s ease;
      user-select:none;
    }
    .client-group summary:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group details[open] summary{background:rgba(37,99,235,.10);color:var(--primary)}
    .client-group summary::-webkit-details-marker{display:none}
    .client-group summary .client-chev{
      width:18px;height:18px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      opacity:.55;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
      background:rgba(15,23,42,.04);
      color:currentColor;
      user-select:none;
    }
    .client-group details[open] summary .client-chev{transform:rotate(180deg);opacity:.9}
    .client-group .subnav{
      display:flex;flex-direction:column;gap:2px;
      padding:6px 0 8px 32px;
      margin:0;border:none;background:transparent;
      max-height:0;opacity:0;transform:translateY(-2px);
      overflow:hidden;
      transition:max-height .22s ease, opacity .18s ease, transform .18s ease;
    }
    .client-group details[open] .subnav{max-height:420px;opacity:1;transform:translateY(0)}
    .client-group .subnav a{
      padding:7px 10px;border-radius:12px;
      color:rgba(15,23,42,.82);
      background:transparent;
    }
    .client-group .subnav a:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group .subnav .client-ico{width:24px;height:24px;border-radius:9px}
    .client-group .subnav .client-ico svg{width:12px;height:12px}
    .client-main{flex:1;min-width:0;display:flex;flex-direction:column}

    /* Top strip nav */
    .client-topnav{
      position:sticky;top:0;z-index:30;
      height:52px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:0 16px;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .client-crumb{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:12.5px;color:var(--muted);
      user-select:none;
    }
    .client-crumb b{color:var(--text);font-weight:750}
    .client-top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;color:var(--text);
      cursor:pointer;
      box-shadow:0 1px 0 rgba(15,23,42,.02);
    }
    .icon-btn:hover{background:#f8fafc}
    .icon-btn svg{width:18px;height:18px}
    .notif-dot{
      position:absolute;top:-6px;right:-6px;
      min-width:16px;height:16px;padding:0 4px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:#ef4444;color:#fff;
      font-size:10px;line-height:16px;font-weight:800;
      border:2px solid #fff;
    }
    .icon-wrap{position:relative;display:inline-flex}
    .avatar-btn{
      width:32px;height:32px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(34,197,94,.14));
      color:rgba(15,23,42,.78);
      cursor:pointer;
      overflow:hidden;
      text-decoration:none;
    }
    .avatar-btn:hover{filter:saturate(110%)}
    .avatar-btn svg{opacity:.9;width:18px;height:18px}

    /* Make existing page container work in shell */
    .client-main .wrap{max-width:none;margin:16px 18px;padding:0}
    @media (max-width: 980px){
      .client-sidenav{display:none}
      .client-main .wrap{margin:12px 12px}
    }

    /* Appt files (shipment row) UI polish */
    .appt-files-entry{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;
      margin:2px auto;
      background:#fff;border:1px solid rgba(15,23,42,.12);
      box-shadow:0 6px 14px rgba(15,23,42,.06);
      font-weight:650;
      white-space:nowrap;
    }
    .appt-files-entry:hover{border-color:rgba(37,99,235,.28)}
    .appt-files-entry:active{transform:translateY(1px)}
    .appt-files-entry .cnt{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:20px;height:18px;padding:0 6px;border-radius:999px;
      background:var(--primary-weak);
      color:var(--primary);
      font-size:12px;font-weight:800;
    }

    /* Prevent line wrap for list "下载" buttons (DO/BL Copy, etc.) */
    .doc-btn{white-space:nowrap}

    .appt-files-modal .sub{
      margin-top:4px;
      font-size:12px;line-height:1.5;
      color:var(--muted);
    }
    .appt-files-modal .toolbar{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(15,23,42,.08);
      background:linear-gradient(#fff,#fbfbfd);
      border-radius:12px;
    }
    .appt-files-modal .toolbar .meta{
      display:flex;align-items:flex-start;gap:10px;
      min-width:220px;
    }
    .appt-files-modal .ico{
      width:34px;height:34px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(37,99,235,.08);
      border:1px solid rgba(37,99,235,.16);
      color:var(--primary);
      font-weight:900;
      font-size:16px;
      flex:0 0 auto;
    }
    .appt-files-modal .list{
      margin-top:10px;
      border:1px solid rgba(15,23,42,.08);
      border-radius:12px;
      overflow:hidden;
      background:#fff;
    }
    .appt-files-modal .item{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;
      padding:10px 12px;
      border-top:1px solid rgba(15,23,42,.06);
    }
    .appt-files-modal .item:first-child{border-top:none}
    .appt-files-modal .item .name{
      font-weight:700;
      max-width:520px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .appt-files-modal .item .meta2{
      margin-top:3px;
      font-size:12px;color:var(--muted);
      display:flex;gap:10px;flex-wrap:wrap;
    }
    .appt-files-modal .item .actions{
      display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-end;
    }

    /* Table cell alignment (project convention) */
    .table th, .table td,
    .excel-table th, .excel-table td{
      text-align:left;
      vertical-align:middle;
      padding:10px;
    }
    .excel-table th.chk-col,
    .excel-table td.chk-col{
      text-align:center;
      padding:0;
    }

    /* Fix frozen columns overlap in shipment grids */
    /* NOTE: delete column renders as 60px (see `_styles.css .row-num`), so offsets must start at 60px */
    .scroll .excel-table .sticky-col-2,
    .cp-table-scroll .excel-table .sticky-col-2{ left:60px !important; }
    .scroll .excel-table th.sticky-col-2,
    .scroll .excel-table td.sticky-col-2,
    .cp-table-scroll .excel-table th.sticky-col-2,
    .cp-table-scroll .excel-table td.sticky-col-2{ width:120px !important; min-width:120px !important; }
    .scroll .excel-table th.sticky-col-3,
    .scroll .excel-table td.sticky-col-3,
    .cp-table-scroll .excel-table th.sticky-col-3,
    .cp-table-scroll .excel-table td.sticky-col-3{ left:180px !important; }
    /* Keep action buttons away from borders */
    .table td button.btn,
    .excel-table td button.btn,
    .table td .appt-files-entry,
    .excel-table td .appt-files-entry{
      margin:2px 0;
    }
    .table th.op-col,
    .table td.op-col{
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      min-width: 132px;
      width: 132px;
      white-space: nowrap;
    }
    .table th.op-col{ z-index: 3; }
    .op-btns{
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .table td.op-col .btn,
    .table td.op-col .btn-ghost-lite{
      height:32px;
      min-height:32px;
      padding:0 12px;
      font-size:12.5px;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      white-space:nowrap;
    }
    .op-btn-cancel{
      color:#b42318;
      border-color:rgba(180,35,24,.35);
      background:#fff5f5;
    }
    .op-btn-cancel:hover{
      background:#ffecec;
      border-color:rgba(180,35,24,.5);
    }

    /* Detail -> uploaded files hierarchy */
    .file-sections{display:flex;flex-direction:column;gap:10px}
    .file-sec{
      border:1px solid rgba(15,23,42,.08);
      border-radius:12px;
      background:#fff;
      overflow:hidden;
    }
    .file-sec-h{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 12px;
      background:linear-gradient(#fff,#fbfbfd);
      border-bottom:1px solid rgba(15,23,42,.06);
    }
    .file-sec-title{font-weight:800}
    .file-sec-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
    .file-sec-b{
      padding:10px 12px;
      background:#fff;
    }
    .file-items{
      border:1px solid rgba(15,23,42,.06);
      border-radius:12px;
      background:#fbfbfd;
      overflow:hidden;
    }
    .file-item{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 12px;
      border-top:1px solid rgba(15,23,42,.06);
    }
    .file-item:first-child{border-top:none}
    .file-item .name{
      font-weight:700;
      max-width:560px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .file-item .meta{
      margin-top:3px;
      font-size:12px;color:var(--muted);
    }
    .file-item .acts{display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-end}

    /* Date range styles moved to `_styles.css` for reuse across pages. */
    /* 查询区默认每行 4 列 */
    #filterGrid{grid-template-columns:repeat(4,minmax(0,1fr));}
    #filterGrid:not(.filter-expanded) .filter-extra{display:none}
    #filterGrid.filter-expanded .filter-extra { grid-column: span 2; }
    @media (min-width: 1500px) {
      #filterGrid.filter-expanded .filter-extra { grid-column: span 1; }
    }
    @media (max-width: 1120px) {
      #filterGrid{grid-template-columns:repeat(2,minmax(0,1fr));}
      #filterGrid.filter-expanded .filter-extra { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="client-shell">
    <aside class="client-sidenav" aria-label="客户端菜单">
      <a class="client-s-brand" href="./index.html" title="返回首页（模块导航）" style="text-decoration:none;color:inherit">
        <div class="client-s-logo" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="7" height="7" rx="2" fill="currentColor" style="color:var(--primary)"></rect>
            <rect x="11" y="2" width="7" height="7" rx="2" fill="currentColor" style="color:rgba(37,99,235,.35)"></rect>
            <rect x="2" y="11" width="7" height="7" rx="2" fill="currentColor" style="color:rgba(37,99,235,.35)"></rect>
            <rect x="11" y="11" width="7" height="7" rx="2" fill="currentColor" style="color:rgba(37,99,235,.65)"></rect>
          </svg>
        </div>
        <div>
          <div class="client-s-title">客户端</div>
          <div class="client-s-sub">模块导航</div>
        </div>
      </a>
      <div class="client-divider" aria-hidden="true"></div>

      <nav class="client-nav">
        <a href="./pickup-disassembly-schedule.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1" stroke-width="1.3"></rect>
              <rect x="8" y="1.5" width="4.5" height="4.5" rx="1" stroke-width="1.3"></rect>
              <rect x="1.5" y="8" width="4.5" height="4.5" rx="1" stroke-width="1.3"></rect>
              <path d="M9 10.5l1.2 1.2 2.3-2.3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span>提拆派计划</span>
        </a>
        <a href="./overseas-warehouse-receiving-plan.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="1.5" y="2.5" width="11" height="9" rx="1.5" stroke-width="1.3"></rect>
              <path d="M4 6h6M4 8.5h4" stroke-width="1.3" stroke-linecap="round"></path>
            </svg>
          </span>
          <span>外仓收货计划</span>
        </a>

        <div class="client-group">
          <details data-snav="shipments">
            <summary>
              <span style="display:flex;align-items:center;gap:10px">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M2 4.5h10M2 4.5l1.5-2h7L12 4.5v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7z" stroke-width="1.3" stroke-linejoin="round"></path>
                  </svg>
                </span>
                货件管理
              </span>
              <span class="client-chev" aria-hidden="true">▾</span>
            </summary>
            <div class="subnav" role="group" aria-label="货件管理子菜单">
              <a href="./shipment-management-all-shipments.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <rect x="2" y="2" width="8" height="8" rx="2" stroke-width="1.3"></rect>
                    <path d="M4 6h4" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M4 8h3" stroke-width="1.3" stroke-linecap="round"></path>
                  </svg>
                </span>
                <span>全部货件</span>
              </a>
              <a href="./shipment-management-pending-outbound.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M6 2v7" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M3.5 6.5L6 9l2.5-2.5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </span>
                <span>待出库货件</span>
              </a>
              <a href="./shipment-management-held-in-warehouse.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M4.2 2.8v6.4" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M7.8 2.8v6.4" stroke-width="1.3" stroke-linecap="round"></path>
                  </svg>
                </span>
                <span>留仓货件</span>
              </a>
              <a href="./shipment-management-issue-items.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M6 2.2l4 7H2l4-7z" stroke-width="1.3" stroke-linejoin="round"></path>
                    <path d="M6 5v2.2" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M6 8.8h.01" stroke-width="2" stroke-linecap="round"></path>
                  </svg>
                </span>
                <span>问题件</span>
              </a>
            </div>
          </details>
        </div>

        <a href="./one-piece-fulfillment.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1.5L1.5 4.5v3c0 2.8 2.3 5.1 5.5 5.8 3.2-.7 5.5-3 5.5-5.8v-3L7 1.5z" stroke-width="1.3" stroke-linejoin="round"></path>
              <path d="M4.5 7l1.5 1.5 3-3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span>一件代发</span>
        </a>
        <a href="./ticket-management.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="10" height="10" rx="2" stroke-width="1.3"></rect>
              <path d="M4.5 6l1.5 1.5 3-3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span>工单管理</span>
        </a>
        <a href="./account-management.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="7" cy="5" r="2.5" stroke-width="1.3"></circle>
              <path d="M2 12c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5" stroke-width="1.3" stroke-linecap="round"></path>
            </svg>
          </span>
          <span>账号管理</span>
        </a>
        <a href="./profile-center.html">
          <span class="client-ico" aria-hidden="true">

          );
          bar.textContent = msg;
          document.body.insertBefore(bar, document.body.firstChild);
        } catch {}

    function fmtDTS(iso) {
      if (!iso) return "";
      const d = new Date(iso);

      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    function statusDot(s) {
      if (s.includes("驳回") || s.includes("异常")) return "danger";
      if (s.includes("运输中") || s.includes("待") || s.includes("查验")) return "warn";
      if (s.includes("已")) return "success";
      return "";
    }

    function hasAnyFile(files) {
      return files && Object.values(files).some(Boolean);
    }

    function countForStatus(s) {
      if (s === "全部") return state.rows.length;
      return state.rows.filter((r) => r.status === s).length;
    }

    function renderStatusTabs() {
      const host = document.getElementById("statusTabs");
      if (!host) return;
      host.innerHTML = "";
      STATUSES.forEach((s) => {
        const pressed = s === state.status;
        const n = countForStatus(s);
        const btn = el("button", {
          class: "status-tab",
          type: "button",
          "aria-pressed": pressed ? "true" : "false",
          title: `筛选：${s}（${n}）`,
          onClick: () => {
            state.status = s;
            try {
              const sel = document.getElementById("q_status");
              if (sel) sel.value = s;
            } catch {}
            runSearch();
          },
        },
        el("span", {}, s),
        el("span", { class: "cnt" }, `(${n})`));
        host.appendChild(btn);

    function getQuery() {
      const v = (id) => document.getElementById(id).value.trim();
      return {
        systemOrderNo: v("q_systemOrderNo").toUpperCase(),
        containerNo: v("q_containerNo").toUpperCase(),
        containerType: v("q_containerType"),
        transportMode: v("q_transportMode"),
        fbaCode: v("q_fbaCode").toUpperCase(),
        fbaId: v("q_fbaId").toUpperCase(),
        refNo: v("q_refNo").toUpperCase(),
        etaFrom: v("q_etaFrom"),
        etaTo: v("q_etaTo"),
        ataFrom: v("q_ataFrom"),
        ataTo: v("q_ataTo"),
        createdFrom: v("q_createdFrom"),
        createdTo: v("q_createdTo"),
      };
    }

    function inDateRange(iso, from, to) {
      const d = new Date(iso);
      if (!iso || Number.isNaN(d.getTime())) return false;
      const t = d.getTime();
      if (from) {
        const f = new Date(from);
        if (!Number.isNaN(f.getTime()) && t < f.getTime()) return false;
      }
      if (to) {
        const e = new Date(to);
        if (!Number.isNaN(e.getTime())) {
          const end = e.getTime() + 86399999;
          if (t > end) return false;
        }
      }
      return true;
    }

    function runSearch() {
      try {
        const sel = document.getElementById("q_status");
        if (sel && sel.value) state.status = sel.value;
        if (sel && !sel.value) state.status = "全部";
      } catch {}
      const q = getQuery();
      const filtered = state.rows.filter((r) => {
        if (state.status !== "全部" && r.status !== state.status) return false;
        if (q.transportMode && r.transportMode !== q.transportMode) return false;
        if (q.containerType && r.containerType !== q.containerType) return false;
        if (q.systemOrderNo && !String(r.id || "").toUpperCase().includes(q.systemOrderNo)) return false;
        if (q.containerNo && !String(r.containerNo || "").toUpperCase().includes(q.containerNo)) return false;

        const shipments = r.shipments || [];
        if (q.fbaCode && !shipments.some((s) => String(s.fbaCode || "").toUpperCase().includes(q.fbaCode))) return false;
        if (q.fbaId && !shipments.some((s) => String(s.fbaId || "").toUpperCase().includes(q.fbaId))) return false;
        if (q.refNo && !shipments.some((s) => String(s.refNo || "").toUpperCase().includes(q.refNo))) return false;

        if ((q.etaFrom || q.etaTo) && !inDateRange(r.ETA, q.etaFrom, q.etaTo)) return false;
        if ((q.ataFrom || q.ataTo) && !inDateRange(r.ATA, q.ataFrom, q.ataTo)) return false;
        if ((q.createdFrom || q.createdTo) && !inDateRange(r.createdAt, q.createdFrom, q.createdTo)) return false;
        return true;
      });
      state.filtered = filtered;
      // 查询/切换筛选后清空旧选择，避免勾选与“查看详情”残留错位
      state.selected = null;
      try { state.selectedIds && state.selectedIds.clear && state.selectedIds.clear(); } catch {}
      pager.page = 1;
      renderTable();
      renderStatusTabs();
    }

    function renderTable() {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";
      const all = state.filtered;
      document.getElementById("empty").style.display = all.length ? "none" : "block";
      const rows = getSlice(all);
      const chkAll = document.getElementById("chkAll");
      if (chkAll) {
        const ids = rows.map((r) => r.id).filter(Boolean);
        const selectedCount = ids.filter((id) => state.selectedIds.has(id)).length;
        chkAll.checked = ids.length > 0 && selectedCount === ids.length;
        chkAll.indeterminate = selectedCount > 0 && selectedCount < ids.length;
        chkAll.onchange = () => {
          if (chkAll.checked) ids.forEach((id) => state.selectedIds.add(id));
          else ids.forEach((id) => state.selectedIds.delete(id));
          renderTable();
        };
      }
      rows.forEach((r) => {
        const badge = el("span", { class: "badge" }, el("span", { class: `dot ${statusDot(r.status)}` }), r.status);
        const empty = (v) => (v ? v : el("span", { class: "muted" }, "-"));
        const docBtn = (row) =>
          row && row.docsFile
            ? el("button", { class: "btn doc-btn", type: "button", onClick: (e) => { e.stopPropagation(); toast("已下载", "success"); } }, "下载")
            : el("span", { class: "muted" }, "-");

        const tr = el("tr", {},
          el("td", {}, el("input", {
            type: "checkbox",
            checked: state.selectedIds.has(r.id),
            "aria-label": `选择 ${r.id}`,
            onClick: (e) => e.stopPropagation(),
            onChange: (e) => {
              if (e.target.checked) state.selectedIds.add(r.id);
              else state.selectedIds.delete(r.id);
              renderTable();
            }
          })),
          el("td", {}, r.id
            ? el("button",{class:"cp-firstcol-link",type:"button",title:"查看详情",onClick:(e)=>{ e.stopPropagation(); openDetail(r); }}, r.id)
            : el("span", { class: "muted" }, "-")

          el("td", {}, r.containerNo ? String(r.containerNo) : el("span", { class: "muted" }, "-")),

                r.status = "已取消";

    function openDetail(row) {
      state.selected = row;
      const mode = String(row.transportMode || "").trim();
      const fmtDTS = (iso) => {
        if (!iso) return "-";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "-";
        const pad = (t) => String(t).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      const base = mode === "空运"
        ? [
            ["运输方式", mode || "-"],
            ["业务类型", row.businessType],
            ["提单号", row.blNo || "-"],
            ["航司", row.carrier || "-"],
            ["客服", row.cs || "-"],

        : mode === "自送"
        ? [
            ["运输方式", mode || "-"],
            ["业务类型", row.businessType],
            ["柜号", row.containerNo || "-"],
            ["柜型", row.containerType || "-"],
            ["提单号", row.blNo || "-"],
            ["船司", row.carrier || "-"],
            ["客服", row.cs || "-"],
          ]
        : [
            ["运输方式", mode || "海运"],
            ["业务类型", row.businessType],
            ["柜号", row.containerNo || "-"],
            ["柜型", row.containerType || "-"],
            ["提单号", row.blNo || "-"],
            ["ETD", fmtDate(row.ETD) || "-"],
            ["ETA", fmtDate(row.ETA) || "-"],
            ["ATD", fmtDate(row.ATD) || "-"],
            ["ATA", fmtDate(row.ATA) || "-"],
            ["船司", row.carrier || "-"],
            ["起运港", row.originPort || "-"],
            ["目的港", row.destPort || "-"],
            ["客服", row.cs || "-"],
            ["自带车架", row.selfChassis ? "是" : "否"],
            ["预计提柜时间", fmtDTS(row.expectedPickupDate) || "-"],
            ["实际提柜时间", fmtDTS(row.actualPickupDate) || "-"],
            ["到仓时间", fmtDTS(row.warehouseArriveDate) || "-"],
            ["拆柜时间", fmtDTS(row.devanningDate) || "-"],
            ["还柜时间", fmtDTS(row.returnContainerDate) || "-"],
            ["创建时间", fmtDTS(row.createdAt) || "-"],
          ];

      const baseBox = el("div", { class: "panel", style: "box-shadow:none;border-radius:12px" },
        el("div", { class: "panel-h" },
          el("div", {}, el("div", { class: "t" }, "基础信息"), el("div", { class: "d" }, `系统单号：${row.id}`)),
          el("span", { class: "pill" }, row.status)
        ),
        el("div", { class: "panel-b" },
          el("div", { class: "grid2", style:"grid-template-columns:repeat(3,minmax(0,1fr))" },
            base.map(([k, v]) => el("div", {},
              el("div", { class: "k" }, k),
              el("div", { class: "v" }, v || el("span", { class: "muted" }, "-"))

      );

      // Pre-report shipments table: keep consistent with “货件信息(明细)” fields
      const shipTbl = (() => {
        const ships = Array.isArray(row.shipments) ? row.shipments : [];
        const apptCnt = (s) => (Array.isArray(s?.apptFiles) ? s.apptFiles.length : 0);
        const safe = (v) => (String(v ?? "").trim() ? String(v) : "-");

        const head = el("thead", {}, el("tr", {},
          el("th", {}, "Move Type"),
          el("th", {}, "Customer Ref No"),
          el("th", {}, "FBA ID"),
          el("th", {}, "PO"),
          el("th", {}, "FBA Code"),
          el("th", { style:"min-width:220px" }, "Address"),
          el("th", {}, "QTY(CTNS)"),
          el("th", {}, "Vol(CBM)"),
          el("th", {}, "GW(LBS)"),
          el("th", {}, "City/城市"),
          el("th", {}, "State/州"),
          el("th", {}, "ZipCode/邮编"),
          el("th", {}, "Contact/联系人"),

          el("th", { style:"min-width:220px" }, "拆柜要求"),
          el("th", { style:"min-width:220px" }, "预约要求"),
          el("th", { style:"text-align:center;min-width:120px" }, "预约文件"),
          el("th", {}, "私卡成本价"),

        const body = el("tbody", {},
          ships.map((s, idx) => el("tr", {
            "data-ref": String(s.customerRefNo || s.refNo || "").trim().toLowerCase(),

            el("td", {}, safe(s.moveType || "FBA卡派")),
            el("td", {}, safe(s.customerRefNo || s.refNo)),

            el("td", {}, safe(s.qtyCtns ?? s.ctns ?? s.preCtns)),
            el("td", {}, safe(s.volCbm ?? s.cbm)),
            el("td", {}, safe(s.gwKgs ?? s.kgs)),

            el("table", { class:"excel-table" }, head, body)

        try { wrap.__shipTbody = body; } catch {}
        return wrap;

      const trace = el("div", {},

      const dev = row.devanningReport
        ? (() => {
            const rep = row.devanningReport || {};
            const items = Array.isArray(rep.items) ? rep.items : [];
            const safe = (v) => (String(v ?? "").trim() ? String(v) : "-");
            const n = (v) => {
              const x = Number(v);
              return Number.isFinite(x) ? x : 0;
            };
            const fmtDT = (iso) => {
              if (!iso) return "-";
              const d = new Date(iso);
              if (Number.isNaN(d.getTime())) return "-";
              const pad = (t) => String(t).padStart(2, "0");
              return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            };

            // Only merge “实际板数” by FBACode; keep other columns untouched.
            const fbaKey = (it) => String(it?.fbaCode ?? "").trim().toUpperCase() || "-";
            const actPltsSumByCode = items.reduce((acc, it) => {
              const k = fbaKey(it);
              acc[k] = (acc[k] || 0) + n(it?.actPlts);
              return acc;
            }, {});
            const fbaCodeCount = items.reduce((acc, it) => {
              const raw = String(it?.fbaCode ?? "").trim();
              if (!raw) return acc; // do not merge blank FBACode
              const k = fbaKey(it);
              acc[k] = (acc[k] || 0) + 1;
              return acc;
            }, {});
            const actPltsShown = new Set();

            const exportBtn = (text, fn) => el("button", { class:"btn btn-primary", type:"button", onClick: fn }, text);
            const ghostBtn = (text, fn) => el("button", { class:"btn", type:"button", onClick: fn }, text);

            const exportList = () => {
              actPltsShown.clear();
              const rows = items.map((it, idx) => ({
                序号: idx + 1,
                MoveType: it.moveType || "",
                FBACode: it.fbaCode || "",
                方数: it.cbm ?? "",
                LBS: it.lbs ?? "",
                预报箱数: it.preCtns ?? "",
                预报板数: it.prePlts ?? "",
                实际箱数: it.actCtns ?? "",
                实际板数: (() => {
                  const raw = String(it?.fbaCode ?? "").trim();
                  if (!raw) return it.actPlts ?? "";
                  const k = fbaKey(it);
                  if (actPltsShown.has(k)) return "";
                  actPltsShown.add(k);
                  return String(Math.trunc(actPltsSumByCode[k] ?? 0));
                })(),
                卡板数: it.pallets ?? "",
                备注: it.remark ?? "",
              }));
              downloadCSV(`拆柜列表-${row.id}.csv`, rows.length ? rows : [{ 序号:"", MoveType:"", FBACode:"" }]);
              toast("已导出", "success");
            };
            const exportReport = () => {
              const rows = [{
                计划号: row.id,
                柜号: row.containerNo || "",
                拆柜开始时间: fmtDT(rep.start),
                拆柜结束时间: fmtDT(rep.end),
                录入时间: fmtDT(rep.createdAt || row.createdAt),
              }];
              downloadCSV(`拆柜明细-${row.id}.csv`, rows);
              toast("已打印拆柜明细", "success");
            };
            const exportPhotos = () => {
              try {
                const blob = new Blob([""], { type: "application/zip" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `拆柜图片-${row.id}.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1500);
              } catch {}

        const raw = String(text ?? "");

    function openEdit(row) {

      const allLocked = row && (row.status === "直送已到达");

      const isPickupEditable = !planLocked && !allLocked && row && row.status === "待提柜";

      // Plan editor: default (formGrid) OR "待提柜" uses same base fields as 创建计划
      let planRoot = null;
      let planGet = null;
      let planLockVisual = null;
      let planIsFormGrid = false;
      let planControls = null;

      if (isPickupEditable) {
        const containerTypeOpts = ["20GP","40GP","40HQ","40HR","45HC","45HQ","53HQ"];

        const txta = (rows=3) => el("textarea", { class:"input textarea", rows });

        const controls2 = {
          transportMode: sel(["海运","空运","自送"]),
          businessType: el("select", { class:"input" }, el("option", { value:"" }, "请选择"), el("option", { value:"拆柜" }, "拆柜"), el("option", { value:"直送" }, "直送")),
          containerNo: inp("text"),
          containerType: el("select", { class:"input" }, [el("option", { value:"" }, "请选择"), ...containerTypeOpts.map((x)=>el("option",{value:x},x))]),
          blNo: inp("text"),
          ETD: inp("date"),
          ETA: inp("date"),
          originPort: inp("text"),
          destPort: inp("text"),
          airCarrierSel: el("select", { class:"input" },
            el("option", { value:"" }, "请选择"),
            el("option", { value:"CAO(中国国际货运航空)" }, "CAO(中国国际货运航空)" )
          ),
          carrierSel: el("select", { class:"input" }, el("option", { value:"" }, "请选择"), el("option", { value:"ZIM(以星航运)" }, "ZIM(以星航运)" )),
          cs: inp("text"),
          selfChassis: el("select", { class:"input" }, el("option", { value:"否" }, "否"), el("option", { value:"是" }, "是")),
        };

        // Prefill from existing row
        controls2.transportMode.value = (row.transportMode || "海运").trim() || "海运";
        controls2.businessType.value = (row.businessType || "").trim();
        controls2.containerNo.value = (row.containerNo || "").trim();
        controls2.containerType.value = (row.containerType || "").trim();
        controls2.blNo.value = (row.blNo || "").trim();
        controls2.ETD.value = row.ETD ? fmtDate(row.ETD) : "";
        controls2.ETA.value = row.ETA ? fmtDate(row.ETA) : "";
        controls2.originPort.value = (row.originPort || "").trim();
        controls2.destPort.value = (row.destPort || "").trim();
        controls2.airCarrierSel.value = (row.carrier || "").trim();
        controls2.carrierSel.value = (row.carrier || "").trim();
        controls2.cs.value = (row.cs || "").trim();
        controls2.selfChassis.value =
          row.selfChassis === true || row.selfChassis === "是"
            ? "是"
            : row.selfChassis === false || row.selfChassis === "否"
              ? "否"
              : String(row.ownChassis || "").trim() === "是"
                ? "是"
                : "否";

        const mkItem = ({ label, node, required=false, cls="", full=false }) =>
          el("div", { class:`cp-item${full ? " full" : ""}${cls ? " " + cls : ""}` },
            el("label", { class:`cp-label${required ? " required" : ""}` }, label),
            node
          );

        const labelMbl = el("label", { class:"cp-label", id:"label-mbl-edit" }, "提单号");
        const labelCarrier = el("label", { class:"cp-label", id:"label-carrier-edit" }, "船司");

        let carrierNode = controls2.carrierSel;
        const swapCarrierNode = (next) => {
          if (carrierNode === next) return;
          const parent = carrierNode && carrierNode.parentNode ? carrierNode.parentNode : null;
          if (!parent) { carrierNode = next; return; }
          try { parent.replaceChild(next, carrierNode); } catch {}
          carrierNode = next;
        };

        const baseGrid = el("div", { class:"cp-form3", id:"editBaseInfoGrid" },
          mkItem({ label:"运输方式", node: controls2.transportMode, required:true }),
          mkItem({ label:"业务类型", node: controls2.businessType, required:true }),
          mkItem({ label:"柜号", node: controls2.containerNo, required:true, cls:"dynamic-container" }),
          mkItem({ label:"柜型", node: controls2.containerType, required:true, cls:"dynamic-container" }),
          el("div", { class:"cp-item" }, labelMbl, controls2.blNo),
          mkItem({ label:"ETD", node: controls2.ETD, cls:"dynamic-ocean" }),
          mkItem({ label:"ETA", node: controls2.ETA, cls:"dynamic-ocean" }),
          el("div", { class:"cp-item" }, labelCarrier, carrierNode),
          mkItem({ label:"起运港", node: controls2.originPort, cls:"dynamic-ocean" }),
          mkItem({ label:"目的港", node: controls2.destPort, cls:"dynamic-ocean" }),
          mkItem({ label:"客服", node: controls2.cs }),
          mkItem({ label:"是否自带车架", node: controls2.selfChassis, cls:"dynamic-ocean" })
        );

        function syncTransportMode2() {
          const mode = controls2.transportMode.value || "海运";
          const containerFields = baseGrid.querySelectorAll(".dynamic-container");
          const oceanFields = baseGrid.querySelectorAll(".dynamic-ocean");
          if (mode === "海运") {
            containerFields.forEach((x)=>x.classList.remove("hidden"));
            oceanFields.forEach((x)=>x.classList.remove("hidden"));
            labelMbl.textContent = "提单号";
            labelCarrier.textContent = "船司";
            swapCarrierNode(controls2.carrierSel);
          } else if (mode === "空运") {
            containerFields.forEach((x)=>x.classList.add("hidden"));
            oceanFields.forEach((x)=>x.classList.add("hidden"));
            labelMbl.textContent = "提单号";
            labelCarrier.textContent = "航司";
            swapCarrierNode(controls2.airCarrierSel);
          } else {
            containerFields.forEach((x)=>x.classList.remove("hidden"));
            oceanFields.forEach((x)=>x.classList.add("hidden"));
            labelMbl.textContent = "提单号";
            labelCarrier.textContent = "船司";
            swapCarrierNode(controls2.carrierSel);

        controls2.transportMode.addEventListener("change", syncTransportMode2);

        planRoot = el("div", { class:"panel", style:"box-shadow:none;border-radius:12px" },
          el("div", { class:"panel-h" }, el("div", {}, el("div", { class:"t" }, "基础信息"))),
          el("div", { class:"panel-b" }, baseGrid)
        );
        planGet = () => {
          const mode = (controls2.transportMode.value || "海运").trim();
          const businessType = (controls2.businessType.value || "").trim();
          const blNo = (controls2.blNo.value || "").trim();
          const cs = (controls2.cs.value || "").trim();
          const containerNo = (controls2.containerNo.value || "").trim();
          const containerType = (controls2.containerType.value || "").trim();
          const carrier = (carrierNode && carrierNode.value ? String(carrierNode.value) : "").trim();
          const originPort = (controls2.originPort.value || "").trim();
          const destPort = (controls2.destPort.value || "").trim();
          const ETD = (controls2.ETD.value || "").trim();
          const ETA = (controls2.ETA.value || "").trim();
          const selfChassis = (controls2.selfChassis.value || "否") === "是";

          // Validate (same spirit as 创建计划, plus container required when not 空运)
          if (!businessType) return { ok:false, msg:"请选择业务类型" };
          if (!blNo) return { ok:false, msg:"请填写提单号" };
          if (mode !== "空运") {
            if (!containerNo) return { ok:false, msg:"请填写柜号" };
            if (!containerType) return { ok:false, msg:"请选择柜型" };
          }
          if (!carrier) return { ok:false, msg: mode === "空运" ? "请选择航司" : "请选择船司" };
          if (mode !== "空运" && carrier !== "ZIM(以星航运)") return { ok:false, msg:"船司仅支持选择 ZIM(以星航运)" };

          return {
            ok:true,
            value: { mode, businessType, containerNo, containerType, blNo, ETD, ETA, originPort, destPort, carrier, cs, selfChassis }
          };
        };
      } else {
        const containerTypeOpts = ["20GP","40GP","40HQ","40HR","45HC","45HQ","53HQ"];

        // For 已到仓 / 已拆柜 / 直送运输中: show a fixed, read-only snapshot per requirement
        const fields = (planLocked && !allLocked)
          ? [
              { name:"status", label:"状态", type:"select", col:4, options: STATUSES.filter(s => s!=="全部").map(s => ({value:s,label:s})) },
              { name:"businessType", label:"业务类型", type:"select", col:4, options: [{ value:"拆柜", label:"拆柜" }, { value:"直送", label:"直送" }] },
              { name:"containerNo", label:"柜号", type:"text", col:4 },
              { name:"containerType", label:"柜型", type:"select", col:4, options: containerTypeOpts.map((x) => ({ value:x, label:x })) },
              { name:"blNo", label:"提单号", type:"text", col:4 },
              { name:"warehouseArriveDate", label:"到仓日期", type:"date", col:4 },
              { name:"devanningDate", label:"拆柜日期", type:"date", col:4 },
              { name:"returnContainerDate", label:"还柜日期", type:"date", col:4 },
            ]
          : [

        const fmtBytes = (n) => {
          const v = Number(n);
          if (!Number.isFinite(v) || v <= 0) return "";
          const u = ["B","KB","MB","GB"];
          const i = Math.min(u.length - 1, Math.floor(Math.log(v) / Math.log(1024)));
          const x = v / (1024 ** i);
          return `${x >= 10 || i === 0 ? Math.round(x) : x.toFixed(1)} ${u[i]}`;
        };
        const tryDownload = (f, fallbackName) => {
          try {
            if (f instanceof File) {
              const url = URL.createObjectURL(f);
              const a = document.createElement("a");
              a.href = url;
              a.download = f.name || fallbackName || "download";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1500);
              return true;
            }
          } catch {}
          return false;
        };
        const fileLabel = (f) => (f && f.name) ? f.name : String(f || "");
        const fileSize = (f) => (f && typeof f.size === "number") ? fmtBytes(f.size) : "";

        : planLocked
        ? el("div", { class:"muted", style:"font-size:12px;line-height:1.6;margin:0 0 10px" },
            "当前状态为“已到仓/已拆柜/直送运输中/已还空”，计划信息不可修改；仅可维护货件的预约要求、预约文件。")
        : null;

      const m = modal({
        title:`修改计划（${row.id}）`,
        content: el("div", {},
          lockHint || "",
          planRoot,
          el("div", { style:"height:10px" }),
          el("div", { class:"panel", style:"box-shadow:none;border-radius:12px" },
            el("div", { class:"panel-h" }, el("div", {}, el("div", { class:"t" }, shipBoxTitle))),
            el("div", { class:"panel-b" }, shipBoxBody || el("div", { class:"empty" }, "-"))
          )
        ),
        confirmText:"保存",
        cancelText:"取消",
        width: 900,
        onConfirm: ({ close }) => {
          const planRes = planGet ? planGet() : { ok:true };
          if (planRes && planRes.ok === false) return toast(planRes.msg || "请检查必填项", "warn");
          if (allLocked) return toast("当前状态不可修改", "warn");
          if (!planLocked) {
            if (isPickupEditable && planRes && planRes.ok && planRes.value) {
              const v = planRes.value;
              // 待提柜：状态不可修改
              row.transportMode = v.mode;
              row.businessType = v.businessType;
              row.containerNo = v.mode === "空运" ? "" : v.containerNo;
              row.containerType = v.mode === "空运" ? "" : v.containerType;
              row.blNo = v.blNo;
              row.carrier = v.carrier;
              row.cs = v.cs;
              row.selfChassis = v.mode === "海运" ? !!v.selfChassis : false;
              row.ETD = v.mode === "海运" && v.ETD ? new Date(v.ETD).toISOString() : "";
              row.ETA = v.mode === "海运" && v.ETA ? new Date(v.ETA).toISOString() : "";
              row.originPort = v.mode === "海运" ? v.originPort : "";
              row.destPort = v.mode === "海运" ? v.destPort : "";
            } else if (planIsFormGrid) {
              const v = (n) => (planControls[n]?.value ?? "").trim();
              row.status = v("status") || row.status;
              row.expectedPickupDate = v("expectedPickupDate") ? new Date(v("expectedPickupDate")).toISOString() : "";
              row.warehouseArriveDate = v("warehouseArriveDate") ? new Date(v("warehouseArriveDate")).toISOString() : "";
              row.devanningDate = v("devanningDate") ? new Date(v("devanningDate")).toISOString() : "";
              row.returnContainerDate = v("returnContainerDate") ? new Date(v("returnContainerDate")).toISOString() : "";
            }
            if (isPickupEditable && typeof writeBackShipments === "function") {
              const ok = writeBackShipments();
              if (ok === false) return;
            }
          }
          row.logs = [{ t: new Date().toISOString(), a: "修改", by: "Client", note: planLocked ? "更新货件拆柜/预约信息" : (isPickupEditable ? "更新基础信息/货件明细" : "更新状态/日期/货件拆柜预约") }, ...(row.logs || [])];
          row.trace = [{ t: new Date().toISOString(), s: row.status, by: "Client" }, ...(row.trace || [])];
          close();
          toast("已保存", "success");
          runSearch();
        },
      });

      // Fullscreen toggle (for this "修改计划" modal)
      try {
        const head = m && m.panel && m.panel.querySelector ? m.panel.querySelector(".modal-head") : null;
        const closeBtn = head && head.querySelector ? head.querySelector("button.btn") : null;
        if (head && closeBtn) {
          const fsBtn = el("button", { class: "btn btn-ghost", type: "button", "aria-pressed": "false" }, "全屏");
          const sync = () => {
            const on = m.panel.classList.contains("is-fullscreen");
            fsBtn.textContent = on ? "退出全屏" : "全屏";
            fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
          };
          fsBtn.addEventListener("click", () => {
            m.panel.classList.toggle("is-fullscreen");
            sync();
          });

          // group buttons on the right
          try { closeBtn.remove(); } catch {}
          const right = el("div", { class: "krow", style: "justify-content:flex-end;gap:8px;flex-wrap:nowrap" }, fsBtn, closeBtn);
          head.appendChild(right);
          sync();
        }
      } catch {}
    }

    function openImport() {
      const downloadTemplate = () => {
        const rows = [{
          运输方式: "",
          业务类型: "",
          柜号: "",
          柜型: "",
          提单号: "",
          船司航司: "",
          ETD: "",
          ETA: "",
          起运港: "",
          目的港: "",
          客服: "",
          是否ISF: "",
        }];
        downloadCSV("提拆派计划-导入模板.csv", rows);
        toast("模板已下载", "success");
      };

      let pickedFile = null;
      const nameEl = el("span", { class:"imp-file-name" }, "未选择文件");
      const fileInput = el("input", { class:"input", type:"file", accept:".xlsx,.csv", style:"display:none" });

      const setPicked = (f) => {
        pickedFile = f || null;
        const name = (f && f.name) ? f.name : "";
        nameEl.textContent = name || "未选择文件";
      };

      fileInput.addEventListener("change", () => {
        const f = fileInput.files && fileInput.files[0];
        setPicked(f || null);
      });

      const pickBtn = el("button", { class:"btn imp-file-btn", type:"button", onClick: () => fileInput.click() }, "选择文件");

      const drop = el("div", { class:"imp-drop", tabIndex:"0", role:"button", "aria-label":"选择或拖拽文件" },
        el("div", { class:"imp-drop-icon", "aria-hidden":"true" },
          el("span", { class:"imp-ico-xls" }, "X")
        ),
        el("div", { class:"imp-drop-title" }, "点击或拖拽 Excel 文件到此区域"),
        el("div", { class:"imp-filebar" }, pickBtn, nameEl),
        fileInput
      );

      const blockClick = (e) => {
        const t = e.target;
        if (t && (t.closest && t.closest("button"))) return;
        fileInput.click();
      };
      drop.addEventListener("click", blockClick);
      drop.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });
      drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("drag");
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) setPicked(f);
      });

      const content = el("div", { class:"imp-wrap" },
        el("div", { class:"imp-top" },
          el("div", { class:"imp-top-l" }, "导入模板"),
          el("button", { class:"btn btn-primary imp-top-r", type:"button", onClick: downloadTemplate }, "下载模板")
        ),
        el("div", { style:"height:12px" }),
        drop
      );
      modal({
        title:"导入计划",
        content,
        confirmText:"开始导入",
        cancelText:"取消",
        onConfirm: ({ close }) => {
          const f = (fileInput.files && fileInput.files[0]) || pickedFile;
          if (!f) return toast("请选择文件", "warn");
          close();
          toast("已导入", "success");
        },
      });
    }

    function exportPlan() {
      const rows = state.filtered.map((r) => ({
        系统单号: r.id,
        柜号: r.containerNo,
        柜型: r.containerType,
        运输方式: r.transportMode,
        状态: r.status,
        业务类型: r.businessType,
        ETD: fmtDate(r.ETD),
        ETA: fmtDate(r.ETA),
        ATD: fmtDate(r.ATD),
        ATA: fmtDate(r.ATA),
        预计提柜日期: fmtDate(r.expectedPickupDate),
        实际提柜日期: fmtDate(r.actualPickupDate),
        到仓日期: fmtDate(r.warehouseArriveDate),
        拆柜日期: fmtDate(r.devanningDate),
        还柜日期: fmtDate(r.returnContainerDate),
        船司: r.carrier || "",
        起运港: r.originPort || "",
        目的港: r.destPort || "",
        客服: r.cs || "",
        自带车架: r.selfChassis ? "是" : (r.ownChassis || ""),
        DO: r.docsFile ? "有" : "",
        "BL Copy": r.docsFile ? "有" : "",
        创建时间: fmtDTS(r.createdAt),
      }));
      downloadCSV(`头程提拆派计划-计划信息-${new Date().toISOString().slice(0,10)}.csv`, rows);
      toast("已导出计划信息（CSV）", "success");
    }

    function exportShipments() {
      const rows = [];
      state.filtered.forEach((r) => {
        (r.shipments || []).forEach((s, idx) => rows.push({
          计划号: r.id,
          序号: idx + 1,
          柜号: r.containerNo || "",
          MoveType: s.moveType || "",
          CustomerRefNo: s.customerRefNo || s.refNo || "",
          FBA_ID: s.fbaId || s.shipmentId || "",
          PO: s.po || "",
          FBA_Code: s.fbaCode || "",
          Address: s.address || "",
          QTY_CTNS: s.qtyCtns ?? "",
          Vol_CBM: s.volCbm ?? "",
          GW_KGS: s.gwKgs ?? "",
          City: s.city || "",
          State: s.state || "",
          ZipCode: s.zipCode || "",
          Contact: s.contact || "",
          Mobile: s.mobile || "",
          Email: s.email || "",
          最早送仓日期: s.earliest || "",
          最晚送仓日期: s.latest || "",
          拆柜要求: s.devanningReq || "",
          预约要求: s.apptReq || "",
          私卡成本价: s.privateCardCostPrice || "",
          预约文件数: Array.isArray(s.apptFiles) ? s.apptFiles.length : 0,
        }));
      });
      downloadCSV(`头程提拆派计划-货件信息-${new Date().toISOString().slice(0,10)}.csv`, rows);
      toast("已导出货件信息（CSV）", "success");
    }

    function downloadDevanning() {
      const row = state.selected || state.filtered[0];
      if (!row) return toast("请先选择一条计划", "warn");
      const report = row.devanningReport || { remark: "暂无拆柜明细" };
      const rows = [{ 计划号: row.id, 柜号: row.containerNo, 状态: row.status, 拆柜备注: report.remark || "" }];
      downloadCSV(`拆柜明细-${row.id}.csv`, rows);
      toast("已打印拆柜明细", "success");
    }

    function downloadPhotos() {
      const row = state.selected || state.filtered[0];
      if (!row) return toast("请先选择一条计划", "warn");
      toast("已下载拆柜图片", "success");
    }

    function getActiveRow() {
      return state.selected || state.filtered[0] || null;
    }

    function getSelectedRowStrict() {
      const ids = Array.from(state.selectedIds || []);
      // “修改计划”以勾选为准，避免 state.selected（查看详情）残留导致编辑错行
      if (ids.length === 1) {
        const id = ids[0];
        const row = (state.filtered || []).find((r) => r && r.id === id) || (state.rows || []).find((r) => r && r.id === id) || null;
        if (row) state.selected = row;
        return row;
      }
      return null;
    }

    function editActive() {
      const row = getSelectedRowStrict();
      if (!row) return toast("请先勾选一条计划再修改", "warn");
      openEdit(row);
    }

    function cancelPlanActive() {
      const row = getSelectedRowStrict();
      if (!row) return toast("请先勾选一条计划再取消", "warn");
      if (row.status === "已取消") return toast("该计划已取消", "warn");
      row.status = "已取消";
      row.logs = [{ t: new Date().toISOString(), a: "取消计划", by: "Client", note: "" }, ...(row.logs || [])];
      toast("计划已取消", "success");
      runSearch();
    }

    function uploadActive() {
      const row = getActiveRow();
      if (!row) return toast("请先选择一条计划", "warn");
      openUploadModal(row);
    }

    function openUploadModal(row, presetType = "") {
      const TYPES = ["B/L Copy","Commericial Invoice","Packing list","报关资料","AN","DO","其它"];
      const typeSel = el("select", { class:"input" },
        el("option", { value:"" }, "请选择文件类型"),
        TYPES.map((t) => el("option", { value:t }, t))
      );
      if (presetType && TYPES.includes(presetType)) typeSel.value = presetType;

      const fileInput = el("input", { class: "input", type: "file" });

      const wrap = el("div", {},
        el("div", { class: "muted", style: "font-size:12px;line-height:1.6" }, "请选择文件类型并上传。上传成功后，对应类型将显示“下载”按钮。"),
        el("div", { style: "height:10px" }),
        el("div", {},
          el("div", {},
            el("div", { class:"label" }, el("span", { class:"required" }), "文件类型"),
            typeSel
          ),
          el("div", { style:"height:10px" }),
          el("div", {},
            el("div", { class:"label" }, el("span", { class:"required" }), "选择文件"),
            fileInput
          )
        )
      );

      modal({
        title: "上传文件",
        content: wrap,
        confirmText: "上传",
        cancelText: "取消",
        onConfirm: ({ close }) => {
          const t = (typeSel.value || "").trim();
          const picked = fileInput && fileInput.files && fileInput.files[0];
          if (!t) return toast("请选择文件类型", "warn");
          if (!picked) return toast("请选择文件", "warn");
          if (!row.files) row.files = {};
          if (!row.uploadedFiles) row.uploadedFiles = {};
          if (!Array.isArray(row.uploadedFiles[t])) row.uploadedFiles[t] = [];
          row.uploadedFiles[t].push({ file: picked, uploadedAt: new Date().toISOString() });
          row.files[t] = true;
          row.docsFile = true;
          row.logs = [{ t: new Date().toISOString(), a: "上传文件", by: "Client", note: t }, ...(row.logs || [])];
          close();
          toast("已上传", "success");
          try { renderTable(); } catch {}
        }
      });
    }

    document.getElementById("btnSearch").addEventListener("click", runSearch);
    document.getElementById("btnReset").addEventListener("click", () => {
      ["q_systemOrderNo","q_containerNo","q_refNo","q_containerType","q_transportMode","q_fbaCode","q_fbaId","q_status","q_etaFrom","q_etaTo","q_ataFrom","q_ataTo","q_createdFrom","q_createdTo"].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.value = "";
      });
      state.status = "全部";
      try {
        const sel = document.getElementById("q_status");
        if (sel) sel.value = "全部";
      } catch {}
      document.getElementById("filterGrid").classList.remove("filter-expanded");
      runSearch();
      try { renderExpandBtn && renderExpandBtn(); } catch {}
    });
    document.getElementById("btnCreate").addEventListener("click", openCreate);
    document.getElementById("btnImport").addEventListener("click", openImport);
    document.getElementById("btnExportPlan").addEventListener("click", exportPlan);
    document.getElementById("btnExportShip").addEventListener("click", exportShipments);
    document.getElementById("btnUpload").addEventListener("click", uploadActive);

    // init
    try {
      const sel = document.getElementById("q_status");
      if (sel) {
        sel.innerHTML = "";
        (STATUSES || ["全部"]).forEach((s) => sel.appendChild(el("option", { value: s }, s)));
        sel.value = state.status || "全部";
        sel.addEventListener("change", () => {
          state.status = sel.value || "全部";
          runSearch();
        });
      }
    } catch {}

    function countExtraFilled(){
      const grid = document.getElementById("filterGrid");
      if (!grid) return 0;
      const extras = Array.from(grid.querySelectorAll(".filter-extra"));
      let n = 0;
      extras.forEach((box)=>{
        const controls = Array.from(box.querySelectorAll("input,select,textarea"));
        const has = controls.some((c)=>{
          if (!c) return false;
          const tag = String(c.tagName || "").toLowerCase();
          const type = String(c.type || "").toLowerCase();
          if (tag === "input" && (type === "checkbox" || type === "radio")) return !!c.checked;
          return String(c.value || "").trim() !== "";
        });
        if (has) n += 1;
      });
      return n;
    }
    function renderExpandBtn(){
      const btn = document.getElementById("btnExpand");
      const grid = document.getElementById("filterGrid");
      if (!btn || !grid) return;
      const expanded = grid.classList.contains("filter-expanded");
      const n = countExtraFilled();
      if (expanded) {
        btn.textContent = "收起 ▲";
      } else {
        btn.innerHTML = `展开更多${n ? ` <span class="ex-count">${n}</span>` : ""} ▼`;
      }
    }
    document.getElementById("btnExpand").addEventListener("click", function(){
      document.getElementById("filterGrid").classList.toggle("filter-expanded");
      renderExpandBtn();
    });
    (function(){
      const grid = document.getElementById("filterGrid");
      if (!grid) return;
      const onChange = (e) => {
        const t = e && e.target;
        if (t && t.closest && t.closest(".filter-extra")) renderExpandBtn();
      };
      grid.addEventListener("input", onChange);
      grid.addEventListener("change", onChange);
      renderExpandBtn();
    })();

    try { wireDateRanges && wireDateRanges(document); } catch {}
    runSearch();
  </script>
  <script>
    (function(){
      try {
        const nav = document.querySelector('.client-nav');
        if (!nav) return;
        const file = decodeURIComponent((location.pathname || '').split('/').pop() || '');
        nav.querySelectorAll('a.active').forEach((a) => a.classList.remove('active'));
        const match = file ? nav.querySelector(`a[href$="${CSS.escape(file)}"]`) : null;
        if (match) match.classList.add('active');
        const activeSub = nav.querySelector('.client-group .subnav a.active');
        if (activeSub) {
          const d = activeSub.closest('details');
          if (d) d.open = true;
        }
      } catch {}
    })();
  </script>
</body>
</html>
