<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户端 - 外仓收货计划</title>
  <link rel="stylesheet" href="./_styles.css" />
  <style>
    /* Client shell (menu framework) */
    .client-shell{display:flex;min-height:100vh}
    .client-sidenav{
      width:248px;flex:0 0 248px;
      padding:12px 10px;
      position:sticky;top:0;align-self:flex-start;height:100vh;
      background:#fff;
      border-right:1px solid rgba(15,23,42,.06);
      box-shadow:2px 0 12px rgba(2,6,23,.04);
      display:flex;flex-direction:column;
    }
    .client-s-brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      margin-bottom:6px;
      text-decoration:none;color:inherit;
    }
    .client-s-brand:hover{
      background:rgba(37,99,235,.06);
      border-color:transparent;
      color:var(--primary);
    }
    .client-s-brand:hover .client-s-logo{
      background:rgba(37,99,235,.12);
      color:var(--primary);
    }
    .client-divider{
      height:1px;
      background:rgba(15,23,42,.06);
      margin:6px 8px 8px;
      flex:0 0 auto;
    }
    .client-s-logo{
      width:30px;height:30px;border-radius:9px;
      background:rgba(37,99,235,.10);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .client-s-logo svg{width:18px;height:18px;display:block}
    .client-s-title{font-weight:800;font-size:13px;line-height:1.2}
    .client-s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .client-nav{
      display:flex;flex-direction:column;gap:2px;
      flex:1;min-height:0;
      overflow-y:auto;
      padding:2px 4px 10px 2px;
      scrollbar-gutter: auto;
      scrollbar-width: auto;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .client-nav::-webkit-scrollbar{width:6px}
    .client-nav::-webkit-scrollbar-track{background:#eef2f7}
    .client-nav::-webkit-scrollbar-thumb{
      background:rgba(100,116,139,.55);
      border-radius:6px;
    }
    .client-nav:hover::-webkit-scrollbar-thumb{background:rgba(71,85,105,.75)}
    .client-nav a{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:12px;
      text-decoration:none;
      border:1px solid transparent;
      color:rgba(15,23,42,.84);
      font-size:12.5px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-nav a:active{transform:translateY(1px)}
    .client-nav a:hover{background:rgba(37,99,235,.06);border-color:transparent;color:var(--primary)}
    .client-nav a.active{
      background:rgba(37,99,235,.10);
      border-color:transparent;
      color:var(--primary);
      font-weight:650;
    }
    .client-ico{
      width:28px;height:28px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.035);
      font-size:12px;
      color:rgba(100,116,139,.95);
      flex:0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-ico svg{width:14px;height:14px;display:block}
    .client-ico svg path,
    .client-ico svg rect,
    .client-ico svg circle,
    .client-ico svg ellipse{stroke:currentColor}
    .client-nav a:hover .client-ico{
      background:rgba(37,99,235,.12);
      border-color:rgba(37,99,235,.10);
      color:var(--primary);
    }
    .client-nav a.active .client-ico{
      background:var(--primary);
      border-color:transparent;
      color:#fff;
    }
    .client-group{margin-top:6px}
    .client-group details{border:none;background:transparent;overflow:visible}
    .client-group summary{
      list-style:none;cursor:pointer;
      padding:7px 10px;border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:12.5px;font-weight:650;
      color:rgba(15,23,42,.84);
      transition: background .15s ease, color .15s ease;
      user-select:none;
    }
    .client-group summary:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group details[open] summary{background:rgba(37,99,235,.10);color:var(--primary)}
    .client-group summary::-webkit-details-marker{display:none}
    .client-group summary .client-chev{
      width:18px;height:18px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      opacity:.55;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
      background:rgba(15,23,42,.04);
      color:currentColor;
      user-select:none;
    }
    .client-group details[open] summary .client-chev{transform:rotate(180deg);opacity:.9}
    .client-group .subnav{
      display:flex;flex-direction:column;gap:2px;
      padding:6px 0 8px 32px;
      margin:0;border:none;background:transparent;
      max-height:0;opacity:0;transform:translateY(-2px);
      overflow:hidden;
      transition:max-height .22s ease, opacity .18s ease, transform .18s ease;
    }
    .client-group details[open] .subnav{max-height:420px;opacity:1;transform:translateY(0)}
    .client-group .subnav a{
      padding:7px 10px;border-radius:12px;
      color:rgba(15,23,42,.82);
      background:transparent;
    }
    .client-group .subnav a:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group .subnav .client-ico{width:24px;height:24px;border-radius:9px}
    .client-group .subnav .client-ico svg{width:12px;height:12px}
    .client-main{flex:1;min-width:0;display:flex;flex-direction:column}

    /* Top strip nav */
    .client-topnav{
      position:sticky;top:0;z-index:30;
      height:52px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:0 16px;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .client-crumb{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:12.5px;color:var(--muted);
      user-select:none;
    }
    .client-crumb b{color:var(--text);font-weight:750}
    .client-top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;color:var(--text);
      cursor:pointer;
      box-shadow:0 1px 0 rgba(15,23,42,.02);
    }
    .icon-btn:hover{background:#f8fafc}
    .icon-btn svg{width:18px;height:18px}
    .notif-dot{
      position:absolute;top:-6px;right:-6px;
      min-width:16px;height:16px;padding:0 4px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:#ef4444;color:#fff;
      font-size:10px;line-height:16px;font-weight:800;
      border:2px solid #fff;
    }
    .icon-wrap{position:relative;display:inline-flex}
    .avatar-btn{
      width:32px;height:32px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(34,197,94,.14));
      color:rgba(15,23,42,.78);
      cursor:pointer;
      overflow:hidden;
      text-decoration:none;
    }
    .avatar-btn:hover{filter:saturate(110%)}
    .avatar-btn svg{opacity:.9;width:18px;height:18px}

    /* Make existing page container work in shell */
    .client-main .wrap{max-width:none;margin:16px 18px;padding:0}
    @media (max-width: 980px){
      .client-sidenav{display:none}
      .client-main .wrap{margin:12px 12px}
    }

    /* Fix frozen columns overlap in shipment grid */
    .scroll .excel-table .sticky-col-2,
    .cp-table-scroll .excel-table .sticky-col-2{ left:60px !important; }
    .scroll .excel-table th.sticky-col-2,
    .scroll .excel-table td.sticky-col-2,
    .cp-table-scroll .excel-table th.sticky-col-2,
    .cp-table-scroll .excel-table td.sticky-col-2{ min-width:120px !important; width:120px !important; }
    .scroll .excel-table th.sticky-col-3,
    .scroll .excel-table td.sticky-col-3,
    .cp-table-scroll .excel-table th.sticky-col-3,
    .cp-table-scroll .excel-table td.sticky-col-3{ left:180px !important; }

    /* Detail modal shipment table: left aligned with whitespace */
    .ship-left .excel-table th{ text-align:left; padding-left:12px; }
    .ship-left .excel-table td{ padding:0 12px; vertical-align:middle; }
    .excel-table th.chk-col,
    .excel-table td.chk-col{ text-align:center; padding:0; }
    .table th.op-col,
    .table td.op-col{
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      min-width: 132px;
      width: 132px;
      white-space: nowrap;
    }
    .table th.op-col{ z-index: 3; }
    .op-btns{
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .table td.op-col .btn,
    .table td.op-col .btn-ghost-lite{
      height:32px;
      min-height:32px;
      padding:0 12px;
      font-size:12.5px;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      white-space:nowrap;
    }
    .op-btn-cancel{
      color:#b42318;
      border-color:rgba(180,35,24,.35);
      background:#fff5f5;
    }
    .op-btn-cancel:hover{
      background:#ffecec;
      border-color:rgba(180,35,24,.5);
    }
  </style>
</head>

    <main class="client-main">
      <header class="client-topnav" aria-label="顶部导航">
        <div class="client-crumb" aria-label="当前位置">
          <span>首页</span>
          <span aria-hidden="true">·</span>
          <b>外仓收货计划</b>
        </div>
        <div class="client-top-actions" aria-label="快捷操作">
          <span class="icon-wrap">
            <button class="icon-btn" type="button" aria-label="搜索" title="搜索">

      <div class="wrap">
    <div class="main">
      <div class="panel">
        <div class="panel-b">
          <div class="grid4" id="filterGrid">
            <div>
              <label class="label">系统单号</label>
              <input class="input" id="q_customerOrderNo" />
            </div>
            <div>
              <label class="label">Customer Ref No</label>
              <input class="input" id="q_refNo" />
            </div>
            <div>
              <label class="label">提货方式</label>
              <select class="input" id="q_pickupMode">
                <option value="">全部</option>
                <option>自送</option>
                <option>提货回仓</option>
                <option>提货直送</option>
              </select>
            </div>
            <div>
              <label class="label">状态</label>
              <select class="input" id="q_status">
                <option value="全部">全部</option>
                <option value="待提货">待提货</option>
                <option value="提货中">提货中</option>
                <option value="已到仓">已到仓</option>
                <option value="直送运输中">直送运输中</option>
                <option value="直送已到达">直送已到达</option>
                <option value="已取消">已取消</option>
              </select>
            </div>
            <div>
              <label class="label">FBA ID</label>
              <input class="input" id="q_fbaId" />
            </div>
            <div>
              <label class="label">PO</label>
              <input class="input" id="q_po" />
            </div>
            <div>
              <label class="label">FBA Code</label>
              <input class="input" id="q_fbaCode" />
            </div>
            <div>
              <label class="label">期望提货日期</label>
              <div class="date-range">
                <div class="dr-field">
                  <span class="dr-ph">开始日期</span>
                  <input class="input" id="q_pickupFrom" type="date" aria-label="期望提货日期开始" />
                </div>
                <span class="dr-arrow">→</span>
                <div class="dr-field">
                  <span class="dr-ph">结束日期</span>
                  <input class="input" id="q_pickupTo" type="date" aria-label="期望提货日期结束" />
                </div>
                <button class="dr-ico" type="button" aria-label="选择期望提货日期范围" title="选择期望提货日期范围">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>

  <script src="./_ui-kit.js"></script>
  <script>
    const { el, fmtDate, fmtDTS, downloadCSV, toast, modal, formGrid, wireTablePager, wireDateRanges } = window.MEEKOO_UI;

    const STATUSES = ["全部","待提货","提货中","已到仓","直送运输中","直送已到达","已取消"];

    const mock = (() => {
      const now = new Date();
      const d = (days) => new Date(now.getTime() + days * 86400000).toISOString();
      const dt = (days, hh = 0, mm = 0) => {
        const x = new Date(now.getTime() + days * 86400000);
        x.setHours(hh, mm, 0, 0);
        return x.toISOString();
      };
      return [
        {
          id:"OP-2026-0001",
          createdAt:d(-2),
          status:"待提货",
          pickupMode:"提货回仓",
          fc:"LAX9",
          pro:"PRO-889900",
          customerOrderNo:"SO-2026-10001",
          pickupCode:"PU-001",
          eta:d(1),
          preShipDate:d(0),
          isaTime:"14:30",
          podUploaded:false,
          customerBOLUploaded:true,
          reservedPallets:12,
          receivedPallets:0,
          pickupStart: dt(0, 16, 0),
          pickupEnd: dt(0, 17, 0),
          pickupDate: dt(0, 16, 0),
          actualPickupDate:"",
          warehouseArriveDate:"",
          trace:[
            { t:d(-2), s:"新订单创建", by:"Client" },
            { t:d(-1), s:"确认到仓（待）", by:"Client" },
          ],
          logs:[{ t:d(-2), a:"创建", by:"Client", note:"提货直送" }],
          shipments:[
            { customerOrderNo:"SO-2026-10001", moveType:"LTL", fc:"LAX9", address:"1234 E St", qtyCtns:90, volCbm:16.2, gwKgs:5200, pallets:12, flatPrice:"", privateCardCostPrice:"920", bolFileName:"BOL_SO-2026-10001.pdf", podFileName:"POD_SO-2026-10001.pdf" },
          ],
        },
        {
          id:"OP-2026-0002",
          createdAt:d(-6),
          status:"已到仓",
          pickupMode:"提货回仓",
          fc:"ONT8",
          pro:"PRO-778811",
          customerOrderNo:"SO-2026-10002",
          pickupCode:"PU-002",
          eta:d(-3),
          preShipDate:d(-4),
          isaTime:"09:00",
          podUploaded:true,
          customerBOLUploaded:true,
          reservedPallets:8,
          receivedPallets:8,
          pickupStart: dt(-4, 10, 30),
          pickupEnd: dt(-4, 12, 0),
          pickupDate: dt(-4, 10, 30),
          actualPickupStart: dt(-4, 11, 0),
          actualPickupEnd: dt(-4, 11, 45),
          actualPickupDate: dt(-4, 11, 0),
          warehouseArriveDate:d(-3),
          trace:[
            { t:d(-6), s:"新订单创建", by:"Client" },
            { t:d(-4), s:"确认到仓", by:"Client" },
            { t:d(-3), s:"已到仓/已送达", by:"System" },
          ],
          logs:[{ t:d(-3), a:"到仓确认", by:"Warehouse", note:"POD已上传" }],
          shipments:[
            { customerOrderNo:"SO-2026-10002", moveType:"FTL", fc:"ONT8", address:"Amazon FC", qtyCtns:60, volCbm:10.6, gwKgs:3900, pallets:8, flatPrice:"1200", privateCardCostPrice:"850", bolFileName:"BOL_SO-2026-10002.pdf", podFileName:"POD_SO-2026-10002.pdf" },
          ],
        },
      ];
    })();

    const state = { status:"全部", rows:mock, filtered:mock, selected:null };
    const pager = { page: 1, pageSize: 10 };
    const { getSlice } = wireTablePager(
      pager,
      { count: "countPill", pageSize: "pgPageSize", page: "pgPage", totalPages: "pgTotalPages", prev: "pgPrev", next: "pgNext" },
      () => state.filtered.length,
      () => renderTable()
    );

    function statusDot(s){
      if (s.includes("待")) return "warn";
      if (s.includes("中")) return "info";
      if (s.includes("已到仓") || s.includes("已到达") || s.includes("已")) return "success";
      return "";
    }

    function fmtExpectedPickupCell(r){
      const s = r.pickupStart || r.pickupDate;
      const e = r.pickupEnd;
      const ds = s ? (fmtDate(s) || "") : "";
      const de = e ? (fmtDate(e) || "") : "";
      if (ds && de && ds !== de) return `${ds} ~ ${de}`;
      if (ds) return ds;
      return "-";
    }

    function countForStatus(s){
      if (s==="全部") return state.rows.length;
      return state.rows.filter((r)=>r.status===s).length;
    }

    function renderStatusTabs(){
      const host=document.getElementById("statusTabs");
      if (!host) return;
      host.innerHTML="";
      STATUSES.forEach((s)=>{
        const pressed=s===state.status;
        const n=countForStatus(s);
        host.appendChild(el("button",{
          class:"status-tab",
          type:"button",
          "aria-pressed":pressed?"true":"false",
          title:`筛选：${s}（${n}）`,
          onClick:()=>{ 
            state.status=s; 
            const sel=document.getElementById("q_status");
            if (sel) sel.value=s;
            runSearch(); 
          },
        },
        el("span",{},s),
        el("span",{class:"cnt"},`(${n})`)));
      });
    }

    function getQuery(){
      const v=(id)=>document.getElementById(id).value.trim();
      return {
        customerOrderNo:v("q_customerOrderNo").toUpperCase(),
        refNo:v("q_refNo").toUpperCase(),
        pickupMode:v("q_pickupMode"),
        status:(document.getElementById("q_status")?.value ?? "全部").trim(),
        pickupFrom:v("q_pickupFrom"),
        pickupTo:v("q_pickupTo"),
        arriveFrom:v("q_arriveFrom"),
        arriveTo:v("q_arriveTo"),
        createdFrom:v("q_createdFrom"),
        createdTo:v("q_createdTo"),
      };
    }

    function runSearch(){
      const q=getQuery();
      if (q.status && q.status !== state.status) state.status = q.status;
      const filtered=state.rows.filter((r)=>{
        if (state.status!=="全部" && r.status!==state.status) return false;
        if (q.customerOrderNo && !String(r.customerOrderNo||"").toUpperCase().includes(q.customerOrderNo)) return false;
        if (q.pickupMode && String(r.pickupMode||"").trim() !== String(q.pickupMode).trim()) return false;
        if (q.refNo) {
          const ref = String(q.refNo).toUpperCase();
          const ships = Array.isArray(r.shipments) ? r.shipments : [];
          const hit = ships.some((s) => String(s?.customerRefNo || "").toUpperCase().includes(ref));
          if (!hit) return false;
        }
        const inDateRange = (iso, from, to) => {
          const t = String(iso || "").trim();
          if (!from && !to) return true;
          if (!t) return false;
          const d = new Date(t);
          if (Number.isNaN(d.getTime())) return false;
          const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
          const f = from ? new Date(from + "T00:00:00").getTime() : null;
          const e = to ? new Date(to + "T00:00:00").getTime() : null;
          if (f != null && day < f) return false;
          if (e != null && day > e) return false;
          return true;
        };
        if (!inDateRange(r.pickupDate, q.pickupFrom, q.pickupTo)) return false;
        if (!inDateRange(r.warehouseArriveDate, q.arriveFrom, q.arriveTo)) return false;
        if (!inDateRange(r.createdAt, q.createdFrom, q.createdTo)) return false;
        return true;
      });
      state.filtered=filtered;
      pager.page = 1;
      renderTable();
      renderStatusTabs();
    }

    function renderTable(){
      const tbody=document.getElementById("tbody");
      tbody.innerHTML="";
      const all=state.filtered;
      document.getElementById("empty").style.display=all.length?"none":"block";
      const rows=getSlice(all);
      const rowStart=(pager.page-1)*pager.pageSize;
      rows.forEach((r, idx)=>{
        const badge=el("span",{class:"badge"},el("span",{class:`dot ${statusDot(r.status)}`}),r.status);
        const bolCell=r.customerBOLUploaded
          ? el("button",{class:"btn",type:"button",onClick:(e)=>{e.stopPropagation();toast("已下载","success");}}, "下载")
          : el("span",{class:"muted"},"未上传");
        const recBolCell=r.bolUploaded
          ? el("button",{class:"btn",type:"button",onClick:(e)=>{e.stopPropagation();toast("已下载","success");}}, "下载")
          : el("span",{class:"muted"},"未上传");

        const tr=el("tr",{},
          el("td",{}, el("input",{type:"checkbox","aria-label":`选择 ${r.id}`})),
          el("td",{},
            r.customerOrderNo
              ? el("button",{class:"cp-firstcol-link",type:"button",onClick:(e)=>{ e.stopPropagation(); openDetail(r); }}, r.customerOrderNo)
              : el("span",{class:"muted"},"-")
          ),
          el("td",{},r.pickupMode||"-"),
          el("td",{},badge),
          el("td",{},String(r.reservedPallets ?? "-")),
          el("td",{},String(r.receivedPallets ?? "-")),
          el("td",{},fmtExpectedPickupCell(r)),
          el("td",{},fmtDate(r.actualPickupDate)||el("span",{class:"muted"},"-")),
          el("td",{},fmtDate(r.warehouseArriveDate)||el("span",{class:"muted"},"-")),
          el("td",{},r.pickupAddress||el("span",{class:"muted"},"-")),
          el("td",{},bolCell),
          el("td",{},recBolCell),
          el("td",{},r.createdAt ? (fmtDTS(r.createdAt) || el("span",{class:"muted"},"-")) : el("span",{class:"muted"},"-")),
          el("td",{class:"op-col"},
            el("div",{class:"op-btns"},
              el("button",{class:"btn",type:"button",onClick:(e)=>{ e.stopPropagation(); openEdit(r); }},"修改"),
              el("button",{class:"btn op-btn-cancel",type:"button",onClick:(e)=>{
                e.stopPropagation();
                if (r.status === "已取消") return toast("该计划已取消","warn");
                r.status = "已取消";
                r.trace = [{ t:new Date().toISOString(), s:"取消计划", by:"Client" }, ...(r.trace||[])];
                toast("计划已取消","success");
                runSearch();
              }},"取消")
            )
          ),
        );
        tbody.appendChild(tr);
      });
    }

    function openDetail(row){
      state.selected=row;
      const mode = String(row.pickupMode || "").trim();
      const dlName = (name) => {
        const safe = String(name || "file").replace(/[\\/:*?"<>|]/g, "_");
        try {
          const blob = new Blob([""], { type: "application/octet-stream" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = safe;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1500);
          return true;
        } catch {}
        return false;
      };
      const getDocName = (s, kind) => {
        const k = String(kind || "").toLowerCase();
        const direct = s && (s[k] || s[`${k}Name`] || s[`${k}FileName`]);
        if (direct) return String(direct);
        const fileLike = s && (s[`${k}File`] || s[`${k}FileObj`] || s[`${k}Obj`]);
        const n = fileLike && (fileLike.name || (fileLike.file && fileLike.file.name));
        return n ? String(n) : "";
      };
      const bulkDownloadDoc = (kind) => {
        const ships = Array.isArray(row.shipments) ? row.shipments : [];
        const names = ships.map((s) => getDocName(s, kind)).filter((x) => String(x || "").trim());
        if (!names.length) return toast(`暂无可下载${kind}文件`, "warn");
        names.forEach((n) => dlName(n));
        toast(`已下载 ${names.length} 个${kind}`, "success");
      };
      const fmtPickupRange = (startIso, endIso, fallbackIso) => {
        const pad2 = (n) => String(n).padStart(2, "0");
        const toDatePart = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const toTimePart = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
        const parse = (iso) => {
          const t = String(iso || "").trim();
          if (!t) return null;
          const d = new Date(t);
          return Number.isNaN(d.getTime()) ? null : d;
        };
        const s = parse(startIso || "");
        const e = parse(endIso || "");
        const p = parse(fallbackIso || "");

        if (s && e) {
          const sameDay = toDatePart(s) === toDatePart(e);
          return sameDay
            ? `${toDatePart(s)} ${toTimePart(s)}~${toTimePart(e)}`
            : `${toDatePart(s)} ${toTimePart(s)}~${toDatePart(e)} ${toTimePart(e)}`;
        }
        if (s) return `${toDatePart(s)} ${toTimePart(s)}`;
        if (p) return `${toDatePart(p)} ${toTimePart(p)}`;
        return "-";
      };
      const fmtPickupTime = () => fmtPickupRange(row.pickupStart, row.pickupEnd, row.pickupDate);
      const fmtActualPickupTime = () =>
        fmtPickupRange(row.actualPickupStart, row.actualPickupEnd, row.actualPickupDate);
      const basePairs = [
        ["系统单号", row.customerOrderNo],
        ["提货方式", mode || "-"],
        ["预估板数", String(row.reservedPallets ?? "")],
        ["实收板数", String(row.receivedPallets ?? "")],
        ["期望提货时间", fmtPickupTime()],
        ["实际提货时间", fmtActualPickupTime()],
        ...(mode && mode !== "自送" ? [["提货地址", row.pickupAddress]] : []),
        ["到仓时间", fmtDate(row.warehouseArriveDate) || "-"],
      ];

      const baseBox = el("div", { class:"panel", style:"box-shadow:none;border-radius:12px" },
        el("div", { class:"panel-h" },
          el("div", {}, el("div", { class:"t" }, "基础信息")),
          el("div", { class:"krow", style:"justify-content:flex-end;gap:10px;flex-wrap:nowrap" },
            el("span", { class:"pill" }, row.status || "-"),
            null
          )
        ),
        el("div", { class:"panel-b" },
          // Align left padding with table cell text (panel padding + wrap border + cell padding)
          el("div", { style:"padding:0 11px" },
            el("div", { class:"grid2", style:"grid-template-columns:repeat(3,minmax(0,1fr))" },
              basePairs.map(([k, v]) => el("div", {},
                el("div", { class:"k" }, k),
                el("div", { class:"v" }, v || el("span", { class:"muted" }, "-"))
              ))
            )
          )
        )
      );

      const shipTbl = (() => {
        const ships = Array.isArray(row.shipments) ? row.shipments : [];
        const safe = (v) => (String(v ?? "").trim() ? String(v) : "-");
        const fmtDTS = (iso) => {
          const t = String(iso || "").trim();
          if (!t) return "-";
          const d = new Date(t);
          if (Number.isNaN(d.getTime())) return "-";
          const pad = (n) => String(n).padStart(2, "0");
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        };
        const openTrace = () => {
          // GPS placeholder (reserved for future live tracking)
          const gpsPlaceholder = el(
            "img",
            {
              alt: "GPS定位预留区域",
              style: "width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid rgba(15,23,42,.10);display:block;background:#f8fafc",
              src:
                "data:image/svg+xml;utf8," +
                encodeURIComponent(
                  `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
                    <defs>
                      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#f1f5f9"/>
                        <stop offset="1" stop-color="#e2e8f0"/>
                      </linearGradient>
                    </defs>
                    <rect width="1200" height="420" rx="18" fill="url(#g)"/>
                    <g fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.65">
                      <path d="M80 320 C200 220, 280 260, 380 180 S620 190, 760 140 980 160, 1120 90" />
                      <path d="M110 150 C260 220, 310 120, 450 160 S680 260, 820 210 1020 250, 1090 200" />
                    </g>
                    <g>
                      <circle cx="860" cy="160" r="18" fill="#2563eb" opacity="0.9"/>
                      <circle cx="860" cy="160" r="38" fill="#2563eb" opacity="0.16"/>
                      <circle cx="860" cy="160" r="62" fill="#2563eb" opacity="0.10"/>
                    </g>
                    <g font-family="Segoe UI, Arial" fill="#0f172a">
                      <text x="70" y="105" font-size="34" font-weight="700">GPS 定位预留区域</text>
                      <text x="70" y="150" font-size="22" fill="#334155">后续将展示车辆/货件实时位置与轨迹回放</text>
                    </g>
                  </svg>`
                ),
            }
          );
          const list = (row.trace || []).length
            ? el("div", {},
                (row.trace || []).map((t) =>
                  el("div", { class: "krow", style: "justify-content:space-between;border-bottom:1px solid rgba(15,23,42,.08);padding:8px 0" },
                    el("div", {}, el("span", { class: "k" }, fmtDTS(t.t) || "-"), " ", el("span", { class: "v" }, t.s || "-"))
                  )
                )
              )
            : el("div", { class: "empty" }, "暂无轨迹");
          const m = modal({
            title: "轨迹",
            content: el("div", {},
              el("div", { style: "margin-bottom:12px" }, gpsPlaceholder),
              list
            ),

    function openApptFiles(files, { title = "预约文件", onRefresh } = {}) {
      const arr = Array.isArray(files) ? files : [];
      const fileInput = el("input", { class:"input", type:"file", multiple:true, style:"display:none" });
      const listHost = el("div", { class:"list" });
      const countPill = () => el("span", { class:"pill" }, `共 ${arr.length} 个`);

      const fileName = (f) => (f && f.name) ? f.name : ((f && f.file && f.file.name) ? f.file.name : "未命名文件");
      const fileSize = (f) => {
        const n = (f && (f.size ?? (f.file && f.file.size))) ?? 0;
        const v = Number(n);
        if (!Number.isFinite(v) || v <= 0) return "";
        const u = ["B","KB","MB","GB"];
        const i = Math.min(u.length - 1, Math.floor(Math.log(v) / Math.log(1024)));
        const m = v / (1024 ** i);
        return `${m >= 10 || i === 0 ? Math.round(m) : m.toFixed(1)} ${u[i]}`;
      };
      const fileType = (f) => {
        const name = fileName(f);
        const dot = String(name).lastIndexOf(".");
        const ext = dot >= 0 ? String(name).slice(dot + 1).toLowerCase() : "";
        if (!ext) return "";
        if (ext === "pdf") return "application/pdf";
        if (ext === "csv") return "text/csv";
        if (ext === "xlsx") return "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
        if (ext === "xls") return "application/vnd.ms-excel";
        if (ext === "png") return "image/png";
        if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
        return ext;
      };
      const tryDownload = (f) => {
        const ff = (f instanceof File) ? f : (f && f.file instanceof File ? f.file : null);
        if (!ff) return false;
        try {
          const url = URL.createObjectURL(ff);
          const a = document.createElement("a");
          a.href = url;
          a.download = ff.name || "download";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          return true;
        } catch {}
        return false;
      };

      const renderList = () => {
        listHost.innerHTML = "";
        if (!arr.length) {
          listHost.appendChild(el("div", { class:"empty" }, "暂无上传文件"));
          return;
        }
        arr.forEach((f, i) => {
          const name = fileName(f);
          const metaBits = [
            fileSize(f) ? `大小：${fileSize(f)}` : "大小：-",
            fileType(f) ? `类型：${fileType(f)}` : "类型：-",
            `序号：${i + 1}/${arr.length}`,
          ];
          listHost.appendChild(
            el("div", { class:"item" },
              el("div", { style:"min-width:0" },
                el("div", { class:"name" }, name),
                el("div", { class:"meta" }, metaBits.join("  "))
              ),
              el("div", { class:"actions" },
                el("button", { class:"btn", type:"button", onClick: () => {
                  if (tryDownload(f)) toast("已下载", "success");
                  else toast("当前为演示数据，暂不支持下载", "warn");
                } }, "下载"),
                el("button", { class:"btn", type:"button", onClick: () => {
                  arr.splice(i, 1);
                  renderList();
                  onRefresh && onRefresh();
                } }, "删除")
              )
            )
          );
        });
      };

      fileInput.addEventListener("change", () => {
        const picked = (fileInput.files ? Array.from(fileInput.files) : []);
        if (!picked.length) return;
        picked.forEach((f) => arr.push(f));
        try { fileInput.value = ""; } catch {}
        renderList();
        onRefresh && onRefresh();
        toast(`已添加 ${picked.length} 个文件`, "success");
      });

      const pickBtn = el("button", { class:"btn btn-primary", type:"button", onClick: () => fileInput.click() }, "上传文件");
      const content = el("div", { class:"appt-files-modal" },
        el("div", { class:"toolbar" },
          el("div", { class:"meta" },
            el("div", { class:"ico", "aria-hidden":"true" }, "📁"),
            el("div", {}, el("div", { class:"sub" }, "支持多选上传；可逐个下载/删除。", " ", countPill()))
          ),
          el("div", { class:"krow", style:"justify-content:flex-end;gap:8px;flex-wrap:nowrap" }, pickBtn, fileInput)
        ),
        listHost
      );
      renderList();
      modal({ title, content, confirmText: null, cancelText: null, width: 860 });
    }

        const d = new Date(t);
        if (Number.isNaN(d.getTime())) return t;
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      const rows=[];
      state.filtered.forEach((r)=>{
        (r.shipments||[]).forEach((s,idx)=>rows.push({
          系统单号:r.customerOrderNo,
          提货方式:r.pickupMode || "",
          状态:r.status,
          预估板数:r.reservedPallets ?? "",
          实收板数:r.receivedPallets ?? "",
          期望提货开始时间: fmtDTS(r.pickupStart || r.pickupDate),
          期望提货结束时间: fmtDTS(r.pickupEnd),
          提货地址:r.pickupAddress || "",
          期望提货日期: fmtDate(r.pickupDate) || "",
          实际提货日期: fmtDate(r.actualPickupDate) || "",
          到仓日期: fmtDate(r.warehouseArriveDate) || "",
          客户BOL: r.customerBOLUploaded ? "已上传" : "未上传",
          明细序号:idx+1,
          "Move Type":s.moveType ?? "",
          "Customer Ref No":s.customerRefNo ?? "",
          "FBA ID":s.shipmentId ?? "",
          PO:s.po ?? "",
          "FBA Code":s.fbaCode ?? "",
          Address:s.address ?? "",
          "QTY(CTNS)":s.qtyCtns ?? "",
          "Vol(CBM)":s.volCbm ?? "",
          "GW(KGS)":s.gwKgs ?? "",
          板数:s.pallets ?? "",
          "City/城市":s.city ?? "",
          "State/州":s.state ?? "",
          "ZipCode/邮编":s.zipCode ?? "",
          "Contact/联系人":s.contact ?? "",
          "Mobile/手机":s.mobile ?? "",
          "Email/邮箱":s.email ?? "",
          最早送仓日期:s.earliest ?? "",
          最晚送仓日期:s.latest ?? "",
          预约备注:s.remark ?? "",
          预约文件:(s.apptFiles && s.apptFiles.length) ? (s.apptFiles.map((f)=> (f && f.name) ? f.name : ((f && f.file && f.file.name) ? f.file.name : "")).filter(Boolean).join(" | ")) : "",
          私卡成本价:s.privateCardCostPrice ?? "",
        }));
      });
      downloadCSV(`外仓收货计划-货件信息-${new Date().toISOString().slice(0,10)}.csv`,rows);
      toast("已导出货件信息（CSV）","success");
    }

    function exportBOL(){
      const rows=state.filtered.map((r)=>({ 计划号:r.id, 系统单号:r.customerOrderNo, FC:r.fc, 提货码:r.pickupCode, PRO:r.pro, 状态:r.status }));
      downloadCSV(`外仓收货计划-收货BOL-${new Date().toISOString().slice(0,10)}.csv`,rows);
      toast("已导出收货BOL（CSV）","success");
    }

    function uploadBOL(){
      const row=state.selected || state.filtered[0];
      if (!row) return toast("暂无可操作数据","warn");
      const content=el("div",{},
        el("div",{style:"height:4px"}),
        el("input",{class:"input",type:"file",accept:".pdf,.png,.jpg,.jpeg"})
      );
      modal({
        title:`上传客户BOL（${row.id}）`,
        content,
        confirmText:"上传",
        cancelText:"取消",
        onConfirm: ({ close }) => {
          row.customerBOLUploaded=true;
          row.logs=[{ t:new Date().toISOString(), a:"上传文件", by:"Client", note:"客户BOL" }, ...(row.logs||[])];
          close();
          toast("已上传","success");
          runSearch();
        }
      });
    }

    document.getElementById("btnSearch").addEventListener("click",runSearch);
    document.getElementById("btnReset").addEventListener("click",()=>{
      ["q_customerOrderNo","q_refNo","q_pickupMode","q_pickupFrom","q_pickupTo","q_arriveFrom","q_arriveTo"].forEach((id)=>{ const n=document.getElementById(id); if (n) n.value=""; });
      const sel=document.getElementById("q_status");
      if (sel) sel.value="全部";
      state.status="全部";
      document.getElementById("filterGrid").classList.remove("filter-expanded");
      runSearch();
      try { renderExpandBtn && renderExpandBtn(); } catch {}
    });
    const statusSel = document.getElementById("q_status");
    if (statusSel) statusSel.addEventListener("change", ()=>runSearch());
    document.getElementById("btnCreate").addEventListener("click",openCreate);
    document.getElementById("btnImport").addEventListener("click",openImport);
    document.getElementById("btnExportPlan").addEventListener("click",exportPlan);
    document.getElementById("btnExportShip").addEventListener("click",exportShip);
    document.getElementById("btnExportBOL").addEventListener("click",exportBOL);
    document.getElementById("btnUploadBOL").addEventListener("click",uploadBOL);

    function countExtraFilled(){
      const grid = document.getElementById("filterGrid");
      if (!grid) return 0;
      const extras = Array.from(grid.querySelectorAll(".filter-extra"));
      let n = 0;
      extras.forEach((box)=>{
        const controls = Array.from(box.querySelectorAll("input,select,textarea"));
        const has = controls.some((c)=>{
          if (!c) return false;
          const tag = String(c.tagName || "").toLowerCase();
          const type = String(c.type || "").toLowerCase();
          if (tag === "input" && (type === "checkbox" || type === "radio")) return !!c.checked;
          return String(c.value || "").trim() !== "";
        });
        if (has) n += 1;
      });
      return n;
    }
    function renderExpandBtn(){
      const btn = document.getElementById("btnExpand");
      const grid = document.getElementById("filterGrid");
      if (!btn || !grid) return;
      const expanded = grid.classList.contains("filter-expanded");
      const n = countExtraFilled();
      if (expanded) {
        btn.textContent = "收起 ▲";
      } else {
        btn.innerHTML = `展开更多${n ? ` <span class="ex-count">${n}</span>` : ""} ▼`;
      }
    }
    document.getElementById("btnExpand").addEventListener("click", function(){
      document.getElementById("filterGrid").classList.toggle("filter-expanded");
      renderExpandBtn();
    });
    (function(){
      const grid = document.getElementById("filterGrid");
      if (!grid) return;
      const onChange = (e) => {
        const t = e && e.target;
        if (t && t.closest && t.closest(".filter-extra")) renderExpandBtn();
      };
      grid.addEventListener("input", onChange);
      grid.addEventListener("change", onChange);
      renderExpandBtn();
    })();

    try { wireDateRanges && wireDateRanges(document); } catch {}
    runSearch();
  </script>
  <script>
    (function(){
      try {
        const nav = document.querySelector('.client-nav');
        if (!nav) return;
        const file = decodeURIComponent((location.pathname || '').split('/').pop() || '');
        nav.querySelectorAll('a.active').forEach((a) => a.classList.remove('active'));
        const match = file ? nav.querySelector(`a[href$="${CSS.escape(file)}"]`) : null;
        if (match) match.classList.add('active');
        const activeSub = nav.querySelector('.client-group .subnav a.active');
        if (activeSub) {
          const d = activeSub.closest('details');
          if (d) d.open = true;
        }
      } catch {}
    })();
  </script>
</body>
</html>
