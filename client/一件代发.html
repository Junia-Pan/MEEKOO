<head>
  <meta charset="utf-8" />

  <title>客户端 - 一件代发</title>
  <link rel="stylesheet" href="./_styles.css" />
  <style>
    /* Client shell (menu framework) */
    .client-shell{display:flex;min-height:100vh}
    .client-sidenav{
      width:248px;flex:0 0 248px;
      padding:12px 10px;
      position:sticky;top:0;align-self:flex-start;height:100vh;
      background:#fff;
      border-right:1px solid rgba(15,23,42,.06);
      box-shadow:2px 0 12px rgba(2,6,23,.04);
      display:flex;flex-direction:column;
    }
    .client-s-brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      margin-bottom:6px;
      text-decoration:none;color:inherit;
    }
    .client-s-brand:hover{
      background:rgba(37,99,235,.06);
      border-color:transparent;
      color:var(--primary);
    }
    .client-s-brand:hover .client-s-logo{
      background:rgba(37,99,235,.12);
      color:var(--primary);
    }
    .client-divider{
      height:1px;
      background:rgba(15,23,42,.06);
      margin:6px 8px 8px;
      flex:0 0 auto;
    }
    .client-s-logo{
      width:30px;height:30px;border-radius:9px;
      background:rgba(37,99,235,.10);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .client-s-logo svg{width:18px;height:18px;display:block}
    .client-s-title{font-weight:800;font-size:13px;line-height:1.2}
    .client-s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .client-nav{
      display:flex;flex-direction:column;gap:2px;
      flex:1;min-height:0;
      overflow-y:auto;
      padding:2px 4px 10px 2px;
      scrollbar-gutter: auto;
      scrollbar-width: auto;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .client-nav::-webkit-scrollbar{width:6px}
    .client-nav::-webkit-scrollbar-track{background:#eef2f7}
    .client-nav::-webkit-scrollbar-thumb{
      background:rgba(100,116,139,.55);
      border-radius:6px;
    }
    .client-nav:hover::-webkit-scrollbar-thumb{background:rgba(71,85,105,.75)}
    .client-nav a{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:12px;
      text-decoration:none;
      border:1px solid transparent;
      color:rgba(15,23,42,.84);
      font-size:12.5px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-nav a:active{transform:translateY(1px)}
    .client-nav a:hover{background:rgba(37,99,235,.06);border-color:transparent;color:var(--primary)}
    .client-nav a.active{
      background:rgba(37,99,235,.10);
      border-color:transparent;
      color:var(--primary);
      font-weight:650;
    }
    .client-ico{
      width:28px;height:28px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.035);
      font-size:12px;
      color:rgba(100,116,139,.95);
      flex:0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-ico svg{width:14px;height:14px;display:block}
    .client-ico svg path,
    .client-ico svg rect,
    .client-ico svg circle,
    .client-ico svg ellipse{stroke:currentColor}
    .client-nav a:hover .client-ico{
      background:rgba(37,99,235,.12);
      border-color:rgba(37,99,235,.10);
      color:var(--primary);
    }
    .client-nav a.active .client-ico{
      background:var(--primary);
      border-color:transparent;
      color:#fff;
    }
    .client-group{margin-top:6px}
    .client-group details{border:none;background:transparent;overflow:visible}
    .client-group summary{
      list-style:none;cursor:pointer;
      padding:7px 10px;border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:12.5px;font-weight:650;
      color:rgba(15,23,42,.84);
      transition: background .15s ease, color .15s ease;
      user-select:none;
    }
    .client-group summary:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group details[open] summary{background:rgba(37,99,235,.10);color:var(--primary)}
    .client-group summary::-webkit-details-marker{display:none}
    .client-group summary .client-chev{
      width:18px;height:18px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      opacity:.55;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
      background:rgba(15,23,42,.04);
      color:currentColor;
      user-select:none;
    }
    .client-group details[open] summary .client-chev{transform:rotate(180deg);opacity:.9}
    .client-group .subnav{
      display:flex;flex-direction:column;gap:2px;
      padding:6px 0 8px 32px;
      margin:0;border:none;background:transparent;
      max-height:0;opacity:0;transform:translateY(-2px);
      overflow:hidden;
      transition:max-height .22s ease, opacity .18s ease, transform .18s ease;
    }
    .client-group details[open] .subnav{max-height:420px;opacity:1;transform:translateY(0)}
    .client-group .subnav a{
      padding:7px 10px;border-radius:12px;
      color:rgba(15,23,42,.82);
      background:transparent;
    }
    .client-group .subnav a:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group .subnav .client-ico{width:24px;height:24px;border-radius:9px}
    .client-group .subnav .client-ico svg{width:12px;height:12px}
    .client-main{flex:1;min-width:0;display:flex;flex-direction:column}

    /* Top strip nav (matches screenshot) */
    .client-topnav{
      position:sticky;top:0;z-index:30;
      height:52px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:0 16px;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .client-crumb{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:12.5px;color:var(--muted);
      user-select:none;
    }
    .client-crumb b{color:var(--text);font-weight:750}
    .client-top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;color:var(--text);
      cursor:pointer;
      box-shadow:0 1px 0 rgba(15,23,42,.02);
    }
    .icon-btn:hover{background:#f8fafc}
    .icon-btn svg{width:18px;height:18px}
    .notif-dot{
      position:absolute;top:-6px;right:-6px;
      min-width:16px;height:16px;padding:0 4px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:#ef4444;color:#fff;
      font-size:10px;line-height:16px;font-weight:800;
      border:2px solid #fff;
    }
    .icon-wrap{position:relative;display:inline-flex}
    .avatar-btn{
      width:32px;height:32px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(34,197,94,.14));
      color:rgba(15,23,42,.78);
      cursor:pointer;
      overflow:hidden;
      text-decoration:none;
    }
    .avatar-btn:hover{filter:saturate(110%)}
    .avatar-btn svg{opacity:.9;width:18px;height:18px}

    .client-main .wrap{max-width:none;margin:16px 18px;padding:0}
    @media (max-width: 980px){
      .client-sidenav{display:none}
      .client-main .wrap{margin:12px 12px}
    }
  </style>
</head>

    const { getSlice } = wireTablePager(
      pager,
      { count: "countPill", pageSize: "pgPageSize", page: "pgPage", totalPages: "pgTotalPages", prev: "pgPrev", next: "pgNext" },
      () => state.filtered.length,
      () => render()
    );

    function fmtDateOnly(iso){
      const t=String(iso||"").trim();
      if (!t) return "";
      const d=new Date(t);
      if (Number.isNaN(d.getTime())) return "";
      const pad=(n)=>String(n).padStart(2,"0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    function runSearch(){
      const v=(id)=>document.getElementById(id).value.trim().toUpperCase();
      const q={
        systemNo:v("q_systemNo"),
        containerNo:v("q_containerNo"),
        customerRefNo:v("q_customerRefNo"),
        createdFrom:document.getElementById("q_createdFrom").value.trim(),
        createdTo:document.getElementById("q_createdTo").value.trim(),
      };
      const inDayRange = (iso, from, to) => {
        const t = String(iso || "").trim();
        if (!from && !to) return true;
        if (!t) return false;
        const dd = new Date(t);
        if (Number.isNaN(dd.getTime())) return false;
        const day = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate()).getTime();
        const f = from ? new Date(from + "T00:00:00").getTime() : null;
        const e = to ? new Date(to + "T00:00:00").getTime() : null;
        if (f != null && day < f) return false;
        if (e != null && day > e) return false;
        return true;
      };
      const filtered=state.rows.filter((x)=>{
        if (q.systemNo && !String(x.systemNo||"").toUpperCase().includes(q.systemNo)) return false;
        if (q.containerNo && !String(x.containerNo||"").toUpperCase().includes(q.containerNo)) return false;
        if (q.customerRefNo && !String(x.customerRefNo||"").toUpperCase().includes(q.customerRefNo)) return false;
        if (!inDayRange(x.createdAt, q.createdFrom, q.createdTo)) return false;
        return true;
      });
      state.filtered=filtered;
      pager.page = 1;
      render();
    }

    function render(){
      const tbody=document.getElementById("tbody");
      tbody.innerHTML="";
      const all=state.filtered;
      document.getElementById("empty").style.display=all.length?"none":"block";
      const rows=getSlice(all);
      const chkAll = document.getElementById("chkAll");
      if (chkAll) {
        const ids = rows.map((r) => r.systemNo).filter(Boolean);
        const selectedCount = ids.filter((id) => state.selectedIds.has(id)).length;
        chkAll.checked = ids.length > 0 && selectedCount === ids.length;
        chkAll.indeterminate = selectedCount > 0 && selectedCount < ids.length;
        chkAll.onchange = () => {
          if (chkAll.checked) ids.forEach((id) => state.selectedIds.add(id));
          else ids.forEach((id) => state.selectedIds.delete(id));
          render();
        };
      }
      rows.forEach((x)=>{
        tbody.appendChild(el("tr",{style:"cursor:pointer",onClick:()=>openDetail(x)},
          el("td",{}, el("input",{
            type:"checkbox",
            checked: state.selectedIds.has(x.systemNo),
            "aria-label": `选择 ${x.systemNo || "-"}`,
            onClick:(e)=>e.stopPropagation(),
            onChange:(e)=>{ if (e.target.checked) state.selectedIds.add(x.systemNo); else state.selectedIds.delete(x.systemNo); render(); }
          })),
          el("td",{},x.systemNo
            ? el("button",{class:"cp-firstcol-link",type:"button",onClick:(e)=>{ e.stopPropagation(); }}, x.systemNo)
            : el("span",{class:"muted"},"-")
          ),
          el("td",{},x.containerNo || el("span",{class:"muted"},"-")),
          el("td",{},x.customerRefNo || el("span",{class:"muted"},"-")),
          el("td",{},x.platformOrderNo || el("span",{class:"muted"},"-")),
          el("td",{},x.arrivalAt ? (fmtDTS ? (fmtDTS(x.arrivalAt) || el("span",{class:"muted"},"-")) : (x.arrivalAt || el("span",{class:"muted"},"-"))) : el("span",{class:"muted"},"-")),
          el("td",{},String(x.qtyCtns ?? "").trim() ? String(x.qtyCtns) : el("span",{class:"muted"},"-")),
          el("td",{},String(x.volCbm ?? "").trim() ? String(x.volCbm) : el("span",{class:"muted"},"-")),
          el("td",{},String(x.gwKgs ?? "").trim() ? String(x.gwKgs) : el("span",{class:"muted"},"-")),
          el("td",{},fmtDTS ? (fmtDTS(x.createdAt) || el("span",{class:"muted"},"-")) : (x.createdAt || el("span",{class:"muted"},"-"))),
        ));
      });
    }

    function openDetail(x){
      modal({
        title:"详情",
        content: el("div",{},
          el("div",{class:"grid2"},
            ...[
              ["系统单号",x.systemNo || "-"],
              ["柜号",x.containerNo || "-"],
              ["Customer Ref No",x.customerRefNo || "-"],
              ["FBA ID",x.fbaId || "-"],
              ["平台单号",x.platformOrderNo || "-"],
              ["到仓时间", x.arrivalAt ? (fmtDTS ? (fmtDTS(x.arrivalAt) || "-") : (x.arrivalAt || "-")) : "-"],
              ["QTY(CTNS)", String(x.qtyCtns ?? "").trim() ? String(x.qtyCtns) : "-"],
              ["Vol(CBM)", String(x.volCbm ?? "").trim() ? String(x.volCbm) : "-"],
              ["GW(KGS)", String(x.gwKgs ?? "").trim() ? String(x.gwKgs) : "-"],
            ].map(([k,v])=>el("div",{},el("div",{class:"k"},k),el("div",{class:"v"},v)))
          )
        ),
        confirmText:"关闭",
        cancelText:"返回",
        onConfirm:({close})=>close()
      });
    }

    function doExport(){
      const rows=state.filtered.map((x)=>({
        系统单号:x.systemNo,
        柜号:x.containerNo,
        CustomerRefNo:x.customerRefNo,
        FBAID:x.fbaId,
        平台单号:x.platformOrderNo,
        到仓时间: x.arrivalAt ? (fmtDTS ? (fmtDTS(x.arrivalAt) || "") : (x.arrivalAt || "")) : "",
        "QTY(CTNS)": x.qtyCtns ?? "",
        "Vol(CBM)": x.volCbm ?? "",
        "GW(KGS)": x.gwKgs ?? "",
        创建时间:fmtDTS ? (fmtDTS(x.createdAt) || "") : (x.createdAt || ""),
      }));
      downloadCSV(`一件代发-${new Date().toISOString().slice(0,10)}.csv`, rows);
      toast("已导出（CSV）","success");
    }

    document.getElementById("btnSearch").addEventListener("click",runSearch);
    document.getElementById("btnReset").addEventListener("click",()=>{
      ["q_systemNo","q_containerNo","q_customerRefNo","q_createdFrom","q_createdTo"].forEach((id)=>document.getElementById(id).value="");
      runSearch();
    });
    document.getElementById("btnExport").addEventListener("click",doExport);

    try { wireDateRanges && wireDateRanges(document); } catch {}
    runSearch();
  </script>
  <script>
    (function(){
      try {
        const nav = document.querySelector('.client-nav');
        if (!nav) return;
        const file = decodeURIComponent((location.pathname || '').split('/').pop() || '');
        nav.querySelectorAll('a.active').forEach((a) => a.classList.remove('active'));
        const match = file ? nav.querySelector(`a[href$="${CSS.escape(file)}"]`) : null;
        if (match) match.classList.add('active');
        const activeSub = nav.querySelector('.client-group .subnav a.active');
        if (activeSub) {
          const d = activeSub.closest('details');
          if (d) d.open = true;
        }
      } catch {}
    })();
  </script>
</body>
</html>
