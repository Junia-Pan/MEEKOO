<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户端 - 货件管理（出库指令）</title>
  <link rel="stylesheet" href="./_styles.css" />
  <style>
    /* Client shell (menu framework) */
    .client-shell{display:flex;min-height:100vh}
    .client-sidenav{
      width:248px;flex:0 0 248px;
      padding:12px 10px;
      position:sticky;top:0;align-self:flex-start;height:100vh;
      background:#fff;
      border-right:1px solid rgba(15,23,42,.06);
      box-shadow:2px 0 12px rgba(2,6,23,.04);
      display:flex;flex-direction:column;
    }
    .client-s-brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      margin-bottom:6px;
      text-decoration:none;color:inherit;
    }
    .client-s-brand:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-s-brand:hover .client-s-logo{background:rgba(37,99,235,.12);color:var(--primary)}
    .client-divider{height:1px;background:rgba(15,23,42,.06);margin:6px 8px 8px;flex:0 0 auto}
    .client-s-logo{
      width:30px;height:30px;border-radius:9px;
      background:rgba(37,99,235,.10);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .client-s-logo svg{width:18px;height:18px;display:block}
    .client-s-title{font-weight:800;font-size:13px;line-height:1.2}
    .client-s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .client-nav{
      display:flex;flex-direction:column;gap:2px;
      flex:1;min-height:0;overflow-y:auto;
      padding:2px 4px 10px 2px;
      scrollbar-gutter: auto;
      scrollbar-width: auto;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .client-nav::-webkit-scrollbar{width:6px}
    .client-nav::-webkit-scrollbar-track{background:#eef2f7}
    .client-nav::-webkit-scrollbar-thumb{background:rgba(100,116,139,.55);border-radius:6px}
    .client-nav:hover::-webkit-scrollbar-thumb{background:rgba(71,85,105,.75)}
    .client-nav a{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:12px;
      text-decoration:none;border:1px solid transparent;
      color:rgba(15,23,42,.84);
      font-size:12.5px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-nav a:active{transform:translateY(1px)}
    .client-nav a:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-nav a.active{background:rgba(37,99,235,.10);color:var(--primary);font-weight:650}
    .client-ico{
      width:28px;height:28px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.035);
      color:rgba(100,116,139,.95);
      flex:0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-ico svg{width:14px;height:14px;display:block}
    .client-ico svg path,
    .client-ico svg rect,
    .client-ico svg circle,
    .client-ico svg ellipse{stroke:currentColor}
    .client-nav a:hover .client-ico{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.10);color:var(--primary)}
    .client-nav a.active .client-ico{background:var(--primary);border-color:transparent;color:#fff}
    .client-group{margin-top:6px}
    .client-group details{border:none;background:transparent;overflow:visible}
    .client-group summary{
      list-style:none;cursor:pointer;
      padding:7px 10px;border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:12.5px;font-weight:650;
      color:rgba(15,23,42,.84);
      transition: background .15s ease, color .15s ease;
      user-select:none;
    }
    .client-group summary:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group details[open] summary{background:rgba(37,99,235,.10);color:var(--primary)}
    .client-group summary::-webkit-details-marker{display:none}
    .client-group summary .client-chev{width:18px;height:18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;opacity:.55;transition:transform .18s ease,opacity .18s ease;background .18s ease;background:rgba(15,23,42,.04)}
    .client-group details[open] summary .client-chev{transform:rotate(180deg);opacity:.9}
    .client-group .subnav{
      display:flex;flex-direction:column;gap:2px;
      padding:6px 0 8px 32px;
      margin:0;border:none;background:transparent;
      max-height:0;opacity:0;transform:translateY(-2px);
      overflow:hidden;
      transition:max-height .22s ease, opacity .18s ease, transform .18s ease;
    }
    .client-group details[open] .subnav{max-height:420px;opacity:1;transform:translateY(0)}
    .client-group .subnav a{padding:7px 10px;border-radius:12px;color:rgba(15,23,42,.82)}
    .client-group .subnav a:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group .subnav .client-ico{width:24px;height:24px;border-radius:9px}
    .client-group .subnav .client-ico svg{width:12px;height:12px}
    .client-main{flex:1;min-width:0;display:flex;flex-direction:column}

    /* Top strip nav */
    .client-topnav{
      position:sticky;top:0;z-index:30;
      height:52px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:0 16px;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .client-crumb{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:12.5px;color:var(--muted);
      user-select:none;
    }
    .client-crumb b{color:var(--text);font-weight:750}
    .client-top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;color:var(--text);
      cursor:pointer;
      box-shadow:0 1px 0 rgba(15,23,42,.02);
    }
    .icon-btn:hover{background:#f8fafc}
    .icon-btn svg{width:18px;height:18px}
    .notif-dot{
      position:absolute;top:-6px;right:-6px;
      min-width:16px;height:16px;padding:0 4px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:#ef4444;color:#fff;
      font-size:10px;line-height:16px;font-weight:800;
      border:2px solid #fff;
    }
    .icon-wrap{position:relative;display:inline-flex}
    .avatar-btn{
      width:32px;height:32px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(34,197,94,.14));
      color:rgba(15,23,42,.78);
      cursor:pointer;
      overflow:hidden;
      text-decoration:none;
    }
    .avatar-btn:hover{filter:saturate(110%)}
    .avatar-btn svg{opacity:.9;width:18px;height:18px}

    .client-main .wrap{max-width:none;margin:16px 18px;padding:0}
    @media (max-width: 980px){
      .client-sidenav{display:none}
      .client-main .wrap{margin:12px 12px}
    }
    /* 查询区默认两行：基础条件按 4 列排布，展开后才显示更多条件 */
    #filterGrid{grid-template-columns:repeat(4,minmax(0,1fr));}
    #filterGrid:not(.filter-expanded) .filter-extra{display:none}
    #filterGrid.filter-expanded .filter-extra { grid-column: span 2; }
    @media (min-width: 1500px) {
      #filterGrid.filter-expanded .filter-extra { grid-column: span 1; }
    }
    @media (max-width: 1120px) {
      #filterGrid.filter-expanded .filter-extra { grid-column: 1 / -1; }
    }
    .fu-panel{display:flex;flex-direction:column;gap:14px}
    .fu-top-hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:-2px}
    .fu-drop{
      border:1.5px dashed #91CAFF;
      background:#F0F7FF;
      border-radius:10px;
      padding:18px 16px;
      transition:border-color .12s ease, background .12s ease, box-shadow .12s ease;
    }
    .fu-drop.is-drag{
      border-color:#1677FF;
      background:#E6F4FF;
      box-shadow:0 0 0 3px rgba(22,119,255,.12);
    }
    .fu-drop-inner{
      border:1.5px dashed rgba(15,23,42,.12);
      background:#fff;
      border-radius:10px;
      padding:22px 16px 18px;
      text-align:center;
    }
    .fu-drop-ico{
      width:44px;height:44px;margin:0 auto 10px;
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:rgba(22,119,255,.1);color:#1677FF;
    }
    .fu-drop-ico svg{width:22px;height:22px;display:block}
    .fu-drop-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
    .fu-drop-hint{font-size:12px;color:#8C8C8C;line-height:1.5;margin-bottom:14px}
    .fu-drop-btn{
      display:inline-flex;align-items:center;justify-content:center;
      height:32px;padding:0 16px;
      border:1px solid #D9D9D9;border-radius:8px;
      background:#fff;color:#262626;font-size:13px;
      cursor:pointer;font-family:inherit;
    }
    .fu-drop-btn:hover{color:#1677FF;border-color:#91CAFF}
    .fu-drop input[type="file"]{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);border:0;
    }
    .fu-list-sec{display:none}
    .fu-list-sec.is-on{display:block}
    .fu-list-head{
      display:flex;align-items:center;gap:8px;
      margin-bottom:10px;font-size:13px;font-weight:650;color:var(--text-primary);
    }
    .fu-list-badge{
      min-width:18px;height:18px;padding:0 5px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      background:#1677FF;color:#fff;font-size:11px;font-weight:700;line-height:1;
    }
    .fu-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
    .fu-item{
      display:flex;align-items:center;gap:12px;
      padding:10px 12px;border:1px solid rgba(15,23,42,.1);
      border-radius:10px;background:#fff;
    }
    .fu-file-ico{
      flex:0 0 auto;width:36px;height:36px;border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      background:#E6F4FF;color:#1677FF;font-size:10px;font-weight:800;letter-spacing:.02em;
    }
    .fu-item-main{flex:1;min-width:0}
    .fu-item-name{
      font-size:13px;font-weight:600;color:var(--text-primary);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .fu-item-size{margin-top:2px;font-size:12px;color:#8C8C8C}
    .fu-item-actions{display:inline-flex;align-items:center;gap:14px;flex-shrink:0}
    .fu-link{
      border:none;background:none;padding:0;cursor:pointer;font-family:inherit;
      font-size:13px;line-height:1.4;
    }
    .fu-link.is-dl{color:#1677FF}
    .fu-link.is-dl:hover{text-decoration:underline}
    .fu-link.is-del{color:#FF4D4F}
    .fu-link.is-del:hover{text-decoration:underline}
    .fu-drop{position:relative;cursor:pointer}
    .fu-panel.is-compact{gap:6px}
    .fu-panel.is-compact .fu-drop{
      padding:0;
      border:1.5px dashed rgba(37,99,235,.28);
      background:#F8FBFF;
    }
    .fu-panel.is-compact .fu-drop.is-drag{
      border-color:#2563eb;
      background:#EFF6FF;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }
    .fu-panel.is-compact .fu-drop-inner{
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      grid-template-rows:auto auto;
      align-items:center;
      column-gap:10px;
      row-gap:1px;
      padding:10px 12px;
      text-align:left;
      border:0;
      background:transparent;
    }
    .fu-panel.is-compact .fu-drop-ico{
      grid-row:1 / span 2;
      width:28px;height:28px;margin:0;
    }
    .fu-panel.is-compact .fu-drop-ico svg{width:15px;height:15px}
    .fu-panel.is-compact .fu-drop-title{grid-column:2;margin:0;font-size:12.5px;margin-bottom:0}
    .fu-panel.is-compact .fu-drop-hint{grid-column:2;margin:0;font-size:11px}
    .fu-panel.is-compact .fu-drop-btn{
      grid-column:3;grid-row:1 / span 2;height:28px;
      border-color:rgba(37,99,235,.22);color:#2563eb;font-weight:600;
    }
    .fu-panel.is-compact .fu-list{max-height:120px}
    .oi-form{display:flex;flex-direction:column;gap:16px;min-width:0}
    .modal-body:has(.oi-form){max-height:min(78vh, 820px)}
    .oi-split-hint{
      font-size:12px;color:#475569;line-height:1.5;
      margin:0;padding:8px 10px;
      background:#F8FAFC;border-radius:8px;
    }
    .oi-ship-block{min-width:0;flex:0 0 auto}
    .oi-ship-list{display:flex;flex-direction:column;gap:12px}
    .oi-ship-card{
      flex:0 0 auto;
      border:1px solid rgba(15,23,42,.08);
      border-radius:12px;
      background:#fff;
      box-shadow:0 1px 2px rgba(15,23,42,.04);
      overflow:hidden;
    }
    .oi-ship-card-h{
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      padding:12px 16px;
      background:linear-gradient(180deg,#F8FBFF 0%,#fff 100%);
      border-bottom:1px solid rgba(15,23,42,.06);
    }
    .oi-ship-card-id{display:flex;align-items:baseline;gap:8px;min-width:0}
    .oi-ship-k{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
    .oi-ship-no{font-size:14px;font-weight:700;color:var(--text-primary);letter-spacing:.01em}
    .oi-ship-card-tags{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
    .oi-chip{
      display:inline-flex;align-items:center;
      height:22px;padding:0 8px;border-radius:999px;
      background:#F1F5F9;color:#334155;
      font-size:12px;font-weight:600;white-space:nowrap;
    }
    .oi-meta{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px 16px;
      padding:12px 16px;
      background:#F8FAFC;
      border-bottom:1px solid rgba(15,23,42,.05);
    }
    .oi-meta-item{min-width:0;font-size:12px;line-height:1.35}
    .oi-meta-item .k{display:block;color:var(--muted);font-weight:500;margin-bottom:2px}
    .oi-meta-item .v{
      display:block;color:var(--text-primary);font-weight:650;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .oi-card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
    .oi-edit-row{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }
    .oi-edit-row .field,.oi-card-note,.oi-card-file{min-width:0;margin:0}
    .oi-edit-row .label,.oi-card-note .label,.oi-card-file .label{margin-bottom:6px}
    .oi-edit-row .req{color:var(--danger);margin-right:2px;font-weight:700}
    .oi-card-note .textarea{min-height:72px;resize:vertical}
    @media (max-width: 720px){
      .oi-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
      .oi-edit-row{grid-template-columns:1fr}
    }
    .oi-attach-modal{display:flex;flex-direction:column;gap:14px}
    .oi-attach-list{display:flex;flex-direction:column;gap:0}
    .oi-attach-item{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 2px;border-bottom:1px solid rgba(15,23,42,.06);
    }
    .oi-attach-item:last-child{border-bottom:none}
    .oi-attach-name{
      flex:1;min-width:0;font-size:13px;color:var(--text-primary);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .oi-attach-actions{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
    .oi-attach-foot{
      display:flex;justify-content:flex-end;padding-top:4px;
      border-top:1px solid rgba(15,23,42,.06);
    }
    .oi-id-stack{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
    .oi-id-line{display:flex;align-items:baseline;gap:6px;white-space:nowrap;line-height:1.3}
    .oi-id-k{flex:0 0 auto;font-size:11px;color:var(--muted)}
    .oi-note-cell{
      max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
  </style>
</head>
<body>
  <div class="client-shell">
    <aside class="client-sidenav" aria-label="客户端菜单">
      <a class="client-s-brand" href="./index.html" title="返回首页（模块导航）">
        <div class="client-s-logo" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="7" height="7" rx="2" fill="currentColor" style="color:var(--primary)"></rect>
            <rect x="11" y="2" width="7" height="7" rx="2" fill="currentColor" style="color:rgba(37,99,235,.35)"></rect>
            <rect x="2" y="11" width="7" height="7" rx="2" fill="currentColor" style="color:rgba(37,99,235,.35)"></rect>
            <rect x="11" y="11" width="7" height="7" rx="2" fill="currentColor" style="color:rgba(37,99,235,.65)"></rect>
          </svg>
        </div>
        <div>
          <div class="client-s-title">客户端</div>
          <div class="client-s-sub">模块导航</div>
        </div>
      </a>
      <div class="client-divider" aria-hidden="true"></div>

      <nav class="client-nav">
        <a href="./pickup-disassembly-schedule.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1" stroke-width="1.3"></rect>
              <rect x="8" y="1.5" width="4.5" height="4.5" rx="1" stroke-width="1.3"></rect>
              <rect x="1.5" y="8" width="4.5" height="4.5" rx="1" stroke-width="1.3"></rect>
              <path d="M9 10.5l1.2 1.2 2.3-2.3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span>提拆派计划</span>
        </a>
        <a href="./overseas-warehouse-receiving-plan.html">
          <span class="client-ico" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="1.5" y="2.5" width="11" height="9" rx="1.5" stroke-width="1.3"></rect>
              <path d="M4 6h6M4 8.5h4" stroke-width="1.3" stroke-linecap="round"></path>
            </svg>
          </span>
          <span>外仓收货计划</span>
        </a>

        <div class="client-group">
          <details data-snav="shipments">
            <summary>
              <span style="display:flex;align-items:center;gap:10px">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M2 4.5h10M2 4.5l1.5-2h7L12 4.5v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7z" stroke-width="1.3" stroke-linejoin="round"></path>
                  </svg>
                </span>
                货件管理
              </span>
              <span class="client-chev" aria-hidden="true">▾</span>
            </summary>
            <div class="subnav" role="group" aria-label="货件管理子菜单">
              <a href="./shipment-management-all-shipments.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <rect x="2" y="2" width="8" height="8" rx="2" stroke-width="1.3"></rect>
                    <path d="M4 6h4" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M4 8h3" stroke-width="1.3" stroke-linecap="round"></path>
                  </svg>
                </span>
                <span>全部货件</span>
              </a>
              <a href="./shipment-management-pending-outbound.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M6 2v7" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M3.5 6.5L6 9l2.5-2.5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </span>
                <span>待出库货件</span>
              </a>
              <a href="./shipment-management-held-in-warehouse.html">
                <span class="client-ico" aria-hidden="true">
                  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M4.2 2.8v6.4" stroke-width="1.3" stroke-linecap="round"></path>
                    <path d="M7.8 2.8v6.4" stroke-width="1.3" stroke-linecap="round"></path>
                  </svg>
                </span>
                <span>在库留仓货件</span>
              </a>
              <a href="./shipment-management-outbound-instructions.html">

    const CLIENT_OI_KEY = "meekoo-wms-client-oi";

    const state = { statusTab:"全部", rows:mock, filtered:mock, selected:null, selectedIds: new Set() };
    function loadClientOiRows(){
      try {
        const extra = JSON.parse(localStorage.getItem(CLIENT_OI_KEY) || "[]");
        if (!Array.isArray(extra)) return;
        extra.slice().reverse().forEach((r) => {
          if (!r || !r.instructionNo) return;
          const exist = state.rows.find((x) => x.instructionNo === r.instructionNo || x.id === r.id);
          if (exist) Object.assign(exist, r);
          else state.rows.unshift(r);
        });
        state.filtered = state.rows;
      } catch (e) {}
    }
    function persistClientOi(row){
      try {
        const extra = JSON.parse(localStorage.getItem(CLIENT_OI_KEY) || "[]");
        const list = Array.isArray(extra) ? extra : [];
        const copy = JSON.parse(JSON.stringify(row));
        let i = -1;
        if (row && row.id) i = list.findIndex((x) => x && x.id === row.id);
        if (i < 0) {
          i = list.findIndex((x) => x && x.instructionNo === row.instructionNo && x.shipNo === row.shipNo);
        }
        if (i >= 0) list[i] = copy;
        else list.unshift(copy);
        localStorage.setItem(CLIENT_OI_KEY, JSON.stringify(list));
      } catch (e) {}
    }
    function instructionKey(r){
      return String((r && (r.instructionNo || r.id)) || "").trim();
    }
    function restoreHeldOnCancel(oi){
      if (!oi || !oi.parentId) return;
      try {
        const data = JSON.parse(localStorage.getItem(CLIENT_HELD_KEY) || "{}") || {};
        data.patches = data.patches && typeof data.patches === "object" ? data.patches : {};
        const snap = oi.heldSnapshot || {};
        if (oi.isSplit) {
          const pt = data.patches[oi.parentId] || {};
          const cur = Number(pt.actualQty ?? pt.qtyCtns);
          const add = Number(oi.qtyCtns) || 0;
          if (Number.isFinite(cur)) pt.actualQty = cur + add;
          else if (snap.actualQty != null) pt.actualQty = Number(snap.actualQty);
          else if (snap.qtyCtns != null) pt.actualQty = Number(snap.qtyCtns);
          delete pt.qtyCtns;
          delete pt.removed;
          data.patches[oi.parentId] = pt;
        } else if (snap.splitSeq) {
          data.patches[oi.parentId] = {
            actualQty: snap.actualQty ?? snap.qtyCtns,
            splitSeq: snap.splitSeq,
          };
        } else {
          delete data.patches[oi.parentId];
        }
        localStorage.setItem(CLIENT_HELD_KEY, JSON.stringify(data));
      } catch (e) {}
    }
    loadClientOiRows();
    function origShipNo(r){
      const parent = String((r && r.parentShipNo) || "").trim();
      const ship = String((r && r.shipNo) || "").trim();
      return parent || ship;
    }
    function newShipNo(r){
      const parent = String((r && r.parentShipNo) || "").trim();
      const ship = String((r && r.shipNo) || "").trim();
      if (r && r.isSplit && ship && ship !== parent) return ship;
      if (parent && ship && ship !== parent) return ship;
      return "";
    }

    }
    function forecastQtyOf(r){
      const snap = (r && r.heldSnapshot) || {};
      const v = r && (r.forecastQty ?? snap.qtyCtns ?? r.qtyCtns);
      return v;
    }
    function actualQtyOf(r){
      const snap = (r && r.heldSnapshot) || {};
      const v = r && (r.actualQty ?? snap.actualQty ?? r.qtyCtns);
      return v;
    }
    function outQtyOf(r){
      return r && (r.outQty ?? r.qtyCtns);
    }
    function createdByOf(r){
      return String((r && r.createdBy) || "").trim();
    }
    const pager = { page: 1, pageSize: 10 };
    const { getSlice } = wireTablePager(
      pager,
      { count: "countPill", pageSize: "pgPageSize", page: "pgPage", totalPages: "pgTotalPages", prev: "pgPrev", next: "pgNext" },
      () => state.filtered.length,
      () => render()
    );

    function matchStatusTab(tabKey, row){
      const k = String(tabKey || "");
      if (k === "全部") return true;
      return String(row?.status || "").trim() === k;
    }
    function countForStatusTab(tabKey){
      if (String(tabKey) === "全部") return state.rows.length;
      return state.rows.filter((r)=>matchStatusTab(tabKey, r)).length;
    }
    function renderStatusTabs(){
      const host=document.getElementById("statusTabs");
      if (!host) return;
      host.innerHTML="";
      STATUS_TABS.forEach(({ key, label })=>{
        const pressed=key===state.statusTab;

        host.appendChild(el("button",{
          class:"status-tab",
          type:"button",
          "aria-pressed":pressed?"true":"false",
          title:`筛选：${label}（${n}）`,
          onClick:()=>{ state.statusTab=key; runSearch(); },
        },
        el("span",{},label),
        el("span",{class:"cnt"},`(${n})`)));
      });
    }

    // 货件管理日期展示：按天（YYYY-MM-DD）
    function fmtDay(iso){
      const t=String(iso||"").trim();
      if (!t) return "-";
      const d=new Date(t);
      if (Number.isNaN(d.getTime())) return "-";
      const pad=(n)=>String(n).padStart(2,"0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    function statusDot(s){
      const v = String(s || "").trim();
      if (!v) return "";
      if (v === "已取消") return "danger";
      if (v === "待处理" || v.includes("中")) return "warn";
      if (v === "已完成") return "success";
      return "";
    }

    const OUTBOUND_METHODS = ["FBA卡派","Walmart卡派","私卡派","自提","UPS","Fedex","DHL","USPS","一件代发"];
    function isInstructionEditable(row){
      return String(row?.status || "").trim() === "待处理";
    }

    function buildFileDrop({
      accept = ".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.gif,.webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,image/*",
      multiple = true,
      hint = "支持 PDF、Excel、Word、图片，单文件不超过 50MB",
      maxBytes = 50 * 1024 * 1024,
      initialFiles = [],
      compact = false,
    } = {}){
      const files = Array.isArray(initialFiles) ? initialFiles.slice() : [];
      const ACCEPT_EXT = new Set(
        String(accept || "")
          .split(",")
          .map((s) => s.trim().toLowerCase())
          .filter((s) => s.startsWith("."))
          .map((s) => s.slice(1))
      );
      const input = el("input", {
        type:"file",
        accept,
        multiple: multiple ? "" : undefined,
        "aria-hidden":"true",
        tabindex:"-1",
      });
      const pickBtn = el("button", { class:"fu-drop-btn", type:"button" }, "选择文件");
      const drop = el("div", {
        class:"fu-drop",
        tabindex:"0",
        role:"button",
        "aria-label":"上传附件",
      },
        el("div", { class:"fu-drop-inner" },
          input,
          el("div", {
            class:"fu-drop-ico",
            "aria-hidden":"true",
            html:'<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 16V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 10.5L12 7l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 16.5v1.2A2.3 2.3 0 0 0 8.3 20h7.4A2.3 2.3 0 0 0 18 17.7v-1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
          }),
          el("div", { class:"fu-drop-title" }, "点击或拖拽文件到此区域上传"),
          el("div", { class:"fu-drop-hint" }, hint),
          pickBtn
        )
      );
      const badge = el("span", { class:"fu-list-badge" }, "0");
      const list = el("div", { class:"fu-list" });
      const listSec = el("div", { class:"fu-list-sec" },
        el("div", { class:"fu-list-head" }, "上传的文件", badge),
        list
      );
      const root = el("div", { class: compact ? "fu-panel is-compact" : "fu-panel" },
        compact ? null : el("div", { class:"fu-top-hint" }, hint),
        drop,
        listSec
      );

      const fmtSize = (n) => {
        const v = Number(n);
        if (!Number.isFinite(v) || v <= 0) return "";
        const u = ["B","KB","MB","GB"];
        const i = Math.min(u.length - 1, Math.floor(Math.log(v) / Math.log(1024)));
        const m = v / (1024 ** i);
        return `${m >= 10 || i === 0 ? Math.round(m) : m.toFixed(1)} ${u[i]}`;
      };
      const fileName = (f, idx) => (f && f.name) ? f.name : `附件 ${idx + 1}`;
      const isAllowed = (file) => {
        if (!ACCEPT_EXT.size) return true;
        const name = String(file && file.name || "");
        const dot = name.lastIndexOf(".");
        const ext = dot >= 0 ? name.slice(dot + 1).toLowerCase() : "";
        return ACCEPT_EXT.has(ext);
      };
      const tryDownload = (f, name) => {
        try {
          if (f instanceof File || (f && typeof Blob !== "undefined" && f instanceof Blob)) {
            const url = URL.createObjectURL(f);
            const a = document.createElement("a");
            a.href = url;
            a.download = name || "download";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            return true;
          }
          const href = f && (f.url || f.href);
          if (href) {
            const a = document.createElement("a");
            a.href = href;
            a.download = name || "download";
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            a.remove();
            return true;
          }
        } catch {}
        return false;
      };
      const tryPreview = (f) => {
        try {
          const href = f && (f.url || f.href);
          if (href) {
            window.open(href, "_blank", "noopener,noreferrer");
            return true;
          }
          if (f instanceof File || (f && typeof Blob !== "undefined" && f instanceof Blob)) {
            const url = URL.createObjectURL(f);
            window.open(url, "_blank", "noopener,noreferrer");
            setTimeout(() => URL.revokeObjectURL(url), 60_000);
            return true;
          }
        } catch {}
        return false;
      };
      const renderList = () => {
        list.innerHTML = "";
        badge.textContent = String(files.length);
        if (!files.length) {
          listSec.classList.remove("is-on");
          return;
        }
        listSec.classList.add("is-on");
        files.forEach((f, idx) => {
          const name = fileName(f, idx);
          const sizeText = fmtSize(f && f.size) || "-";
          list.appendChild(
            el("div", { class:"fu-item" },
              el("div", { class:"fu-file-ico", "aria-hidden":"true" }, "FILE"),
              el("div", { class:"fu-item-main" },
                el("div", { class:"fu-item-name", title:name }, name),
                el("div", { class:"fu-item-size" }, sizeText)
              ),
              el("div", { class:"fu-item-actions" },
                el("button", {
                  class:"fu-link is-dl",
                  type:"button",
                  onClick:(e)=>{
                    e.stopPropagation();
                    if (tryPreview(f)) toast("已打开预览","success");
                    else toast("已打开预览（演示）","success");
                  }
                }, "预览"),
                el("button", {
                  class:"fu-link is-dl",
                  type:"button",
                  onClick:(e)=>{
                    e.stopPropagation();
                    if (tryDownload(f, name)) toast("已下载","success");
                    else toast("已下载（演示）","success");
                  }
                }, "下载"),
                el("button", {
                  class:"fu-link is-del",
                  type:"button",
                  onClick:(e)=>{
                    e.stopPropagation();
                    files.splice(idx, 1);
                    renderList();
                  }
                }, "删除")
              )
            )
          );
        });
      };
      const addFiles = (listLike) => {
        const incoming = Array.from(listLike || []);
        if (!incoming.length) return;
        const rejectedType = [];
        const rejectedSize = [];
        incoming.forEach((f) => {
          if (!isAllowed(f)) {
            rejectedType.push(f.name);
            return;
          }
          if (maxBytes && Number(f.size) > maxBytes) {
            rejectedSize.push(f.name);
            return;
          }
          const dup = files.some((x) => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified);
          if (!dup) files.push(f);
        });
        if (rejectedType.length) toast(`不支持的文件类型：${rejectedType.slice(0, 3).join("、")}${rejectedType.length > 3 ? "…" : ""}`, "warn");
        if (rejectedSize.length) toast(`超过 50MB：${rejectedSize.slice(0, 3).join("、")}${rejectedSize.length > 3 ? "…" : ""}`, "warn");
        renderList();
      };

      const openPicker = () => input.click();
      pickBtn.addEventListener("click", (e) => { e.stopPropagation(); openPicker(); });
      drop.addEventListener("click", (e) => {
        if (e.target === input) return;
        if (e.target.closest && e.target.closest("button")) return;
        openPicker();
      });
      drop.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openPicker();
        }
      });
      input.addEventListener("change", () => {
        addFiles(input.files);
        input.value = "";
      });
      drop.addEventListener("dragenter", (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.add("is-drag"); });
      drop.addEventListener("dragover", (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.add("is-drag"); });
      drop.addEventListener("dragleave", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!drop.contains(e.relatedTarget)) drop.classList.remove("is-drag");
      });
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        drop.classList.remove("is-drag");
        addFiles(e.dataTransfer && e.dataTransfer.files);
      });

      renderList();
      return {
        root,
        getFiles: () => files.slice(),
      };
    }

    function editInstruction(row){
      if (!row) return;
      if (!isInstructionEditable(row)) return toast("仅待处理的出库指令可编辑","warn");
      const dash = (v) => (v == null || String(v).trim() === "") ? "-" : String(v);
      const fmtNum = (v, digits) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return dash(v);
        return n.toFixed(digits);
      };
      const metaItem = (k, v) => el("div", { class:"oi-meta-item" },
        el("span", { class:"k" }, k),
        el("span", { class:"v", title: String(v) }, v)
      );
      const maxQty = Number(actualQtyOf(row));

      const qtyInput = el("input", {

      const orig = origShipNo(row);

      const card = el("div", { class:"oi-ship-card" },

          ),
          el("div", { class:"oi-ship-card-tags" },
            neu ? el("span", { class:"oi-chip", title:"原货件ID" }, `原 ${orig}`) : null,
            ctn !== "-" ? el("span", { class:"oi-chip", title:"柜号" }, ctn) : null
          )
        ),
        el("div", { class:"oi-meta" },
          metaItem("Customer Ref No", dash(row.customerRefNo)),
          metaItem("预报件数", dash(forecastQtyOf(row))),
          metaItem("实际件数", dash(actualQtyOf(row))),
          metaItem("预估板数", dash(row.pallets)),
          metaItem("收费板数", dash(chargePallets)),
          metaItem("方数", fmtNum(row.volCbm, 3)),
          metaItem("重量(KG)", fmtNum(row.gwKgs, 2)),
          metaItem("FBA Code", dash(row.fbaCode))
        ),
        el("div", { class:"oi-card-body" },
          el("div", { class:"oi-edit-row" },
            el("div", { class:"field" },
              el("label", { class:"label" }, el("span", { class:"req", "aria-hidden":"true" }, "*"), "出库件数"),
              qtyInput
            ),
            el("div", { class:"field" },
              el("label", { class:"label" }, "FBA ID"),
              fbaInput
            ),
            el("div", { class:"field" },
              el("label", { class:"label" }, "PO"),
              poInput
            )
          ),
          el("div", { class:"field oi-card-note" },
            el("label", { class:"label" }, "备注"),
            noteInput
          ),
          el("div", { class:"field oi-card-file" },
            el("label", { class:"label" }, "附件"),
            fileDrop.root
          )
        )
      );
      const splitHint = el("div", { class:"oi-split-hint" }, "出库件数小于实际件数时，仅本次件数进入出库指令，剩余件数继续留仓。");
      const content = el("div", { class:"oi-form" },
        splitHint,
        root,
        el("div", { class:"oi-ship-block" },
          el("div", { class:"oi-ship-list" }, card)
        )

      modal({
        title: `编辑出库指令（${row.shipNo || row.systemNo || "-"}）`,

        confirmText:"保存",
        cancelText:"取消",

        onConfirm: ({ close }) => {
          const method = (controls.method.value || "").trim();
          if (!method) return toast("请选择出库方式","warn");
          const raw = String(qtyInput.value || "").trim();
          const qty = Number(raw);
          if (!raw || !Number.isFinite(qty) || !Number.isInteger(qty) || qty < 1) {
            return toast("请填写有效的出库件数", "warn");
          }
          if (Number.isFinite(maxQty) && qty > maxQty) {
            return toast(`出库件数不能大于实际件数（${maxQty}）`, "warn");

          row.moveType = method;
          row.fbaId = String(fbaInput.value || "").trim();
          row.po = String(poInput.value || "").trim();
          row.note = String(noteInput.value || "").trim();
          row.outQty = qty;
          row.qtyCtns = qty;
          row.outboundAttachments = fileDrop.getFiles().map((f) => ({
            name: f.name,
            size: f.size,
          }));
          row.updatedAt = new Date().toISOString();
          persistClientOi(row);
          close();
          toast("已保存出库指令","success");
          render();
        }
      });

    function runSearch(){
      const v=(id)=>document.getElementById(id).value.trim().toUpperCase();
      const d=(id)=>document.getElementById(id).value.trim();
      const q={
        shipNo:v("q_shipNo"),
        systemNo:v("q_systemNo"),
        containerNo:v("q_containerNo"),
        customerRefNo:v("q_customerRefNo"),
        fbaId:v("q_fbaId"),
        po:v("q_po"),
        fbaCode:v("q_fbaCode"),
        moveType:(document.getElementById("q_moveType").value || "").trim(),
        arrivalFrom:d("q_arrivalFrom"),
        arrivalTo:d("q_arrivalTo"),
        expectedDeliverFrom:d("q_expectedDeliverFrom"),
        expectedDeliverTo:d("q_expectedDeliverTo"),
        signedFrom:d("q_signedFrom"),
        signedTo:d("q_signedTo"),
        createdFrom:d("q_createdFrom"),
        createdTo:d("q_createdTo"),
      };

      const inDayRange = (iso, from, to) => {
        if (!from && !to) return true;
        const t = String(iso || "").trim();
        if (!t) return false;
        const dd = new Date(t);
        if (Number.isNaN(dd.getTime())) return false;
        const day = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate()).getTime();
        const f = from ? new Date(from + "T00:00:00").getTime() : null;
        const e = to ? new Date(to + "T00:00:00").getTime() : null;
        if (f != null && day < f) return false;
        if (e != null && day > e) return false;
        return true;
      };
      const filtered=state.rows.filter((r)=>{
        if (!matchStatusTab(state.statusTab, r)) return false;
        if (q.moveType && String(r.moveType || "").trim() !== q.moveType) return false;
        if (q.shipNo && ![r.shipNo, r.parentShipNo].some((s) => String(s||"").toUpperCase().includes(q.shipNo))) return false;
        if (q.systemNo && !String(r.systemNo||"").toUpperCase().includes(q.systemNo)) return false;
        if (q.containerNo && !String(r.containerNo||"").toUpperCase().includes(q.containerNo)) return false;
        if (q.customerRefNo && !String(r.customerRefNo||"").toUpperCase().includes(q.customerRefNo)) return false;
        if (q.fbaId && !String(r.fbaId||"").toUpperCase().includes(q.fbaId)) return false;
        if (q.po && !String(r.po||"").toUpperCase().includes(q.po)) return false;
        if (q.fbaCode && !String(r.fbaCode||"").toUpperCase().includes(q.fbaCode)) return false;
        if (!inDayRange(r.arrivalAt || r.arrivedAt || r.warehouseArrivalAt || r.inWarehouseAt || r.receivedAt || r.latestWhAt, q.arrivalFrom, q.arrivalTo)) return false;
        if (!inDayRange(r.expectedDeliverAt, q.expectedDeliverFrom, q.expectedDeliverTo)) return false;
        if (!inDayRange(r.signedAt, q.signedFrom, q.signedTo)) return false;
        if (!inDayRange(r.createdAt, q.createdFrom, q.createdTo)) return false;
        return true;
      });
      filtered.sort((a, b) => {
        const tb = Date.parse(b.createdAt) || 0;
        const ta = Date.parse(a.createdAt) || 0;
        if (tb !== ta) return tb - ta;
        const ka = instructionKey(a);
        const kb = instructionKey(b);
        if (ka !== kb) return ka < kb ? -1 : 1;
        return 0;
      });
      state.filtered=filtered;
      pager.page = 1;
      renderStatusTabs();
      render();
    }

    function openOutboundAttachments(row){
      const files = Array.isArray(row && row.outboundAttachments) ? row.outboundAttachments : [];
      if (!files.length) return toast("暂无附件", "warn");
      const fileName = (f, i) => (f && f.name) ? f.name : `附件 ${i + 1}`;
      const extOf = (name) => {
        const t = String(name || "").trim().toLowerCase();
        const i = t.lastIndexOf(".");
        return i >= 0 ? t.slice(i + 1) : "";
      };
      const canPreview = (name) => {
        const ext = extOf(name);
        return ["png","jpg","jpeg","gif","webp","bmp","svg","pdf","txt"].includes(ext);
      };
      const openUrl = (url) => {
        try { window.open(url, "_blank", "noopener,noreferrer"); return true; } catch { return false; }
      };
      const resolveUrl = (f) => {
        if (!f) return "";
        if (f.url || f.href) return f.url || f.href;
        try {
          if (f instanceof File || (typeof Blob !== "undefined" && f instanceof Blob)) {
            return URL.createObjectURL(f);
          }
        } catch {}
        return "";
      };
      const doPreview = (f, i) => {
        const name = fileName(f, i);
        const url = resolveUrl(f);
        if (url) {
          if (!openUrl(url)) return toast("无法打开预览", "warn");
          if (!(f && (f.url || f.href))) setTimeout(() => { try { URL.revokeObjectURL(url); } catch {} }, 60000);
          return;
        }
        if (!canPreview(name)) return toast("该文件类型暂不支持预览（演示）", "info");
        toast(`已打开预览：${name}（演示）`, "success");
      };
      const doDownload = (f, i, { silent = false } = {}) => {
        const name = fileName(f, i);
        const url = resolveUrl(f);
        if (url) {
          try {
            const a = document.createElement("a");
            a.href = url;
            a.download = name;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            a.remove();
            if (!(f && (f.url || f.href))) setTimeout(() => { try { URL.revokeObjectURL(url); } catch {} }, 1500);
            if (!silent) toast("已下载", "success");
            return;
          } catch {}
        }
        if (!silent) toast(`已下载：${name}（演示）`, "success");
      };
      const bulkDownload = () => {
        files.forEach((f, i) => doDownload(f, i, { silent: true }));
        toast(`已批量下载 ${files.length} 个文件（演示）`, "success");
      };

      const list = el("div", { class:"oi-attach-modal" },
        el("div", { class:"oi-attach-list" },
          files.map((f, i) => el("div", { class:"oi-attach-item" },
            el("div", { class:"oi-attach-name", title: fileName(f, i) }, fileName(f, i)),
            el("div", { class:"oi-attach-actions" },
              el("button", { class:"btn", type:"button", onClick:() => doPreview(f, i) }, "预览"),
              el("button", { class:"btn", type:"button", onClick:() => doDownload(f, i) }, "下载")
            )
          ))
        ),
        el("div", { class:"oi-attach-foot" },
          el("button", { class:"btn btn-primary", type:"button", onClick: bulkDownload }, "批量下载")
        )
      );
      modal({
        title: `附件（${(row && row.shipNo) || "-"}）`,
        content: list,
        confirmText: null,
        cancelText: null,
        width: 640,
      });
    }

    function render(){
      const tbody=document.getElementById("tbody");
      tbody.innerHTML="";
      const all=state.filtered;
      document.getElementById("empty").style.display=all.length?"none":"block";
      const rows=getSlice(all);
      const chkAll = document.getElementById("chkAll");
      if (chkAll) {
        const ids = rows.map((r) => r.shipNo || r.systemNo || r.id).filter(Boolean);
        const selectedCount = ids.filter((id) => state.selectedIds.has(id)).length;
        chkAll.checked = ids.length > 0 && selectedCount === ids.length;
        chkAll.indeterminate = selectedCount > 0 && selectedCount < ids.length;
        chkAll.onchange = () => {
          if (chkAll.checked) ids.forEach((id) => state.selectedIds.add(id));
          else ids.forEach((id) => state.selectedIds.delete(id));
          render();
        };
      }
      rows.forEach((r)=>{
        const rowKey = r.shipNo || r.systemNo || r.id;
        const statusText = String(r.status || "").trim();
        const badge=el("span",{class:"badge"}, el("span",{class:`dot ${statusDot(statusText)}`}), statusText || "-");
        const attachments = Array.isArray(r.outboundAttachments) ? r.outboundAttachments : [];
        const attachCell = attachments.length
          ? el("button",{
              class:"btn",
              type:"button",
              onClick:(e)=>{
                e.stopPropagation();
                openOutboundAttachments(r);
              }
            }, `${attachments.length} 个`)
          : el("span",{class:"muted"},"-");
        const noteText = String(r.note || "").trim();
        const noteCell = noteText
          ? el("div", { class:"oi-note-cell", title: noteText }, noteText)
          : el("span",{class:"muted"},"-");
        const tr=el("tr",{},
          el("td",{}, el("input",{
            type:"checkbox",
            checked: state.selectedIds.has(rowKey),
            "aria-label": `选择 ${rowKey || "-"}`,
            onChange:(e)=>{
              if (e.target.checked) {
                state.selectedIds.add(rowKey);
                state.selected = r;
              } else {
                state.selectedIds.delete(rowKey);
                if (state.selected && (state.selected.shipNo || state.selected.systemNo) === rowKey) state.selected = null;
              }
              render();
            }
          })),
          el("td",{}, shipIdCell(r)),
          el("td",{}, r.customerRefNo || el("span",{class:"muted"},"-")),
          el("td",{}, r.containerNo || el("span",{class:"muted"},"-")),
          el("td",{}, badge),
          el("td",{}, dashNum(forecastQtyOf(r))),
          el("td",{}, dashNum(actualQtyOf(r))),
          el("td",{}, dashNum(outQtyOf(r))),
          el("td",{}, r.fbaId || el("span",{class:"muted"},"-")),
          el("td",{}, r.po || el("span",{class:"muted"},"-")),
          el("td",{}, noteCell),
          el("td",{}, attachCell),
          el("td",{}, r.fbaCode || el("span",{class:"muted"},"-")),
          el("td",{}, fmtVol(r.volCbm)),
          el("td",{}, fmtVol(r.volCbm)),
          el("td",{}, fmtDTS ? (fmtDTS(r.createdAt) || "-") : fmtDay(r.createdAt)),
          el("td",{}, createdByOf(r) || el("span",{class:"muted"},"-")),
          el("td",{class:"op-col"}, (() => {
            if (!isInstructionEditable(r)) return el("span",{class:"muted"},"-");
            return el("div",{class:"op-btns"},
              el("button",{
                class:"btn btn-ghost-lite",
                type:"button",
                onClick:(e)=>{ e.stopPropagation(); editInstruction(r); }
              },"编辑"),
              el("button",{
                class:"btn btn-ghost-lite",
                type:"button",
                onClick:(e)=>{ e.stopPropagation(); cancelInstruction(r); }
              },"取消")
            );
          })()),
        );
        tbody.appendChild(tr);
      });
    }

    function doExport(){
      const rows = (state.filtered || []).map((r)=>({
        原货件ID: origShipNo(r),
        新货件ID: newShipNo(r),
        CustomerRefNo:r.customerRefNo||"",
        柜号:r.containerNo||"",
        指令状态:r.status||"",
        预报件数:forecastQtyOf(r),
        实际件数:actualQtyOf(r),
        出库件数:outQtyOf(r),
        FBAID:r.fbaId||"",
        PO:r.po||"",
        备注:r.note||"",
        文件:(Array.isArray(r.outboundAttachments)?r.outboundAttachments.map(f=>f.name).join(";"):""),
        FBACode:r.fbaCode||"",
        方数:r.volCbm,
        体积:r.volCbm,
        发起时间:fmtDTS ? (fmtDTS(r.createdAt) || "") : fmtDay(r.createdAt),
        发起人:createdByOf(r),
      }));
      downloadCSV(`出库指令-导出-${new Date().toISOString().slice(0,10)}.csv`, rows);
      toast("已导出（CSV）","success");
    }

    document.getElementById("btnSearch").addEventListener("click",runSearch);
    document.getElementById("btnReset").addEventListener("click",()=>{
      ["q_shipNo","q_systemNo","q_containerNo","q_customerRefNo","q_fbaId","q_po","q_moveType","q_fbaCode","q_arrivalFrom","q_arrivalTo","q_expectedDeliverFrom","q_expectedDeliverTo","q_signedFrom","q_signedTo","q_createdFrom","q_createdTo"].forEach((id)=>document.getElementById(id).value="");
      try { const mt = document.getElementById("q_moveType"); if (mt) mt.value = ""; } catch {}
      state.selected=null;
      state.statusTab = "全部";
      document.getElementById("filterGrid").classList.remove("filter-expanded");
      runSearch();
      try { renderExpandBtn && renderExpandBtn(); } catch {}
    });
    document.getElementById("btnExport").addEventListener("click",doExport);

    function countExtraFilled(){
      const grid = document.getElementById("filterGrid");
      if (!grid) return 0;
      const extras = Array.from(grid.querySelectorAll(".filter-extra"));
      let n = 0;
      extras.forEach((box)=>{
        const controls = Array.from(box.querySelectorAll("input,select,textarea"));
        const has = controls.some((c)=>{
          if (!c) return false;
          const tag = String(c.tagName || "").toLowerCase();
          const type = String(c.type || "").toLowerCase();
          if (tag === "input" && (type === "checkbox" || type === "radio")) return !!c.checked;
          return String(c.value || "").trim() !== "";
        });
        if (has) n += 1;
      });
      return n;
    }
    function renderExpandBtn(){
      const btn = document.getElementById("btnExpand");
      const grid = document.getElementById("filterGrid");
      if (!btn || !grid) return;
      const expanded = grid.classList.contains("filter-expanded");
      const n = countExtraFilled();
      if (expanded) {
        btn.textContent = "收起 ▲";
      } else {
        btn.innerHTML = `展开更多${n ? ` <span class="ex-count">${n}</span>` : ""} ▼`;
      }
    }
    document.getElementById("btnExpand").addEventListener("click", function(){
      document.getElementById("filterGrid").classList.toggle("filter-expanded");
      renderExpandBtn();
    });
    (function(){
      const grid = document.getElementById("filterGrid");
      if (!grid) return;
      const onChange = (e) => {
        const t = e && e.target;
        if (t && t.closest && t.closest(".filter-extra")) renderExpandBtn();
      };
      grid.addEventListener("input", onChange);
      grid.addEventListener("change", onChange);
      renderExpandBtn();
    })();

    try { wireDateRanges && wireDateRanges(document); } catch {}
    runSearch();
  </script>
  <script>
    (function(){
      try {
        const nav = document.querySelector('.client-nav');
        if (!nav) return;
        const file = decodeURIComponent((location.pathname || '').split('/').pop() || '');
        nav.querySelectorAll('a.active').forEach((a) => a.classList.remove('active'));
        const match = file ? nav.querySelector(`a[href$="${CSS.escape(file)}"]`) : null;
        if (match) match.classList.add('active');
        const activeSub = nav.querySelector('.client-group .subnav a.active');
        if (activeSub) {
          const d = activeSub.closest('details');
          if (d) d.open = true;
        }
      } catch {}
    })();
  </script>
</body>
