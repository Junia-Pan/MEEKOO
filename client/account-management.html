<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户端 - 账号管理</title>
  <link rel="stylesheet" href="./_styles.css" />
  <style>
    /* Client shell (menu framework) */
    .client-shell{display:flex;min-height:100vh}
    .client-sidenav{
      width:248px;flex:0 0 248px;
      padding:12px 10px;
      position:sticky;top:0;align-self:flex-start;height:100vh;
      background:#fff;
      border-right:1px solid rgba(15,23,42,.06);
      box-shadow:2px 0 12px rgba(2,6,23,.04);
      display:flex;flex-direction:column;
    }
    .client-s-brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      margin-bottom:6px;
      text-decoration:none;color:inherit;
    }
    .client-s-brand:hover{
      background:rgba(37,99,235,.06);
      border-color:transparent;
      color:var(--primary);
    }
    .client-s-brand:hover .client-s-logo{
      background:rgba(37,99,235,.12);
      color:var(--primary);
    }
    .client-divider{
      height:1px;
      background:rgba(15,23,42,.06);
      margin:6px 8px 8px;
      flex:0 0 auto;
    }
    .client-s-logo{
      width:30px;height:30px;border-radius:9px;
      background:rgba(37,99,235,.10);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .client-s-logo svg{width:18px;height:18px;display:block}
    .client-s-title{font-weight:800;font-size:13px;line-height:1.2}
    .client-s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .client-nav{
      display:flex;flex-direction:column;gap:2px;
      flex:1;min-height:0;
      overflow-y:auto;
      padding:2px 4px 10px 2px;
      scrollbar-gutter: auto;
      scrollbar-width: auto; /* Firefox */
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .client-nav::-webkit-scrollbar{width:6px}
    .client-nav::-webkit-scrollbar-track{background:#eef2f7}
    .client-nav::-webkit-scrollbar-thumb{
      background:rgba(100,116,139,.55);
      border-radius:6px;
    }
    .client-nav:hover::-webkit-scrollbar-thumb{background:rgba(71,85,105,.75)}
    .client-nav a{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:12px;
      text-decoration:none;
      border:1px solid transparent;
      color:rgba(15,23,42,.84);
      font-size:12.5px;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-nav a:active{transform:translateY(1px)}
    .client-nav a:hover{background:rgba(37,99,235,.06);border-color:transparent;color:var(--primary)}
    .client-nav a.active{
      background:rgba(37,99,235,.10);
      border-color:transparent;
      color:var(--primary);
      font-weight:650;
    }
    .client-ico{
      width:28px;height:28px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.035);
      font-size:12px;
      color:rgba(100,116,139,.95);
      flex:0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .client-ico svg{width:14px;height:14px;display:block}
    .client-ico svg path,
    .client-ico svg rect,
    .client-ico svg circle,
    .client-ico svg ellipse{stroke:currentColor}
    .client-nav a:hover .client-ico{
      background:rgba(37,99,235,.12);
      border-color:rgba(37,99,235,.10);
      color:var(--primary);
    }
    .client-nav a.active .client-ico{
      background:var(--primary);
      border-color:transparent;
      color:#fff;
    }
    .client-badge{
      font-size:10px;font-weight:700;
      padding:1px 6px;border-radius:999px;
      line-height:1.6;
      flex:0 0 auto;
    }
    .client-badge.red{background:#fee2e2;color:#ef4444}
    .client-badge.blue{background:#dbeafe;color:#2563eb}
    /* Expand group: match reference (no heavy frame) */
    .client-group{margin-top:6px}
    .client-group details{
      border:none;
      background:transparent;
      overflow:visible;
    }
    .client-group summary{
      list-style:none;cursor:pointer;
      padding:7px 10px;border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-size:12.5px;font-weight:650;
      color:rgba(15,23,42,.84);
      transition: background .15s ease, color .15s ease;
      user-select:none;
    }
    .client-group summary:hover{background:rgba(37,99,235,.06);color:var(--primary)}
    .client-group details[open] summary{
      background:rgba(37,99,235,.10);
      color:var(--primary);
    }
    .client-group summary .client-ico{margin-right:0}
    .client-group summary::-webkit-details-marker{display:none}

    .client-group summary .client-chev{
      width:18px;height:18px;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      opacity:.55;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
      background:rgba(15,23,42,.04);
      color:currentColor;
      user-select:none;
    }
    .client-group details[open] summary .client-chev{transform:rotate(180deg);opacity:.9}

    .client-group .subnav{
      display:flex;flex-direction:column;gap:2px;
      padding:6px 0 8px 32px; /* indent under icon (closer left) */
      margin:0;
      border:none;
      background:transparent;
      max-height:0;
      opacity:0;
      transform:translateY(-2px);
      overflow:hidden;
      transition:max-height .22s ease, opacity .18s ease, transform .18s ease;
    }
    .client-group details[open] .subnav{
      max-height:420px;
      opacity:1;
      transform:translateY(0);
    }
    .client-group .subnav a{
      padding:7px 10px;
      border-radius:12px;
      color:rgba(15,23,42,.82);
      background:transparent;
    }
    .client-group .subnav a:hover{
      background:rgba(37,99,235,.06);
      color:var(--primary);
    }
    .client-group .subnav a.active{
      background:rgba(37,99,235,.18);
      color:var(--primary);
      font-weight:650;
    }
    .client-group .subnav .client-ico{
      width:24px;height:24px;border-radius:9px;
    }
    .client-group .subnav .client-ico svg{width:12px;height:12px}

    .client-main{flex:1;min-width:0;display:flex;flex-direction:column}

    /* Top strip nav */
    .client-topnav{
      position:sticky;top:0;z-index:30;
      height:52px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:0 16px;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .client-crumb{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:12.5px;color:var(--muted);
      user-select:none;
    }
    .client-crumb b{color:var(--text);font-weight:750}
    .client-top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:#fff;color:var(--text);
      cursor:pointer;
      box-shadow:0 1px 0 rgba(15,23,42,.02);
    }
    .icon-btn:hover{background:#f8fafc}
    .icon-btn svg{width:18px;height:18px}
    .notif-dot{
      position:absolute;top:-6px;right:-6px;
      min-width:16px;height:16px;padding:0 4px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:#ef4444;color:#fff;
      font-size:10px;line-height:16px;font-weight:800;
      border:2px solid #fff;
    }
    .icon-wrap{position:relative;display:inline-flex}
    .avatar-btn{
      width:32px;height:32px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(15,23,42,.10);
      background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(34,197,94,.14));
      color:rgba(15,23,42,.78);
      cursor:pointer;
      overflow:hidden;
      text-decoration:none;
    }
    .avatar-btn:hover{filter:saturate(110%)}
    .avatar-btn svg{opacity:.9;width:18px;height:18px}

    .client-main .wrap{max-width:none;margin:16px 18px;padding:0}
    @media (max-width: 980px){
      .client-sidenav{display:none}
      .client-main .wrap{margin:12px 12px}
    }
  </style>
</head>

  <script>
    const { el, toast, modal, formGrid, wireTablePager } = window.MEEKOO_UI;
    const state = {
      filter: { status: "all", username: "", name: "" },
      rows: [
        { id:"u1", username:"test001", name:"1111", email:"644922677@qq.com", phone:"", status:"禁用", createdAt:"2026-03-24 13:40:43" },
        { id:"u2", username:"test002", name:"xiaoming", email:"txfba@qq.com", phone:"", status:"启用", createdAt:"2026-03-25 16:42:17" },
      ]
    };
    const pager = { page: 1, pageSize: 10 };
    const { getSlice } = wireTablePager(
      pager,
      { count: "countPill", pageSize: "pgPageSize", page: "pgPage", totalPages: "pgTotalPages", prev: "pgPrev", next: "pgNext" },
      () => getFilteredRows().length,
      () => render()
    );

    function pad2(n){ return String(n).padStart(2,"0"); }
    function formatDT(d){
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }
    function normalize(s){ return (s ?? "").toString().trim().toLowerCase(); }

    function getFilteredRows(){
      const f = state.filter;
      const u = normalize(f.username);
      const n = normalize(f.name);
      return state.rows.filter((r)=>{
        if (f.status === "enabled" && r.status !== "启用") return false;
        if (f.status === "disabled" && r.status !== "禁用") return false;
        if (u && !normalize(r.username).includes(u)) return false;
        if (n && !normalize(r.name).includes(n)) return false;
        return true;
      });
    }

    function runSearch(){
      state.filter.status = (document.getElementById("qStatus").value || "all").trim();
      state.filter.username = (document.getElementById("qUsername").value || "").trim();
      state.filter.name = (document.getElementById("qName").value || "").trim();
      pager.page = 1;
      render();
    }

    function resetSearch(){
      state.filter.status = "all";
      state.filter.username = "";
      state.filter.name = "";
      document.getElementById("qStatus").value = "all";
      document.getElementById("qUsername").value = "";
      document.getElementById("qName").value = "";
      pager.page = 1;
      render();
    }

    function render(){
      const tbody=document.getElementById("tbody");
      tbody.innerHTML="";
      const all=getFilteredRows();
      document.getElementById("empty").style.display=all.length?"none":"block";
      const rows=getSlice(all);
      const rowStart=(pager.page-1)*pager.pageSize;
      rows.forEach((u, idx)=>{
        const actions = el("div",{class:"krow"},
          el("button",{class:"btn",type:"button",onClick:()=>edit(u)},"编辑"),
          el("button",{class:"btn",type:"button",onClick:()=>toggle(u)},u.status==="启用"?"禁用":"启用"),
          el("button",{class:"btn",type:"button",onClick:()=>resetPassword(u)},"重置密码"),
        );
        tbody.appendChild(el("tr",{},
          el("td",{}, String(rowStart + idx + 1)),
          el("td",{},u.username),
          el("td",{},u.name),
          el("td",{},u.email),
          el("td",{},u.phone || "-"),
          el("td",{},el("span",{class:"badge"},el("span",{class:`dot ${u.status==="启用"?"success":"danger"}`}),u.status)),
          el("td",{},u.createdAt || "-"),
          el("td",{class:"op-col"},actions),
        ));
      });
    }

    function add(){
      const reqMark = el("span",{style:"color:#dc2626;margin-right:6px"}, "*");
      const labelReq = (text)=>el("label",{class:"label"}, el("span",{}, reqMark.cloneNode(true)), text);
      const labelOpt = (text)=>el("label",{class:"label"}, text);

      const username = el("input",{class:"input",placeholder:"请输入用户名"});
      const name = el("input",{class:"input",placeholder:"请输入真实姓名"});
      const enName = el("input",{class:"input",placeholder:"请输入英文名"});
      const email = el("input",{class:"input",type:"email",placeholder:"请输入邮箱"});
      const phone = el("input",{class:"input",placeholder:"请输入手机号"});
      const password = el("input",{class:"input",type:"password",placeholder:"请输入密码"});

      const stEnable = el("input",{type:"radio",name:"_status_add",value:"启用",checked:true});
      const stDisable = el("input",{type:"radio",name:"_status_add",value:"禁用"});
      const statusRow = el("div",{class:"krow",style:"gap:18px;align-items:center"},
        el("label",{class:"krow",style:"gap:8px;cursor:pointer"}, stEnable, el("span",{},"启用")),
        el("label",{class:"krow",style:"gap:8px;cursor:pointer"}, stDisable, el("span",{},"禁用")),
      );

      const remark = el("textarea",{class:"input textarea",rows:"3",maxlength:"50",placeholder:"请输入备注"});
      const remarkCnt = el("div",{class:"muted",style:"text-align:right;margin-top:6px;font-size:12px"},"0 / 50");
      const syncCnt = ()=>{ remarkCnt.textContent = `${(remark.value||"").length} / 50`; };
      remark.addEventListener("input",syncCnt);
      syncCnt();

      const root = el("div",{},
        el("div",{class:"form-grid"},
          el("div",{class:"field col-6"}, labelReq("用户名"), username),
          el("div",{class:"field col-6"}, labelReq("真实姓名"), name),
          el("div",{class:"field col-6"}, labelOpt("英文名"), enName),
          el("div",{class:"field col-6"}, labelReq("邮箱"), email),
          el("div",{class:"field col-6"}, labelOpt("手机号"), phone),
          el("div",{class:"field col-6"}, labelReq("密码"), password),
          el("div",{class:"field col-12"}, el("label",{class:"label"},"状态"), statusRow),
          el("div",{class:"field col-12"}, labelOpt("备注"), remark, remarkCnt),
        )
      );
      modal({
        title:"添加用户",
        content: root,
        confirmText:"确定",
        cancelText:"取消",
        width: 860,
        onConfirm: ({ close }) => {
          const v = (x)=>(x.value ?? "").trim();
          const status = (stDisable.checked ? "禁用" : "启用");
          if (!v(username) || !v(name) || !v(email) || !v(password)) {
            toast("请完善必填项","warn");
            return;
          }
          if (state.rows.some((x)=>normalize(x.username)===normalize(v(username)))) {
            toast("用户名已存在","warn");
            return;
          }
          state.rows.push({
            id:`u${Math.random().toString(16).slice(2)}`,
            username:v(username),
            name:v(name),
            enName:v(enName),
            email:v(email),
            phone:v(phone),
            status,
            createdAt: formatDT(new Date()),
            remark:v(remark),
          });
          close(); toast("已创建","success"); runSearch();
        }
      });
    }

    function edit(u){
      const { root, controls } = formGrid([
        { name:"name", label:"真实姓名", type:"text", col:6, required:true },
        { name:"email", label:"邮箱", type:"email", col:6, required:true },
        { name:"phone", label:"手机号", type:"text", col:6 },
        { name:"status", label:"状态", type:"select", col:6, options:[{value:"启用",label:"启用"},{value:"禁用",label:"禁用"}] },
        { name:"remark", label:"备注", type:"textarea", col:12, rows:3 },
      ], { name:u.name, email:u.email, phone:u.phone, status:u.status, remark:u.remark || "" });
      controls.remark.setAttribute("maxlength", "50");
      controls.remark.setAttribute("placeholder", "请输入备注");
      const remarkCnt = el("div",{class:"muted",style:"text-align:right;margin-top:6px;font-size:12px"},"0 / 50");
      controls.remark.parentElement.appendChild(remarkCnt);
      const syncRemarkCnt = ()=>{ remarkCnt.textContent = `${(controls.remark.value||"").length} / 50`; };
      controls.remark.addEventListener("input", syncRemarkCnt);
      syncRemarkCnt();
      modal({
        title:`修改账号（${u.username}）`,
        content: root,
        confirmText:"保存",
        cancelText:"取消",
        width: 860,
        onConfirm: ({ close }) => {
          const name=(controls.name.value||"").trim();
          const email=(controls.email.value||"").trim();
          if (!name || !email) {
            toast("请完善必填项","warn");
            return;
          }
          u.name=name;
          u.email=email;
          u.phone=(controls.phone.value||"").trim();
          u.status=(controls.status.value||"").trim();
          u.remark=(controls.remark.value||"").trim();
          close(); toast("已保存","success"); render();
        }
      });
    }

    function toggle(u){
      u.status = u.status==="启用" ? "禁用" : "启用";
      toast(`已${u.status==="启用" ? "启用" : "禁用"}`,"success");
      render();
    }

    function resetPassword(u){
      modal({
        title:"重置密码",
        content: el("div",{class:"muted",style:"font-size:12px;line-height:1.6"},`确定要将用户 ${u.username} 的密码重置为系统默认密码吗？`),
        confirmText:"确定",
        cancelText:"取消",
        onConfirm: ({ close }) => {
          close(); toast("密码已重置","success");
        }
      });
    }

    document.getElementById("btnAdd").addEventListener("click",add);
    document.getElementById("btnSearch").addEventListener("click",runSearch);
    document.getElementById("btnReset").addEventListener("click",resetSearch);
    document.getElementById("qStatus").addEventListener("change",runSearch);
    document.getElementById("qUsername").addEventListener("keydown",(e)=>{ if (e.key==="Enter") runSearch(); });
    document.getElementById("qName").addEventListener("keydown",(e)=>{ if (e.key==="Enter") runSearch(); });
    render();
  </script>
</body>
</html>
