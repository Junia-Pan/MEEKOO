<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 应付汇总</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  .table-toolbar-spacer { flex: 1; min-width: 8px; }
  table.data-table th.th-action,
  table.data-table td.td-action {
    width: 1%;
    white-space: nowrap;
    padding-left: 12px;
    padding-right: 12px;
    box-sizing: border-box;
  }
  table.data-table th.th-action {
    position: sticky;
    right: 0;
    z-index: 3;
    background: #F8FAFD;
    box-shadow: -2px 0 8px rgba(0,0,0,0.08);
    text-align: left;
  }
  table.data-table td.td-action {
    position: sticky;
    right: 0;
    z-index: 1;
    background: var(--surface);
    box-shadow: -2px 0 8px rgba(0,0,0,0.06);
    display: table-cell;
    vertical-align: middle;
    text-align: left;
  }
  table.data-table tbody tr:hover td.td-action { background: #F8FAFD; }
  table.data-table thead th,
  table.data-table tbody td {
    text-align: left;
    vertical-align: middle;
  }
  .data-table th, .data-table td { white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>应付管理</span><span class="sep">›</span><span class="current">应付汇总</span></div></div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">📊</div>应付汇总 (按供应商)</div></div>
      <div class="search-card">
        <div class="search-grid-5">
          <div class="search-field"><label class="search-label">供应商</label><select class="search-select"><option value="">全部</option><option>快马物流</option><option>速达运输</option><option>迅捷拖车行</option><option>平安仓储</option></select></div>
        </div>
        <div class="search-actions"><button class="btn btn-primary">🔍 查询</button><button class="btn btn-default">↺ 重置</button></div>
      </div>
      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-success">📄 生成应付账单</button>
          <button class="btn btn-default">📤 导出</button>
          <div class="table-toolbar-spacer"></div>
          <button class="btn btn-default btn-col-setting" type="button">⚙️ 自定义列</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th style="width:36px"><input type="checkbox"></th>
              <th>供应商</th>
              <th>未付金额</th>
              <th>币种</th>
              <th>折合人民币</th>
              <th class="th-action">操作</th>
            </tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td><span class="td-link">快马物流</span></td><td style="font-weight:600;color:var(--danger-text);">460.00</td><td>USD</td><td style="font-weight:600;">¥3,312.00</td><td class="td-action"><button class="btn btn-default btn-xs" type="button">查看明细</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">速达运输</span></td><td style="font-weight:600;">0.00</td><td>USD</td><td>¥0.00</td><td class="td-action"><button class="btn btn-default btn-xs" type="button">查看明细</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">迅捷拖车行</span></td><td style="font-weight:600;color:var(--danger-text);">450.00</td><td>USD</td><td style="font-weight:600;">¥3,240.00</td><td class="td-action"><button class="btn btn-default btn-xs" type="button">查看明细</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">平安仓储</span></td><td style="font-weight:600;color:var(--danger-text);">45.00</td><td>USD</td><td style="font-weight:600;">¥324.00</td><td class="td-action"><button class="btn btn-default btn-xs" type="button">查看明细</button></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination"><div class="pagination-info">共 4 条</div><div class="pagination-right"><button class="page-btn active">1</button></div></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
