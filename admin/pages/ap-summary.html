<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 应付汇总</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  .th-action { position: sticky; right: 0; z-index: 3; background: #F8FAFD; box-shadow: -2px 0 8px rgba(0,0,0,0.08); }
  .td-action { position: sticky; right: 0; z-index: 1; background: var(--surface); box-shadow: -2px 0 8px rgba(0,0,0,0.06); }
  .data-table tbody tr:hover .td-action { background: #F8FAFD; }
  .data-table th, .data-table td { white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>应付管理</span><span class="sep">›</span><span class="current">应付汇总</span></div></div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">📊</div>应付汇总 (按供应商)</div></div>
      <div class="search-card">
        <div class="search-grid-5">
          <div class="search-field"><label class="search-label">供应商</label><input class="search-input" placeholder="供应商名称"></div>
          <div class="search-field"><label class="search-label">结清状态</label><select class="search-select"><option>全部</option><option>有未付</option><option>已结清</option></select></div>
        </div>
        <div class="search-actions"><button class="btn btn-primary">🔍 查询</button><button class="btn btn-default">↺ 重置</button></div>
      </div>
      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-success">📄 生成应付账单</button>
          <button class="btn btn-default" style="margin-left:auto;">📤 导出</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th style="width:36px"><input type="checkbox"></th>
              <th>供应商</th><th>总金额($)</th><th>已付金额($)</th><th>未付金额($)</th><th class="th-action">操作</th>
            </tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td><span class="td-link">快马物流</span></td><td style="font-weight:600;">$460.00</td><td>$0.00</td><td style="font-weight:600;color:var(--danger-text);">$460.00</td><td class="td-action"><button class="btn btn-default btn-xs">查看明细</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">速达运输</span></td><td style="font-weight:600;">$220.00</td><td>$220.00</td><td style="font-weight:600;">$0.00</td><td class="td-action"><button class="btn btn-default btn-xs">查看明细</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">迅捷拖车行</span></td><td style="font-weight:600;">$450.00</td><td>$0.00</td><td style="font-weight:600;color:var(--danger-text);">$450.00</td><td class="td-action"><button class="btn btn-default btn-xs">查看明细</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">平安仓储</span></td><td style="font-weight:600;">$95.00</td><td>$95.00</td><td style="font-weight:600;">$0.00</td><td class="td-action"><button class="btn btn-default btn-xs">查看明细</button></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination"><div class="pagination-info">共 3 条</div><div class="pagination-right"><button class="page-btn active">1</button></div></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
