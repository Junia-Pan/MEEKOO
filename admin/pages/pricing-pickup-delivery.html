<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 提拆派报价</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.btn-with-dropdown { position: relative; display: inline-flex; vertical-align: middle; }
.dropdown-menu {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
  min-width: 100px;
  display: none;
  padding: 4px 0;
}
.btn-with-dropdown.open .dropdown-menu { display: block; }
.dropdown-item {
  display: block; padding: 7px 16px; font-size: 13px; color: var(--text-primary);
  cursor: pointer; white-space: nowrap; transition: background 0.1s; text-align: left;
}
.dropdown-item:hover { background: var(--bg); }

/* 操作列：左对齐及宽度优化 */
table.data-table th.th-action,
table.data-table td.td-action {
  width: 170px; min-width: 170px;
  text-align: left !important;
}
table.data-table td.td-action {
  display: table-cell; vertical-align: middle;
}
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>应收报价配置</span><span class="sep">›</span><span class="current">提拆派报价</span></div></div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">🏷️</div>提拆派报价</div></div>
      
      <div class="search-card">
        <div class="search-grid">
          <div class="search-field">
            <label class="search-label">报价编号</label>
            <input class="search-input" placeholder="请输入报价编号">
          </div>
          <div class="search-field">
            <label class="search-label">报价名称</label>
            <input class="search-input" placeholder="请输入报价名称">
          </div>
          <div class="search-field">
            <label class="search-label">客户</label>
            <select class="search-select">
              <option value="">全部</option>
              <option value="tx">腾信物流</option>
              <option value="abc">ABC Trading Co.</option>
            </select>
          </div>
          <div class="search-field">
            <label class="search-label">生效日期</label>
            <div class="date-range">
              <input type="date" class="search-input"><span class="sep">至</span><input type="date" class="search-input">
            </div>
          </div>
        </div>
        <div class="search-actions">
          <button class="btn btn-primary">🔍 查询</button>
          <button class="btn btn-default">↺ 重置</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-primary" onclick="location.href='pricing-pickup-delivery-edit.html'">＋ 新增报价</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>报价编号</th><th>报价名称</th><th>客户</th><th>生效时间</th><th>失效时间</th><th>结算币种</th><th>状态</th><th>创建时间</th><th>修改时间</th><th class="th-action">操作</th></tr></thead>
            <tbody id="pricingQuoteTableBody"></tbody>
          </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/pricing-pickup-delivery-quote.js"></script>
<script>
var P = window.PricingPickupQuote;

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

function copyPricingQuote(id) {
  location.href = 'pricing-pickup-delivery-edit.html?copy=' + encodeURIComponent(id);
}

async function uiAlert(message, title) {
  if (typeof openSharedAlert === 'function') return openSharedAlert(title || '提示', message);
  alert(message);
}

async function uiConfirm(message, title) {
  if (typeof openSharedConfirm === 'function') return openSharedConfirm(title || '确认', message);
  return confirm(message);
}

function renderPricingQuoteTable() {
  var tbody = document.getElementById('pricingQuoteTableBody');
  if (!tbody || !P) return;
  var quotes = P.loadQuotes();
  var ids = Object.keys(quotes).sort();
  tbody.innerHTML = ids.map(function (id) {
    var q = quotes[id];
    var enabled = P.isQuoteEnabled(q);
    var statusHtml = enabled
      ? '<span style="background:#F0FDF4;color:#16A34A;padding:2px 7px;border-radius:4px;font-size:11px;">启用</span>'
      : '<span style="background:#FEF2F2;color:#DC2626;padding:2px 7px;border-radius:4px;font-size:11px;">停用</span>';
    var toggleLabel = enabled ? '停用' : '启用';
    var toggleAction = enabled ? 'disable' : 'enable';
    return '<tr data-quote-id="' + escHtml(id) + '">' +
      '<td>' + escHtml(id) + '</td>' +
      '<td>' + escHtml(q.name) + '</td>' +
      '<td>' + escHtml(P.formatCustomerLabel(q)) + '</td>' +
      '<td>' + escHtml(P.formatDisplayTime(q.start)) + '</td>' +
      '<td>' + escHtml(P.formatDisplayTime(q.end)) + '</td>' +
      '<td>' + escHtml(q.currency || 'USD') + '</td>' +
      '<td>' + statusHtml + '</td>' +
      '<td>' + escHtml(q.createdAt || '-') + '</td>' +
      '<td>' + escHtml(q.modifiedAt || '-') + '</td>' +
      '<td class="td-action"><div style="display:flex;gap:4px;">' +
      '<button class="btn btn-default btn-xs" onclick="location.href=\'pricing-pickup-delivery-edit.html?id=' + encodeURIComponent(id) + '\'">编辑</button>' +
      '<button class="btn btn-default btn-xs" onclick="copyPricingQuote(\'' + escHtml(id) + '\')">复制</button>' +
      '<div class="btn-with-dropdown">' +
      '<button class="btn btn-default btn-xs" onclick="toggleDropdown(this)">更多 ▾</button>' +
      '<div class="dropdown-menu">' +
      '<div class="dropdown-item" data-action="' + toggleAction + '" data-quote-id="' + escHtml(id) + '">' + toggleLabel + '</div>' +
      '<div class="dropdown-item" data-action="log" data-quote-id="' + escHtml(id) + '">日志</div>' +
      '</div></div></div></td></tr>';
  }).join('');
}

async function onQuoteDropdownAction(action, quoteId) {
  _closeAllDropdowns();
  if (action === 'log') {
    await uiAlert('查看报价 ' + quoteId + ' 的操作日志（原型演示）', '操作日志');
    return;
  }
  var quotes = P.loadQuotes();
  var q = quotes[quoteId];
  if (!q) return;

  if (action === 'disable') {
    var ok = await uiConfirm('确定停用报价 ' + quoteId + '？停用后将不再参与新提拆派计划匹配。', '停用确认');
    if (!ok) return;
    q.enabled = false;
    q.modifiedAt = P.formatDisplayTime(new Date().toISOString());
    quotes[quoteId] = q;
    P.saveQuotes(quotes);
    renderPricingQuoteTable();
    await uiAlert('已停用（原型演示）', '操作成功');
    return;
  }

  if (action === 'enable') {
    var hit = P.findUniquenessConflict({
      customerScope: q.customerScope,
      customerIds: q.customerIds || [],
      start: q.start,
      end: q.end,
      checkAsEnabled: true,
    }, quoteId);
    if (hit) {
      await uiAlert(P.buildConflictMessage(hit), '无法启用');
      return;
    }
    var ok2 = await uiConfirm('确定启用报价 ' + quoteId + '？启用后须满足时间与适用客户唯一性。', '启用确认');
    if (!ok2) return;
    q.enabled = true;
    q.modifiedAt = P.formatDisplayTime(new Date().toISOString());
    quotes[quoteId] = q;
    P.saveQuotes(quotes);
    renderPricingQuoteTable();
    await uiAlert('已启用（原型演示）', '操作成功');
  }
}

document.addEventListener('DOMContentLoaded', function () {
  renderPricingQuoteTable();
  document.getElementById('pricingQuoteTableBody').addEventListener('click', function (e) {
    var item = e.target.closest('.dropdown-item[data-action]');
    if (!item) return;
    e.stopPropagation();
    onQuoteDropdownAction(item.getAttribute('data-action'), item.getAttribute('data-quote-id'));
  });
});

const _dpPortals = new Map();
function _closeAllDropdowns() {
  document.querySelectorAll('.btn-with-dropdown.open').forEach(w => w.classList.remove('open'));
  _dpPortals.forEach((parent, menu) => {
    menu.style.cssText = '';
    parent.appendChild(menu);
  });
  _dpPortals.clear();
}

function toggleDropdown(btn) {
  event.stopPropagation();
  const wrapper = btn.closest('.btn-with-dropdown');
  const menu = wrapper.querySelector('.dropdown-menu');
  const isOpen = wrapper.classList.contains('open');
  _closeAllDropdowns();
  if (!isOpen) {
    const pad = 8;
    const rect = btn.getBoundingClientRect();
    const vh = window.innerHeight;
    const vw = window.innerWidth;
    _dpPortals.set(menu, wrapper);
    document.body.appendChild(menu);
    menu.style.cssText = 'position:fixed;visibility:hidden;display:block;z-index:9999;top:0;left:0;max-height:none;';
    const mw = menu.offsetWidth;
    const mhNatural = menu.offsetHeight;
    let top = mhNatural <= (vh - rect.bottom - 4 - pad) ? rect.bottom + 4 : (mhNatural <= (rect.top - 4 - pad) ? rect.top - mhNatural - 4 : rect.bottom + 4);
    let left = Math.max(pad, Math.min(rect.left, vw - mw - pad));
    if (rect.left + mw > vw - pad) left = rect.right - mw;
    const maxH = Math.max(vh - rect.bottom - 4 - pad, rect.top - 4 - pad);
    const clipCss = mhNatural > maxH + 0.5 ? `max-height:${maxH}px;overflow-y:auto;overflow-x:hidden;` : 'max-height:none;overflow:visible;';
    menu.style.cssText = `position:fixed;z-index:9999;display:block;top:${top}px;left:${left}px;${clipCss}`;
    wrapper.classList.add('open');
  }
}
document.addEventListener('click', function(e) {
  var item = e.target.closest('.dropdown-item[data-action]');
  if (item) return;
  if (!e.target.closest('.btn-with-dropdown') && !e.target.closest('.dropdown-menu')) {
    _closeAllDropdowns();
  }
});
</script>
</body>
</html>
