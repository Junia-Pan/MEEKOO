<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* ── 左右分栏高阶权限配置样式 ── */
    .perm-layout {
      display: flex; height: 500px;
      border: 1px solid var(--border); border-radius: 8px;
      background: #fff; overflow: hidden;
    }
    
    /* 左侧树形导航 */
    .perm-sidebar {
      width: 220px; background: #F8FAFD;
      border-right: 1px solid var(--border);
      overflow-y: auto; padding: 8px 0;
    }
    .perm-tree-group { margin-bottom: 2px; }
    .perm-tree-group-header {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 12px 9px 10px; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); cursor: pointer; user-select: none;
      transition: all 0.15s;
    }
    .perm-tree-group-header:hover { background: var(--border-light); color: var(--text-primary); }
    .perm-tree-arrow {
      width: 14px; font-size: 11px; color: var(--text-muted); flex-shrink: 0;
      transition: transform 0.2s; text-align: center;
    }
    .perm-tree-group.open > .perm-tree-group-header .perm-tree-arrow { transform: rotate(90deg); }
    .perm-tree-label { flex: 1; min-width: 0; }
    .perm-tree-children {
      overflow: hidden; max-height: 0; transition: max-height 0.22s ease;
    }
    .perm-tree-group.open > .perm-tree-children { max-height: 400px; }
    .perm-tree-page {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px 8px 32px; font-size: 12.5px; color: var(--text-secondary);
      cursor: pointer; transition: all 0.15s;
    }
    .perm-tree-page:hover { background: var(--border-light); color: var(--text-primary); }
    .perm-tree-page.active {
      background: var(--primary-lighter); color: var(--primary); font-weight: 600;
    }
    .perm-tree-leaf {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 12px 9px 10px; margin-bottom: 2px; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
    }
    .perm-tree-leaf:hover { background: var(--border-light); color: var(--text-primary); }
    .perm-tree-leaf.active {
      background: var(--primary-lighter); color: var(--primary); font-weight: 600;
    }
    .perm-module-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: transparent; transition: background 0.2s;
    }
    .perm-module-dot.partial { background: #F59E0B; box-shadow: 0 0 0 2px rgba(245,158,11,.2); }
    .perm-module-dot.full { background: var(--primary); box-shadow: 0 0 0 2px rgba(21,101,192,.2); }
    .perm-page-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: transparent;
    }
    .perm-page-dot.partial { background: #F59E0B; }
    .perm-page-dot.full { background: var(--primary); }

    /* 右侧权限内容区 */
    .perm-content {
      flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff;
    }
    .perm-page-panels { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .perm-page-panel { display: none; }
    .perm-page-panel.active { display: block; }
    .perm-page-card {
      border: 1px solid var(--border-light); border-radius: 8px;
      background: #fff; overflow: hidden;
    }
    .perm-page-header {
      padding: 12px 16px; background: #FAFAFA;
      border-bottom: 1px solid var(--border-light);
    }
    .perm-page-header label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 700; color: var(--text-primary);
      cursor: pointer; margin: 0;
    }
    .perm-page-header input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer;
    }
    .perm-page-body { background: #fff; }

    /* 权限细分行 */
    .perm-row {
      display: flex; align-items: flex-start;
      padding: 12px 16px; border-bottom: 1px dashed var(--border-light);
    }
    .perm-row:last-child { border-bottom: none; }
    .perm-row-label {
      width: 100px; flex-shrink: 0; font-size: 13px; font-weight: 600;
      color: var(--text-primary); padding-top: 2px; line-height: 1.4;
    }
    .perm-row-items {
      flex: 1; display: flex; flex-wrap: wrap; gap: 10px 20px;
    }
    .perm-cb-label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-primary); cursor: pointer;
      transition: color 0.15s; white-space: nowrap;
    }
    .perm-cb-label:hover { color: var(--primary); }
    .perm-cb-label input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer; }

    .perm-terminal-tabs {
      margin: -16px -20px 16px; padding: 0 20px; background: #fff;
    }
  </style>
</head>

<div class="layout">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb" id="breadcrumb">
          <span>首页</span><span class="sep">›</span><span>系统配置</span><span class="sep">›</span><span class="current">角色管理</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-info" style="display:flex;align-items:center;gap:8px;">
          <div class="user-avatar">管</div>
          <span style="font-size:13px;font-weight:500;">Admin</span>
        </div>
      </div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <div class="page-title"><div class="page-title-icon">🛡️</div>角色管理</div>
      </div>

      <!-- 搜索区域 -->
      <div class="search-card">
        <div class="search-grid-5">
          <div class="search-field">
            <label class="search-label">角色名称</label>
            <input class="search-input" placeholder="请输入角色名称">
          </div>
          <div class="search-field">
            <label class="search-label">角色代码</label>
            <input class="search-input" placeholder="请输入角色代码">
          </div>
          <div class="search-field">
            <label class="search-label">状态</label>
            <select class="search-select">
              <option value="">全部</option>
              <option value="1">启用</option>
              <option value="0">停用</option>
            </select>
          </div>
        </div>
        <div class="search-actions">
          <button class="btn btn-primary">🔍 查询</button>
          <button class="btn btn-default">↺ 重置</button>
        </div>
      </div>

      <!-- 表格区域 -->
      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-primary" onclick="openRoleModal('create')">＋ 新增角色</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>角色名称</th>
                <th>角色代码</th>
                <th>描述</th>
                <th>关联用户数</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>超级管理员</td>
                <td>SUPER_ADMIN</td>
                <td>系统全部权限，禁止删除</td>
                <td><a href="user-management.html" class="td-link">1</a></td>
                <td><span class="status-badge" style="background:#D1FAE5;color:#065F46;">启用</span></td>
                <td>
                  <button class="btn btn-default btn-xs" onclick="openPermissionModal()">权限配置</button>
                </td>
              </tr>
              <tr>
                <td>仓库操作员</td>
                <td>WH_OPERATOR</td>
                <td>仅限入仓/出仓/PDA/盘点等库内操作</td>
                <td><a href="user-management.html" class="td-link">5</a></td>
                <td><span class="status-badge" style="background:#D1FAE5;color:#065F46;">启用</span></td>
                <td>
                  <button class="btn btn-default btn-xs" onclick="openPermissionModal()">权限配置</button>
                  <button class="btn btn-default btn-xs" onclick="openRoleModal('edit')">编辑</button>
                  <button class="btn btn-default btn-xs" style="color:var(--danger);" onclick="showToast('已删除', 'success')">删除</button>
                </td>
              </tr>
              <tr>
                <td>财务专员</td>
                <td>FINANCE</td>
                <td>应收应付账单查看及审核结算</td>
                <td>-</td>
                <td><span class="status-badge" style="background:#F3F4F6;color:#475569;">停用</span></td>
                <td>
                  <button class="btn btn-default btn-xs" onclick="openPermissionModal()">权限配置</button>
                  <button class="btn btn-default btn-xs" onclick="openRoleModal('edit')">编辑</button>
                  <button class="btn btn-default btn-xs" style="color:var(--danger);" onclick="showToast('已删除', 'success')">删除</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" style="border-top: none; padding-top: 16px;">
          <div class="pagination-info">共 3 条</div>
          <div class="pagination-right">

    </div>

</div>

<!-- 角色新增/编辑弹窗 -->
<div id="modal-role" class="modal-overlay" onclick="closeModalOutside(event,'modal-role')">
  <div class="modal" style="width: 520px;">
    <div class="modal-header">
      <span class="modal-title" id="role-modal-title">新增角色</span>
      <button class="modal-close" onclick="closeModal('modal-role')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-field"><label class="form-label">角色名称 <span class="req">*</span></label><input type="text" class="form-input" placeholder="请输入角色名称"></div>
        <div class="form-field"><label class="form-label">角色代码 <span class="req">*</span></label><input type="text" class="form-input" placeholder="请输入角色代码"></div>
        <div class="form-field"><label class="form-label">状态</label>
          <select class="form-select"><option value="1">启用</option><option value="0">停用</option></select>
        </div>
        <!-- 空白占位保持网格规整 -->
        <div class="form-field"></div>
        <div class="form-field span-2"><label class="form-label">描述</label><textarea class="form-textarea" rows="3" placeholder="请输入"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('modal-role')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('modal-role'); showToast('保存成功')">确认</button>
    </div>
  </div>
</div>

<!-- 权限配置弹窗 -->
<div id="modal-permission" class="modal-overlay" onclick="closeModalOutside(event,'modal-permission')">
  <div class="modal" style="width: 960px; max-height: 85vh;">
    <div class="modal-header">
      <span class="modal-title">权限配置</span>
      <button class="modal-close" onclick="closeModal('modal-permission')">✕</button>
    </div>
    <div class="modal-body" style="padding: 16px 20px;">
      <div class="tabs perm-terminal-tabs" id="perm-terminal-tabs">
        <div class="tab active" data-terminal="admin" onclick="switchPermTerminal('admin')">员工端</div>
        <div class="tab" data-terminal="pda" onclick="switchPermTerminal('pda')">PDA端</div>
      </div>

      <!-- 数据范围控制 -->
      <div class="form-field" style="margin-bottom: 16px;">
        <label class="form-label">数据权限范围</label>
        <select class="form-select">
          <option>全部数据 (查看系统所有数据)</option>
          <option>本部门及下级部门数据</option>
          <option selected>本部门数据</option>
          <option>仅本人数据</option>
        </select>
      </div>

      <div class="form-label" style="margin-bottom: 8px;">细分权限配置</div>
      
      <!-- 左右分栏 -->
      <div class="perm-layout">
        
        <!-- 左侧模块列表 -->
        <div class="perm-sidebar" id="perm-sidebar"></div>

        <!-- 右侧卡片内容区 -->
        <div class="perm-content">
          <div class="perm-page-panels" id="perm-content-area"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('modal-permission')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('modal-permission'); showToast('权限已更新')">确认</button>
    </div>
  </div>
</div>

      {
        id: 'outbound-dispatch', label: '出库装车',
        pages: [{
          id: 'main', name: '出库装车',
          rows: [{ label: '按钮权限', items: [
            { text: '扫描装车', checked: false }, { text: '确认发车', checked: false },
            { text: '查看装车单', checked: false },
          ]}],
        }],
      },
      {
        id: 'self-pickup', label: '自提出库',
        pages: [{
          id: 'main', name: '自提出库',
          rows: [{ label: '按钮权限', items: [
            { text: '核验提货码', checked: false }, { text: '确认出库', checked: false },
            { text: '部分提货', checked: false },
          ]}],
        }],
      },
      {
        id: 'supervisor', label: '主管工作台',
        pages: [{
          id: 'main', name: '主管工作台',
          rows: [
            { label: '按钮权限', items: [
              { text: '任务分配', checked: false }, { text: '进度查看', checked: false },
              { text: '异常处理', checked: false }, { text: '数据导出', checked: false },
            ]},
            { label: '数据权限', items: [
              { text: '本班组数据', checked: false }, { text: '全仓数据', checked: false },
            ]},
          ],
        }],
      },
      {
        id: 'problem', label: '问题件处理',
        pages: [{
          id: 'main', name: '问题件处理',
          rows: [{ label: '按钮权限', items: [
            { text: '登记问题件', checked: false }, { text: '处理完成', checked: false },
            { text: '拍照上传', checked: false },
          ]}],
        }],
      },
      {
        id: 'measurement', label: '测量作业',
        pages: [{
          id: 'main', name: '测量作业',
          rows: [{ label: '按钮权限', items: [
            { text: '开始测量', checked: false }, { text: '提交数据', checked: false },
            { text: '重新测量', checked: false },
          ]}],
        }],
      },
    ],
  };

  const permTerminalState = {
    admin: { module: 'shipment', page: 'all', expanded: new Set(['shipment']) },
    pda: { module: 'inbound', page: 'main', expanded: new Set() },
  };

  let activePermTerminal = 'admin';
  let activePermModule = 'shipment';
  let activePermPage = 'all';
  let expandedModules = new Set(['shipment']);
  let permUiReady = false;

  function getCurrentTree() {
    return PERM_TREES[activePermTerminal];
  }

  function getPageKey(moduleId, pageId) {
    return `${activePermTerminal}:${moduleId}:${pageId}`;
  }

  function savePermNavigationState() {
    permTerminalState[activePermTerminal] = {
      module: activePermModule,
      page: activePermPage,
      expanded: new Set(expandedModules),
    };
  }

  function loadPermNavigationState(terminal) {
    const state = permTerminalState[terminal];
    activePermModule = state.module;
    activePermPage = state.page;
    expandedModules = new Set(state.expanded);
  }

  function syncPanelToTree(panel) {
    const moduleId = panel.dataset.module;
    const pageId = panel.dataset.page;
    const mod = getCurrentTree().find(m => m.id === moduleId);
    const page = mod?.pages.find(p => p.id === pageId);
    if (!page) return;
    const cbs = panel.querySelectorAll('.perm-item-cb');
    let i = 0;
    page.rows.forEach(row => {
      row.items.forEach(item => {
        if (cbs[i]) item.checked = cbs[i].checked;
        i++;
      });
    });
  }

  function saveAllPermCheckboxStates() {
    document.querySelectorAll('.perm-page-panel').forEach(syncPanelToTree);
    savePermNavigationState();
  }

  function openRoleModal(mode) {
    const title = document.getElementById('role-modal-title');
    if (title) title.textContent = mode === 'edit' ? '编辑角色' : '新增角色';
    showModal('modal-role');
  }

  function openPermissionModal() {
    if (!permUiReady) initPermUi();
    showModal('modal-permission');
    refreshPermUi();
  }

  function switchPermTerminal(terminal) {
    if (terminal === activePermTerminal) return;
    saveAllPermCheckboxStates();
    activePermTerminal = terminal;
    loadPermNavigationState(terminal);
    document.querySelectorAll('#perm-terminal-tabs .tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.terminal === terminal);
    });
    renderPermPanels();
    renderPermSidebar();
    refreshPermUi();
  }

  function initPermUi() {
    renderPermPanels();
    renderPermSidebar();
    document.querySelector('#modal-permission .perm-layout')?.addEventListener('change', onPermChange);
    permUiReady = true;
  }

  function renderPermSidebar() {
    const sidebar = document.getElementById('perm-sidebar');
    sidebar.innerHTML = getCurrentTree().map(mod => {
      if (mod.pages.length === 1) {
        const page = mod.pages[0];
        const active = activePermModule === mod.id && activePermPage === page.id;
        return `
          <div class="perm-tree-leaf${active ? ' active' : ''}"
               onclick="switchPermPage('${mod.id}', '${page.id}')">
            <span class="perm-tree-label">${mod.label}</span>
            <span class="perm-module-dot" data-module="${mod.id}"></span>
          </div>`;
      }
      const expanded = expandedModules.has(mod.id);
      return `
        <div class="perm-tree-group${expanded ? ' open' : ''}" data-module="${mod.id}">
          <div class="perm-tree-group-header" onclick="togglePermGroup('${mod.id}', event)">
            <span class="perm-tree-arrow">›</span>
            <span class="perm-tree-label">${mod.label}</span>
            <span class="perm-module-dot" data-module="${mod.id}"></span>
          </div>
          <div class="perm-tree-children">
            ${mod.pages.map(page => {
              const key = getPageKey(mod.id, page.id);
              const active = activePermModule === mod.id && activePermPage === page.id;
              return `
                <div class="perm-tree-page${active ? ' active' : ''}"
                     onclick="switchPermPage('${mod.id}', '${page.id}', event)">
                  <span>${page.name}</span>
                  <span class="perm-page-dot" data-page-key="${key}"></span>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
  }

  function renderPagePanel(mod, page) {
    const key = getPageKey(mod.id, page.id);
    const rowsHtml = page.rows.map(row => `
      <div class="perm-row">
        <div class="perm-row-label">${row.label}</div>
        <div class="perm-row-items">
          ${row.items.map(item => `
            <label class="perm-cb-label">
              <input type="checkbox" class="perm-item-cb"${item.checked ? ' checked' : ''}> ${item.text}
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');

    const active = activePermModule === mod.id && activePermPage === page.id;
    return `
      <div class="perm-page-panel${active ? ' active' : ''}"
           data-terminal="${activePermTerminal}" data-module="${mod.id}" data-page="${page.id}" data-page-key="${key}">
        <div class="perm-page-card">
          <div class="perm-page-header">
            <label>
              <input type="checkbox" class="page-check-all">
              ${page.name}
            </label>
          </div>
          <div class="perm-page-body">${rowsHtml}</div>
        </div>
      </div>
    `;
  }

  function renderPermPanels() {
    const area = document.getElementById('perm-content-area');
    area.innerHTML = getCurrentTree().flatMap(mod =>
      mod.pages.map(page => renderPagePanel(mod, page))
    ).join('');
  }

  function togglePermGroup(moduleId, event) {
    event.stopPropagation();
    if (expandedModules.has(moduleId)) {
      expandedModules.delete(moduleId);
    } else {
      expandedModules.add(moduleId);
    }
    savePermNavigationState();
    renderPermSidebar();
    refreshPermUi();
  }

  function switchPermPage(moduleId, pageId, event) {
    event?.stopPropagation();
    activePermModule = moduleId;
    activePermPage = pageId;
    expandedModules.add(moduleId);
    savePermNavigationState();

    document.querySelectorAll('.perm-tree-leaf, .perm-tree-page').forEach(item => {
      item.classList.remove('active');
    });
    document.querySelectorAll('.perm-page-panel').forEach(panel => {
      const active = panel.dataset.module === moduleId && panel.dataset.page === pageId;
      panel.classList.toggle('active', active);
    });

    renderPermSidebar();
    updateModuleDots();
    updatePageDots();
    document.getElementById('perm-content-area').scrollTop = 0;
    updatePagePanelState(moduleId, pageId);
  }

  function getPageCheckboxes(moduleId, pageId) {
    return Array.from(document.querySelectorAll(
      `.perm-page-panel[data-module="${moduleId}"][data-page="${pageId}"] .perm-item-cb`
    ));
  }

  function getModuleCheckboxes(moduleId) {
    return Array.from(document.querySelectorAll(
      `.perm-page-panel[data-module="${moduleId}"] .perm-item-cb`
    ));
  }

  function getPermState(cbs) {
    const checked = cbs.filter(cb => cb.checked).length;
    if (checked === 0) return 'none';
    if (checked === cbs.length) return 'full';
    return 'partial';
  }

  function updateModuleDots() {
    getCurrentTree().forEach(mod => {
      const dot = document.querySelector(`.perm-module-dot[data-module="${mod.id}"]`);
      if (!dot) return;
      const cbs = getModuleCheckboxes(mod.id);
      const state = getPermState(cbs);
      dot.className = 'perm-module-dot' + (state === 'none' ? '' : ` ${state}`);
      const checked = cbs.filter(cb => cb.checked).length;
      const labels = { none: '未配置任何权限', partial: '部分权限已配置', full: '权限已全部开启' };
      dot.title = `${labels[state]}（${checked}/${cbs.length} 项）`;
    });
  }

  function updatePageDots() {
    getCurrentTree().forEach(mod => {
      mod.pages.forEach(page => {
        const key = getPageKey(mod.id, page.id);
        const dot = document.querySelector(`.perm-page-dot[data-page-key="${key}"]`);
        if (!dot) return;
        const cbs = getPageCheckboxes(mod.id, page.id);
        const state = getPermState(cbs);
        dot.className = 'perm-page-dot' + (state === 'none' ? '' : ` ${state}`);
      });
    });
  }

  function updatePagePanelState(moduleId, pageId) {
    const panel = document.querySelector(
      `.perm-page-panel[data-module="${moduleId}"][data-page="${pageId}"]`
    );
    if (!panel) return;
    const cbs = Array.from(panel.querySelectorAll('.perm-item-cb'));
    const checkedCount = cbs.filter(cb => cb.checked).length;
    const allCb = panel.querySelector('.page-check-all');
    if (allCb) {
      allCb.checked = checkedCount === cbs.length && cbs.length > 0;
      allCb.indeterminate = checkedCount > 0 && checkedCount < cbs.length;
    }
  }

  function refreshPermUi() {
    getCurrentTree().forEach(mod => {
      mod.pages.forEach(page => updatePagePanelState(mod.id, page.id));
    });
    updateModuleDots();
    updatePageDots();
  }

  function onPermChange(e) {
    const target = e.target;
    let moduleId, pageId, panel;

    if (target.classList.contains('page-check-all')) {
      panel = target.closest('.perm-page-panel');
      if (!panel) return;
      moduleId = panel.dataset.module;
      pageId = panel.dataset.page;
      panel.querySelectorAll('.perm-item-cb').forEach(cb => { cb.checked = target.checked; });
      target.indeterminate = false;
    } else if (target.classList.contains('perm-item-cb')) {
      panel = target.closest('.perm-page-panel');
      if (!panel) return;
      moduleId = panel.dataset.module;
      pageId = panel.dataset.page;
      const allCb = panel.querySelector('.page-check-all');
      const cbs = Array.from(panel.querySelectorAll('.perm-item-cb'));
      const checkedCount = cbs.filter(cb => cb.checked).length;
      if (allCb) {
        allCb.checked = checkedCount === cbs.length && cbs.length > 0;
        allCb.indeterminate = checkedCount > 0 && checkedCount < cbs.length;
      }
    } else {
      return;
    }

    syncPanelToTree(panel);
    updatePagePanelState(moduleId, pageId);
    updateModuleDots();
    updatePageDots();
  }
</script>
</body>
</html>
