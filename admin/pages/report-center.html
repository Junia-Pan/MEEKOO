<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 报表中心</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.report-card-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px; }
.report-card {
  padding:18px; border:1px solid var(--border); border-radius:16px; background:var(--surface);
  box-shadow:0 10px 24px rgba(15,23,42,.04); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
}
.report-card:hover { transform: translateY(-2px); box-shadow:0 16px 28px rgba(15,23,42,.08); }
.report-card h3 { margin:0 0 8px; font-size:16px; }
.report-card p { margin:0; color:var(--text-secondary); font-size:13px; line-height:1.6; }
.report-card .go { margin-top:14px; color:var(--primary); font-size:13px; font-weight:600; }
@media (max-width: 1100px) { .report-card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 720px) { .report-card-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout"><nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar"><div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span class="current">报表中心</span></div></div><div class="topbar-right"><div class="topbar-icon-btn">🔍</div><div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div><div class="user-avatar">管</div></div></div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">📊</div>报表中心</div></div>
      <div class="report-card-grid">
        <div class="report-card" onclick="location.href='report-stock-statistics.html'"><h3>在库数据统计</h3><p>查看当前在库、待出库、留仓与问题件的统计概览。</p><div class="go">进入报表 →</div></div>
        <div class="report-card" onclick="location.href='report-destination-summary.html'"><h3>目的仓汇总</h3><p>按 FBA Code 汇总待发货件数、板数、重量等数据。</p><div class="go">进入报表 →</div></div>
        <div class="report-card" onclick="location.href='report-commercial-address-summary.html'"><h3>商业地址汇总</h3><p>按州/地址汇总待发货件数与装载信息。</p><div class="go">进入报表 →</div></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
