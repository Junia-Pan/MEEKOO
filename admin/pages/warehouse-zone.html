<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 仓库分区</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>配置</span><span class="sep">›</span><span class="current">仓库分区</span></div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header">
        <div class="page-title"><div class="page-title-icon">🧩</div>仓库分区</div>
      </div>
      <div class="search-card">
        <div class="search-grid-5">
          <div class="search-field"><label class="search-label">仓库代码</label><input class="search-input" placeholder="全部"></div>
          <div class="search-field"><label class="search-label">分区代码</label><input class="search-input" placeholder="请输入"></div>
        </div>
        <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
      </div>
      <div class="table-card">
        <div class="table-toolbar"><button class="btn btn-primary" onclick="openZoneModal('create')">＋ 添加</button></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>NO</th><th>仓库</th><th>分区代码</th><th>分区名称</th><th>英文名称</th><th>类型</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td>1</td><td>LA1150</td><td>A区</td><td>A区拣货区</td><td>Area A Picking</td><td>标准区</td><td><span style="color:#16A34A;background:#F0FDF4;padding:2px 6px;border-radius:4px;font-size:11px;">启用</span></td><td>创建:2026-05-01</td><td><div style="display:flex;gap:4px;"><button class="btn btn-default btn-xs" onclick="openZoneModal('edit')">编辑</button><button class="btn btn-default btn-xs" onclick="showZoneLog('A区')">日志</button></div></td></tr>
              <tr><td>2</td><td>TX15005</td><td>R</td><td>R-</td><td>R</td><td>标准区</td><td><span style="color:#16A34A;background:#F0FDF4;padding:2px 6px;border-radius:4px;font-size:11px;">启用</span></td><td>创建:2026-03-19</td><td><div style="display:flex;gap:4px;"><button class="btn btn-default btn-xs" onclick="openZoneModal('edit')">编辑</button><button class="btn btn-default btn-xs" onclick="showZoneLog('R')">日志</button></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: 新增/修改分区 -->
<div id="modal-zone" class="modal-overlay" onclick="closeModalOutside(event,'modal-zone')">
  <div class="modal" style="width: 640px;">
    <div class="modal-header">
      <span class="modal-title" id="zone-modal-title">新增分区</span>
      <button class="modal-close" onclick="closeModal('modal-zone')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-field"><label class="form-label">所属仓库 <span class="req">*</span></label><select class="form-select"><option>LA1150</option><option>TX15005</option></select></div>
        <div class="form-field"><label class="form-label">分区代码 <span class="req">*</span></label><input class="form-input" placeholder="例如：A区"></div>
        <div class="form-field"><label class="form-label">分区名称 <span class="req">*</span></label><input class="form-input" placeholder="请输入分区名称"></div>
        <div class="form-field"><label class="form-label">英文名称</label><input class="form-input" placeholder="请输入英文名称"></div>
        <div class="form-field"><label class="form-label">分区类型</label><select class="form-select"><option>标准区</option><option>虚拟区</option></select></div>
        <div class="form-field"><label class="form-label">状态</label><select class="form-select"><option>启用</option><option>停用</option></select></div>
        <div class="form-field" style="grid-column: span 2;"><label class="form-label">备注</label><textarea class="form-textarea" rows="2" placeholder="请输入其他说明信息"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('modal-zone')">取消</button>
      <button class="btn btn-primary" onclick="showToast('保存成功'); closeModal('modal-zone')">保存</button>
    </div>
  </div>
</div>

<!-- MODAL: 操作日志 -->
<div id="modal-zone-log" class="modal-overlay" onclick="closeModalOutside(event,'modal-zone-log')">
  <div class="modal modal-md">
    <div class="modal-header">
      <span class="modal-title" id="zone-log-title">操作日志</span>
      <button class="modal-close" onclick="closeModal('modal-zone-log')">✕</button>
    </div>
    <div class="modal-body" style="padding-top:16px;">
      <div class="timeline" id="zone-log-list">
        <div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-content"><div class="timeline-title">修改分区信息</div><div class="timeline-time">2026-05-02 14:30:00 · 李晓华</div></div></div>
        <div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-content"><div class="timeline-title">创建分区</div><div class="timeline-time">2026-05-01 10:00:00 · 张伟</div></div></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
  function openZoneModal(mode) {
    const title = document.getElementById('zone-modal-title');
    if (title) title.textContent = mode === 'edit' ? '修改分区' : '新增分区';
    showModal('modal-zone');
  }

  function showZoneLog(code) {
    const title = document.getElementById('zone-log-title');
    if (title) title.textContent = '操作日志 · ' + code;
    showModal('modal-zone-log');
  }
</script>
</body>
</html>
