<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 收款水单管理</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>应收管理</span><span class="sep">›</span><span class="current">收款水单管理</span></div></div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">💧</div>收款水单管理</div></div>
      <div class="search-card">
        <div class="search-grid-5">
          <div class="search-field"><label class="search-label">水单号</label><input class="search-input" placeholder="水单号"></div>
          <div class="search-field"><label class="search-label">交易流水号</label><input class="search-input" placeholder="交易流水号"></div>
          <div class="search-field"><label class="search-label">客户</label><input class="search-input" placeholder="客户名称"></div>
          <div class="search-field"><label class="search-label">状态</label><select class="search-select"><option>全部</option><option>已登记</option><option>已确认</option><option>已作废</option></select></div>
          <div class="search-field"><label class="search-label">到账日期</label><div class="date-range-c"><input type="date"><span class="sep">—</span><input type="date"></div></div>
        </div>
        <div class="search-actions"><button class="btn btn-primary">🔍 查询</button><button class="btn btn-default">↺ 重置</button></div>
      </div>
      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-primary" onclick="openArPaymentForm()">＋ 新增水单</button>
          <button class="btn btn-default">📤 导出</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>水单号</th><th>交易流水号</th><th>客户</th><th>金额</th><th>币种</th><th>到账时间</th><th>银行账号</th><th>附件</th><th>状态</th><th class="th-action">操作</th></tr></thead>
            <tbody id="ar-payment-tbody"></tbody>
          </table>
        </div>
        <div class="pagination"><div class="pagination-info" id="ar-payment-count">共 0 条</div><div class="pagination-right"><button class="page-btn active">1</button></div></div>
      </div>
    </div>
  </div>
</div>

<div id="modal-ar-payment" class="modal-overlay" onclick="closeModalOutside(event,'modal-ar-payment')">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title" id="ar-payment-form-title">新增水单</span><button class="modal-close" type="button" onclick="closeModal('modal-ar-payment')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-field span-2"><label class="form-label">交易流水号 <span class="req">*</span></label><input class="form-input" id="ar-pay-txn-no" type="text" placeholder="银行/支付平台交易流水号"></div>
        <div class="form-field"><label class="form-label">客户 <span class="req">*</span></label><select class="form-select" id="ar-pay-customer"><option value="">请选择</option><option>ABC Trading Co.</option><option>XYZ Imports</option></select></div>
        <div class="form-field"><label class="form-label">币种 <span class="req">*</span></label><select class="form-select" id="ar-pay-currency"><option>USD</option><option>CNY</option></select></div>
        <div class="form-field"><label class="form-label">金额 <span class="req">*</span></label><input class="form-input" id="ar-pay-amount" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="form-field"><label class="form-label">到账时间 <span class="req">*</span></label><input class="form-input" id="ar-pay-time" type="datetime-local"></div>
        <div class="form-field span-2"><label class="form-label">收款银行账号 <span class="req">*</span></label><select class="form-select" id="ar-pay-bank"><option value="">请选择</option><option>BOA-****5678</option><option>Chase-****1234</option></select></div>
        <div class="form-field span-2"><label class="form-label">上传水单附件 <span class="req">*</span></label><input class="form-input" id="ar-pay-file" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" type="button" onclick="closeModal('modal-ar-payment')">取消</button>
      <button class="btn btn-default" type="button" onclick="saveArPayment(false)">保存（已登记）</button>
      <button class="btn btn-primary" type="button" onclick="saveArPayment(true)">保存并确认入账</button>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
  let arPaymentSlips = [
    { id: 'PAY-2026-04-01', txnNo: 'TXN20260426001420', customer: 'ABC Trading Co.', amount: 3100, currency: 'USD', time: '2026-04-26 14:20', bank: 'BOA-****5678', fileName: 'receipt_0401.pdf', status: '已确认' },
    { id: 'PAY-2026-04-02', txnNo: 'TXN20260420113045', customer: 'XYZ Imports', amount: 540, currency: 'USD', time: '2026-04-20 11:30', bank: 'Chase-****1234', fileName: 'receipt_0402.pdf', status: '已确认' },
    { id: 'PAY-2026-04-05', txnNo: 'TXN20260428090012', customer: 'ABC Trading Co.', amount: 5000, currency: 'CNY', time: '2026-04-28 09:00', bank: 'BOA-****5678', fileName: 'receipt_0405.pdf', status: '已登记' },
  ];
  function statusBadge(status) {
    const map = {
      '已登记': 'background:#EFF6FF;color:#2563EB',
      '已确认': 'background:#F0FDF4;color:#16A34A',
      '已作废': 'background:#F3F4F6;color:#6B7280',
    };
    return '<span style="padding:2px 7px;border-radius:4px;font-size:11px;' + (map[status] || map['已登记']) + '">' + status + '</span>';
  }

  function renderArPaymentTable() {
    const tbody = document.getElementById('ar-payment-tbody');
    const countEl = document.getElementById('ar-payment-count');
    if (!tbody) return;
    tbody.innerHTML = arPaymentSlips.map(function (row) {
      let actions = '';
      if (row.status === '已登记') {
        actions = '<button class="btn btn-success btn-xs" type="button" onclick="confirmArPayment(\'' + row.id + '\')">确认入账</button> ' +
          '<button class="btn btn-default btn-xs text-danger" type="button" onclick="voidArPayment(\'' + row.id + '\')">作废</button>';
      } else if (row.status === '已确认') {
        actions = '<button class="btn btn-default btn-xs" type="button" onclick="viewArPayment(\'' + row.id + '\')">查看</button>';
      } else {
        actions = '<button class="btn btn-default btn-xs" type="button" onclick="viewArPayment(\'' + row.id + '\')">查看</button>';
      }
      const sym = row.currency === 'CNY' ? '¥' : '$';
      return '<tr><td><span class="td-link">' + row.id + '</span></td><td>' + (row.txnNo || '—') + '</td><td>' + row.customer + '</td><td style="font-weight:600;">' + sym + row.amount.toLocaleString(undefined, { minimumFractionDigits: 2 }) + '</td><td>' + row.currency + '</td><td>' + row.time + '</td><td>' + row.bank + '</td><td>' + (row.fileName || '—') + '</td><td>' + statusBadge(row.status) + '</td><td class="td-action">' + actions + '</td></tr>';
    }).join('');
    if (countEl) countEl.textContent = '共 ' + arPaymentSlips.length + ' 条';
  }

  function openArPaymentForm() {
    document.getElementById('ar-payment-form-title').textContent = '新增水单';
    document.getElementById('ar-pay-txn-no').value = '';
    document.getElementById('ar-pay-customer').value = '';
    document.getElementById('ar-pay-currency').value = 'USD';
    document.getElementById('ar-pay-amount').value = '';
    document.getElementById('ar-pay-time').value = '';
    document.getElementById('ar-pay-bank').value = '';
    document.getElementById('ar-pay-file').value = '';
    showModal('modal-ar-payment');
  }

  function validateArPaymentForm() {
    const txnNo = (document.getElementById('ar-pay-txn-no').value || '').trim();
    const customer = document.getElementById('ar-pay-customer').value;
    const amount = parseFloat(document.getElementById('ar-pay-amount').value);
    const time = document.getElementById('ar-pay-time').value;
    const bank = document.getElementById('ar-pay-bank').value;
    const file = document.getElementById('ar-pay-file').files[0];
    if (!txnNo) { showToast('请填写交易流水号', 'warning'); return null; }
    if (!customer) { showToast('请选择客户', 'warning'); return null; }
    if (!isFinite(amount) || amount <= 0) { showToast('请输入有效金额', 'warning'); return null; }
    if (!time) { showToast('请填写到账时间', 'warning'); return null; }
    if (!bank) { showToast('请选择收款银行账号', 'warning'); return null; }
    if (!file) { showToast('请上传水单附件', 'warning'); return null; }
    return {
      txnNo: txnNo,
      customer: customer,
      amount: amount,
      currency: document.getElementById('ar-pay-currency').value,
      time: time.replace('T', ' '),
      bank: bank,
      fileName: file.name,
    };
  }

  function saveArPayment(andConfirm) {
    const data = validateArPaymentForm();
    if (!data) return;
    arPaymentSlips.unshift({
      id: 'PAY-' + Date.now().toString().slice(-8),
      txnNo: data.txnNo,
      customer: data.customer,
      amount: data.amount,
      currency: data.currency,
      time: data.time,
      bank: data.bank,
      fileName: data.fileName,
      status: andConfirm ? '已确认' : '已登记',
    });
    closeModal('modal-ar-payment');
    renderArPaymentTable();
    showToast(andConfirm ? '已确认入账，客户余额已增加' : '已保存（已登记）', 'success');
  }

  function confirmArPayment(id) {
    const row = arPaymentSlips.find(function (r) { return r.id === id; });
    if (!row || row.status !== '已登记') return;
    row.status = '已确认';
    renderArPaymentTable();
    showToast('已确认入账，客户「' + row.customer + '」' + row.currency + ' 可核销余额 +' + row.amount, 'success');
  }

  function voidArPayment(id) {
    const row = arPaymentSlips.find(function (r) { return r.id === id; });
    if (!row || row.status !== '已登记') {
      showToast('仅已登记状态可作废；已确认入账不可作废', 'warning');
      return;
    }
    if (!confirm('确认作废该水单？')) return;
    row.status = '已作废';
    renderArPaymentTable();
    showToast('水单已作废', 'success');
  }

  function viewArPayment(id) {
    const row = arPaymentSlips.find(function (r) { return r.id === id; });
    if (!row) return;
    showToast(row.id + ' · ' + (row.txnNo || '—') + ' · ' + row.status + ' · ' + row.customer, 'info');
  }

  renderArPaymentTable();
</script>
</body>
</html>
