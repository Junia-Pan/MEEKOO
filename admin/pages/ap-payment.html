<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 付款凭证管理</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>应付管理</span><span class="sep">›</span><span class="current">付款凭证管理</span></div></div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">🧾</div>付款凭证管理</div></div>
      <div class="search-card">
        <div class="search-grid-5">
          <div class="search-field"><label class="search-label">凭证号</label><input class="search-input" placeholder="凭证号"></div>
          <div class="search-field"><label class="search-label">供应商</label><input class="search-input" placeholder="供应商名称"></div>
          <div class="search-field"><label class="search-label">关联应付账单</label><input class="search-input" placeholder="应付账单号"></div>
          <div class="search-field"><label class="search-label">付款日期</label><div class="date-range-c"><input type="date"><span class="sep">—</span><input type="date"></div></div>
        </div>
        <div class="search-actions"><button class="btn btn-primary">🔍 查询</button><button class="btn btn-default">↺ 重置</button></div>
      </div>
      <div class="table-card">
        <div class="table-toolbar">
          <button class="btn btn-primary" onclick="showModal('modal-ap-payment')">＋ 新增付款凭证</button>
          <button class="btn btn-default">📤 导出</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th style="width:36px"><input type="checkbox"></th><th>凭证号</th><th>供应商</th><th>付款金额($)</th><th>币种</th><th>付款日期</th><th>付款银行账号</th><th>关联应付账单</th><th>备注</th><th class="th-action">操作</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox"></td><td><span class="td-link">VOU-2026-04-01</span></td><td>速达运输</td><td style="font-weight:600;">220.00</td><td>USD</td><td>2026-04-24</td><td>BOA-****5678</td><td><span class="td-link">BILL-2604-01</span></td><td>4月卡派费用</td><td class="td-action"><button class="btn btn-default btn-xs">查看</button><button class="btn btn-default btn-xs text-danger">删除</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">VOU-2026-04-02</span></td><td>平安仓储</td><td style="font-weight:600;">50.00</td><td>USD</td><td>2026-04-25</td><td>BOA-****5678</td><td><span class="td-link">BILL-2604-02</span></td><td>4月仓储费(部分)</td><td class="td-action"><button class="btn btn-default btn-xs">查看</button><button class="btn btn-default btn-xs text-danger">删除</button></td></tr>
              <tr><td><input type="checkbox"></td><td><span class="td-link">VOU-2026-04-03</span></td><td>快马物流</td><td style="font-weight:600;">180.00</td><td>USD</td><td>2026-04-24</td><td>Chase-****1234</td><td><span class="td-link">BILL-2604-03</span></td><td>4月卡派费用</td><td class="td-action"><button class="btn btn-default btn-xs">查看</button><button class="btn btn-default btn-xs text-danger">删除</button></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination"><div class="pagination-info">共 3 条</div><div class="pagination-right"><button class="page-btn active">1</button></div></div>
      </div>
    </div>
  </div>
</div>

<div id="modal-ap-payment" class="modal-overlay" onclick="closeModalOutside(event,'modal-ap-payment')">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">新增付款凭证</span><button class="modal-close" onclick="closeModal('modal-ap-payment')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-field"><label class="form-label">供应商 <span class="req">*</span></label><select class="form-select"><option value="">请选择</option><option>速达运输</option><option>平安仓储</option><option>快马物流</option></select></div>
        <div class="form-field"><label class="form-label">付款金额($) <span class="req">*</span></label><input class="form-input" type="number" placeholder="0.00"></div>
        <div class="form-field"><label class="form-label">付款日期 <span class="req">*</span></label><input class="form-input" type="date"></div>
        <div class="form-field"><label class="form-label">付款银行账号</label><select class="form-select"><option>BOA-****5678</option><option>Chase-****1234</option></select></div>
        <div class="form-field span-2"><label class="form-label">关联应付账单</label><input class="form-input" placeholder="可填写多个，用逗号隔开"></div>
        <div class="form-field span-2"><label class="form-label">上传凭证 (水单)</label><input class="form-input" type="file"></div>
        <div class="form-field span-2"><label class="form-label">备注</label><textarea class="form-textarea" rows="2" placeholder="付款说明"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('modal-ap-payment')">取消</button>
      <button class="btn btn-primary" onclick="showToast('凭证已上传'); closeModal('modal-ap-payment')">确认</button>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
