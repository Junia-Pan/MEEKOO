<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 运营看板</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  .ops-block { margin-bottom: 18px; }
  .ops-block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .ops-block-head-main {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .ops-block-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .ops-block-actions {
    display: flex;
    align-items: center;
    margin-left: auto;
  }
  .ops-refresh-line {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .ops-refresh-btn {
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    line-height: inherit;
    cursor: pointer;
  }
  .ops-refresh-btn:hover {
    color: var(--primary);
    text-decoration: underline;
  }

  .ops-scene {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 860px) {
    .ops-scene { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .ops-scene { grid-template-columns: 1fr; }
  }
  .ops-scene-card {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    font-family: inherit;
  }
  .ops-scene-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .ops-scene-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    line-height: 1.15;
  }
  .ops-scene-desc {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .ops-sum-unit {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  .ops-delta {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ops-delta.up { color: #DC2626; }
  .ops-delta.down { color: #059669; }
  .ops-delta.flat { color: var(--text-muted); }

  .ops-range-seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 999px;
    background: #F1F5F9;
    gap: 2px;
  }
  .ops-range-chip {
    height: 30px;
    padding: 0 14px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .ops-range-chip:hover { color: var(--text-primary); }
  .ops-range-chip.is-on {
    background: #fff;
    color: var(--text-primary);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
  }
  .ops-trend-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .ops-trend-card {
    --ops-row-h: 44px;
    --ops-head-h: 40px;
    --ops-reserve-rows: 5;
    display: flex;
    flex-direction: column;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .ops-trend-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 16px 12px;
  }
  .ops-trend-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .ops-trend-sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .ops-chip-group {
    display: inline-flex;
    padding: 3px;
    border-radius: 9px;
    background: #F1F5F9;
  }
  .ops-chip {
    height: 30px;
    padding: 0 12px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .ops-chip:hover { color: var(--text-primary); }
  .ops-chip.is-on {
    background: var(--primary);
    color: #fff;
  }
  .ops-trend-body {
    flex: 0 0 auto;
    height: calc(var(--ops-head-h) + var(--ops-row-h) * var(--ops-reserve-rows) + var(--ops-row-h));
    border-top: 1px solid var(--border);
    overflow: auto;
  }
  .ops-trend-card .table-card {
    margin-bottom: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
  }
  .ops-trend-card .table-wrap {
    overflow: visible;
  }
  .ops-trend-card .data-table thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    height: var(--ops-head-h);
    box-sizing: border-box;
    background: #fff;
    box-shadow: inset 0 -1px 0 var(--border);
  }
  .ops-trend-card .data-table thead th.th-today {
    color: var(--text-primary);
    font-weight: 700;
  }
  .ops-trend-card .data-table tbody tr:not(.ops-pad-row):not(.total-row) td {
    height: var(--ops-row-h);
    box-sizing: border-box;
    vertical-align: middle;
  }
  .ops-trend-card .data-table tbody .total-row td {
    position: sticky;
    bottom: 0;
    z-index: 3;
    height: var(--ops-row-h);
    box-sizing: border-box;
    background: #F8FAFD;
    font-weight: 700;
    box-shadow: inset 0 1px 0 var(--border);
  }
  .ops-trend-card .data-table tbody .ops-pad-row td {
    padding: 0 !important;
    border: none !important;
    height: 0;
    line-height: 0;
    background: transparent;
  }
  .ops-trend-foot {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border-top: 1px solid var(--border);
    background: #F8FAFC;
  }
  .ops-dim-btn {
    height: 42px;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .ops-dim-btn:last-child { border-right: none; }
  .ops-dim-btn:hover {
    color: var(--text-primary);
    background: #F1F5F9;
  }
  .ops-dim-btn.is-on {
    background: var(--primary);
    color: #fff;
  }

  .other-name { color: var(--text-secondary); }
  .other-count {
    margin-left: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .data-table th, .data-table td { white-space: nowrap; }
  .ops-trend-card .data-table th {
    font-weight: 500;
    color: var(--text-muted);
    background: #fff;
  }
  .table-wrap { overflow-x: auto; }
  .num { text-align: left; font-variant-numeric: tabular-nums; }
  .td-zero { color: var(--text-muted); }
  .num-now { color: var(--text-primary); font-weight: 600; }
  .total-row { background: #F8FAFD; font-weight: 600; }
  .share-pct {
    color: var(--text-primary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .trend-cell { min-width: 108px; }
  .trend-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
  }
  .trend-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
  }
  .trend-bars span {
    flex: 1;
    min-width: 8px;
    border-radius: 2px 2px 0 0;
    background: #93C5FD;
  }
  .trend-bars span.is-now { background: #2563EB; }
  .trend-rel {
    min-width: 42px;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
  }
  .ops-th-tip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .ops-tip {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid #94A3B8;
    color: #64748B;
    font-size: 10px;
    font-weight: 700;
    font-style: normal;
    line-height: 1;
    cursor: help;
    flex: 0 0 auto;
    background: #fff;
  }
  .ops-tip:hover,
  .ops-tip:focus {
    color: var(--primary);
    border-color: var(--primary);
    outline: none;
  }
  .ops-tip-pop {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 20;
    width: 240px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.55;
    text-align: left;
    white-space: normal;
  }
  .ops-tip-pop::before {
    content: '';
    position: absolute;
    right: 8px;
    top: -5px;
    width: 8px;
    height: 8px;
    background: #fff;
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    transform: rotate(45deg);
  }
  .ops-tip:hover .ops-tip-pop,
  .ops-tip:focus .ops-tip-pop,
  .ops-tip:focus-within .ops-tip-pop {
    display: block;
  }
</style>
</head>

<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="breadcrumb">
        <span>首页</span><span class="sep">›</span>
        <span class="current">运营看板</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">🔍</div>
      <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
      <div class="user-avatar">管</div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <div class="page-title"><div class="page-title-icon">📈</div>运营看板</div>
    </div>

    <div class="ops-block">
      <div class="ops-block-head">
        <div class="ops-block-title">今日概览</div>
        <div class="ops-block-actions">
          <div class="ops-refresh-line">
            <span id="updatedAt">—</span>
            <span aria-hidden="true">·</span>
            <button type="button" class="ops-refresh-btn" id="btnRefresh">刷新</button>
          </div>
        </div>
      </div>
      <div class="ops-scene" id="kpiCards" aria-label="今日概览">
        <div class="ops-scene-card">
          <div class="ops-scene-title">预计到港</div>
          <div class="ops-scene-value"><span id="kpi-eta">—</span><span class="ops-sum-unit">柜</span></div>
          <div class="ops-scene-desc" id="kpi-eta-note">—</div>
        </div>
        <div class="ops-scene-card">
          <div class="ops-scene-title">实际到仓</div>
          <div class="ops-scene-value"><span id="kpi-arrival">—</span><span class="ops-sum-unit">柜</span></div>
          <div class="ops-scene-desc" id="kpi-arrival-note">—</div>
        </div>
        <div class="ops-scene-card">
          <div class="ops-scene-title">实际拆柜</div>
          <div class="ops-scene-value"><span id="kpi-unpack">—</span><span class="ops-sum-unit">柜</span></div>
          <div class="ops-scene-desc" id="kpi-unpack-note">—</div>
        </div>
        <div class="ops-scene-card">
          <div class="ops-scene-title">下单</div>
          <div class="ops-scene-value"><span id="kpi-order">—</span><span class="ops-sum-unit">柜</span></div>
          <div class="ops-scene-desc" id="kpi-order-note">—</div>
        </div>
      </div>
    </div>

    <div class="ops-block">
      <div class="ops-block-head">
        <div class="ops-block-head-main">
          <div class="ops-block-title">近期走势</div>
          <div class="ops-range-seg" id="rangeTabs" role="tablist" aria-label="时间范围">
            <button type="button" class="ops-range-chip is-on" data-range="1m">近1月</button>
            <button type="button" class="ops-range-chip" data-range="1w">近1周</button>
          </div>
        </div>
      </div>

      <div class="ops-trend-stack" id="trendStack"></div>
    </div>

  </div>
</div>
</div>

        return '小柱图：今天起共 7 天的数值走势（深蓝柱为今天）。\n百分比：其余 6 天日均，相对今天的涨跌。';
      }
      return '小柱图：本周及后 3 周的数值走势（深蓝柱为本周）。\n百分比：后 3 周周均，相对本周的涨跌。';
    }
    if (daily) {
      return '小柱图：今天往前共 7 天的数值走势（深蓝柱为今天）。\n百分比：今天相对昨天的涨跌（环比）。';
    }
    return '小柱图：本周及前 3 周的数值走势（深蓝柱为本周）。\n百分比：本周相对上周的涨跌（环比）。';
  }
  function trendHeadCell(label, tip) {
    return '<th class="num"><span class="ops-th-tip">' +
      '<span class="ops-tip" tabindex="0" aria-label="说明">' +
      'i<span class="ops-tip-pop">' + escapeHtml(tip).replace(/\n/g, '<br>') + '</span>' +
      '</span>' +
      '<span>' + escapeHtml(label) + '</span>' +
      '</span></th>';
  }

  function todayTotals(sceneId) {
    var map = DATA[sceneId].carrier;
    var total = 0;
    Object.keys(map).forEach(function (k) {
      var t = map[k] && map[k].today;
      total += Number(t && t.cntr) || 0;
    });
    return total;
  }
  function todayNote(sceneId, todayCntr) {
    var map = DATA[sceneId].carrier;
    var week = 0;
    Object.keys(map).forEach(function (k) {
      var w0 = map[k] && map[k].weeks && map[k].weeks[0];
      week += Number(w0 && w0.cntr) || 0;
    });
    var rel = relVsBase(todayCntr, week / 7);
    return '本周日均约 ' + Math.round(week / 7) + ' 柜 · 较日均 <span class="ops-delta ' + rel.cls + '">' + rel.text + '</span>';
  }

  function buildCardShell(scene) {
    var metricBtns = ['cntr', 'cbm', 'lbs'].map(function (m) {
      return '<button type="button" class="ops-chip" data-scene="' + scene.id + '" data-metric="' + m + '">' +
        METRICS[m].label + '</button>';
    }).join('');
    var dimBtns = ['carrier', 'customer', 'moveType'].map(function (d) {
      return '<button type="button" class="ops-dim-btn" data-scene="' + scene.id + '" data-dim="' + d + '">' +
        DIM_LABEL[d] + '</button>';
    }).join('');
    return '<article class="ops-trend-card" data-card="' + scene.id + '">' +
      '<div class="ops-trend-head">' +
        '<div><div class="ops-trend-title">' + scene.trendTitle + '</div>' +
        '<div class="ops-trend-sub" data-role="range"></div></div>' +
        '<div class="ops-chip-group" data-role="metrics" role="group" aria-label="统计指标">' + metricBtns + '</div>' +
      '</div>' +
      '<div class="ops-trend-body">' +
        '<div class="table-card"><div class="table-wrap">' +
          '<table class="data-table"><thead data-role="head"></thead><tbody data-role="body"></tbody></table>' +
        '</div></div>' +
      '</div>' +
      '<div class="ops-trend-foot" data-role="dims" role="tablist" aria-label="查看维度">' + dimBtns + '</div>' +
    '</article>';
  }

  function renderCard(scene, now) {
    var card = state.cards[scene.id];
    ensureCardMetric(card);
    var dim = card.dim;
    var metric = card.metric;
    var daily = isDailyRange();
    var periods = buildPeriods(scene, now);
    var count = periods.length;
    var map = DATA[scene.id][dim];
    var built = dim === 'moveType'
      ? buildRows(map, MOVE_TYPES, false, metric, count, daily)
      : buildRows(map, null, true, metric, count, daily);
    var rows = built.rows;
    var showShare = dim === 'carrier' || dim === 'customer';
    var showTrend = count > 1;
    var trendLabel = daily
      ? (scene.time === 'forward' ? '相对今天' : '环比')
      : scene.trendLabel;
    var max = 1;
    rows.forEach(function (r) {
      r.weeks.forEach(function (v) { if (v > max) max = v; });
    });
    var allow = allowedMetrics(dim);
    var root = document.querySelector('.ops-trend-card[data-card="' + scene.id + '"]');
    if (!root) return;
    root.querySelector('[data-role="range"]').textContent = rangeText(periods, scene);
    root.querySelectorAll('[data-role="metrics"] .ops-chip').forEach(function (chip) {
      var m = chip.getAttribute('data-metric');
      var ok = allow.indexOf(m) >= 0;
      chip.style.display = ok ? '' : 'none';
      chip.classList.toggle('is-on', ok && m === metric);
    });
    root.querySelectorAll('[data-role="dims"] .ops-dim-btn').forEach(function (btn) {
      btn.classList.toggle('is-on', btn.getAttribute('data-dim') === dim);
    });
    var head = '<tr><th>维度</th>';
    periods.forEach(function (p) {
      var label = p.label + '(' + p.short + ')';
      head += '<th class="num' + (p.isToday ? ' th-today' : '') + '">' + label + '</th>';
    });
    head += '<th class="num">' + scene.totalLabel + '</th>';
    if (showShare) head += '<th class="num">' + scene.shareLabel + '</th>';
    if (showTrend) head += trendHeadCell(trendLabel, trendTipText(scene, daily));
    head += '</tr>';
    root.querySelector('[data-role="head"]').innerHTML = head;

    var colWeeks = [];
    for (var i = 0; i < count; i++) colWeeks.push(0);
    var listTotal = 0, shareSum = 0;
    rows.forEach(function (r) {
      r.weeks.forEach(function (v, i) { colWeeks[i] += Number(v) || 0; });
      listTotal += r.all;
      shareSum += r.share || 0;
    });

    var totalRow = '<tr class="total-row"><td>合计</td>';
    totalRow += colWeeks.map(function (v, i) {
      return plainCell(v, !!(periods[i] && periods[i].isToday), metric);
    }).join('');
    totalRow += '<td class="num">' + fmtNum(listTotal, metric) + '</td>';
    if (showShare) totalRow += shareCell(shareSum);
    if (showTrend) totalRow += '<td class="num"></td>';
    totalRow += '</tr>';

    var colCount = 1 + periods.length + 1 + (showShare ? 1 : 0) + (showTrend ? 1 : 0);
    var bodyEl = root.querySelector('[data-role="body"]');
    if (!rows.length) {
      bodyEl.innerHTML = '<tr><td colspan="' + colCount +
        '" style="text-align:center;color:var(--text-muted);padding:28px;">暂无数据</td></tr>' +
        '<tr class="ops-pad-row" aria-hidden="true"><td colspan="' + colCount +
        '" style="height:220px"></td></tr>' + totalRow;
      return;
    }

    var body = rows.map(function (r) {
      var nameCell = r.isOther
        ? '<td><span class="other-name">其他</span><span class="other-count">' + r.otherCount + ' 个</span></td>'
        : '<td>' + escapeHtml(r.label) + '</td>';
      var cells = '<tr>' + nameCell;
      cells += r.weeks.map(function (v, i) {
        return numCell(v, !!(periods[i] && periods[i].isToday), metric);
      }).join('');
      cells += '<td class="num"><strong>' + fmtNum(r.all, metric) + '</strong></td>';
      if (showShare) cells += shareCell(r.share);
      if (showTrend) cells += trendCell(r, max, rowBadge(scene, r, daily), metric);
      return cells + '</tr>';
    }).join('');

    var reserveRows = 5;
    var padCount = Math.max(0, reserveRows - rows.length);
    var padHtml = padCount
      ? '<tr class="ops-pad-row" aria-hidden="true"><td colspan="' + colCount +
        '" style="height:' + (padCount * 44) + 'px"></td></tr>'
      : '';
    bodyEl.innerHTML = body + padHtml + totalRow;
  }

  function syncRangeUi() {
    document.querySelectorAll('#rangeTabs .ops-range-chip').forEach(function (chip) {
      chip.classList.toggle('is-on', chip.getAttribute('data-range') === state.range);
    });
  }

  function render() {
    var now = new Date();
    document.getElementById('updatedAt').textContent = '更新于 ' + fmtDateTime(now);
    syncRangeUi();

    ['eta', 'arrival', 'unpack', 'order'].forEach(function (id) {
      var today = todayTotals(id);
      document.getElementById('kpi-' + id).textContent = String(today);
      document.getElementById('kpi-' + id + '-note').innerHTML = todayNote(id, today);
    });

    SCENES.forEach(function (scene) {
      renderCard(scene, now);
    });
  }

  document.getElementById('trendStack').innerHTML = SCENES.map(buildCardShell).join('');

  document.getElementById('rangeTabs').addEventListener('click', function (e) {
    var chip = e.target.closest('.ops-range-chip[data-range]');
    if (!chip) return;
    state.range = chip.getAttribute('data-range') || '1m';
    render();
  });
  document.getElementById('trendStack').addEventListener('click', function (e) {
    var metricBtn = e.target.closest('button[data-metric][data-scene]');
    if (metricBtn) {
      var sid = metricBtn.getAttribute('data-scene');
      var card = state.cards[sid];
      if (!card || metricBtn.style.display === 'none') return;
      card.metric = metricBtn.getAttribute('data-metric') || 'cntr';
      render();
      return;
    }
    var dimBtn = e.target.closest('.ops-dim-btn[data-dim][data-scene]');
    if (!dimBtn) return;
    var sceneId = dimBtn.getAttribute('data-scene');
    var next = state.cards[sceneId];
    if (!next) return;
    next.dim = dimBtn.getAttribute('data-dim') || 'carrier';
    ensureCardMetric(next);
    render();
  });
  document.getElementById('btnRefresh').addEventListener('click', function () {
    render();
    if (typeof showToast === 'function') showToast('已刷新', 'success');
  });

  render();
})();
</script>
</body>
</html>
