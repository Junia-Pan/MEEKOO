<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 运营看板</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  /* 一级场景切换 */
  .ops-scene {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  @media (max-width: 720px) {
    .ops-scene { grid-template-columns: 1fr; }
  }
  .ops-scene-card {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px 14px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .ops-scene-card:hover {
    border-color: #93C5FD;
    background: #F8FBFF;
  }
  .ops-scene-card.is-on {
    border-color: var(--primary);
    background: linear-gradient(135deg, #EFF6FF 0%, #F8FBFF 100%);
    box-shadow: 0 0 0 1px rgba(21, 101, 192, .12), var(--shadow-sm);
  }
  .ops-scene-card.is-on::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--primary);
  }
  .ops-scene-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .ops-scene-card.is-on .ops-scene-title { color: var(--primary); }
  .ops-scene-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.45;
  }

  .ops-panel { display: none; }
  .ops-panel.is-on { display: block; }
  .ops-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .ops-meta-row .ops-section-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .ops-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 900px) {
    .ops-summary { grid-template-columns: 1fr; }
  }
  .ops-sum-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
  }
  .ops-sum-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .ops-sum-value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .ops-sum-unit {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  .ops-sum-note {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .ops-sum-card.is-focus {
    border-color: #93C5FD;
    background: linear-gradient(180deg, #F8FBFF 0%, var(--surface) 70%);
  }
  .ops-delta {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ops-delta.up { color: #DC2626; }
  .ops-delta.down { color: #059669; }
  .ops-delta.flat { color: var(--text-muted); }
  .ops-sum-delta { margin-top: 4px; font-size: 13px; }

  /* 内容区工具条：维度 + 指标 */
  .ops-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
  }
  .ops-toolbar-left,
  .ops-toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ops-chip-group {
    display: inline-flex;
    padding: 3px;
    border-radius: 9px;
    background: #F1F5F9;
  }
  .ops-chip {
    height: 30px;
    padding: 0 12px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .ops-chip:hover { color: var(--text-primary); }
  .ops-chip.is-on {
    background: #fff;
    color: var(--primary);
    box-shadow: 0 1px 2px rgba(15, 23, 42, .08);
  }
  .ops-metric-label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .ops-dim-filter {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .ops-dim-filter.is-on { display: flex; }
  .ops-dim-filter .search-input {
    width: 180px;
    height: 30px;
    border-radius: 8px;
  }

  .cell-stack {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    line-height: 1.2;
  }
  .cell-delta { font-size: 11px; font-weight: 600; }
  .cell-delta.up { color: #DC2626; }
  .cell-delta.down { color: #059669; }
  .cell-delta.flat { color: var(--text-muted); }
  .trend-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .trend-rel {
    min-width: 42px;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
  }
  .table-card {
    margin-bottom: 0;
    border-radius: 12px;
    overflow: hidden;
  }
  .data-table th, .data-table td { white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .th-week-now {
    background: #EFF6FF !important;
    color: #1D4ED8 !important;
  }
  .td-week-now { background: #F8FBFF; }
  .td-zero { color: var(--text-muted); }
  .td-link-num {
    color: var(--primary);
    cursor: pointer;
    font-weight: 600;
  }
  .td-link-num:hover { text-decoration: underline; }
  .total-row { background: #F8FAFD; font-weight: 600; }
  .trend-cell {
    min-width: 108px;
    padding-top: 10px !important;
    padding-bottom: 10px !important;
  }
  .trend-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 28px;
  }
  .trend-bars span {
    flex: 1;
    min-width: 8px;
    border-radius: 2px 2px 0 0;
    background: #93C5FD;
  }
  .trend-bars span.is-now { background: #2563EB; }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="breadcrumb">
        <span>首页</span><span class="sep">›</span>
        <span class="current">运营看板</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn">🔍</div>
      <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
      <div class="user-avatar">管</div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <div class="page-title"><div class="page-title-icon">📈</div>运营看板</div>
      <div class="page-header-actions">
        <button class="btn btn-default" type="button" id="btnRefresh">刷新</button>
      </div>
    </div>

    <!-- 一级场景 -->
    <div class="ops-scene" id="primaryTabs" role="tablist" aria-label="看板场景">
      <button type="button" class="ops-scene-card is-on" data-primary="eta" role="tab" aria-selected="true">
        <div class="ops-scene-title">预计到港</div>
        <div class="ops-scene-desc">按 ETA 看本周及后续货量，提前安排车辆</div>
      </button>
      <button type="button" class="ops-scene-card" data-primary="order" role="tab" aria-selected="false">
        <div class="ops-scene-title">下单情况</div>
        <div class="ops-scene-desc">看近期下单走势，对比环比与同比</div>
      </button>
    </div>

    <!-- 面板：预计到港 -->
    <section class="ops-panel is-on" id="panelEta" aria-label="预计到港">
      <div class="ops-meta-row">
        <div class="ops-section-sub" id="etaRangeLabel">—</div>
      </div>
      <div class="ops-summary" id="etaSummary">
        <div class="ops-sum-card is-focus">
          <div class="ops-sum-label">本周预计到港</div>
          <div><span class="ops-sum-value" id="etaSumThisWeek">—</span><span class="ops-sum-unit" data-unit>CBM</span></div>
          <div class="ops-sum-note" id="etaSumThisWeekNote">—</div>
        </div>
        <div class="ops-sum-card">
          <div class="ops-sum-label">接下来一个月</div>
          <div><span class="ops-sum-value" id="etaSumNext">—</span><span class="ops-sum-unit" data-unit>CBM</span></div>
          <div class="ops-sum-note" id="etaSumNextNote">—</div>
        </div>
        <div class="ops-sum-card">
          <div class="ops-sum-label">相对本周</div>
          <div class="ops-sum-delta" id="etaSumRel">—</div>
          <div class="ops-sum-note" id="etaSumRelNote">后四周周均对比本周</div>
        </div>
      </div>
      <div class="ops-toolbar">
        <div class="ops-toolbar-left">
          <div class="ops-chip-group" id="etaDimTabs" role="tablist" aria-label="查看维度">
            <button type="button" class="ops-chip is-on" data-dim="moveType">Move Type</button>
            <button type="button" class="ops-chip" data-dim="customer">客户</button>
          </div>
          <div class="ops-dim-filter" id="etaCustFilter">
            <input class="search-input" id="qEtaCustomer" placeholder="搜索客户">
          </div>
        </div>
        <div class="ops-toolbar-right">
          <span class="ops-metric-label">指标</span>
          <div class="ops-chip-group metric-seg" role="group" aria-label="统计指标">
            <button type="button" class="ops-chip is-on" data-metric="cbm">方数</button>
            <button type="button" class="ops-chip" data-metric="ctns">件数</button>
            <button type="button" class="ops-chip" data-metric="lbs">重量</button>
          </div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead id="etaHead"></thead>
            <tbody id="etaBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 面板：下单情况 -->
    <section class="ops-panel" id="panelOrder" aria-label="下单情况">
      <div class="ops-meta-row">
        <div class="ops-section-sub" id="orderRangeLabel">—</div>
      </div>
      <div class="ops-summary">
        <div class="ops-sum-card is-focus">
          <div class="ops-sum-label">本周下单</div>
          <div><span class="ops-sum-value" id="orderSumThisWeek">—</span><span class="ops-sum-unit" data-unit>CBM</span></div>
          <div class="ops-sum-note" id="orderSumThisWeekNote">—</div>
        </div>
        <div class="ops-sum-card">
          <div class="ops-sum-label">环比上周</div>
          <div class="ops-sum-delta" id="orderSumWow">—</div>
          <div class="ops-sum-note" id="orderSumWowNote">本周 vs 上周</div>
        </div>
        <div class="ops-sum-card">
          <div class="ops-sum-label">同比去年</div>
          <div class="ops-sum-delta" id="orderSumYoy">—</div>
          <div class="ops-sum-note" id="orderSumYoyNote">本周 vs 去年同周</div>
        </div>
      </div>
      <div class="ops-toolbar">
        <div class="ops-toolbar-left">
          <div class="ops-chip-group" id="orderDimTabs" role="tablist" aria-label="查看维度">
            <button type="button" class="ops-chip is-on" data-dim="moveType">Move Type</button>
            <button type="button" class="ops-chip" data-dim="customer">客户</button>
          </div>
          <div class="ops-dim-filter" id="orderCustFilter">
            <input class="search-input" id="qOrderCustomer" placeholder="搜索客户">
          </div>
        </div>
        <div class="ops-toolbar-right">
          <span class="ops-metric-label">指标</span>
          <div class="ops-chip-group metric-seg" role="group" aria-label="统计指标">
            <button type="button" class="ops-chip is-on" data-metric="cbm">方数</button>
            <button type="button" class="ops-chip" data-metric="ctns">件数</button>
            <button type="button" class="ops-chip" data-metric="lbs">重量</button>
          </div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead id="orderHead"></thead>
            <tbody id="orderBody"></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>
</div>
</div>
<script src="../js/common.js"></script>

  var state = {
    primary: 'eta',
    metric: 'cbm',
    etaDim: 'moveType',
    orderDim: 'moveType',
    etaKw: '',
    orderKw: ''
  };

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function fmtDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtDateTime(d) {
    return fmtDate(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function mondayOf(base) {
    var d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    var day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    return d;
  }
  function addDays(d, n) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }
  /** 预计到港：本周起向后 5 周 */
  function forwardWeeks(base) {
    var mon0 = mondayOf(base);
    var weeks = [];
    for (var i = 0; i < 5; i++) {
      var mon = addDays(mon0, i * 7);
      var sun = addDays(mon, 6);
      weeks.push({
        index: i,
        from: fmtDate(mon),
        to: fmtDate(sun),
        label: i === 0 ? '本周' : ('+' + i + '周'),
        short: (mon.getMonth() + 1) + '/' + mon.getDate() + '-' + (sun.getMonth() + 1) + '/' + sun.getDate()
      });
    }
    return weeks;
  }
  /** 下单：本周起向过去 5 周（0=本周, 1=上周…） */
  function pastWeeks(base) {
    var mon0 = mondayOf(base);
    var weeks = [];
    for (var i = 0; i < 5; i++) {
      var mon = addDays(mon0, -i * 7);
      var sun = addDays(mon, 6);
      var label = i === 0 ? '本周' : (i === 1 ? '上周' : ('前' + i + '周'));
      weeks.push({
        index: i,
        from: fmtDate(mon),
        to: fmtDate(sun),
        label: label,
        short: (mon.getMonth() + 1) + '/' + mon.getDate() + '-' + (sun.getMonth() + 1) + '/' + sun.getDate()
      });
    }
    return weeks;
  }

  function meta() { return METRICS[state.metric] || METRICS.cbm; }
  function fmtNum(n) {
    var m = meta();
    return Number(n || 0).toLocaleString('en-US', {
      minimumFractionDigits: m.decimals,
      maximumFractionDigits: m.decimals
    });
  }
  function zeroText() { return meta().decimals > 0 ? '0.00' : '0'; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }
  function sumArr(arr, from, to) {
    var s = 0;
    for (var i = from; i <= to; i++) s += Number(arr[i]) || 0;
    return s;
  }
  function relVsBase(value, base) {
    var v = Number(value) || 0;
    var b = Number(base) || 0;
    if (b <= 0 && v <= 0) return { cls: 'flat', text: '—' };
    if (b <= 0 && v > 0) return { cls: 'up', text: '新增' };
    var pct = ((v - b) / b) * 100;
    if (Math.abs(pct) < 0.5) return { cls: 'flat', text: '持平' };
    var abs = Math.abs(pct).toFixed(0);
    return pct > 0 ? { cls: 'up', text: '↑' + abs + '%' } : { cls: 'down', text: '↓' + abs + '%' };
  }
  function maxVal(rows, field) {
    var m = 0;
    rows.forEach(function (r) {
      (r[field] || r.weeks || []).forEach(function (v) {
        var n = typeof v === 'number' ? v : (v && v.cur);
        if (n > m) m = n;
      });
    });
    return m || 1;
  }
  function syncUnits() {
    var unit = meta().unit;
    document.querySelectorAll('[data-unit]').forEach(function (el) { el.textContent = unit; });
  }

  /* —— 预计到港 —— */
  function pickEtaWeeks(series) {
    var key = state.metric;
    return (series || []).map(function (w) { return Number(w[key]) || 0; });
  }
  function buildEtaRows(map, orderedKeys, kw, sortThisWeek) {
    var keys = orderedKeys || Object.keys(map);
    var rows = keys.map(function (name) {
      var weeks = pickEtaWeeks(map[name]);
      var thisWeek = weeks[0] || 0;
      var next4 = sumArr(weeks, 1, 4);
      return {
        key: name, label: name, weeks: weeks,
        thisWeek: thisWeek, next4: next4, avgNext: next4 / 4,
        all: sumArr(weeks, 0, 4), rel: relVsBase(next4 / 4, thisWeek)
      };
    });
    if (kw) {
      var q = kw.trim().toLowerCase();
      rows = rows.filter(function (r) { return String(r.label).toLowerCase().indexOf(q) >= 0; });
    }
    if (sortThisWeek) rows.sort(function (a, b) { return b.thisWeek - a.thisWeek; });
    return rows;
  }
  function etaCell(key, wi, n, base, isNow) {
    var num = Number(n) || 0;
    var cls = 'num' + (isNow ? ' td-week-now' : '');
    if (isNow) {
      if (num <= 0) return '<td class="' + cls + ' td-zero">' + zeroText() + '</td>';
      return '<td class="' + cls + '"><span class="td-link-num" data-panel="eta" data-key="' +
        escapeHtml(key) + '" data-wi="' + wi + '">' + fmtNum(num) + '</span></td>';
    }
    var rel = relVsBase(num, base);
    var main = num <= 0
      ? '<span class="td-zero">' + zeroText() + '</span>'
      : '<span class="td-link-num" data-panel="eta" data-key="' + escapeHtml(key) +
        '" data-wi="' + wi + '">' + fmtNum(num) + '</span>';
    return '<td class="' + cls + '"><span class="cell-stack">' + main +
      '<span class="cell-delta ' + rel.cls + '">' + rel.text + '</span></span></td>';
  }
  function etaTrend(row, max) {
    var unit = meta().unit;
    var bars = row.weeks.map(function (v, i) {
      var h = Math.max(2, Math.round((Number(v) || 0) / max * 28));
      var tip = i === 0 ? ('本周 ' + fmtNum(v) + ' ' + unit)
        : (fmtNum(v) + ' ' + unit + ' · 较本周 ' + relVsBase(v, row.thisWeek).text);
      return '<span class="' + (i === 0 ? 'is-now' : '') + '" style="height:' + h + 'px" title="' + tip + '"></span>';
    }).join('');
    return '<td class="trend-cell"><div class="trend-wrap"><div class="trend-bars">' + bars +
      '</div><span class="trend-rel ops-delta ' + row.rel.cls + '">' + row.rel.text + '</span></div></td>';
  }
  function renderEta() {
    var now = new Date();
    var weeks = forwardWeeks(now);
    var isCust = state.etaDim === 'customer';
    var map = isCust ? ETA_CUSTOMER : ETA_MOVE;
    var rows = isCust
      ? buildEtaRows(map, null, state.etaKw, true)
      : buildEtaRows(map, MOVE_TYPES, '', false);
    var max = maxVal(rows, 'weeks');
    var unit = meta().unit;

    document.getElementById('etaCustFilter').classList.toggle('is-on', isCust);
    document.getElementById('etaRangeLabel').textContent =
      weeks[0].from + ' ~ ' + weeks[4].to + ' · 更新于 ' + fmtDateTime(now);

    var thisWeekTotal = 0, next4Total = 0;
    Object.keys(map).forEach(function (k) {
      var w = pickEtaWeeks(map[k]);
      thisWeekTotal += w[0] || 0;
      next4Total += sumArr(w, 1, 4);
    });
    var avgNext = next4Total / 4;
    var rel = relVsBase(avgNext, thisWeekTotal);
    document.getElementById('etaSumThisWeek').textContent = fmtNum(thisWeekTotal);
    document.getElementById('etaSumNext').textContent = fmtNum(next4Total);
    document.getElementById('etaSumThisWeekNote').textContent = weeks[0].from + ' ~ ' + weeks[0].to;
    document.getElementById('etaSumNextNote').textContent =
      weeks[1].from + ' ~ ' + weeks[4].to + ' · 周均 ' + fmtNum(avgNext) + ' ' + unit;
    document.getElementById('etaSumRel').innerHTML =
      '<span class="ops-delta ' + rel.cls + '" style="font-size:22px;">' + rel.text + '</span>' +
      '<span style="margin-left:8px;font-size:13px;color:var(--text-secondary);">周均 ' +
      fmtNum(avgNext) + ' ' + unit + '</span>';
    document.getElementById('etaSumRelNote').textContent =
      '后四周周均 ' + fmtNum(avgNext) + '，对比本周 ' + fmtNum(thisWeekTotal);
    syncUnits();

    var firstCol = isCust ? '客户' : 'Move Type';
    var head = '<tr><th>' + firstCol + '</th>';
    weeks.forEach(function (w, i) {
      head += '<th class="num' + (i === 0 ? ' th-week-now' : '') + '">' +
        (i === 0 ? '本周预计到港' : w.label) +
        '<br><span style="font-weight:500;color:var(--text-muted)">' + w.short + '</span></th>';
    });
    head += '<th class="num">合计</th><th class="num">相对本周</th></tr>';
    document.getElementById('etaHead').innerHTML = head;

    if (!rows.length) {
      document.getElementById('etaBody').innerHTML =
        '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:28px;">暂无数据</td></tr>';
      window.__etaWeeks = weeks;
      return;
    }

    var body = rows.map(function (r) {
      return '<tr><td>' + escapeHtml(r.label) + '</td>' +
        r.weeks.map(function (v, i) { return etaCell(r.key, i, v, r.thisWeek, i === 0); }).join('') +
        '<td class="num"><strong>' + fmtNum(r.all) + '</strong></td>' + etaTrend(r, max) + '</tr>';
    }).join('');

    var colSums = [0, 0, 0, 0, 0], listTotal = 0;
    rows.forEach(function (r) {
      r.weeks.forEach(function (v, i) { colSums[i] += Number(v) || 0; });
      listTotal += r.all;
    });
    var totalRel = relVsBase(sumArr(colSums, 1, 4) / 4, colSums[0] || 0);
    var totalLabel = isCust && state.etaKw.trim() ? '合计（筛选）' : '合计';
    body += '<tr class="total-row"><td>' + totalLabel + '</td>' +
      colSums.map(function (v, i) {
        if (i === 0) return '<td class="num td-week-now">' + fmtNum(v) + '</td>';
        var r = relVsBase(v, colSums[0] || 0);
        return '<td class="num"><span class="cell-stack">' + fmtNum(v) +
          '<span class="cell-delta ' + r.cls + '">' + r.text + '</span></span></td>';
      }).join('') +
      '<td class="num">' + fmtNum(listTotal) + '</td>' +
      '<td class="num"><span class="ops-delta ' + totalRel.cls + '">' + totalRel.text + '</span></td></tr>';
    document.getElementById('etaBody').innerHTML = body;
    window.__etaWeeks = weeks;
  }

  /* —— 下单情况（趋势 + 同比） —— */
  function pickOrderWeeks(series) {
    var key = state.metric;
    return (series || []).map(function (w) {
      return {
        cur: Number(w.cur[key]) || 0,
        yoy: Number(w.yoy[key]) || 0
      };
    });
  }
  function buildOrderRows(map, orderedKeys, kw, sortThisWeek) {
    var keys = orderedKeys || Object.keys(map);
    var rows = keys.map(function (name) {
      var weeks = pickOrderWeeks(map[name]);
      var thisWeek = weeks[0] ? weeks[0].cur : 0;
      var lastWeek = weeks[1] ? weeks[1].cur : 0;
      var yoyBase = weeks[0] ? weeks[0].yoy : 0;
      var vals = weeks.map(function (w) { return w.cur; });
      return {
        key: name, label: name, weeks: weeks, vals: vals,
        thisWeek: thisWeek,
        wow: relVsBase(thisWeek, lastWeek),
        yoy: relVsBase(thisWeek, yoyBase),
        all: sumArr(vals, 0, 4)
      };
    });
    if (kw) {
      var q = kw.trim().toLowerCase();
      rows = rows.filter(function (r) { return String(r.label).toLowerCase().indexOf(q) >= 0; });
    }
    if (sortThisWeek) rows.sort(function (a, b) { return b.thisWeek - a.thisWeek; });
    return rows;
  }
  function orderCell(key, wi, cur, yoyVal, isNow) {
    var num = Number(cur) || 0;
    var cls = 'num' + (isNow ? ' td-week-now' : '');
    var yoyRel = relVsBase(cur, yoyVal);
    var main = num <= 0
      ? '<span class="td-zero">' + zeroText() + '</span>'
      : '<span class="td-link-num" data-panel="order" data-key="' + escapeHtml(key) +
        '" data-wi="' + wi + '">' + fmtNum(num) + '</span>';
    return '<td class="' + cls + '"><span class="cell-stack">' + main +
      '<span class="cell-delta ' + yoyRel.cls + '" title="同比">' + yoyRel.text + '</span></span></td>';
  }
  function orderTrend(row, max) {
    var unit = meta().unit;
    var bars = row.vals.map(function (v, i) {
      var h = Math.max(2, Math.round((Number(v) || 0) / max * 28));
      return '<span class="' + (i === 0 ? 'is-now' : '') + '" style="height:' + h + 'px" title="' +
        fmtNum(v) + ' ' + unit + '"></span>';
    }).join('');
    return '<td class="trend-cell"><div class="trend-wrap"><div class="trend-bars">' + bars +
      '</div><span class="trend-rel ops-delta ' + row.wow.cls + '" title="环比上周">' +
      row.wow.text + '</span></div></td>';
  }
  function renderOrder() {
    var now = new Date();
    var weeks = pastWeeks(now);
    var isCust = state.orderDim === 'customer';
    var map = isCust ? ORDER_CUSTOMER : ORDER_MOVE;
    var rows = isCust
      ? buildOrderRows(map, null, state.orderKw, true)
      : buildOrderRows(map, MOVE_TYPES, '', false);
    var max = 1;
    rows.forEach(function (r) {
      r.vals.forEach(function (v) { if (v > max) max = v; });
    });

    document.getElementById('orderCustFilter').classList.toggle('is-on', isCust);
    document.getElementById('orderRangeLabel').textContent =
      weeks[4].from + ' ~ ' + weeks[0].to + ' · 更新于 ' + fmtDateTime(now);

    var thisWeekTotal = 0, lastWeekTotal = 0, yoyTotal = 0;
    Object.keys(map).forEach(function (k) {
      var w = pickOrderWeeks(map[k]);
      thisWeekTotal += w[0] ? w[0].cur : 0;
      lastWeekTotal += w[1] ? w[1].cur : 0;
      yoyTotal += w[0] ? w[0].yoy : 0;
    });
    var wow = relVsBase(thisWeekTotal, lastWeekTotal);
    var yoy = relVsBase(thisWeekTotal, yoyTotal);
    var unit = meta().unit;

    document.getElementById('orderSumThisWeek').textContent = fmtNum(thisWeekTotal);
    document.getElementById('orderSumThisWeekNote').textContent = weeks[0].from + ' ~ ' + weeks[0].to;
    document.getElementById('orderSumWow').innerHTML =
      '<span class="ops-delta ' + wow.cls + '" style="font-size:22px;">' + wow.text + '</span>' +
      '<span style="margin-left:8px;font-size:13px;color:var(--text-secondary);">上周 ' +
      fmtNum(lastWeekTotal) + ' ' + unit + '</span>';
    document.getElementById('orderSumWowNote').textContent = '本周 ' + fmtNum(thisWeekTotal) + ' vs 上周 ' + fmtNum(lastWeekTotal);
    document.getElementById('orderSumYoy').innerHTML =
      '<span class="ops-delta ' + yoy.cls + '" style="font-size:22px;">' + yoy.text + '</span>' +
      '<span style="margin-left:8px;font-size:13px;color:var(--text-secondary);">去年同周 ' +
      fmtNum(yoyTotal) + ' ' + unit + '</span>';
    document.getElementById('orderSumYoyNote').textContent = '本周 vs 去年同周 ' + fmtNum(yoyTotal);
    syncUnits();

    var firstCol = isCust ? '客户' : 'Move Type';
    var head = '<tr><th>' + firstCol + '</th>';
    weeks.forEach(function (w, i) {
      head += '<th class="num' + (i === 0 ? ' th-week-now' : '') + '">' +
        (i === 0 ? '本周下单' : w.label) +
        '<br><span style="font-weight:500;color:var(--text-muted)">' + w.short + '</span>' +
        '<br><span style="font-weight:500;color:var(--text-muted);font-size:11px;">同比</span></th>';
    });
    head += '<th class="num">近5周合计</th><th class="num">环比</th><th class="num">同比</th></tr>';
    document.getElementById('orderHead').innerHTML = head;

    if (!rows.length) {
      document.getElementById('orderBody').innerHTML =
        '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:28px;">暂无数据</td></tr>';
      window.__orderWeeks = weeks;
      return;
    }

    var body = rows.map(function (r) {
      return '<tr><td>' + escapeHtml(r.label) + '</td>' +
        r.weeks.map(function (w, i) {
          return orderCell(r.key, i, w.cur, w.yoy, i === 0);
        }).join('') +
        '<td class="num"><strong>' + fmtNum(r.all) + '</strong></td>' +
        orderTrend(r, max) +
        '<td class="num"><span class="ops-delta ' + r.yoy.cls + '">' + r.yoy.text + '</span></td></tr>';
    }).join('');

    var colCur = [0, 0, 0, 0, 0], colYoy = [0, 0, 0, 0, 0], listTotal = 0;
    rows.forEach(function (r) {
      r.weeks.forEach(function (w, i) {
        colCur[i] += Number(w.cur) || 0;
        colYoy[i] += Number(w.yoy) || 0;
      });
      listTotal += r.all;
    });
    var totalWow = relVsBase(colCur[0], colCur[1]);
    var totalYoy = relVsBase(colCur[0], colYoy[0]);
    var totalLabel = isCust && state.orderKw.trim() ? '合计（筛选）' : '合计';
    body += '<tr class="total-row"><td>' + totalLabel + '</td>' +
      colCur.map(function (v, i) {
        var r = relVsBase(v, colYoy[i]);
        var cls = 'num' + (i === 0 ? ' td-week-now' : '');
        return '<td class="' + cls + '"><span class="cell-stack">' + fmtNum(v) +
          '<span class="cell-delta ' + r.cls + '">' + r.text + '</span></span></td>';
      }).join('') +
      '<td class="num">' + fmtNum(listTotal) + '</td>' +
      '<td class="num"><span class="ops-delta ' + totalWow.cls + '">' + totalWow.text + '</span></td>' +
      '<td class="num"><span class="ops-delta ' + totalYoy.cls + '">' + totalYoy.text + '</span></td></tr>';

    document.getElementById('orderBody').innerHTML = body;
    window.__orderWeeks = weeks;
  }

  function renderAll() {
    if (state.primary === 'eta') renderEta();
    else renderOrder();
  }

  function setPrimary(primary) {
    state.primary = primary === 'order' ? 'order' : 'eta';
    document.querySelectorAll('#primaryTabs .ops-scene-card').forEach(function (card) {
      var on = card.getAttribute('data-primary') === state.primary;
      card.classList.toggle('is-on', on);
      card.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.getElementById('panelEta').classList.toggle('is-on', state.primary === 'eta');
    document.getElementById('panelOrder').classList.toggle('is-on', state.primary === 'order');
    syncMetricChips();
    renderAll();
  }

  function syncMetricChips() {
    document.querySelectorAll('.metric-seg .ops-chip').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-metric') === state.metric);
    });
  }

  function bindDimTabs(id, getDim, setDim) {
    document.getElementById(id).addEventListener('click', function (e) {
      var chip = e.target.closest('.ops-chip[data-dim]');
      if (!chip) return;
      setDim(chip.getAttribute('data-dim') || 'moveType');
      document.querySelectorAll('#' + id + ' .ops-chip').forEach(function (t) {
        t.classList.toggle('is-on', t.getAttribute('data-dim') === getDim());
      });
      renderAll();
    });
  }

  document.getElementById('primaryTabs').addEventListener('click', function (e) {
    var card = e.target.closest('.ops-scene-card');
    if (!card) return;
    setPrimary(card.getAttribute('data-primary'));
  });
  document.querySelectorAll('.metric-seg').forEach(function (seg) {
    seg.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-metric]');
      if (!btn) return;
      state.metric = btn.getAttribute('data-metric') || 'cbm';
      syncMetricChips();
      renderAll();
    });
  });
  bindDimTabs('etaDimTabs', function () { return state.etaDim; }, function (d) { state.etaDim = d; });
  bindDimTabs('orderDimTabs', function () { return state.orderDim; }, function (d) { state.orderDim = d; });

  document.getElementById('qEtaCustomer').addEventListener('input', function () {
    state.etaKw = this.value || '';
    if (state.primary === 'eta' && state.etaDim === 'customer') renderEta();
  });
  document.getElementById('qOrderCustomer').addEventListener('input', function () {
    state.orderKw = this.value || '';
    if (state.primary === 'order' && state.orderDim === 'customer') renderOrder();
  });
  document.getElementById('btnRefresh').addEventListener('click', function () {
    renderAll();
    if (typeof showToast === 'function') showToast('已刷新', 'success');
  });
  document.getElementById('etaBody').addEventListener('click', function (e) {
    var el = e.target.closest('.td-link-num');
    if (!el) return;
    var weeks = window.__etaWeeks || forwardWeeks(new Date());
    var w = weeks[Number(el.getAttribute('data-wi')) || 0] || weeks[0];
    var q = new URLSearchParams({ etaFrom: w.from, etaTo: w.to });
    if (state.etaDim === 'customer') q.set('customer', el.getAttribute('data-key'));
    else q.set('moveType', el.getAttribute('data-key'));
    location.href = 'pickup-disassembly-schedule.html?' + q.toString();
  });
  document.getElementById('orderBody').addEventListener('click', function (e) {
    var el = e.target.closest('.td-link-num');
    if (!el) return;
    var weeks = window.__orderWeeks || pastWeeks(new Date());
    var w = weeks[Number(el.getAttribute('data-wi')) || 0] || weeks[0];
    var q = new URLSearchParams({ orderFrom: w.from, orderTo: w.to });
    if (state.orderDim === 'customer') q.set('customer', el.getAttribute('data-key'));
    else q.set('moveType', el.getAttribute('data-key'));
    location.href = 'pickup-disassembly-schedule.html?' + q.toString();
  });

  renderAll();
})();
</script>
</body>
</html>
