<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 邮件模板配置</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  .et-subject-cell {
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .et-cc-cell {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
    font-size: 12.5px;
  }
  .et-vars {
    font-size: 12px; color: var(--text-muted); line-height: 1.6;
    background: #F8FAFD; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; margin-top: 8px;
  }
  .et-vars-group { margin-bottom: 10px; }
  .et-vars-group:last-child { margin-bottom: 0; }
  .et-vars-group-title {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .et-vars-group-desc {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .et-vars code {
    display: inline-block; margin: 2px 4px 2px 0; padding: 1px 6px;
    background: #fff; border: 1px solid var(--border-light); border-radius: 4px;
    font-size: 11.5px; color: #475569; cursor: pointer;
  }
  .et-vars code:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: #EFF6FF;
  }
  .et-send-fields-cell {
    max-width: 180px;
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .et-preview-sub { font-size: 13px; margin-bottom: 10px; line-height: 1.5; }
  .et-preview-content {
    background: #F8FAFD;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    max-height: 360px;
    overflow-y: auto;
  }
  .et-preview-content p { margin: 0 0 0.6em; }
  .et-action-btns { display: flex; gap: 6px; flex-wrap: wrap; }

  .et-rte {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }
  .et-rte-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: #F8FAFD;
  }
  .et-rte-toolbar .et-rte-btn {
    min-width: 30px;
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text-primary);
    font-size: 12.5px;
    cursor: pointer;
    line-height: 1;
  }
  .et-rte-toolbar .et-rte-btn:hover { border-color: var(--primary); color: var(--primary); }
  .et-rte-toolbar .et-rte-btn.is-active {
    background: #EFF6FF;
    border-color: #93C5FD;
    color: var(--primary);
  }
  .et-rte-toolbar select.et-rte-select {
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
    padding: 0 6px;
    color: var(--text-primary);
  }
  .et-rte-toolbar .et-rte-sep {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 2px;
  }
  .et-rte-toolbar input[type="color"] {
    width: 28px;
    height: 28px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .et-rte-body {
    min-height: 220px;
    max-height: 360px;
    overflow-y: auto;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.65;
    outline: none;
    color: var(--text-primary);
  }
  .et-rte-body:empty:before {
    content: attr(data-placeholder);
    color: var(--text-muted);
    pointer-events: none;
  }
  .et-rte-body p { margin: 0 0 0.55em; }
  .et-rte-hint {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb" id="breadcrumb">
          <span>首页</span><span class="sep">›</span>
          <span>服务</span><span class="sep">›</span>
          <span>异常与服务支持</span><span class="sep">›</span>
          <span class="current">邮件模板配置</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header">
        <div class="page-title"><div class="page-title-icon">✉️</div>邮件模板配置</div>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>模板名称</th>
                <th>状态</th>
                <th>邮件标题</th>
                <th>抄送人</th>
                <th>发信字段</th>
                <th>更新人</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="et-table-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pagination-info" id="et-pagination-info">共 2 条</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div id="modal-et-edit" class="modal-overlay" onclick="closeModalOutside(event,'modal-et-edit')">
  <div class="modal" style="width: 820px; max-height: 92vh;">
    <div class="modal-header">
      <span class="modal-title" id="et-edit-modal-title">编辑模板</span>
      <button class="modal-close" type="button" onclick="etCloseEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field mb-12">
        <label class="form-label"><input type="checkbox" id="et-edit-enabled" checked> <span id="et-edit-enable-label">启用模板</span></label>
      </div>
      <div class="form-field mb-12">
        <label class="form-label">抄送人</label>
        <input class="form-input" id="et-edit-cc" type="text" placeholder="多个邮箱用分号或逗号分隔，如 a@x.com; b@y.com">
        <div class="et-rte-hint">选填；发信时默认带入抄送人，可在发信弹窗再改</div>
      </div>
      <div class="form-field mb-12">
        <label class="form-label">邮件标题</label>
        <input class="form-input" id="et-edit-subject" type="text">
      </div>
      <div class="form-field">
        <label class="form-label">邮件正文</label>
        <div class="et-rte" id="et-edit-rte">
          <div class="et-rte-toolbar" role="toolbar" aria-label="正文格式">
            <button type="button" class="et-rte-btn" data-cmd="bold" title="加粗"><b>B</b></button>
            <button type="button" class="et-rte-btn" data-cmd="italic" title="斜体"><i>I</i></button>
            <button type="button" class="et-rte-btn" data-cmd="underline" title="下划线"><u>U</u></button>
            <span class="et-rte-sep" aria-hidden="true"></span>
            <select class="et-rte-select" id="et-rte-font-size" title="字号">
              <option value="">字号</option>
              <option value="2">小</option>
              <option value="3">标准</option>
              <option value="4">中</option>
              <option value="5">大</option>
              <option value="6">更大</option>
            </select>
            <input type="color" id="et-rte-fore-color" value="#0F172A" title="文字颜色">
            <span class="et-rte-sep" aria-hidden="true"></span>
            <button type="button" class="et-rte-btn" data-cmd="justifyLeft" title="左对齐">左</button>
            <button type="button" class="et-rte-btn" data-cmd="justifyCenter" title="居中">中</button>
            <button type="button" class="et-rte-btn" data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
            <button type="button" class="et-rte-btn" data-cmd="removeFormat" title="清除格式">清除</button>
          </div>
          <div class="et-rte-body" id="et-edit-body" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="请输入邮件正文，可设置字体样式"></div>
        </div>
        <div class="et-vars" id="et-edit-vars"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" type="button" onclick="etCloseEditModal()">取消</button>
      <button class="btn btn-primary" type="button" onclick="etSaveCurrent()">保存</button>
    </div>
  </div>
</div>

<!-- 预览弹窗 -->
<div id="modal-et-preview" class="modal-overlay" onclick="closeModalOutside(event,'modal-et-preview')">
  <div class="modal" style="width: 560px; max-width: 95vw;">
    <div class="modal-header">
      <span class="modal-title" id="et-preview-modal-title">邮件预览</span>
      <button class="modal-close" type="button" onclick="closeModal('modal-et-preview')">✕</button>
    </div>
    <div class="modal-body" id="et-preview-body"></div>
    <div class="modal-footer">
      <button class="btn btn-default" type="button" onclick="closeModal('modal-et-preview')">关闭</button>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/loc-pw-email-templates.js"></script>
<script>
  var ET_TEMPLATES = [
    { id: 'inquiry', label: '询价模板', enableLabel: '启用询价模板' },
    { id: 'appointment', label: '预约模板', enableLabel: '启用预约模板' }
  ];

  var ET_PREVIEW_SAMPLE = {
    bol: 'BOL-2026-0411',
    ship: {
      shipmentId: 'SHP-2026-001',
      customer: 'Acme Trading',
      refNo: 'REF-88421',
      container: 'MSCU1234567',
      actPlts: 12,
      ctns: 480,
      address: '1234 Warehouse Blvd',
      city: 'Los Angeles',
      state: 'CA',
      zipCode: '90001',
      miles: 28,
      contact: 'John Smith',
      phone: '+1 626-555-0100',
      email: 'john@acme.com',
      destWarehouse: 'LAX1',
      dimensionWeight: '48×40×72 in / 850 lbs per pallet',
      apptRequirement: '需预约 · 需 POD'
    },
    extra: {
      destWarehouse: 'LAX1',
      apptSlot: '2026-07-01 09:00–12:00',
      vendors: 'Swift Logistics; Pacific Freight',
      pickupAddress: '1495 E Locust St. Ontario, CA 91761',
      deliveryInstruction: 'APPT; FCFS'
    }
  };

  var ET_VAR_GROUP_TITLES = {
    sendTime: '发信时需填写（模板含占位符时，发信弹窗会出现对应字段）',
    auto: '货件信息'
  };

  var etEditingId = null;
  var etEditDirty = false;
  var etEditSnapshot = null;
  var etRteBound = false;

  function etEsc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function etPlainToHtml(text) {
    if (typeof locPwEmailTplPlainToHtml === 'function') return locPwEmailTplPlainToHtml(text);
    var s = String(text == null ? '' : text);
    if (!s) return '';
    if (/<[a-z][\s\S]*>/i.test(s)) return s;
    return etEsc(s).replace(/\n/g, '<br>');
  }

  function etGetBodyHtml() {
    var ed = document.getElementById('et-edit-body');
    if (!ed) return '';
    return (ed.innerHTML || '').replace(/^(<br\s*\/?>|\s)+$/i, '');
  }

  function etSetBodyHtml(html) {
    var ed = document.getElementById('et-edit-body');
    if (!ed) return;
    ed.innerHTML = etPlainToHtml(html || '');
  }

  function etFormatTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function etRenderVarHints(type) {
    type = type || etEditingId || 'inquiry';
    var groups = (typeof locPwEmailTplGetVariableGroups === 'function')
      ? locPwEmailTplGetVariableGroups(type)
      : null;
    if (!groups) return '<div class="et-vars-group-desc">点击变量可插入到正文</div>';
    var html = '<div class="et-vars-group-desc">点击变量可插入到正文光标处</div>';
    ['sendTime', 'auto'].forEach(function (cat) {
      var items = groups[cat] || [];
      if (!items.length) return;
      html += '<div class="et-vars-group">' +
        '<div class="et-vars-group-title">' + ET_VAR_GROUP_TITLES[cat] + '</div>' +
        items.map(function (item) {
          return '<code role="button" tabindex="0" title="' + etEsc(item.desc || item.label) + '" onclick="etInsertVar(\'' + item.tag.replace(/'/g, "\\'") + '\')">' + etEsc(item.tag) + '</code>';
        }).join('') +
        '</div>';
    });
    return html;
  }

  function etInsertVar(tag) {
    var ed = document.getElementById('et-edit-body');
    if (!ed) return;
    ed.focus();
    try {
      if (!document.execCommand('insertText', false, tag)) {
        document.execCommand('insertHTML', false, etEsc(tag));
      }
    } catch (_) {
      ed.appendChild(document.createTextNode(tag));
    }
    etMarkDirty();
  }

  function etExecCmd(cmd, value) {
    var ed = document.getElementById('et-edit-body');
    if (!ed) return;
    ed.focus();
    try { document.execCommand(cmd, false, value); } catch (_) {}
    etSyncToolbarState();
    etMarkDirty();
  }

  function etSyncToolbarState() {
    document.querySelectorAll('#et-edit-rte .et-rte-btn[data-cmd]').forEach(function (btn) {
      var cmd = btn.getAttribute('data-cmd');
      var active = false;
      try { active = !!document.queryCommandState(cmd); } catch (_) {}
      btn.classList.toggle('is-active', active);
    });
  }

  function etBindRichEditor() {
    if (etRteBound) return;
    etRteBound = true;
    var root = document.getElementById('et-edit-rte');
    var ed = document.getElementById('et-edit-body');
    if (!root || !ed) return;

    root.querySelectorAll('.et-rte-btn[data-cmd]').forEach(function (btn) {
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
      btn.addEventListener('click', function () {
        etExecCmd(btn.getAttribute('data-cmd'));
      });
    });

    var sizeEl = document.getElementById('et-rte-font-size');
    if (sizeEl) {
      sizeEl.addEventListener('change', function () {
        if (!sizeEl.value) return;
        etExecCmd('fontSize', sizeEl.value);
        sizeEl.value = '';
      });
    }
    var colorEl = document.getElementById('et-rte-fore-color');
    if (colorEl) {
      colorEl.addEventListener('input', function () {
        etExecCmd('foreColor', colorEl.value);
      });
    }

    ed.addEventListener('input', etMarkDirty);
    ed.addEventListener('keyup', etSyncToolbarState);
    ed.addEventListener('mouseup', etSyncToolbarState);
    ed.addEventListener('focus', etSyncToolbarState);
  }

  function etStatusBadge(enabled) {
    if (enabled !== false) {
      return '<span class="status-badge" style="background:#D1FAE5;color:#065F46;">启用</span>';
    }
    return '<span class="status-badge" style="background:#F3F4F6;color:#6B7280;">停用</span>';
  }

  function etRenderTable() {
    var tbody = document.getElementById('et-table-body');
    if (!tbody) return;

    tbody.innerHTML = ET_TEMPLATES.map(function (meta) {
      var tpl = locPwEmailTplGet(meta.id);
      var updatedBy = tpl.updatedBy || '系统默认';
      var updatedAt = etFormatTime(tpl.updatedAt);
      var subject = tpl.subject || '—';
      var cc = String(tpl.cc || '').trim() || '—';
      var sendFields = (typeof locPwEmailTplGetSendTimeSummary === 'function')
        ? locPwEmailTplGetSendTimeSummary(meta.id)
        : '—';
      return '<tr>' +
        '<td style="font-weight:600;">' + meta.label + '</td>' +
        '<td>' + etStatusBadge(tpl.enabled) + '</td>' +
        '<td><div class="et-subject-cell" title="' + etEsc(subject) + '">' + etEsc(subject) + '</div></td>' +
        '<td><div class="et-cc-cell" title="' + etEsc(cc) + '">' + etEsc(cc) + '</div></td>' +
        '<td><div class="et-send-fields-cell" title="' + etEsc(sendFields) + '">' + etEsc(sendFields) + '</div></td>' +
        '<td>' + etEsc(updatedBy) + '</td>' +
        '<td>' + updatedAt + '</td>' +
        '<td><div class="et-action-btns">' +
          '<button class="btn btn-default btn-xs" type="button" onclick="etOpenEdit(\'' + meta.id + '\')">编辑</button>' +
          '<button class="btn btn-default btn-xs" type="button" onclick="etOpenPreview(\'' + meta.id + '\')">预览</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');

    var info = document.getElementById('et-pagination-info');
    if (info) info.textContent = '共 ' + ET_TEMPLATES.length + ' 条';
  }

  function etGetEditFormData() {
    return {
      enabled: document.getElementById('et-edit-enabled').checked,
      subject: document.getElementById('et-edit-subject').value,
      cc: document.getElementById('et-edit-cc').value,
      body: etGetBodyHtml()
    };
  }

  function etSnapshotForm(data) {
    return JSON.stringify(data || etGetEditFormData());
  }

  function etMarkDirty() {
    if (!etEditingId) return;
    etEditDirty = etSnapshotForm() !== etEditSnapshot;
  }

  function etBindEditInputs() {
    ['et-edit-enabled', 'et-edit-subject', 'et-edit-cc'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el._etBound) return;
      el._etBound = true;
      el.addEventListener('input', etMarkDirty);
      el.addEventListener('change', etMarkDirty);
    });
    etBindRichEditor();
  }

  function etOpenEdit(type) {
    var meta = ET_TEMPLATES.find(function (t) { return t.id === type; });
    if (!meta) return;

    etEditingId = type;
    var tpl = locPwEmailTplGet(type);

    document.getElementById('et-edit-modal-title').textContent = '编辑 · ' + meta.label;
    document.getElementById('et-edit-enable-label').textContent = meta.enableLabel;
    document.getElementById('et-edit-enabled').checked = tpl.enabled !== false;
    document.getElementById('et-edit-subject').value = tpl.subject || '';
    document.getElementById('et-edit-cc').value = tpl.cc || '';
    etSetBodyHtml(tpl.body || '');
    document.getElementById('et-edit-vars').innerHTML = etRenderVarHints(type);

    etEditSnapshot = etSnapshotForm({
      enabled: tpl.enabled !== false,
      subject: tpl.subject || '',
      cc: tpl.cc || '',
      body: etGetBodyHtml()
    });
    etEditDirty = false;
    etBindEditInputs();
    showModal('modal-et-edit');
  }

  function etCloseEditModal() {
    if (etEditDirty) {
      var close = function () {
        etEditingId = null;
        etEditDirty = false;
        etEditSnapshot = null;
        closeModal('modal-et-edit');
      };
      if (typeof openSharedConfirm === 'function') {
        openSharedConfirm('放弃修改', '当前模板有未保存的修改，确定关闭吗？').then(function (ok) {
          if (ok) close();
        });
        return;
      }
      if (window.confirm('当前模板有未保存的修改，确定关闭吗？')) close();
      return;
    }
    etEditingId = null;
    etEditSnapshot = null;
    closeModal('modal-et-edit');
  }

  function etSaveCurrent() {
    if (!etEditingId) return;
    var data = etGetEditFormData();
    var plain = String(data.body || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
    if (!String(data.subject || '').trim()) return showToast('请填写邮件标题', 'warning');
    if (!plain) return showToast('请填写邮件正文', 'warning');
    locPwEmailTplSave(etEditingId, data);
    etEditDirty = false;
    etEditSnapshot = etSnapshotForm(data);
    etEditingId = null;
    closeModal('modal-et-edit');
    etRenderTable();
    showToast('模板已保存', 'success');
  }

  function etBuildPreviewHtml(subject, cc, body) {
    return '<div class="et-preview-sub"><strong>抄送：</strong>' + etEsc(String(cc || '').trim() || '—') + '</div>' +
      '<div class="et-preview-sub"><strong>标题：</strong>' + etEsc(subject || '—') + '</div>' +
      '<div class="et-preview-content">' + (body || '—') + '</div>';
  }

  function etFillPreview(type, subject, body) {
    var vars = locPwEmailTplBuildVars(
      ET_PREVIEW_SAMPLE.bol,
      ET_PREVIEW_SAMPLE.ship,
      ET_PREVIEW_SAMPLE.extra
    );
    return {
      subject: locPwEmailTplFill(subject, vars),
      body: locPwEmailTplFill(body, vars)
    };
  }

  function etOpenPreview(type) {
    var meta = ET_TEMPLATES.find(function (t) { return t.id === type; });
    if (!meta) return;
    var tpl = locPwEmailTplGet(type);
    var filled = etFillPreview(type, tpl.subject, tpl.body);
    document.getElementById('et-preview-modal-title').textContent = '预览 · ' + meta.label;
    document.getElementById('et-preview-body').innerHTML = etBuildPreviewHtml(filled.subject, tpl.cc, filled.body);
    showModal('modal-et-preview');
  }

  etRenderTable();
</script>
</body>
</html>
