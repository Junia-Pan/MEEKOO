<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEEKOO 员工端 · FBA/WM Plan · Plan to ship</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .plan-shell { display:flex; flex-direction:column; gap:12px; }
    .head-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn-outline-danger{
      border:1px solid #f2c6c2;
      background:#fff7f7;
      color:#b42318;
    }
    .btn-outline-danger:hover{ background:#ffefef; }
    .btn-outline-primary{
      border:1px solid #bfdbfe;
      background:#eff6ff;
      color:#1d4ed8;
    }
    .btn-outline-primary:hover{ background:#dbeafe; }

    .split-wrap{
      display:grid;
      grid-template-rows: minmax(320px, 1fr) minmax(220px, .82fr);
      gap:12px;
      min-height: calc(100vh - 260px);
    }
    .panel{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow-sm);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .panel-head{
      padding:10px 14px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#f8fafd;
    }
    .panel-title{ font-size:13px; font-weight:600; color:var(--text-primary); }
    .panel-meta{ font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:10px; }
    .panel-body{ overflow:scroll; min-height:0; }

    table.plan-table{ width:100%; border-collapse:collapse; min-width:1380px; }
    .plan-table thead th{
      background:#f8fafd;
      color:var(--text-secondary);
      font-size:12px;
      font-weight:600;
      border-bottom:1px solid var(--border);
      padding:9px 10px;
      text-align:left;
      white-space:nowrap;
    }
    .plan-table tbody td{
      border-bottom:1px solid var(--border-light);
      padding:9px 10px;
      font-size:12px;
      white-space:nowrap;
      background:var(--surface);
    }
    .plan-table tbody tr:hover td{ background:#f9fbff; }
    .plan-table tbody tr.is-selected td{ background:#eaf3ff; }
    .plan-table tbody tr:last-child td{ border-bottom:none; }
    .row-index{ color:var(--text-muted); width:46px; }
    .fake-link{ color:var(--primary); cursor:pointer; font-weight:500; }
    .fake-link:hover{ text-decoration:underline; }
    .status-pill{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:2px 8px;
      font-size:11px;
      font-weight:600;
      line-height:1.3;
    }
    .st-新单{ color:#1d4ed8; background:#dbeafe; }
    .st-已完结{ color:#15803d; background:#dcfce7; }
    .st-备货计划{ color:#b45309; background:#fef3c7; }
    .st-已取消{ color:#6b7280; background:#e5e7eb; }

    .sub-actions{ display:flex; align-items:center; gap:8px; }
    .muted{ color:var(--text-muted); }
    .checkbox-cell{ width:38px; }
    .empty-holder{
      min-height:110px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text-muted);
      font-size:12px;
    }
    .loading-dot::after{
      content:"";
      display:inline-block;
      width:8px; height:8px;
      margin-left:6px;
      border-radius:50%;
      background:var(--primary);
      animation: pulse 1s infinite ease-in-out;
      vertical-align:middle;
    }
    @keyframes pulse{
      0%{ opacity:.25; transform:scale(.8); }
      50%{ opacity:1; transform:scale(1); }
      100%{ opacity:.25; transform:scale(.8); }
    }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar"></nav>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>出库管理</span><span class="sep">›</span><span class="current">FBA/WM Plan · Plan to ship</span></div></div>
      <div class="topbar-right"><div class="topbar-icon-btn">🔍</div><div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div><div class="user-avatar">管</div></div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">🚚</div>FBA/WM Plan · Plan to ship</div></div>
      <div class="plan-shell">
        <div class="search-card">
          <div class="search-grid">
            <div class="search-field">
              <label class="search-label">计划创建时间</label>
              <div class="date-range">
                <input type="date" id="fStart">
                <span class="sep">至</span>
                <input type="date" id="fEnd">
              </div>
            </div>
            <div class="search-field">
              <label class="search-label">库区</label>
              <select class="search-select" id="fArea">
                <option value="">全部</option>
                <option>1号仓</option><option>5号仓</option><option>18号仓</option>
              </select>
            </div>
            <div class="search-field">
              <label class="search-label">FBA Code</label>
              <input class="search-input" id="fCode" placeholder="输入 FBA code">
            </div>
            <div class="search-field">
              <label class="search-label">状态</label>
              <select class="search-select" id="fStatus">
                <option value="">全部</option>
                <option>新单</option><option>备货计划</option><option>已完结</option><option>已取消</option>
              </select>
            </div>
          </div>
          <div class="search-actions">
            <button class="btn btn-primary" id="btnSearch">查询</button>
            <button class="btn btn-default" id="btnReset">重置</button>
          </div>
        </div>

        <div class="split-wrap">
          <section class="panel">
            <div class="panel-head">
              <div class="panel-title">Plan 主单列表</div>
              <div class="panel-meta">
                <div class="head-actions">
                  <button class="btn btn-default btn-sm">↻</button>
                  <button class="btn btn-default btn-sm">To prepare</button>
                  <button class="btn btn-default btn-sm">+ Add</button>
                  <button class="btn btn-default btn-sm" id="btnEditPlan">Edit</button>
                  <button class="btn btn-outline-danger btn-sm" id="btnCancelPlan">Cancel plan</button>
                  <span class="muted" style="margin-left:6px;">自动加载明细</span>
                  <label class="muted"><input type="checkbox" id="autoLoad"> 开启</label>
                </div>
              </div>
            </div>
            <div class="panel-body">
              <table class="plan-table" id="mainTable">
                <thead>
                <tr>
                  <th>#</th><th>计划创建时间</th><th>计划单号</th><th>库区</th><th>FBACode</th><th>总方数</th><th>总重量</th><th>总托码板数</th>
                  <th>计划名称</th><th>货车单号</th><th>计划车型</th><th>状态</th><th>ISA</th><th>ISA时间</th>
                </tr>
                </thead>
                <tbody id="mainBody"></tbody>
              </table>
            </div>
            <div class="pagination">
              <div class="pagination-info" id="mainPagingInfo">共 0 条</div>
              <div class="pagination-right">
                每页
                <select class="page-size-select" id="mainPageSize"><option>10</option><option>20</option><option>50</option></select>
                条
                <button class="page-btn" id="mainPrev">‹ 上一页</button>
                <button class="page-btn" id="mainNext">下一页 ›</button>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div class="panel-title">主单明细（子单）</div>
              <div class="sub-actions">
                <span class="muted" id="subHint">请先选择上方主单</span>
                <button class="btn btn-default btn-sm" id="btnLoadSub">加载明细</button>
                <button class="btn btn-outline-danger btn-sm" id="btnRemoveItems">Remove item</button>
              </div>
            </div>
            <div class="panel-body" id="subPanelBody">
              <table class="plan-table" id="subTable">
                <thead>
                  <tr>
                    <th class="checkbox-cell"><input type="checkbox" id="subAll"></th>
                    <th>操作</th><th>货件状态</th><th>库区</th><th>FBACode</th><th>托运单号</th><th>客户单号</th><th>总板数</th>
                    <th>已装板数</th><th>ETA</th><th>LFD</th><th>运输方式</th><th>备注</th>
                  </tr>
                </thead>
                <tbody id="subBody"></tbody>
              </table>
              <div class="empty-holder" id="subEmpty">未加载明细</div>
            </div>
            <div class="pagination">
              <div class="pagination-info" id="subPagingInfo">共 0 条</div>
              <div class="pagination-right">
                每页
                <select class="page-size-select" id="subPageSize"><option>10</option><option>20</option><option>50</option></select>
                条
                <button class="page-btn" id="subPrev">‹ 上一页</button>
                <button class="page-btn" id="subNext">下一页 ›</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
<script>
  const mainMock = [
    {id:"PL20260412001", createAt:"2026-04-23", area:"5号仓", fba:"CDE5", cbm:10.03, weight:72, pallets:26, name:"2026-04-23 CDE5", truckNo:"-", truckType:"26' fb box truck", status:"新单", isa:"647346", isaDate:"2026-05-09"},
    {id:"PL20260420001", createAt:"2026-04-20", area:"18号仓", fba:"ONT8", cbm:52.72, weight:924.35, pallets:6, name:"2026-04-20 ONT8", truckNo:"-", truckType:"26' fb box truck", status:"新单", isa:"8390439022", isaDate:"2026-04-20"},
    {id:"PL20260418001", createAt:"2026-04-20", area:"-", fba:"ABE4", cbm:0, weight:0, pallets:25, name:"2026-03-29 ABE4", truckNo:"-", truckType:"26' fb box truck", status:"新单", isa:"-", isaDate:"2026-03-30"},
    {id:"PL20260417002", createAt:"2026-04-17", area:"-", fba:"ABE2", cbm:0, weight:0, pallets:25, name:"2026-04-17 ABE2", truckNo:"TC260417002", truckType:"26' fb box truck", status:"已完结", isa:"ISAQ26041701", isaDate:"2026-04-17"},
    {id:"PL20260413001", createAt:"2026-04-13", area:"-", fba:"ABE2", cbm:0, weight:0, pallets:26, name:"2026-04-13 ABE2 Q4131", truckNo:"-", truckType:"26' fb box truck", status:"新单", isa:"ISAQ26041301", isaDate:"2026-04-13"},
    {id:"PL20260329001", createAt:"2026-03-29", area:"5号仓", fba:"ABE4", cbm:30.32, weight:7578.98, pallets:9.48, name:"2026-03-29 ABE4", truckNo:"TC260129002", truckType:"奇迹计划", status:"备货计划", isa:"12312rr", isaDate:"2026-03-30"}
  ];
  const subMockDB = {
    PL20260412001: [{sid:"CDHU6913435", st:"新单", area:"10号仓", fba:"ONT8", waybill:"-", customerNo:"76667004", pallet:1, loaded:1, eta:"2022-10-02", lfd:"-", mode:"40HQ", remark:"离港"}, {sid:"FI260410101", st:"备货计划", area:"18号仓", fba:"ONT8", waybill:"-", customerNo:"FJ", pallet:1, loaded:1, eta:"-", lfd:"-", mode:"20GP", remark:"海运"}, {sid:"HLBU9700057", st:"已完结", area:"-", fba:"ONT8", waybill:"-", customerNo:"76616143", pallet:2, loaded:2, eta:"2023-08-28", lfd:"2023-09-02", mode:"40HR", remark:"自送"}],
    PL20260420001: [{sid:"MSDU5345176", st:"新单", area:"18号仓", fba:"ONT8", waybill:"-", customerNo:"76610980", pallet:2, loaded:2, eta:"-", lfd:"-", mode:"40HQ", remark:"自送"}],
    PL20260418001: [{sid:"ABCD112233", st:"备货计划", area:"5号仓", fba:"ABE4", waybill:"WB20260418", customerNo:"CUS111", pallet:6, loaded:2, eta:"2026-04-21", lfd:"2026-04-28", mode:"20GP", remark:"待预约"}],
    PL20260417002: [{sid:"XYYT908889", st:"已完结", area:"-", fba:"ABE2", waybill:"WB260417", customerNo:"CUS2099", pallet:12, loaded:12, eta:"2026-04-18", lfd:"2026-04-25", mode:"40HQ", remark:"已完成"}],
    PL20260413001: [{sid:"KYHU221100", st:"新单", area:"-", fba:"ABE2", waybill:"-", customerNo:"CUS0102", pallet:3, loaded:0, eta:"-", lfd:"-", mode:"20GP", remark:"新导入"}],
    PL20260329001: [{sid:"RRUU009931", st:"备货计划", area:"5号仓", fba:"ABE4", waybill:"WB260329", customerNo:"CUS7777", pallet:4, loaded:1, eta:"2026-03-31", lfd:"2026-04-04", mode:"40HQ", remark:"等待卡板"}]
  };

  const state = {
    mainRows: mainMock.slice(),
    mainFiltered: mainMock.slice(),
    mainPage: 1, mainPageSize: 10,
    subCache: {},
    subRows: [],
    subPage: 1, subPageSize: 10,
    selectedPlanId: "",
    loadingSub: false,
    autoLoad: false
  };
  let selectDebounce = null;

  function fmtNum(n){ return Number(n || 0).toString(); }
  function statusClass(s){ return "st-" + (s || "").replace(/\s+/g, ""); }
  function toast(msg, type){ showToast(msg, type || "info"); }

  function getMainSlice(){
    const start = (state.mainPage - 1) * state.mainPageSize;
    return state.mainFiltered.slice(start, start + state.mainPageSize);
  }
  function getSubSlice(){
    const start = (state.subPage - 1) * state.subPageSize;
    return state.subRows.slice(start, start + state.subPageSize);
  }

  function renderMain(){
    const body = document.getElementById("mainBody");
    const rows = getMainSlice();
    body.innerHTML = rows.map((r, idx)=>`
      <tr data-id="${r.id}" class="${state.selectedPlanId === r.id ? "is-selected" : ""}">
        <td class="row-index">${(state.mainPage - 1) * state.mainPageSize + idx + 1}</td>
        <td>${r.createAt}</td><td class="fake-link">${r.id}</td><td>${r.area}</td><td>${r.fba}</td><td>${fmtNum(r.cbm)}</td>
        <td>${fmtNum(r.weight)}</td><td>${fmtNum(r.pallets)}</td><td>${r.name}</td><td>${r.truckNo}</td><td>${r.truckType}</td>
        <td><span class="status-pill ${statusClass(r.status)}">${r.status}</span></td><td>${r.isa}</td><td>${r.isaDate}</td>
      </tr>`).join("");
    document.getElementById("mainPagingInfo").textContent = `共 ${state.mainFiltered.length} 条`;
    bindMainRowEvents();
  }

  function renderSub(){
    const tbody = document.getElementById("subBody");
    const empty = document.getElementById("subEmpty");
    const rows = getSubSlice();
    if (!rows.length){
      tbody.innerHTML = "";
      empty.style.display = "flex";
      empty.textContent = state.loadingSub ? "明细加载中..." : (state.selectedPlanId ? "该主单暂无明细" : "未加载明细");
    } else {
      empty.style.display = "none";
      tbody.innerHTML = rows.map((r)=>`
        <tr data-sid="${r.sid}">
          <td class="checkbox-cell"><input type="checkbox" class="sub-check"></td>
          <td><span class="fake-link">详情</span></td><td><span class="status-pill ${statusClass(r.st)}">${r.st}</span></td>
          <td>${r.area}</td><td>${r.fba}</td><td>${r.waybill}</td><td>${r.customerNo}</td><td>${r.pallet}</td>
          <td>${r.loaded}</td><td>${r.eta}</td><td>${r.lfd}</td><td>${r.mode}</td><td>${r.remark}</td>
        </tr>`).join("");
    }
    document.getElementById("subPagingInfo").textContent = `共 ${state.subRows.length} 条`;
    document.getElementById("subHint").textContent = state.loadingSub ? "正在加载中" : (state.selectedPlanId ? `当前主单：${state.selectedPlanId}` : "请先选择上方主单");
    document.getElementById("subHint").classList.toggle("loading-dot", state.loadingSub);
    document.getElementById("subAll").checked = false;
  }

  function bindMainRowEvents(){
    document.querySelectorAll("#mainBody tr").forEach(tr=>{
      tr.addEventListener("click", ()=>{
        const id = tr.getAttribute("data-id");
        state.selectedPlanId = id;
        renderMain();
        state.subRows = [];
        state.subPage = 1;
        renderSub();
        if (selectDebounce) clearTimeout(selectDebounce);
        if (state.autoLoad){
          selectDebounce = setTimeout(()=> loadSubRows(id), 260);
        }
      });
    });
  }

  function applySearch(){
    const start = document.getElementById("fStart").value;
    const end = document.getElementById("fEnd").value;
    const area = document.getElementById("fArea").value.trim();
    const code = document.getElementById("fCode").value.trim().toUpperCase();
    const status = document.getElementById("fStatus").value.trim();
    state.mainFiltered = state.mainRows.filter(r=>{
      const okArea = !area || r.area === area;
      const okCode = !code || String(r.fba || "").toUpperCase().includes(code);
      const okStatus = !status || r.status === status;
      const okStart = !start || r.createAt >= start;
      const okEnd = !end || r.createAt <= end;
      return okArea && okCode && okStatus && okStart && okEnd;
    });
    state.mainPage = 1;
    renderMain();
  }

  function loadSubRows(planId){
    if (!planId){ toast("请先选择主单", "warning"); return; }
    if (state.subCache[planId]){
      state.subRows = state.subCache[planId].map(i=>({ ...i }));
      state.subPage = 1;
      renderSub();
      return;
    }
    state.loadingSub = true;
    renderSub();
    setTimeout(()=>{
      const src = (subMockDB[planId] || []).map(i=>({ ...i }));
      state.subCache[planId] = src;
      state.subRows = src.map(i=>({ ...i }));
      state.subPage = 1;
      state.loadingSub = false;
      renderSub();
    }, 420);
  }

  function removeSelectedSub(){
    if (!state.selectedPlanId){ toast("请先选择主单", "warning"); return; }
    const checks = [...document.querySelectorAll("#subBody .sub-check:checked")];
    if (!checks.length){ toast("请先勾选下方子单", "warning"); return; }
    const ids = checks.map(c=>c.closest("tr").getAttribute("data-sid"));
    state.subRows = state.subRows.filter(r=>!ids.includes(r.sid));
    state.subCache[state.selectedPlanId] = state.subRows.map(i=>({ ...i }));
    renderSub();
    toast(`已移除 ${ids.length} 条子单`, "success");
  }

  function cancelPlan(){
    if (!state.selectedPlanId){ toast("请先选择主单", "warning"); return; }
    const row = state.mainRows.find(i=>i.id === state.selectedPlanId);
    if (!row){ return; }
    row.status = "已取消";
    applySearch();
    toast("计划已取消（静态演示）", "success");
  }

  function initPage(){
    renderMain();
    renderSub();

    document.getElementById("btnSearch").addEventListener("click", applySearch);
    document.getElementById("btnReset").addEventListener("click", ()=>{
      ["fStart","fEnd","fArea","fCode","fStatus"].forEach(id=>document.getElementById(id).value = "");
      state.mainFiltered = state.mainRows.slice();
      state.mainPage = 1;
      renderMain();
    });
    document.getElementById("mainPageSize").addEventListener("change", e=>{ state.mainPageSize = Number(e.target.value); state.mainPage = 1; renderMain(); });
    document.getElementById("subPageSize").addEventListener("change", e=>{ state.subPageSize = Number(e.target.value); state.subPage = 1; renderSub(); });
    document.getElementById("mainPrev").addEventListener("click", ()=>{ if (state.mainPage > 1){ state.mainPage--; renderMain(); } });
    document.getElementById("mainNext").addEventListener("click", ()=>{ const max = Math.max(1, Math.ceil(state.mainFiltered.length / state.mainPageSize)); if (state.mainPage < max){ state.mainPage++; renderMain(); } });
    document.getElementById("subPrev").addEventListener("click", ()=>{ if (state.subPage > 1){ state.subPage--; renderSub(); } });
    document.getElementById("subNext").addEventListener("click", ()=>{ const max = Math.max(1, Math.ceil(state.subRows.length / state.subPageSize)); if (state.subPage < max){ state.subPage++; renderSub(); } });
    document.getElementById("btnLoadSub").addEventListener("click", ()=> loadSubRows(state.selectedPlanId));
    document.getElementById("btnRemoveItems").addEventListener("click", removeSelectedSub);
    document.getElementById("btnCancelPlan").addEventListener("click", cancelPlan);
    document.getElementById("btnEditPlan").addEventListener("click", ()=> toast("Edit 功能已预留，下一步接入", "info"));
    document.getElementById("autoLoad").addEventListener("change", e=>{ state.autoLoad = e.target.checked; });
    document.getElementById("subAll").addEventListener("change", e=>{
      document.querySelectorAll("#subBody .sub-check").forEach(i=> i.checked = e.target.checked);
    });
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", initPage);
  } else {
    initPage();
  }
</script>
</body>
</html>
