<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 基础数据</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.base-data-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.base-data-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 10px 24px rgba(15,23,42,.04);
  transition: transform .15s ease, box-shadow .15s ease;
  cursor: pointer;
}
.base-data-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 28px rgba(15,23,42,.08);
}
.base-data-card h3 { margin: 0; font-size: 16px; }
.base-data-card p { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.base-data-card .go { margin-top: auto; color: var(--primary); font-size: 13px; font-weight: 600; }
@media (max-width: 1100px) { .base-data-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .base-data-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span class="current">基础数据</span></div></div>
      <div class="topbar-right"><div class="topbar-icon-btn">🔍</div><div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div><div class="user-avatar">管</div></div>
    </div>
    <div class="page-content">
      <div class="page-header"><div class="page-title"><div class="page-title-icon">🗂️</div>基础数据</div></div>
      <div class="base-data-grid">
        <div class="base-data-card" onclick="location.href='customer-management.html'"><h3>客户管理</h3><p>客户档案、代码、联系人、状态等基础信息维护。</p><div class="go">进入页面 →</div></div>
        <div class="base-data-card" onclick="location.href='supplier-management.html'"><h3>供应商管理</h3><p>卡派公司、船司等供应商信息独立管理。</p><div class="go">进入页面 →</div></div>
        <div class="base-data-card" onclick="location.href='carrier-config.html'"><h3>船司配置</h3><p>维护船司名称、代码、联系方式与启用状态。</p><div class="go">进入页面 →</div></div>
        <div class="base-data-card" onclick="location.href='delivery-warehouse-config.html'"><h3>派送仓库配置</h3><p>维护派送仓库、FBA Code、地址与州信息。</p><div class="go">进入页面 →</div></div>
        <div class="base-data-card" onclick="location.href='account-subjects.html'"><h3>财务科目</h3><p>应收、应付及业务科目基础配置。</p><div class="go">进入页面 →</div></div>
        <div class="base-data-card" onclick="location.href='bank-accounts.html'"><h3>银行账号</h3><p>收付款银行账户及币种信息独立配置。</p><div class="go">进入页面 →</div></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
