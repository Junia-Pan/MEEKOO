<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 银行账号</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>基础数据</span><span class="sep">›</span><span class="current">银行账号</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">🏦</div>银行账号</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">账号名称</label><input class="search-input" placeholder="请输入账号名称"></div>
        <div class="search-field"><label class="search-label">银行</label><input class="search-input" placeholder="请输入银行名称"></div>
        <div class="search-field"><label class="search-label">币种</label><select class="search-select"><option>全部</option><option>USD</option><option>CNY</option><option>HKD</option></select></div>
        <div class="search-field"><label class="search-label">状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card"><div class="table-toolbar"><button class="btn btn-primary">＋ 新增账号</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>账号名称</th><th>银行</th><th>账号</th><th>币种</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody><tr><td>BOA 主账号</td><td>Bank of America</td><td>****5678</td><td>USD</td><td>启用</td><td>收款账号</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr><tr><td>Chase 收款账号</td><td>Chase Bank</td><td>****9012</td><td>USD</td><td>启用</td><td>备用账号</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr></tbody></table></div></div>
  </div>
</div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
