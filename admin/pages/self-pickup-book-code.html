<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提货预约</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  .sp-book-standalone {
    margin: 0;
    min-height: 100vh;
    background: #e8ecf1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .sp-book-standalone .sp-book-page {
    max-width: 480px;
    margin: 0 auto;
    padding: 22px 16px 36px;
    box-sizing: border-box;
  }
  .sp-book-top {
    text-align: center;
    padding: 4px 0 14px;
    margin-bottom: 4px;
  }
  .sp-book-brand {
    font-size: 20px;
    font-weight: 600;
    color: #334155;
    letter-spacing: 0.03em;
  }
  .sp-book-sub {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 400;
    color: #64748b;
  }
  .sp-book-card {
    background: #fff;
    border: 1px solid #dce3ec;
    border-radius: 12px;
    padding: 16px 18px 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .sp-book-code-actions { margin-top: 14px; }
  .sp-book-query-ta {
    min-height: 96px;
    resize: vertical;
    font-size: 14px;
    line-height: 1.5;
  }
  .sp-book-query-preview {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 12px;
    color: #475569;
    line-height: 1.5;
    display: none;
  }
  .sp-book-query-preview.is-visible { display: block; }
  .sp-book-query-preview strong { color: #1e293b; }
  .sp-book-zt-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sp-book-zt-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
  }
  .sp-book-zt-item:hover { border-color: #93c5fd; }
  .sp-book-zt-item input { margin-top: 3px; }
  .sp-book-zt-item__body { flex: 1; min-width: 0; }
  .sp-book-zt-item__title { font-size: 13px; font-weight: 600; color: #1e293b; }
  .sp-book-zt-item__meta { font-size: 12px; color: #64748b; margin-top: 4px; line-height: 1.45; }
  .sp-book-zt-item__tag {
    display: inline-block;
    margin-top: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #2563eb;
    background: #eff6ff;
    border: 1px solid #93c5fd;
  }
  .sp-book-bind-note { color: #c2410c; margin-top: 8px; }
  .sp-book-standalone .btn.btn-primary.sp-book-submit {
    display: flex;
    width: 100%;
    min-height: 44px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-radius: 10px;
    border: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(180deg, #3b82f6 0%, #2563eb 48%, #1d4ed8 100%);
    box-shadow:
      0 6px 18px rgba(37, 99, 235, 0.32),
      0 1px 4px rgba(15, 23, 42, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body class="sp-book-standalone">
  <div class="sp-book-page">
    <header class="sp-book-top">
      <span class="sp-book-brand">提货预约</span>
      <span class="sp-book-sub">步骤 1 / 2 · 查找货件</span>
    </header>
    <div class="sp-book-card">
      <div class="form-field" style="margin-bottom:0;">
        <label class="form-label" for="sp-enter-query">Customer Ref / 货件 ID <span class="req">*</span></label>
        <textarea id="sp-enter-query" class="form-textarea sp-book-query-ta" rows="4" placeholder="每行一个，例如：&#10;ref-mix-a&#10;ref-norm-sp01"></textarea>
      </div>
      <div class="sp-book-query-preview" id="sp-query-preview"></div>
      <div class="sp-book-code-actions">
        <button type="button" class="btn btn-primary sp-book-submit" onclick="spBookGoFill()">下一步</button>
      </div>
    </div>
  </div>
<script src="../js/common.js"></script>
<script>
  var SP_BOOK_SESSION_KEY = 'meekoo_sp_book_session';

  /** 自提单切片：合并打板批次可有多张自提单（拆分后） */
  var SP_BOOK_ZT_ORDERS = [
    {
      zt: 'ZT-2026-M0401',
      lotId: 'lot-mix-1',
      mergePallet: true,
      split: false,
      pallets: 4,
      bookable: true,
      status: '未预约',
      pickCode: '',
      customer: '华东跨境贸易',
      shipments: [
        { key: 'mx-1', fba: 'FBA15HJ20260401-A', cust: 'ref-001-customerX', cntr: 'MSKU1234567', sysNo: 'EXP-2026-0401', qty: '15', plt: '2', vol: '0.60', gw: '110', whIn: '2026-04-26' },
        { key: 'mx-2', fba: 'FBA15HJ20260401-B', cust: 'ref-002-customerY', cntr: 'MSKU2233445', sysNo: 'EXP-2026-0402', qty: '25', plt: '2', vol: '0.90', gw: '125', whIn: '2026-04-26' },
        { key: 'mx-3', fba: 'FBA15HJ20260401-C', cust: 'ref-003-customerZ', cntr: 'MSKU3390008', sysNo: 'EXP-2026-0403', qty: '20', plt: '2', vol: '1.35', gw: '125', whIn: '2026-04-26' }
      ]
    },
    {
      zt: 'ZT-2026-M0501-1',
      lotId: 'lot-mix-2',
      mergePallet: true,
      split: true,
      pallets: 2,
      bookable: true,
      status: '未预约',
      pickCode: '',
      customer: '华东跨境贸易',
      shipments: [
        { key: 'mix2-a', fba: 'FBA15MIX0501-A', cust: 'ref-mix-a', cntr: 'MSKU5500111', sysNo: 'EXP-2026-0501', qty: '10', plt: '1', vol: '0.45', gw: '60', whIn: '2026-04-28' },
        { key: 'mix2-b', fba: 'FBA15MIX0501-B', cust: 'ref-mix-b', cntr: 'MSKU5500111', sysNo: 'EXP-2026-0502', qty: '10', plt: '1', vol: '0.45', gw: '60', whIn: '2026-04-28' },
        { key: 'mix2-c', fba: 'FBA15MIX0501-C', cust: 'ref-mix-c', cntr: 'MSKU5500111', sysNo: 'EXP-2026-0503', qty: '10', plt: '1', vol: '0.50', gw: '60', whIn: '2026-04-28' }
      ]
    },
    {
      zt: 'ZT-2026-M0501-2',
      lotId: 'lot-mix-2',
      mergePallet: true,
      split: true,
      pallets: 2,
      bookable: true,
      status: '未预约',
      pickCode: '',
      customer: '华东跨境贸易',
      shipments: [
        { key: 'mix2-a', fba: 'FBA15MIX0501-A', cust: 'ref-mix-a', cntr: 'MSKU5500111', sysNo: 'EXP-2026-0501', qty: '10', plt: '1', vol: '0.45', gw: '60', whIn: '2026-04-28' },
        { key: 'mix2-b', fba: 'FBA15MIX0501-B', cust: 'ref-mix-b', cntr: 'MSKU5500111', sysNo: 'EXP-2026-0502', qty: '10', plt: '1', vol: '0.45', gw: '60', whIn: '2026-04-28' },
        { key: 'mix2-c', fba: 'FBA15MIX0501-C', cust: 'ref-mix-c', cntr: 'MSKU5500111', sysNo: 'EXP-2026-0503', qty: '10', plt: '1', vol: '0.50', gw: '60', whIn: '2026-04-28' }
      ]
    },
    {
      zt: 'ZT-2026-0405',
      lotId: '',
      mergePallet: false,
      split: false,
      pallets: 2,
      bookable: true,
      status: '未预约',
      pickCode: '',
      customer: '华东跨境贸易',
      shipments: [
        { key: 'n-0405', fba: 'FBA15HJ20260405', cust: 'ref-norm-sp01', cntr: 'MSKU4400123', sysNo: 'EXP-2026-0405', qty: '28', plt: '2', vol: '1.25', gw: '165', whIn: '2026-04-27' }
      ]
    },
    {
      zt: 'ZT-2026-0406',
      lotId: '',
      mergePallet: false,
      split: false,
      pallets: 2,
      bookable: true,
      status: '已过期',
      pickCode: 'TK-88300',
      customer: '深圳星航供应链',
      shipments: [
        { key: 'ov-0406', fba: 'FBA15HJ20260406', cust: 'ref-overdue-01', cntr: 'TCLU5566778', sysNo: 'EXP-2026-0406', qty: '16', plt: '2', vol: '0.88', gw: '142', whIn: '2026-04-20' }
      ]
    }
  ];

  function spBookNorm(s) {
    return String(s || '').trim().toLowerCase();
  }

  function spBookParseQueries(raw) {
    return String(raw || '').split(/[\n,;，；]+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  function spBookFindZtOrders(queries) {
    var hitZt = {};
    queries.forEach(function (q) {
      var nq = spBookNorm(q);
      SP_BOOK_ZT_ORDERS.forEach(function (ord) {
        if (spBookNorm(ord.zt) === nq) hitZt[ord.zt] = true;
        (ord.shipments || []).forEach(function (s) {
          if (spBookNorm(s.cust) === nq || spBookNorm(s.fba) === nq) hitZt[ord.zt] = true;
        });
      });
    });
    var found = SP_BOOK_ZT_ORDERS.filter(function (o) { return hitZt[o.zt]; });
    var lots = {};
    found.forEach(function (o) {
      if (o.lotId) lots[o.lotId] = true;
    });
    SP_BOOK_ZT_ORDERS.forEach(function (o) {
      if (o.lotId && lots[o.lotId] && !hitZt[o.zt]) {
        found.push(o);
        hitZt[o.zt] = true;
      }
    });
    return found;
  }

  function spBookEscape(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/"/g, '&quot;');
  }

  function spBookPreview() {
    var inp = document.getElementById('sp-enter-query');
    var box = document.getElementById('sp-query-preview');
    if (!box) return;
    var queries = spBookParseQueries(inp && inp.value);
    if (!queries.length) {
      box.classList.remove('is-visible');
      box.innerHTML = '';
      return;
    }
    var orders = spBookFindZtOrders(queries);
    if (!orders.length) {
      box.classList.add('is-visible');
      box.innerHTML = '未找到匹配货件。演示可用：<strong>ref-mix-a</strong>、<strong>ref-001-customerX</strong>、<strong>ref-norm-sp01</strong>、<strong>ref-overdue-01</strong>';
      return;
    }
    var multiLot = orders.some(function (o) { return o.lotId && orders.filter(function (x) { return x.lotId === o.lotId; }).length > 1; });
    var html = '<div>找到 <strong>' + orders.length + '</strong> 张自提单，请勾选本次预约：</div><div class="sp-book-zt-list">';
    orders.forEach(function (o) {
      var checked = o.bookable ? ' checked' : '';
      var disabled = o.bookable ? '' : ' disabled';
      var tag = o.mergePallet ? '<span class="sp-book-zt-item__tag">合并打板' + (o.split ? ' · 已拆分' : '') + '</span>' : '';
      var refs = (o.shipments || []).map(function (s) { return s.cust; }).join('、');
      html += '<label class="sp-book-zt-item">' +
        '<input type="checkbox" class="sp-book-zt-cb" value="' + spBookEscape(o.zt) + '"' + checked + disabled + '>' +
        '<span class="sp-book-zt-item__body">' +
        '<span class="sp-book-zt-item__title">' + spBookEscape(o.zt) + ' · ' + o.pallets + ' 板 · ' + spBookEscape(o.status) + '</span>' +
        '<div class="sp-book-zt-item__meta">货件：' + spBookEscape(refs) + '</div>' +
        tag +
        '</span></label>';
    });
    html += '</div>';
    if (multiLot) {
      html += '<div class="sp-book-bind-note">同一合并打板批次可只约其中一张（分批提），也可勾选多张一起约。</div>';
    }
    box.classList.add('is-visible');
    box.innerHTML = html;
  }

  function spBookGoFill() {
    var inp = document.getElementById('sp-enter-query');
    var queries = spBookParseQueries(inp && inp.value);
    if (!queries.length) {
      showToast('请输入 Customer Ref 或货件 ID');
      if (inp) inp.focus();
      return;
    }
    var orders = spBookFindZtOrders(queries);
    if (!orders.length) {
      showToast('未找到可预约货件');
      return;
    }
    var selectedZt = [];
    document.querySelectorAll('.sp-book-zt-cb:checked').forEach(function (cb) {
      selectedZt.push(cb.value);
    });
    if (!selectedZt.length) {
      showToast('请至少勾选 1 张自提单');
      return;
    }
    var selected = orders.filter(function (o) { return selectedZt.indexOf(o.zt) >= 0; });
    var notReady = selected.filter(function (o) { return !o.bookable; });
    if (notReady.length) {
      showToast('「' + notReady[0].zt + '」当前不可预约（' + notReady[0].status + '）');
      return;
    }
    var customers = {};
    selected.forEach(function (o) { customers[o.customer] = true; });
    if (Object.keys(customers).length > 1) {
      showToast('不能把不同客户的货件约在一起');
      return;
    }
    var rows = [];
    var seenShip = {};
    selected.forEach(function (o) {
      (o.shipments || []).forEach(function (s) {
        var sk = (o.lotId ? o.lotId + ':' : '') + s.key;
        if (seenShip[sk]) return;
        seenShip[sk] = true;
        rows.push(Object.assign({}, s, {
          zt: o.zt,
          customer: o.customer,
          mergePallet: o.mergePallet,
          lotId: o.lotId || '',
          status: o.status
        }));
      });
    });
    var palletTotal = selected.reduce(function (n, o) { return n + (Number(o.pallets) || 0); }, 0);
    var session = {
      queries: queries,
      selectedZt: selectedZt,
      orders: selected,
      rows: rows,
      pickCode: selected.length === 1 ? (selected[0].pickCode || '') : '',
      status: selected[0].status || '未预约',
      zt: selectedZt.join('、'),
      bindAutoCount: 0,
      mergePallet: selected.some(function (o) { return o.mergePallet; }),
      palletTotal: palletTotal
    };
    try { sessionStorage.setItem(SP_BOOK_SESSION_KEY, JSON.stringify(session)); } catch (e) {}
    location.href = 'self-pickup-book-fill.html';
  }

  document.addEventListener('DOMContentLoaded', function() {
    var inp = document.getElementById('sp-enter-query');
    var prev = '';
    try {
      var raw = sessionStorage.getItem(SP_BOOK_SESSION_KEY);
      if (raw) {
        var sess = JSON.parse(raw);
        if (sess && sess.queries && sess.queries.length) prev = sess.queries.join('\n');
      }
    } catch (e) {}
    if (inp && prev) inp.value = prev;
    if (inp) inp.focus();
    inp && inp.addEventListener('input', spBookPreview);
    inp && inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); spBookGoFill(); }
    });
    spBookPreview();
  });
</script>
</body>
</html>
