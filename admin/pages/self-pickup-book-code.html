<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提货预约</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  .sp-book-standalone {
    margin: 0;
    min-height: 100vh;
    background: #e8ecf1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .sp-book-standalone .sp-book-page {
    max-width: 440px;
    margin: 0 auto;
    padding: 22px 16px 36px;
    box-sizing: border-box;
  }
  .sp-book-top {
    text-align: center;
    padding: 4px 0 14px;
    margin-bottom: 4px;
  }
  .sp-book-brand {
    font-size: 20px;
    font-weight: 600;
    color: #334155;
    letter-spacing: 0.03em;
  }
  .sp-book-sub {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 400;
    color: #64748b;
  }
  .sp-book-card {
    background: #fff;
    border: 1px solid #dce3ec;
    border-radius: 12px;
    padding: 16px 18px 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .sp-book-code-hint { font-size: 13px; color: #475569; margin: 0 0 14px; line-height: 1.55; }
  .sp-book-code-actions { margin-top: 14px; }
  .sp-book-standalone .btn.btn-primary.sp-book-submit {
    display: flex;
    width: 100%;
    min-height: 44px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-radius: 10px;
    border: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(180deg, #3b82f6 0%, #2563eb 48%, #1d4ed8 100%);
    box-shadow:
      0 6px 18px rgba(37, 99, 235, 0.32),
      0 1px 4px rgba(15, 23, 42, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  }
  .sp-book-standalone .btn.btn-primary.sp-book-submit:hover {
    filter: brightness(1.04);
    box-shadow:
      0 8px 22px rgba(37, 99, 235, 0.38),
      0 2px 6px rgba(15, 23, 42, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
  }
  .sp-book-standalone .btn.btn-primary.sp-book-submit:active {
    transform: translateY(0);
    filter: brightness(0.98);
    box-shadow:
      0 4px 12px rgba(37, 99, 235, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  .sp-book-standalone .btn.btn-primary.sp-book-submit:focus-visible {
    outline: 2px solid rgba(37, 99, 235, 0.45);
    outline-offset: 2px;
  }
</style>
</head>
<body class="sp-book-standalone">
  <div class="sp-book-page">
    <header class="sp-book-top">
      <span class="sp-book-brand">提货预约</span>
      <span class="sp-book-sub">步骤 1 / 2 · 验证提货码</span>
    </header>
    <div class="sp-book-card">
      <p class="sp-book-code-hint">请输入提货码以继续。信息仅用于本次预约流程。</p>
      <div class="form-field" style="margin-bottom:0;">
        <label class="form-label" for="sp-enter-pick-code">提货码 <span class="req">*</span></label>
        <input id="sp-enter-pick-code" class="form-input" type="text" autocomplete="off" placeholder="扫描或输入提货码" maxlength="64">
      </div>
      <div class="sp-book-code-actions">
        <button type="button" class="btn btn-primary sp-book-submit" onclick="spBookGoFill()">下一步</button>
      </div>
    </div>
  </div>
<script src="../js/common.js"></script>
<script>
  var SP_BOOK_KEY = 'meekoo_sp_book_pick_code';

  function spBookGoFill() {
    var inp = document.getElementById('sp-enter-pick-code');
    var v = inp && String(inp.value || '').trim();
    if (!v) {
      showToast('请输入提货码');
      if (inp) inp.focus();
      return;
    }
    try { sessionStorage.setItem(SP_BOOK_KEY, v); } catch (e) {}
    location.href = 'self-pickup-book-fill.html';
  }

  document.addEventListener('DOMContentLoaded', function() {
    var inp = document.getElementById('sp-enter-pick-code');
    var prev = '';
    try { prev = sessionStorage.getItem(SP_BOOK_KEY) || ''; } catch (e) {}
    if (inp && prev) inp.value = prev;
    if (inp) inp.focus();
    inp && inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); spBookGoFill(); }
    });
  });
</script>
</body>
</html>
