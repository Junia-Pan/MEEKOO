<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自提预约 · 输入提货码</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  html {
    background: #e8ecf1;
    min-height: 100%;
  }
  .sp-book-standalone {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #e8ecf1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .sp-book-standalone .sp-book-page {
    max-width: 1040px;
    margin: 0 auto;
    padding: 20px 14px 28px;
    box-sizing: border-box;
  }
  .sp-book-top {
    text-align: center;
    padding: 2px 0 10px;
    margin-bottom: 2px;
  }
  .sp-book-brand {
    font-size: 20px;
    font-weight: 600;
    color: #334155;
    letter-spacing: 0.03em;
  }
  .sp-book-sub {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 400;
    color: #64748b;
  }
  .sp-book-code-stage {
    max-width: 520px;
    margin: 0 auto;
  }
  .sp-book-card-wrap {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px 18px 14px;
    box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
  }
  .sp-book-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sp-book-field-label {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    letter-spacing: 0.01em;
  }
  .sp-book-field-label .req { color: #dc2626; font-weight: 700; }
  .sp-book-code-input {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  .sp-book-code-input::placeholder {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #94a3b8;
  }
  .sp-book-query-preview {
    margin-top: 10px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 13px;
    color: #475569;
    line-height: 1.5;
    display: none;
  }
  .sp-book-query-preview.is-visible { display: block; }
  .sp-book-code-actions { margin-top: 16px; }
  .sp-book-standalone .btn.btn-primary.sp-book-submit {
    display: flex;
    width: 100%;
    min-height: 44px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-radius: 10px;
    border: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(180deg, #3b82f6 0%, #2563eb 48%, #1d4ed8 100%);
    box-shadow:
      0 6px 18px rgba(37, 99, 235, 0.32),
      0 1px 4px rgba(15, 23, 42, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  }
  .sp-book-standalone .btn.btn-primary.sp-book-submit:hover {
    filter: brightness(1.04);
    box-shadow:
      0 8px 22px rgba(37, 99, 235, 0.38),
      0 2px 6px rgba(15, 23, 42, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
  }
  .sp-book-standalone .btn.btn-primary.sp-book-submit:active {
    transform: translateY(0);
    filter: brightness(0.98);
    box-shadow:
      0 4px 12px rgba(37, 99, 235, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  .sp-book-standalone .btn.btn-primary.sp-book-submit:focus-visible {
    outline: 2px solid rgba(37, 99, 235, 0.45);
    outline-offset: 2px;
  }
</style>
</head>
<body class="sp-book-standalone">
  <div class="sp-book-page">
    <header class="sp-book-top">
      <span class="sp-book-brand">自提预约</span>
      <span class="sp-book-sub">步骤 1 / 2 · 输入提货码</span>
    </header>
    <div class="sp-book-code-stage">
      <div class="sp-book-card-wrap">
        <div class="sp-book-field">
          <label class="sp-book-field-label" for="sp-enter-pick-code">提货码 <span class="req">*</span></label>
          <input id="sp-enter-pick-code" class="form-input sp-book-code-input" type="text" maxlength="8" placeholder="请输入提货码" autocomplete="off" lang="en">
        </div>
        <div class="sp-book-query-preview" id="sp-query-preview"></div>
        <div class="sp-book-code-actions">
          <button type="button" class="btn btn-primary sp-book-submit" onclick="spBookGoFill()">下一步</button>
        </div>
      </div>
    </div>
  </div>
<script src="../js/common.js"></script>
<script src="../js/self-pickup-core.js"></script>
<script src="../js/self-pickup-book-data.js"></script>
<script>
  var SP_BOOK_SESSION_KEY = 'meekoo_sp_book_session';
  var BD = window.SpPickupBookData;

  function spBookPreview() {
    var box = document.getElementById('sp-query-preview');
    if (!box) return;
    box.classList.remove('is-visible');
    box.innerHTML = '';
  }

  function spBookGoFill() {
    if (!BD) return;
    var inp = document.getElementById('sp-enter-pick-code');
    var result = BD.bootstrapSessionFromPickCode(inp && inp.value);
    if (!result.ok) {
      showToast(result.message || '提货码无效或不可用，请核对后重试');
      if (!result.ok && inp) inp.focus();
      return;
    }
    try { sessionStorage.setItem(SP_BOOK_SESSION_KEY, JSON.stringify(result.session)); } catch (e) {}
    location.href = 'self-pickup-book-fill.html';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var inp = document.getElementById('sp-enter-pick-code');
    var prev = '';
    try {
      var raw = sessionStorage.getItem(SP_BOOK_SESSION_KEY);
      if (raw) {
        var sess = JSON.parse(raw);
        if (sess && sess.pickCode) prev = sess.pickCode;
      }
    } catch (e) {}
    if (inp) {
      if (prev) inp.value = prev;
      inp.focus();
      inp.addEventListener('input', function () {
        var v = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (v.indexOf('SP') !== 0 && v.length) v = 'SP' + v.replace(/^SP/, '');
        inp.value = v.slice(0, 8);
        spBookPreview();
      });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); spBookGoFill(); }
      });
      spBookPreview();
    }
  });
</script>
</body>
</html>
