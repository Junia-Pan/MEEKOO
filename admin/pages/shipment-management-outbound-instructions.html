<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 出库指令</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.tabs { scrollbar-width: none; background: linear-gradient(180deg,rgba(37,99,235,.055) 0%,rgba(37,99,235,0) 100%); }
.tabs::-webkit-scrollbar { display: none; }
#oiPageBtns { display: inline-flex; align-items: center; gap: 8px; }

.s-待处理 { background: #FEF3C7; color: #92400E; }
.s-待处理 .status-dot { background: #F59E0B; }
.s-处理中 { background: #DBEAFE; color: #1E40AF; }
.s-处理中 .status-dot { background: #3B82F6; }
.s-已完成 { background: #D1FAE5; color: #065F46; }
.s-已完成 .status-dot { background: #10B981; }
.s-已取消 { background: #FEE2E2; color: #991B1B; }
.s-已取消 .status-dot { background: #EF4444; }

.oi-ship-cell {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0; min-width: 0;
}
.th-action {
  position: sticky; right: 0; z-index: 5;
  background: #F8FAFD;
  box-shadow: -8px 0 12px rgba(15, 23, 42, .10);
  white-space: nowrap;
  min-width: 232px;
  width: 232px;
}
.td-action {
  position: sticky; right: 0; z-index: 4;
  background: #fff !important;
  box-shadow: -8px 0 12px rgba(15, 23, 42, .10);
  white-space: nowrap;
  min-width: 232px;
  width: 232px;
  display: table-cell !important;
  vertical-align: middle;
}
tr:hover .td-action,
table.data-table tbody tr:hover td.td-action { background: #F8FAFD !important; }
.th-action:hover { background: #F0F4FA; }
.td-action-inner {
  display: grid;
  grid-template-columns: 72px 52px 64px;
  gap: 4px;
  align-items: center;
  justify-content: start;
  white-space: nowrap;
}
.td-action-inner > .btn-xs,
.td-action-inner .btn-with-dropdown > .btn-xs {
  width: 100%;
  min-width: 0;
  padding: 0 6px;
  text-align: center;
  justify-content: center;
}
.td-action-inner > .oi-op-slot {
  display: block;
  width: 100%;
  height: 24px;
  visibility: hidden;
  pointer-events: none;
}
.btn-with-dropdown { position: relative; display: block; width: 100%; }
.dropdown-menu {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
  min-width: 108px;
  display: none;
  padding: 4px 0;
}
.dropdown-menu.is-portal {
  position: fixed;
  z-index: 12000;
  display: block;
}
.dropdown-item {
  display: block; padding: 7px 16px;
  font-size: 13px; color: var(--text-primary);
  cursor: pointer; white-space: nowrap;
}
.dropdown-item:hover { background: var(--bg); }
.dropdown-item.danger { color: #EF4444; }
.dropdown-item.danger:hover { background: var(--bg); color: #EF4444; }

.oi-file-list { display: flex; flex-direction: column; gap: 0; }
.oi-file-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 2px; border-bottom: 1px solid rgba(15,23,42,.06);
}
.oi-file-item:last-child { border-bottom: none; }
.oi-file-name {
  flex: 1; min-width: 0; font-size: 13px; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.oi-file-actions { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.oi-file-foot {
  display: flex; justify-content: flex-end; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(15,23,42,.06);
}
.oi-detail-meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px;
  margin-bottom: 14px; font-size: 13px;
}
.oi-detail-item { display: flex; gap: 8px; min-width: 0; line-height: 1.45; }
.oi-detail-label { flex: 0 0 auto; color: var(--text-muted); }
.oi-detail-value { min-width: 0; color: var(--text-primary); word-break: break-all; }
.oi-detail-note { grid-column: 1 / -1; }
.oi-line-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.oi-line-table th, .oi-line-table td {
  padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(15,23,42,.06);
  white-space: nowrap;
}
.oi-line-table th { background: #F8FAFC; font-weight: 650; color: var(--text-secondary); }
.oi-section-title { font-size: 13px; font-weight: 650; margin: 4px 0 8px; }
.oi-ob-banner {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);
}
.file-drop {
  border: 1.5px dashed rgba(15,23,42,.18);
  background: rgba(248,250,252,.9);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
}
.file-drop:hover { border-color: rgba(37,99,235,.28); box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
.file-drop.is-drag { border-color: #2563EB; background: #EFF6FF; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.file-drop-title { font-size: 13px; font-weight: 650; }
.file-drop-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
#modal-oi-proxy .modal { max-width: 920px; }
#modal-oi-edit .modal, #modal-oi-complete .modal { max-width: 920px; }
#modal-oi-edit .modal-body, #modal-oi-complete .modal-body, #modal-oi-view .modal-body { max-height: min(78vh, 820px); overflow: auto; }
#oi-px-files { margin-top: 8px; }
#oi-px-files:empty { margin-top: 0; }
.oi-line-input {
  width: 92px; height: 28px; padding: 0 8px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 12px; font-family: inherit;
}
.oi-line-input.is-error { border-color: #EF4444; background: #FEF2F2; }
.form-input.is-error, .form-select.is-error { border-color: #EF4444; background: #FEF2F2; }
.search-card .search-form-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) {
  .search-card .search-form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.oi-id-stack { display:flex; flex-direction:column; gap:2px; min-width:0; }
.oi-id-line { display:flex; align-items:baseline; gap:6px; white-space:nowrap; }
.oi-id-k { font-size:11px; color:var(--text-muted); font-weight:600; }
.oi-id-group { display:flex; flex-direction:column; align-items:flex-start; gap:8px; max-width:300px; }
.oi-id-group-head { display:inline-flex; align-items:center; flex-wrap:wrap; gap:6px; }
.merge-tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 8px; font-size:11px; font-weight:700; line-height:1.4;
  color:#1d4ed8; background:#dbeafe; border:1px solid #93c5fd;
  border-radius:999px; white-space:nowrap; vertical-align:middle;
}
.oi-ship-summary {
  border:1px solid rgba(15,23,42,.08); border-radius:12px; overflow-x:auto; background:#fff;
}
.oi-ship-summary-row {
  display:grid;
  grid-template-columns:minmax(110px,1.1fr) minmax(90px,.9fr) repeat(8,minmax(56px,.65fr));
  gap:8px 10px; padding:10px 14px; align-items:center;
  border-bottom:1px solid rgba(15,23,42,.06); font-size:12.5px; min-width:720px;
}
.oi-ship-summary-row:last-child { border-bottom:0; }
.oi-ship-summary-row.is-head { background:#F8FAFC; color:var(--text-muted); font-weight:650; font-size:12px; }
.oi-ship-summary-id { font-weight:700; color:var(--text-primary); }
.oi-shared-form {
  border:1px solid rgba(15,23,42,.08); border-radius:12px; background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.04); overflow:hidden;
}
.oi-shared-form .oi-card-body { padding:14px 16px 16px; }
#modal-oi-proxy .modal { max-width: 920px; }
#modal-oi-proxy .modal-body { max-height: min(78vh, 820px); overflow: auto; }
.oi-split-hint {
  font-size:12px; color:#475569; line-height:1.5;
  margin:0 0 12px; padding:8px 10px;
  background:#F8FAFC; border-radius:8px;
}
.oi-ship-block { min-width:0; }
.oi-ship-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.oi-ship-head-label { font-size:13px; font-weight:650; }
.oi-ship-count {
  display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px;
  background:#EFF6FF; color:#2563EB; font-size:12px; font-weight:650;
}
.oi-ship-list { display:flex; flex-direction:column; gap:12px; }
.oi-ship-card {
  flex:0 0 auto; border:1px solid rgba(15,23,42,.08); border-radius:12px;
  background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.04); overflow:hidden;
}
.oi-ship-card.is-off { opacity:.72; }
.oi-ship-card-h {
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:12px 16px; background:linear-gradient(180deg,#F8FBFF 0%,#fff 100%);
  border-bottom:1px solid rgba(15,23,42,.06);
}
.oi-ship-card-id { display:flex; align-items:center; gap:8px; min-width:0; }
.oi-ship-k { font-size:11px; font-weight:600; color:var(--text-muted); }
.oi-ship-no { font-size:14px; font-weight:700; }
.oi-ship-card-tags { display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
.oi-chip {
  display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px;
  background:#F1F5F9; color:#334155; font-size:12px; font-weight:600; white-space:nowrap;
}
.oi-meta {
  display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px 16px;
  padding:12px 16px; background:#F8FAFC; border-bottom:1px solid rgba(15,23,42,.05);
}
.oi-meta-item { min-width:0; font-size:12px; line-height:1.35; }
.oi-meta-item .k { display:block; color:var(--text-muted); font-weight:500; margin-bottom:2px; }
.oi-meta-item .v { display:block; color:var(--text-primary); font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.oi-card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:14px; }
.oi-edit-row {
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:14px;
  align-items:start;
}
.oi-edit-row .form-field,
.oi-pw-grid .form-field,
.oi-card-note,
.oi-card-file {
  min-width:0;
  margin:0;
}
.oi-edit-row .form-input,
.oi-edit-row .form-select,
.oi-edit-row .oi-line-input,
.oi-pw-grid .form-input,
.oi-pw-grid .form-select {
  width:100%;
  min-width:0;
  max-width:100%;
  box-sizing:border-box;
}
.oi-pw-col { display:none; }
.oi-form.is-mode-pw .oi-pw-col { display:flex; flex-direction:column; gap:5px; }
.oi-form.is-mode-pw .oi-fba-col { display:none; }
.oi-form.is-mode-pw .oi-fba-row { display:none; }
.oi-form.is-mode-fba .oi-pw-addr-row { display:none; }
.oi-form.is-mode-other .oi-fba-col,
.oi-form.is-mode-other .oi-fba-row,
.oi-form.is-mode-other .oi-pw-addr-row { display:none; }
.oi-pw-block { display:none; flex-direction:column; gap:14px; }
.oi-form.is-mode-pw .oi-pw-block { display:flex; }
.oi-form.is-mode-other .oi-pw-block { display:none; }
.oi-pw-grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:14px;
  align-items:start;
}
.oi-pw-grid .oi-span-2 { grid-column:span 2; }
.oi-star-fba { display:none; }
.oi-form.is-mode-fba .oi-star-fba { display:inline; }
.oi-form .form-input:disabled, .oi-form .form-select:disabled, .oi-form .oi-line-input:disabled {
  background:#F1F5F9; color:#64748b; cursor:not-allowed;
}
.oi-ob-pallet-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 12px;
}
.oi-view-extra { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px 16px; }
.oi-view-extra .oi-meta-item .v { white-space:normal; word-break:break-word; }
.oi-view-span { grid-column: 1 / -1; }
.oi-view-files { min-width:0; }
.oi-attach-head {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.oi-attach-head-title { display:inline-flex; align-items:baseline; gap:8px; min-width:0; }
.oi-view-files .oi-attach-head { margin-bottom:16px; }
.oi-attach-head .k { display:inline; margin-bottom:0; font-size:12px; font-weight:650; color:var(--text-primary); }
.oi-attach-head .muted { font-size:12px; font-weight:500; color:var(--text-muted); }
.oi-attach-list {
  border:1px solid rgba(15,23,42,.08);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}
.oi-attach-item {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:10px 12px;
  border-top:1px solid rgba(15,23,42,.06);
}
.oi-attach-item:first-child { border-top:none; }
.oi-attach-main { min-width:0; }
.oi-attach-name {
  font-weight:700; font-size:13px; color:var(--text-primary);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.oi-attach-meta { font-size:12px; color:var(--text-muted); margin-top:3px; }
.oi-attach-actions { display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
.file-drop.is-compact { padding:10px 12px; text-align:left; }
.file-drop.is-compact .file-drop-title { font-size:12.5px; }
.file-drop.is-compact .file-drop-hint { font-size:11px; margin-top:2px; }
.oi-note-cell { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width: 720px) {
  .oi-meta { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .oi-edit-row, .oi-pw-grid, .oi-view-extra { grid-template-columns:1fr; }
  .oi-pw-grid .oi-span-2 { grid-column:auto; }
}
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><div class="breadcrumb" id="breadcrumb"><span>首页</span><span class="sep">›</span><span>货件管理</span><span class="sep">›</span><span class="current">出库指令</span></div></div>
      <div class="topbar-right">
        <div class="topbar-icon-btn">🔍</div>
        <div class="topbar-icon-btn">🔔<span class="topbar-badge">3</span></div>
        <div class="user-avatar">管</div>
      </div>
    </div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="page-title"><div class="page-title-icon">📋</div>出库指令</div>
        </div>
      </div>
      <div class="search-card">
        <div class="search-form-grid">
          <div class="search-field"><label class="search-label">柜号</label><input class="search-input" id="q_containerNo" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field"><label class="search-label">Customer Ref No</label><input class="search-input" id="q_customerRefNo" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field"><label class="search-label">出库方式</label><select class="search-select" id="q_moveType"><option value="">全部</option><option>FBA卡派</option><option>Walmart卡派</option><option>私卡派</option><option>自提</option><option>UPS</option><option>Fedex</option><option>DHL</option><option>USPS</option><option>一件代发</option></select></div>
          <div class="search-field"><label class="search-label">系统单号</label><input class="search-input" id="q_systemNo" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field"><label class="search-label">货件ID</label><input class="search-input" id="q_shipNo" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field"><label class="search-label">FBA Code</label><input class="search-input" id="q_fbaCode" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field"><label class="search-label">FBA ID</label><input class="search-input" id="q_fbaId" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field"><label class="search-label">PO</label><input class="search-input" id="q_po" placeholder="多个值以空格/换行/逗号分割"></div>
          <div class="search-field search-field--fold"><label class="search-label">到仓日期</label><div class="date-range-c"><input type="date" id="q_arrivalFrom" aria-label="到仓开始日期"><span class="sep">—</span><input type="date" id="q_arrivalTo" aria-label="到仓结束日期"></div></div>
          <div class="search-field search-field--fold"><label class="search-label">拆柜日期</label><div class="date-range-c"><input type="date" id="q_unpackFrom" aria-label="拆柜开始日期"><span class="sep">—</span><input type="date" id="q_unpackTo" aria-label="拆柜结束日期"></div></div>
          <div class="search-field search-field--fold"><label class="search-label">客户</label><select class="search-select" id="q_customer"><option value="">全部</option><option>ABC Trading Co.</option><option>Pacific LLC</option><option>Global Freight Inc.</option><option>XYZ Imports LLC</option></select></div>
          <div class="search-field search-field--fold"><label class="search-label">发起时间</label><div class="date-range-c"><input type="date" id="q_createdFrom" aria-label="发起开始日期"><span class="sep">—</span><input type="date" id="q_createdTo" aria-label="发起结束日期"></div></div>
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" type="button" id="btnSearch">🔍 查询</button>
          <button class="btn btn-default" type="button" id="btnReset">↺ 重置</button>
          <button type="button" class="search-toggle" aria-expanded="false">
            <span class="search-toggle-label">展开更多</span>
            <span class="search-toggle-badge filter-count" style="display:none" aria-hidden="true"></span>
            <span class="toggle-arrow" aria-hidden="true">▼</span>
          </button>
        </div>
      </div>
      <div class="table-card">
        <div class="tabs" id="statusTabs" aria-label="按指令状态筛选"></div>
        <div class="table-toolbar">
          <button class="btn btn-default" type="button" id="btnBatchStart">开始处理</button>
          <button class="btn btn-default" type="button" id="btnExport">📤 导出</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:36px"><input type="checkbox" id="chkAll" aria-label="全选"></th>
                <th>货件ID</th>
                <th>客户</th>
                <th>Customer Ref No</th>
                <th>柜号</th>
                <th>系统单号</th>
                <th>出库方式</th>
                <th>指令状态</th>
                <th>预报件数</th>
                <th>实际件数</th>
                <th>出库件数</th>
                <th>原Move Type</th>
                <th>FBA Code</th>
                <th>FBA ID</th>
                <th>PO</th>
                <th>备注</th>
                <th>文件</th>
                <th>发起时间</th>
                <th>发起人</th>
                <th class="th-action">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pagination-info" id="tableInfo">共 0 条</div>
          <div class="pagination-right">
            每页
            <select class="page-size-select" id="oiPageSize">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            条
            <button class="page-btn" type="button" id="oiPrev" disabled>‹ 上一页</button>
            <span id="oiPageBtns"></span>
            <button class="page-btn" type="button" id="oiNext" disabled>下一页 ›</button>
            <span class="text-muted">第</span>
            <input class="page-input" id="oiPageInput" value="1" inputmode="numeric">
            <span class="text-muted">/ <span id="oiTotalPages">1</span> 页</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal-oi-proxy" class="modal-overlay" onclick="closeModalOutside(event,'modal-oi-proxy')">
  <div class="modal modal-md" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="oi-px-title">发起出库指令</span>
      <button type="button" class="modal-close" onclick="closeModal('modal-oi-proxy')">✕</button>
    </div>
    <div class="modal-body">
      <div class="oi-form is-mode-fba" id="oi-px-form">
        <div class="oi-split-hint" id="oi-px-hint">出库件数小于实际件数时，会拆出新货件ID（原ID-1）进入出库指令，原票剩余件数继续留仓。</div>
        <div class="form-field" style="margin-bottom:12px">
          <label class="form-label">出库方式 <span class="req">*</span></label>
          <select class="form-select" id="oi-px-method">
            <option value="">请选择出库方式</option>
            <option>FBA卡派</option>
            <option>Walmart卡派</option>
            <option>私卡派</option>
            <option>自提</option>
            <option>UPS</option>

        (item.desc ? `<div class="timeline-desc">${esc(item.desc)}</div>` : '') +
        `</div></div>`
      ).join('');
    }
    showModal('modal-oi-log');
  }
  function uniqJoin(lines, key) {
    const vals = [];
    (lines || []).forEach((ln) => {
      const v = String(ln && ln[key] || '').trim();
      if (v && vals.indexOf(v) < 0) vals.push(v);
    });
    return vals.join(' / ') || '—';
  }
  function sumNum(lines, key) {
    return (lines || []).reduce((n, ln) => n + (Number(ln && ln[key]) || 0), 0);
  }
  function round3(n) {
    return Math.round(n * 1000) / 1000;
  }
  function includesAny(q, values) {
    if (!q) return true;
    return values.some((v) => String(v || '').toUpperCase().includes(q));
  }
  function matchTab(tab, row) {
    if (tab === '全部') return true;
    return String(row.status || '') === tab;
  }
  function countTab(tab) {
    const rows = tab === '全部' ? state.rows : state.rows.filter((r) => matchTab(tab, r));
    return rows.length;
  }
  function mergeGroupIdOf(rowOrLine) {
    return String((rowOrLine && rowOrLine.mergeGroupId) || '').trim();
  }
  function sumLineQty(lines, getter) {
    return (lines || []).reduce((n, ln) => n + (Number(getter(ln)) || 0), 0);
  }
  function firstNonEmpty(lines, getter) {
    for (let i = 0; i < (lines || []).length; i++) {
      const v = String(getter(lines[i]) || '').trim();
      if (v) return v;
    }
    return '';
  }
  function uniqJoin(lines, getter) {
    return Array.from(new Set((lines || []).map(getter).filter(Boolean))).join('、');
  }
  function shipIdCellHtml(row) {
    const lines = instructionLines(row);
    const n = lines.length;
    const gid = mergeGroupIdOf(row) || lines.map(mergeGroupIdOf).find(Boolean) || '';
    const stacks = lines.map((ln) => {
      const orig = origShipNo(ln) || '—';
      const neu = newShipNo(ln);
      if (gid) {
        return `<div class="oi-id-stack"><div class="oi-id-line"><span class="oi-id-k">原ID</span>${esc(orig)}</div></div>`;
      }
      return `<div class="oi-id-stack">
        <div class="oi-id-line"><span class="oi-id-k">原ID</span>${esc(orig)}</div>
        <div class="oi-id-line"><span class="oi-id-k">新ID</span>${neu ? esc(neu) : '<span style="color:var(--text-muted)">—</span>'}</div>
      </div>`;
    }).join('');
    const head = (gid || n > 1)
      ? `<div class="oi-id-group-head">${
          gid ? `<span class="merge-tag" title="${esc(gid)} · 同组 ${n} 票">合板</span>` : ''
        }${n > 1 ? `<span class="oi-chip" title="${esc(lines.map((ln) => ln.shipNo).filter(Boolean).join('、'))}">${n} 票</span>` : ''}
      </div>`
      : '';
    return `<div class="oi-id-group">${head}${stacks}</div>`;
  }
  function inDayRange(text, from, to) {
    if (!from && !to) return true;
    const day = String(text || '').slice(0, 10);
    if (!day) return false;
    if (from && day < from) return false;
    if (to && day > to) return false;
    return true;
  }
  function lineField(ln, keys) {
    for (let i = 0; i < keys.length; i++) {
      const v = ln && ln[keys[i]];
      if (v != null && String(v).trim() !== '') return String(v).trim();
    }
    return '';
  }
  function originMoveType(ln) {
    const v = lineField(ln, ['originMoveType']);
    if (v) return v;
    const snap = ln && ln.heldSnapshot;
    return String((snap && snap.moveType) || '').trim() || '留仓';
  }
  function matchLineDay(lines, keys, from, to) {
    if (!from && !to) return true;
    return lines.some((ln) => inDayRange(lineField(ln, keys), from, to));
  }

  function renderTabs() {
    const host = document.getElementById('statusTabs');
    if (!host) return;
    host.innerHTML = STATUS_TABS.map((tab) => {
      const active = tab === state.statusTab ? ' active' : '';
      return `<div class="tab${active}" data-tab="${esc(tab)}">${esc(tab)} <span class="tab-count">${countTab(tab)}</span></div>`;
    }).join('');
    host.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.statusTab = btn.getAttribute('data-tab') || '全部';
        runSearch();
      });
    });
  }

  function runSearch() {
    const q = {
      shipNo: parseMultiQuery(val('q_shipNo')),
      customer: val('q_customer'),
      customerRefNo: parseMultiQuery(val('q_customerRefNo')),
      moveType: val('q_moveType'),
      systemNo: parseMultiQuery(val('q_systemNo')),
      containerNo: parseMultiQuery(val('q_containerNo')),
      fbaId: parseMultiQuery(val('q_fbaId')),
      po: parseMultiQuery(val('q_po')),
      fbaCode: parseMultiQuery(val('q_fbaCode')),
      arrivalFrom: val('q_arrivalFrom'),
      arrivalTo: val('q_arrivalTo'),
      unpackFrom: val('q_unpackFrom'),
      unpackTo: val('q_unpackTo'),
      createdFrom: val('q_createdFrom'),
      createdTo: val('q_createdTo'),
    };
    state.filtered = state.rows.filter((r) => {
      if (!matchTab(state.statusTab, r)) return false;
      const lines = instructionLines(r);
      if (!matchAnyField(q.shipNo, lines.reduce(function (acc, ln) {
        acc.push(ln.shipNo, ln.parentShipNo);
        return acc;
      }, []))) return false;
      if (q.customer && String(r.customer || '') !== q.customer) return false;
      if (!matchAnyField(q.customerRefNo, lines.map((ln) => ln.customerRefNo))) return false;
      if (q.moveType && String(r.moveType || '') !== q.moveType) return false;
      if (!matchAnyField(q.systemNo, lines.map((ln) => ln.systemNo).concat([r.instructionNo]))) return false;
      if (!matchAnyField(q.containerNo, lines.map((ln) => ln.containerNo))) return false;
      if (!matchAnyField(q.fbaId, lines.map((ln) => ln.fbaId))) return false;
      if (!matchAnyField(q.po, lines.map((ln) => ln.po))) return false;
      if (!matchAnyField(q.fbaCode, lines.map((ln) => ln.fbaCode))) return false;
      if (!matchLineDay(lines, ['arrivalAt', 'arrivedAt'], q.arrivalFrom, q.arrivalTo)) return false;
      if (!matchLineDay(lines, ['unpackAt', 'devannedAt'], q.unpackFrom, q.unpackTo)) return false;
      if (!inDayRange(r.createdAt, q.createdFrom, q.createdTo)) return false;
      return true;
    });
    state.page = 1;
    renderTabs();
    renderTable();
  }

  function totalPagesOf(total) {
    const size = Math.max(1, Number(state.pageSize) || 10);
    return Math.max(1, Math.ceil((Number(total) || 0) / size));
  }

  function syncPager(total) {
    const pages = totalPagesOf(total);
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;
    const info = document.getElementById('tableInfo');
    if (info) info.textContent = `共 ${total} 条`;
    const totalEl = document.getElementById('oiTotalPages');
    if (totalEl) totalEl.textContent = String(pages);
    const input = document.getElementById('oiPageInput');
    if (input && document.activeElement !== input) input.value = String(state.page);
    const sizeEl = document.getElementById('oiPageSize');
    if (sizeEl && String(sizeEl.value) !== String(state.pageSize)) sizeEl.value = String(state.pageSize);
    const prev = document.getElementById('oiPrev');
    const next = document.getElementById('oiNext');
    if (prev) prev.disabled = state.page <= 1;
    if (next) next.disabled = state.page >= pages;
    const host = document.getElementById('oiPageBtns');
    if (host) {
      let start = Math.max(1, state.page - 2);
      let end = Math.min(pages, start + 4);
      start = Math.max(1, end - 4);
      const btns = [];
      for (let p = start; p <= end; p++) {
        btns.push(
          `<button class="page-btn${p === state.page ? ' active' : ''}" type="button" data-oi-page="${p}">${p}</button>`
        );
      }
      host.innerHTML = btns.join('');
    }
  }

  function pagedItems(items) {
    const size = Math.max(1, Number(state.pageSize) || 10);
    const start = (state.page - 1) * size;
    return items.slice(start, start + size);
  }

  function statusBadge(status) {
    const s = String(status || '-');
    return `<span class="status-badge s-${esc(s)}"><span class="status-dot"></span>${esc(s)}</span>`;
  }

  function opsHtml(row) {
    const st = String(row.status || '');
    const btns = [];
    if (st === '待处理') {
      btns.push(`<button class="btn btn-primary btn-xs" type="button" data-act="start" data-id="${esc(row.id)}">开始处理</button>`);
    } else if (st === '处理中') {
      btns.push(`<button class="btn btn-primary btn-xs" type="button" data-act="complete" data-id="${esc(row.id)}">处理完成</button>`);
    } else {
      btns.push(`<span class="oi-op-slot" aria-hidden="true"></span>`);
    }
    btns.push(`<button class="btn btn-default btn-xs" type="button" data-act="view" data-id="${esc(row.id)}">查看</button>`);
    const extra = [];
    if (st === '待处理') {
      extra.push(`<div class="dropdown-item" data-act="edit" data-id="${esc(row.id)}">编辑</div>`);
    }
    extra.push(`<div class="dropdown-item" data-act="log" data-id="${esc(row.id)}">日志</div>`);
    if (st === '待处理' || st === '处理中') {
      extra.push(`<div class="dropdown-item danger" data-act="cancel" data-id="${esc(row.id)}">取消</div>`);
    }
    btns.push(
      `<div class="btn-with-dropdown">` +
        `<button class="btn btn-default btn-xs" type="button" data-act="more">更多 ▾</button>` +
        `<div class="dropdown-menu">${extra.join('')}</div>` +
      `</div>`
    );
    return `<div class="td-action-inner">${btns.join('')}</div>`;
  }

  function renderTable() {
    closeOiDropdowns();
    const tbody = document.getElementById('tbody');
    const items = state.filtered || [];
    syncPager(items.length);
    const pageItems = pagedItems(items);
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="20" style="text-align:center;color:var(--text-muted);padding:36px 12px;">暂无数据</td></tr>`;
      const chkAllEmpty = document.getElementById('chkAll');
      if (chkAllEmpty) {
        chkAllEmpty.checked = false;
        chkAllEmpty.indeterminate = false;
      }
      return;
    }
    tbody.innerHTML = pageItems.map((r) => {
      const lines = instructionLines(r);
      const checked = state.selectedIds.has(r.id) ? ' checked' : '';
      const files = lines.reduce((acc, ln) => acc.concat(lineFilesOf(ln, r)), []);
      const attachCell = files.length
        ? `<button class="btn btn-default btn-xs" type="button" data-act="files" data-id="${esc(r.id)}">${files.length} 个</button>`
        : '<span style="color:var(--text-muted)">—</span>';
      const note = lines.map((ln) => lineNoteOf(ln, r)).filter(Boolean).join('；');
      const noteCell = note
        ? `<span class="oi-note-cell" title="${esc(note)}">${esc(note)}</span>`
        : '<span style="color:var(--text-muted)">—</span>';
      const isMerge = !!(mergeGroupIdOf(r) || lines.map(mergeGroupIdOf).find(Boolean));
      const refText = uniqJoin(lines, (ln) => ln.customerRefNo) || '—';
      const ctnText = (isMerge ? firstNonEmpty(lines, (ln) => ln.containerNo) : uniqJoin(lines, (ln) => ln.containerNo)) || '—';
      const sysText = (isMerge ? firstNonEmpty(lines, (ln) => ln.systemNo) : uniqJoin(lines, (ln) => ln.systemNo)) || '—';
      const originTypes = uniqJoin(lines, (ln) => originMoveType(ln)) || '—';
      const fbaCodes = uniqJoin(lines, (ln) => ln.fbaCode) || '—';
      const fbaIds = uniqJoin(lines, (ln) => ln.fbaId) || '—';
      const pos = uniqJoin(lines, (ln) => ln.po) || '—';
      return `<tr data-id="${esc(r.id)}">
        <td><input type="checkbox" data-chk="${esc(r.id)}"${checked}></td>
        <td>${shipIdCellHtml(r)}</td>
        <td>${esc(r.customer || '—')}</td>
        <td>${esc(refText)}</td>
        <td>${esc(ctnText)}</td>
        <td>${esc(sysText)}</td>
        <td>${esc(r.moveType || '—')}</td>
        <td>${statusBadge(r.status)}</td>
        <td>${esc(dashNum(sumLineQty(lines, lineForecast)))}</td>
        <td>${esc(dashNum(sumLineQty(lines, lineActual)))}</td>
        <td>${esc(dashNum(sumLineQty(lines, lineOut)))}</td>
        <td>${esc(originTypes)}</td>
        <td>${esc(fbaCodes)}</td>
        <td>${esc(fbaIds)}</td>
        <td>${esc(pos)}</td>
        <td>${noteCell}</td>
        <td>${attachCell}</td>
        <td>${esc(r.createdAt || '—')}</td>
        <td>${esc(createdByOf(r))}</td>
        <td class="td-action">${opsHtml(r)}</td>
      </tr>`;
    }).join('');

    const chkAll = document.getElementById('chkAll');
    if (chkAll) {
      const ids = pageItems.map((r) => r.id);
      const selectedCount = ids.filter((id) => state.selectedIds.has(id)).length;
      chkAll.checked = ids.length > 0 && selectedCount === ids.length;
      chkAll.indeterminate = selectedCount > 0 && selectedCount < ids.length;
    }
  }

  function findRow(id) {
    return state.rows.find((r) => r.id === id);
  }

  function setStatus(id, next, toastMsg) {
    const row = findRow(id);
    if (!row) return false;
    row.status = next;
    if (toastMsg) showToast(toastMsg, 'success');
    runSearch();
    return true;
  }

  function startRow(row, silent) {
    if (!row || row.status !== '待处理') return false;
    row.status = '处理中';
    pushLog(row, '开始处理', '状态由 [待处理] 变更为 [处理中]');
    persistOiRow(row);
    if (!silent) showToast('已开始处理', 'success');
    return true;
  }

  const PX_KEYS = ['qty','fbaCode','fba','po','address','city','state','zip','company','contact','mobile','email','cnName','enName','note'];
  const proxyCtx = {
    selected: new Set(), qty: {}, fbaCode: {}, fba: {}, po: {}, address: {}, city: {}, state: {}, zip: {},
    company: {}, contact: {}, mobile: {}, email: {}, cnName: {}, enName: {}, note: {}, files: {},
    forceDestack: false, wholeMerge: false, mergePrompted: false,
  };
  function resetProxyCtx() {
    proxyCtx.selected.clear();
    proxyCtx.files = {};
    proxyCtx.forceDestack = false;
    proxyCtx.wholeMerge = false;
    proxyCtx.mergePrompted = false;
    PX_KEYS.forEach((k) => { proxyCtx[k] = {}; });
  }
  function openMergeBoardChoice(title, messageHtml, opts) {
    opts = opts || {};
    const allowWhole = opts.allowWhole !== false;
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (done) return; done = true; overlay.remove(); resolve(v); };
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay show';
      overlay.innerHTML = `<div class="modal" style="max-width:560px">
        <div class="modal-header"><span class="modal-title">${esc(title || '合并打板提醒')}</span>
          <button class="modal-close" type="button">×</button></div>
        <div class="modal-body" style="font-size:13px;line-height:1.65;color:var(--text-primary)"></div>
        <div class="modal-footer">
          <button class="btn ${allowWhole ? 'btn-default' : 'btn-primary'}" type="button" data-choice="split">${esc(opts.splitText || '拆板出库')}</button>
          ${allowWhole ? `<button class="btn btn-primary" type="button" data-choice="whole">${esc(opts.wholeText || '整板出库(不拆板)')}</button>` : ''}
        </div>
      </div>`;
      const body = overlay.querySelector('.modal-body');
      if (typeof messageHtml === 'string') body.textContent = messageHtml;
      else if (messageHtml) body.appendChild(messageHtml);
      else body.textContent = '请选择出库方式。';
      overlay.querySelector('.modal-close').addEventListener('click', () => finish(null));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(null); });
      overlay.querySelectorAll('[data-choice]').forEach((btn) => {
        btn.addEventListener('click', () => finish(btn.getAttribute('data-choice')));
      });
      document.body.appendChild(overlay);
    });
  }
  function heldMergePeers(gid) {
    const id = String(gid || '').trim();
    if (!id) return [];
    return heldPoolLive().filter((h) => String(h.mergeGroupId || '').trim() === id);
  }
  async function promptMergeForProxy(selected) {
    const mergeIds = Array.from(new Set((selected || []).map((h) => String(h.mergeGroupId || '').trim()).filter(Boolean)));
    if (!mergeIds.length) return { ok: true, selected: selected || [], forceDestack: false, wholeMerge: false };
    if (mergeIds.length > 1) {
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div>所选货件分属 ${mergeIds.length} 组已合并打板：</div>` +
        mergeIds.map((id, i) => {
          const peers = heldMergePeers(id);
          const picked = (selected || []).filter((h) => String(h.mergeGroupId || '').trim() === id);
          const pickedNames = picked.map((h) => h.shipNo).join('、') || '-';
          const other = peers.filter((h) => !(selected || []).some((s) => s.shipNo === h.shipNo)).map((h) => h.shipNo).join('、');
          const detail = other ? `已勾选 ${pickedNames}，同板还有 ${other}` : `已勾选 ${pickedNames}（同板已全部勾选）`;
          return `<div style="margin-top:6px">第${i + 1}组：${esc(detail)}</div>`;
        }).join('') +
        `<div style="margin-top:10px">整板出库请按组分别发起；本次可将勾选票全部按拆板出库。</div>`;
      const choice = await openMergeBoardChoice('合并打板提醒', wrap, { allowWhole: false, splitText: '拆板出库' });
      if (choice == null) return { ok: false, selected, forceDestack: false, wholeMerge: false };
      return { ok: true, selected, forceDestack: true, wholeMerge: false };
    }
    const gid = mergeIds[0];
    const peers = heldMergePeers(gid);
    if (peers.length < 2) return { ok: true, selected, forceDestack: false, wholeMerge: false };
    const unselected = peers.filter((h) => !(selected || []).some((s) => s.shipNo === h.shipNo));
    const pickedNames = (selected || []).map((h) => h.shipNo).filter(Boolean).join('、');
    const peerNames = peers.map((h) => h.shipNo).join('、');
    const msg = unselected.length
      ? `${pickedNames} 与同板未勾选的 ${unselected.map((h) => h.shipNo).join('、')} 已合并打在同一板上。请选择整板出库，或拆板出库。`
      : `${peerNames} 已合并打在同一板上。请选择整板出库，或拆板出库。`;
    const choice = await openMergeBoardChoice('合并打板提醒', msg, {
      allowWhole: true,
      splitText: '拆板出库',
      wholeText: '整板出库(不拆板)',
    });
    if (choice == null) return { ok: false, selected, forceDestack: false, wholeMerge: false };
    if (choice === 'whole') {
      unselected.forEach((h) => toggleProxyShip(h.shipNo, true));
      const next = heldPoolLive().filter((h) => proxyCtx.selected.has(h.shipNo));
      return { ok: true, selected: next, forceDestack: false, wholeMerge: true };
    }
    return { ok: true, selected, forceDestack: true, wholeMerge: false };
  }
  function syncProxyHint() {
    const hint = document.getElementById('oi-px-hint');
    if (!hint) return;
    if (proxyCtx.wholeMerge) {
      hint.textContent = '合板整组按整板出库：请按组填写出库信息；件数须出满实际库存。';
    } else if (proxyCtx.forceDestack) {
      hint.textContent = '以上货件此前已合并打板，本次按拆板出库。出库件数小于实际件数时会生成新货件ID，余量继续留仓。';
    } else {
      hint.textContent = '出库件数小于实际件数时，会拆出新货件ID（原ID-1）进入出库指令，原票剩余件数继续留仓。';
    }
  }

  function rowPlates(row) {
    if (!row) return [];
    if (!Array.isArray(row.plates)) row.plates = [];
    if (row.plates.length) return row.plates;
    const lines = instructionLines(row);
    const first = lines[0] || {};
    const qty = sumNum(lines, 'qtyCtns') || 1;
    const lbs = sumNum(lines, 'gwKgs') || 0;
    row.plates = [{
      pltNo: 'PLT-' + String(first.shipNo || row.id || 'X').replace(/\s+/g, ''),
      status: '在库',
      pieces: qty,
      lbs: lbs,
      mixed: lines.length > 1,
      fbaCode: first.fbaCode || '',
    }];
    return row.plates;
  }

  function parsePalletCount(raw) {
    const s = String(raw == null ? '' : raw).trim();
    if (!s) return null;
    const n = Number(s);
    if (!Number.isFinite(n) || n < 0 || Math.floor(n) !== n) return null;
    return n;
  }

  function closeOverlay(overlay) {
    if (overlay && overlay.remove) overlay.remove();
  }

  function openOverlay(title, bodyHtml, maxWidth) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay show';
    overlay.innerHTML = `<div class="modal" style="max-width:${maxWidth || 720}px">
      <div class="modal-header"><span class="modal-title">${esc(title)}</span><button class="modal-close" type="button">×</button></div>
      <div class="modal-body"></div>
      <div class="modal-footer"><button class="btn btn-default" type="button" data-close>关闭</button></div>
    </div>`;
    overlay.querySelector('.modal-body').innerHTML = bodyHtml;
    const close = () => closeOverlay(overlay);
    overlay.querySelector('.modal-close').addEventListener('click', close);
    overlay.querySelector('[data-close]').addEventListener('click', close);
    document.body.appendChild(overlay);
    return overlay;
  }

  function dashText(v) {
    const s = String(v == null ? '' : v).trim();
    return (!s || s === '-' || s === '—') ? '—' : s;
  }
  function fmtNum(v, digits) {
    const n = Number(v);
    if (!Number.isFinite(n)) return dashText(v);
    return n.toFixed(digits);
  }
  function viewMetaItem(k, v, span) {
    return `<div class="oi-meta-item${span ? ' oi-view-span' : ''}"><span class="k">${esc(k)}</span><span class="v" title="${esc(v)}">${esc(v)}</span></div>`;
  }
  function attachFileName(f, i) {
    return (f && f.name) ? f.name : ('附件 ' + (i + 1));
  }
  function fmtAttachBytes(x) {
    const v = Number(x);
    if (!Number.isFinite(v) || v <= 0) return '-';
    const u = ['B', 'KB', 'MB', 'GB'];
    const i = Math.min(u.length - 1, Math.floor(Math.log(v) / Math.log(1024)));
    const m = v / Math.pow(1024, i);
    return (m >= 10 || i === 0 ? Math.round(m) : m.toFixed(1)) + ' ' + u[i];

    overlay.id = isComplete ? 'modal-oi-complete' : 'modal-oi-edit';
    const hintText = isComplete
      ? (mergeGid
        ? '合板整组不拆板：无需填写实际板数。出库方式可改，出库件数不可改。'
        : '请按货件填写实际板数（非负整数）。填写后自动同步到收费板数，收费板数可再改。出库方式可改，出库件数不可改。')
      : (mergeGid
        ? '合板整组 · 不拆板，件数不可改。出库方式可改。如需调整件数，请取消本指令后在留仓重新发起。'
        : '出库件数不可修改，出库方式可改。如需调整件数，请取消本指令后在留仓重新发起，或对留仓余票再发一票。');
    const titlePrefix = isComplete ? '处理完成' : '编辑出库指令';
    const titleExtra = lines.length > 1 ? `（${lines.length} 票）` : '';
    overlay.innerHTML = `<div class="modal" style="max-width:920px">
      <div class="modal-header"><span class="modal-title">${titlePrefix}${titleExtra}</span>
        <button class="modal-close" type="button">×</button></div>
      <div class="modal-body">
        <div class="oi-form ${kind === 'pw' ? 'is-mode-pw' : (kind === 'other' ? 'is-mode-other' : 'is-mode-fba')}" data-oi-form>
          <div class="oi-split-hint">${esc(hintText)}</div>
          <div class="form-field" style="margin-bottom:12px">
            <label class="form-label">出库方式 <span class="req">*</span></label>
            <select class="form-select" data-ed-method>
              ${methodSelectOptionsHtml(row.moveType)}
            </select>
          </div>
          ${shipHtml}
          ${palletHtml}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" type="button" data-close>取消</button>
        <button class="btn btn-primary" type="button" data-save>${isComplete ? '确认完成' : '保存'}</button>
      </div>
    </div>`;
    const close = () => overlay.remove();
    overlay.querySelector('.modal-close').addEventListener('click', close);
    overlay.querySelector('[data-close]').addEventListener('click', close);
    const formEl = overlay.querySelector('[data-oi-form]');
    const methodEl = overlay.querySelector('[data-ed-method]');
    if (methodEl) {
      methodEl.addEventListener('change', () => syncOiFormMode(formEl, methodEl.value));
    }
    const editFiles = {};
    if (mergeGid) {
      editFiles.shared = cloneAttachList(lineFilesOf(lines[0], row));
    } else {
      lines.forEach((ln, i) => {
        editFiles[String(i)] = cloneAttachList(lineFilesOf(ln, row));
      });
    }
    const renderEditFiles = (key) => {
      const host = overlay.querySelector('[data-ed-files="' + key + '"]');
      if (host) host.innerHTML = editFileListHtml(editFiles[key] || []);
    };
    const addEditFiles = (key, fileList) => {
      if (!key) return;
      if (!editFiles[key]) editFiles[key] = [];
      Array.from(fileList || []).forEach((f) => {
        editFiles[key].push({ name: f.name, size: f.size, file: f });
      });
      renderEditFiles(key);
    };
    document.body.appendChild(overlay);
    overlay.querySelectorAll('[data-ed-files]').forEach((el) => {
      const key = el.getAttribute('data-ed-files');
      if (!key) return;
      if (!editFiles[key]) editFiles[key] = [];
      renderEditFiles(key);
    });
    overlay.addEventListener('change', (e) => {
      const input = e.target.closest('[data-ed-file]');
      if (!input) return;
      addEditFiles(input.getAttribute('data-ed-file'), input.files);
      input.value = '';
    });
    overlay.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-ed-rm]');
      if (rm) {
        const host = rm.closest('[data-ed-files]');
        const key = host && host.getAttribute('data-ed-files');
        const idx = Number(rm.getAttribute('data-ed-rm'));
        if (key && editFiles[key] && Number.isFinite(idx)) {
          editFiles[key].splice(idx, 1);
          renderEditFiles(key);
        }
        return;
      }
      const drop = e.target.closest('[data-ed-drop]');
      if (!drop || e.target.closest('input[type="file"]') || e.target.closest('[data-ed-rm]')) return;
      const input = drop.querySelector('input[type="file"]');
      if (input) input.click();
    });
    overlay.addEventListener('keydown', (e) => {
      const drop = e.target.closest('[data-ed-drop]');
      if (!drop) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const input = drop.querySelector('input[type="file"]');
        if (input) input.click();
      }
    });
    ['dragenter', 'dragover'].forEach((ev) => {
      overlay.addEventListener(ev, (e) => {
        const drop = e.target.closest('[data-ed-drop]');
        if (!drop) return;
        e.preventDefault();
        e.stopPropagation();
        drop.classList.add('is-drag');
      });
    });
    overlay.addEventListener('dragleave', (e) => {
      const drop = e.target.closest('[data-ed-drop]');
      if (!drop) return;
      if (!drop.contains(e.relatedTarget)) drop.classList.remove('is-drag');
    });
    overlay.addEventListener('drop', (e) => {
      const drop = e.target.closest('[data-ed-drop]');
      if (!drop) return;
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove('is-drag');
      addEditFiles(drop.getAttribute('data-ed-drop'), e.dataTransfer && e.dataTransfer.files);
    });
    const syncLineChargeFromActual = (actualEl) => {
      if (!actualEl) return;
      const card = actualEl.closest('[data-edit-line]');
      if (!card) return;
      const chargeEl = card.querySelector('[data-ed-charge-plt]');
      if (chargeEl) chargeEl.value = actualEl.value;
    };
    overlay.querySelectorAll('[data-ed-actual-plt]').forEach((el) => {
      el.addEventListener('input', () => syncLineChargeFromActual(el));
      el.addEventListener('change', () => syncLineChargeFromActual(el));
    });
    overlay.querySelector('[data-save]').addEventListener('click', () => {
      const method = methodEl ? String(methodEl.value || '').trim() : String(row.moveType || '').trim();
      if (!method) return showToast('请选择出库方式', 'warning');
      const curKind = oiMethodKind(method);
      const changed = [];
      const mark = (label, field, from, to) => {
        if (String(from || '') === String(to || '')) return;
        changed.push((label ? label + ' ' : '') + field);
      };
      mark('', '出库方式', row.moveType, method);
      const applyFromHost = (host, ln, label) => {
        const g = (sel) => {
          const el = host.querySelector(sel);
          return el ? String(el.value || '').trim() : '';
        };
        if (curKind === 'pw') {
          mark(label, 'Address', ln.address, g('[data-ed-address]'));
          mark(label, '城市', ln.city, g('[data-ed-city]'));
          mark(label, '州', ln.state, g('[data-ed-state]'));
          mark(label, '邮编', ln.zipCode, g('[data-ed-zip]'));
          mark(label, '公司名称', ln.companyName, g('[data-ed-company]'));
          mark(label, '联系人', ln.contact, g('[data-ed-contact]'));
          mark(label, '手机', ln.mobile, g('[data-ed-mobile]'));
          mark(label, '邮箱', ln.email, g('[data-ed-email]'));
          mark(label, '中文品名', ln.cnProductName, g('[data-ed-cn]'));
          mark(label, '英文品名', ln.enProductName, g('[data-ed-en]'));
          ln.address = g('[data-ed-address]');
          ln.city = g('[data-ed-city]');
          ln.state = g('[data-ed-state]');
          ln.zipCode = g('[data-ed-zip]');
          ln.companyName = g('[data-ed-company]');
          ln.contact = g('[data-ed-contact]');
          ln.mobile = g('[data-ed-mobile]');
          ln.email = g('[data-ed-email]');
          ln.cnProductName = g('[data-ed-cn]');
          ln.enProductName = g('[data-ed-en]');
        } else {
          mark(label, 'FBA Code', ln.fbaCode, g('[data-ed-fba-code]'));
          mark(label, 'FBA ID', ln.fbaId, g('[data-ed-fba]'));
          mark(label, 'PO', ln.po, g('[data-ed-po]'));
          ln.fbaCode = g('[data-ed-fba-code]');
          ln.fbaId = g('[data-ed-fba]');
          ln.po = g('[data-ed-po]');
        }
        mark(label, '备注', ln.note, g('[data-ed-note]'));
        ln.note = g('[data-ed-note]');
      };
      if (mergeGid) {
        const host = overlay.querySelector('[data-edit-shared]');
        if (!host) return;
        const g = (sel) => {
          const el = host.querySelector(sel);
          return el ? String(el.value || '').trim() : '';
        };
        if (curKind === 'fba') {
          if (!g('[data-ed-fba-code]')) return showToast('请选择 FBA Code', 'warning');
          if (!g('[data-ed-fba]')) return showToast('请填写 FBA ID', 'warning');
          if (!g('[data-ed-po]')) return showToast('请填写 PO', 'warning');
        }
        if (curKind === 'pw' && !g('[data-ed-address]')) return showToast('请填写 Address', 'warning');
        lines.forEach((ln, i) => {
          applyFromHost(host, ln, ln.shipNo || '货件');
          if (i === 0 && curKind === 'pw') row.address = ln.address;
        });
      } else {
        const cardsEl = overlay.querySelectorAll('[data-edit-line]');
        for (let i = 0; i < cardsEl.length; i++) {
          const card = cardsEl[i];
          const ln = lines[Number(card.getAttribute('data-edit-line'))];
          if (!ln) continue;
          const g = (sel) => {
            const el = card.querySelector(sel);
            return el ? String(el.value || '').trim() : '';
          };
          const label = ln.shipNo || '货件';
          if (curKind === 'fba') {
            if (!g('[data-ed-fba-code]')) return showToast(label + '：请选择 FBA Code', 'warning');
            if (!g('[data-ed-fba]')) return showToast(label + '：请填写 FBA ID', 'warning');
            if (!g('[data-ed-po]')) return showToast(label + '：请填写 PO', 'warning');
          }
          if (curKind === 'pw' && !g('[data-ed-address]')) return showToast(label + '：请填写 Address', 'warning');
          applyFromHost(card, ln, label);
          if (i === 0 && curKind === 'pw') row.address = ln.address;
        }
      }
      const normalizeFiles = (list) => (list || []).map((f) => ({ name: f.name, size: f.size }));
      const filesSig = (list) => normalizeFiles(list).map((f) => f.name + ':' + (f.size || 0)).join('|');
      if (mergeGid) {
        const shared = normalizeFiles(editFiles.shared);
        const before = filesSig(lineFilesOf(lines[0], row));
        lines.forEach((ln) => {
          ln.attachments = shared.slice();
          ln.outboundAttachments = shared.slice();
        });
        row.attachments = shared.slice();
        if (before !== filesSig(shared)) changed.push('附件');
      } else {
        let filesChanged = false;
        lines.forEach((ln, i) => {
          const before = filesSig(lineFilesOf(ln, row));
          const files = normalizeFiles(editFiles[String(i)]);
          ln.attachments = files;
          ln.outboundAttachments = files;
          if (before !== filesSig(files)) filesChanged = true;
        });
        row.attachments = lines.reduce((acc, ln) => acc.concat(ln.attachments || []), []);
        if (filesChanged) changed.push('附件');
      }
      row.moveType = method;
      row.note = lines.map((ln) => ln.note).filter(Boolean).join('\n');
      if (isComplete) {
        if (mergeGid) {
          delete row.actualPallets;
          delete row.chargePallets;
          lines.forEach((ln) => {
            delete ln.actualPallets;
            delete ln.chargePallets;
          });
          rowPlates(row).forEach((p) => {
            if (p.status === '在库') p.status = '已安排';
          });
          row.status = '已完成';
          pushLog(row, '处理完成',
            (changed.length ? ('修改了 ' + changed.join('、') + '；') : '') +
            '状态由 [处理中] 变更为 [已完成]（整板出库，未填实际板数）');
          persistOiRow(row);
          close();
          showToast('已确认完成', 'success');
          runSearch();
          return;
        }
        const palletNotes = [];
        for (let i = 0; i < lines.length; i++) {
          const card = overlay.querySelector('[data-edit-line="' + i + '"]');
          const ln = lines[i];
          const actualEl = card ? card.querySelector('[data-ed-actual-plt]') : null;
          const chargeEl = card ? card.querySelector('[data-ed-charge-plt]') : null;
          const actual = parsePalletCount(actualEl && actualEl.value);
          const charge = parsePalletCount(chargeEl && chargeEl.value);
          if (actual == null) {
            if (actualEl) actualEl.classList.add('is-error');
            return showToast((ln.shipNo || ('第' + (i + 1) + '票')) + '：请填写实际板数（非负整数）', 'warning');
          }
          if (charge == null) {
            if (chargeEl) chargeEl.classList.add('is-error');
            return showToast((ln.shipNo || ('第' + (i + 1) + '票')) + '：请填写收费板数（非负整数）', 'warning');
          }
          if (actualEl) actualEl.classList.remove('is-error');
          if (chargeEl) chargeEl.classList.remove('is-error');
          ln.actualPallets = actual;
          ln.chargePallets = charge;
          palletNotes.push((ln.shipNo || ('L' + (i + 1))) + ' 实际' + actual + '/收费' + charge);
        }
        if (lines.length === 1) {
          row.actualPallets = lines[0].actualPallets;
          row.chargePallets = lines[0].chargePallets;
        } else {
          delete row.actualPallets;
          delete row.chargePallets;
        }
        rowPlates(row).forEach((p) => {
          if (p.status === '在库') p.status = '已安排';
        });
        row.status = '已完成';
        pushLog(row, '处理完成',
          (changed.length ? ('修改了 ' + changed.join('、') + '；') : '') +
          '状态由 [处理中] 变更为 [已完成]；' + palletNotes.join('，'));
        persistOiRow(row);
        close();
        showToast('已确认完成', 'success');
        runSearch();
        return;
      }
      pushLog(row, '编辑出库指令', changed.length ? ('修改了 ' + changed.join('、')) : '保存出库指令');
      persistOiRow(row);
      close();
      showToast('已保存出库指令', 'success');
      runSearch();
    });
  }

  function csvCell(v) {
    const s = String(v == null ? '' : v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportCsv() {
    const items = flattenLines(state.filtered || []);
    if (!items.length) return showToast('暂无数据可导出', 'warning');
    const headers = ['指令单号','原货件ID','新货件ID','客户','Customer Ref No','出库方式','来源','指令状态','柜号','系统单号','原Move Type','FBA Code','FBA ID','PO','预报件数','实际件数','出库件数','发起时间','发起人','备注'];
    const body = items.map((it) => {
      const r = it.row;
      const ln = it.line || {};
      return [
        r.instructionNo,
        origShipNo(ln),
        newShipNo(ln),
        r.customer,
        ln.customerRefNo,
        r.moveType,
        sourceLabel(r),
        r.status,
        ln.containerNo,
        ln.systemNo,
        originMoveType(ln),
        ln.fbaCode,
        ln.fbaId,
        ln.po,
        lineForecast(ln),
        lineActual(ln),
        lineOut(ln),
        r.createdAt,
        createdByOf(r),
        lineNoteOf(ln, r),
      ].map(csvCell).join(',');
    });
    const blob = new Blob(['\ufeff' + [headers.join(',')].concat(body).join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '出库指令-导出-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 1500);
    showToast('已导出 ' + items.length + ' 条', 'success');
  }

  function batchStart() {
    const ids = Array.from(state.selectedIds);
    const pending = ids.map(findRow).filter((r) => r && r.status === '待处理');
    if (!pending.length) return showToast('请勾选待处理的出库指令', 'warning');
    confirmAction('开始处理', '确认开始处理？开始后状态将变为「处理中」。', () => {
      pending.forEach((r) => startRow(r, true));
      showToast('已开始处理 ' + pending.length + ' 条', 'success');
      runSearch();
    });
  }

  function openFiles(id, lineIndex) {
    const row = findRow(id);
    if (!row) return;
    const idx = lineIndex == null || lineIndex === '' ? -1 : Number(lineIndex);
    const lines = instructionLines(row);
    let files = (idx >= 0 && lines[idx])
      ? lineFilesOf(lines[idx], row)
      : lines.reduce((acc, ln) => acc.concat(lineFilesOf(ln, row)), []);
    if (!files.length && Array.isArray(row.attachments)) files = row.attachments;
    if (!files.length) return showToast('暂无附件', 'warning');

    const bodyWrap = document.createElement('div');
    bodyWrap.innerHTML = renderViewFiles(files);
    bindFileActions(bodyWrap, files);

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay show';
    overlay.innerHTML = `<div class="modal" style="max-width:640px">
      <div class="modal-header"><span class="modal-title">附件（${esc(firstLine(row).shipNo || firstLine(row).systemNo || '-')}）</span><button class="modal-close" type="button">×</button></div>
      <div class="modal-body"></div>
      <div class="modal-footer"><button class="btn btn-default" type="button" data-close>关闭</button></div>
    </div>`;
    overlay.querySelector('.modal-body').appendChild(bodyWrap);
    const close = () => overlay.remove();
    overlay.querySelector('.modal-close').addEventListener('click', close);
    overlay.querySelector('[data-close]').addEventListener('click', close);
    document.body.appendChild(overlay);
  }

  function confirmAction(title, message, onOk) {
    if (typeof openSharedConfirm === 'function') {
      openSharedConfirm(title, message).then((ok) => { if (ok) onOk(); });
      return;
    }
    if (window.confirm(message)) onOk();
  }

  const _oiDpPortals = new Map();
  function closeOiDropdowns() {
    document.querySelectorAll('.btn-with-dropdown.open').forEach((w) => w.classList.remove('open'));
    _oiDpPortals.forEach((parent, menu) => {
      menu.classList.remove('is-portal');
      menu.style.cssText = '';
      parent.appendChild(menu);
    });
    _oiDpPortals.clear();
  }
  function openOiDropdown(btn) {
    const wrapper = btn.closest('.btn-with-dropdown');
    const menu = wrapper && wrapper.querySelector('.dropdown-menu');
    if (!wrapper || !menu) return;
    const wasOpen = wrapper.classList.contains('open');
    closeOiDropdowns();
    if (wasOpen) return;
    const pad = 8;
    const rect = btn.getBoundingClientRect();
    _oiDpPortals.set(menu, wrapper);
    document.body.appendChild(menu);
    menu.classList.add('is-portal');
    menu.style.cssText = 'position:fixed;visibility:hidden;display:block;z-index:12000;top:0;left:0;';
    const mw = menu.offsetWidth || 108;
    const mh = menu.offsetHeight || 36;
    const vh = window.innerHeight;
    const vw = window.innerWidth;
    let top = rect.bottom + 4;
    if (top + mh > vh - pad && rect.top - 4 - mh >= pad) top = rect.top - mh - 4;
    let left = rect.right - mw;
    left = Math.max(pad, Math.min(left, vw - mw - pad));
    menu.style.cssText = 'position:fixed;z-index:12000;display:block;top:' + top + 'px;left:' + left + 'px;';
    wrapper.classList.add('open');
  }
  function persistHeldPatches(mutator) {
    try {
      const patchStore = 'meekoo-wms-held-patches';
      const data = JSON.parse(localStorage.getItem(patchStore) || '{}') || {};
      mutator(data);
      localStorage.setItem(patchStore, JSON.stringify(data));
    } catch (e) {}
  }
  function restoreHeldOnCancel(row) {
    if (!row) return;
    instructionLines(row).forEach((ln) => {
      const origin = String(ln.parentShipNo || ln.parentId || '').trim();
      if (!origin) return;
      const out = Number(ln.outboundQty || ln.outQty || ln.qtyCtns) || 0;
      const snap = ln.heldSnapshot || {};
      if (ln.isSplit) {
        const held = heldByShip(origin);
        if (held) held.actualQty = (heldStockQty(held) || 0) + out;
        persistHeldPatches((data) => {
          const pt = data[origin] || {};
          const cur = Number(pt.actualQty);
          pt.actualQty = Number.isFinite(cur) ? cur + out : (held ? heldStockQty(held) : (Number(snap.actualQty) || out));
          delete pt.instructionNo;
          data[origin] = pt;
        });
      } else {
        if (!heldByShip(origin)) {
          state.heldPool.push({
            id: 'H-' + origin,
            shipNo: origin,
            customer: row.customer,
            customerRefNo: ln.customerRefNo,
            systemNo: snap.systemNo || String(ln.systemNo || '').replace(/-\d+$/, ''),
            containerNo: ln.containerNo,
            qtyCtns: snap.qtyCtns || ln.forecastQty || ln.qtyCtns,
            actualQty: snap.actualQty != null ? snap.actualQty : out,
            volCbm: snap.volCbm != null ? snap.volCbm : ln.volCbm,
            gwKgs: snap.gwKgs != null ? snap.gwKgs : ln.gwKgs,
            pallets: snap.pallets != null ? snap.pallets : ln.pallets,
            chargePallets: snap.chargePallets != null ? snap.chargePallets : ln.chargePallets,
            fbaId: ln.fbaId,
            po: ln.po,
            fbaCode: ln.fbaCode,
            address: ln.address || row.address,
            city: ln.city,
            state: ln.state,
            zipCode: ln.zipCode,
            mergeGroupId: row.mergeGroupId || '',
            moveType: snap.moveType || '留仓',
          });
        }
        persistHeldPatches((data) => {
          if (snap.splitSeq) {
            data[origin] = { actualQty: snap.actualQty ?? snap.qtyCtns, splitSeq: snap.splitSeq };
          } else {
            delete data[origin];
          }
        });
      }
    });
  }
  function cancelInstruction(id) {
    const row = findRow(id);
    if (!row) return;
    if (row.status !== '待处理' && row.status !== '处理中') return showToast('当前状态不可取消', 'warning');
    const label = firstLine(row).shipNo || firstLine(row).systemNo || '-';
    const hasSplit = instructionLines(row).some((ln) => ln.isSplit);
    const msg = hasSplit
      ? `确认取消出库指令 ${label}？取消后拆出的件数将加回原票。`
      : `确认取消出库指令 ${label}？取消后货件将回到留仓。`;
    confirmAction('取消出库指令', msg, () => {
      restoreHeldOnCancel(row);
      pushLog(row, '取消出库指令', '状态变更为 [已取消]');
