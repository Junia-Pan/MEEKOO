            <div class="form-field"><label class="form-label">联系人</label><input class="form-input" data-px-contact="${no}" value="${esc(val('contact', h.contact))}" placeholder="请输入联系人"${disabled}></div>
            <div class="form-field"><label class="form-label">手机</label><input class="form-input" data-px-mobile="${no}" value="${esc(val('mobile', h.mobile))}" placeholder="请输入手机"${disabled}></div>
            <div class="form-field"><label class="form-label">邮箱</label><input class="form-input" data-px-email="${no}" value="${esc(val('email', h.email))}" placeholder="请输入邮箱"${disabled}></div>
            <div class="form-field"><label class="form-label">中文品名</label><input class="form-input" data-px-cn="${no}" value="${esc(val('cnName', h.cnProductName))}" placeholder="请输入中文品名"${disabled}></div>
            <div class="form-field"><label class="form-label">英文品名</label><input class="form-input" data-px-en="${no}" value="${esc(val('enName', h.enProductName))}" placeholder="请输入英文品名"${disabled}></div>
          </div></div>
          <div class="form-field"><label class="form-label">备注</label>
            <textarea class="form-textarea" rows="2" data-px-note="${no}" placeholder="请输入备注"${disabled}>${esc(val('note', ''))}</textarea>
          </div>
          <div class="form-field"><label class="form-label">附件</label>
            <div class="file-drop is-compact" data-px-drop="${no}" tabindex="0" role="button" aria-label="上传附件">
              <input type="file" hidden multiple data-px-file="${no}"${disabled}>
              <div class="file-drop-title">点击或拖拽文件到此处上传</div>
              <div class="file-drop-hint">支持常见文件，可多选</div>
            </div>
            <div data-px-files="${no}">${proxyFileHtml(h.shipNo)}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  function addProxyFiles(shipNo, fileList) {
    if (!proxyCtx.files[shipNo]) proxyCtx.files[shipNo] = [];
    Array.from(fileList || []).forEach((f) => {
      proxyCtx.files[shipNo].push({ name: f.name, size: f.size });
    });
    renderProxyShipFiles(shipNo);
  }
  async function openProxy(preShip) {
    resetProxyCtx();
    const methodEl = document.getElementById('oi-px-method');
    if (methodEl) methodEl.value = '';
    const ship = String(preShip || '').trim();
    if (ship) {
      if (heldByShip(ship) && heldStockQty(heldByShip(ship)) > 0) toggleProxyShip(ship, true);
      else showToast('在库留仓池未找到 ' + ship, 'warning');
    }
    let selected = heldPoolLive().filter((h) => proxyCtx.selected.has(h.shipNo));
    if (selected.length) {
      const hasMergeOpen = selected.some((h) => String(h.mergeGroupId || '').trim());
      const hasSoloOpen = selected.some((h) => !String(h.mergeGroupId || '').trim());
      if (hasMergeOpen && hasSoloOpen) return showToast('合并打板货件与独立货件请分开发起出库', 'warning');
      const mergeResult = await promptMergeForProxy(selected);
      if (!mergeResult.ok) return;
      proxyCtx.forceDestack = !!mergeResult.forceDestack;
      proxyCtx.wholeMerge = !!mergeResult.wholeMerge;
      proxyCtx.mergePrompted = true;
      if (proxyCtx.wholeMerge) {
        selected = mergeResult.selected || selected;
        selected.forEach((h) => { proxyCtx.qty[h.shipNo] = heldStockQty(h); });
      }
    }
    syncProxyHint();
    renderProxyPool();
    syncOiFormMode('oi-px-form', methodEl ? methodEl.value : '');
    showModal('modal-oi-proxy');
  }
  function buildPlatesFromLines(lines, id) {
    const qty = sumNum(lines, 'outboundQty') || sumNum(lines, 'qtyCtns') || 1;
    const lbs = sumNum(lines, 'gwKgs') || 0;
    const plateCount = Math.max(1, Math.ceil(qty / 5));
    const per = Math.ceil(qty / plateCount);
    const perLbs = Math.round(lbs / plateCount) || 0;
    const plates = [];
    let left = qty;
    for (let i = 0; i < plateCount; i++) {
      const pieces = Math.min(per, left);
      left -= pieces;
      plates.push({
        pltNo: 'PLT-' + String(id || 'X').replace(/\s+/g, '') + '-' + String(i + 1).padStart(3, '0'),
        status: '在库',
        pieces: pieces,
        lbs: perLbs,
        mixed: lines.length > 1,
        fbaCode: (lines[0] && lines[0].fbaCode) || '',
      });
    }
    return plates;
  }
  function peekSplit(shipNo) {
    let n = Number((heldByShip(shipNo) || {}).splitSeq) || 0;
    state.rows.forEach((r) => {
      instructionLines(r).forEach((ln) => {
        if (String(ln.parentShipNo || '') !== shipNo) return;
        const m = String(ln.shipNo || '').match(/-(\d+)$/);
        if (m) n = Math.max(n, Number(m[1]) || 0);
      });
    });
    return n;
  }
  async function submitProxy() {
    captureProxyCards();
    const method = val('oi-px-method');
    if (!method) return showToast('请选择出库方式', 'warning');
    const kind = oiMethodKind(method);
    let selected = heldPoolLive().filter((h) => proxyCtx.selected.has(h.shipNo));
    if (!selected.length) return showToast('请勾选至少一票在库留仓货件', 'warning');
    const customers = [];
    selected.forEach((h) => {
      if (customers.indexOf(h.customer) < 0) customers.push(h.customer);
    });
    if (customers.length > 1) return showToast('一次只能代同一客户发起', 'warning');

    const hasMerge = selected.some((h) => String(h.mergeGroupId || '').trim());
    const hasSolo = selected.some((h) => !String(h.mergeGroupId || '').trim());
    if (hasMerge && hasSolo) return showToast('合并打板货件与独立货件请分开发起出库', 'warning');
    if (hasMerge && !proxyCtx.mergePrompted) {
      const mergeResult = await promptMergeForProxy(selected);
      if (!mergeResult.ok) return;
      proxyCtx.forceDestack = !!mergeResult.forceDestack;
      proxyCtx.wholeMerge = !!mergeResult.wholeMerge;
      proxyCtx.mergePrompted = true;
      if (proxyCtx.wholeMerge) {
        selected = mergeResult.selected || selected;
        selected.forEach((h) => { proxyCtx.qty[h.shipNo] = heldStockQty(h); });
        syncProxyHint();
        renderProxyPool();
        syncOiFormMode('oi-px-form', method);
        return showToast('已按整板带入同板货件，请确认后再次提交', 'info');
      }
      syncProxyHint();
      selected = heldPoolLive().filter((h) => proxyCtx.selected.has(h.shipNo));
    }

    const mergeIds = [];
    selected.forEach((h) => {
      const gid = String(h.mergeGroupId || '').trim();
      if (gid && mergeIds.indexOf(gid) < 0) mergeIds.push(gid);
    });
    const singleGid = mergeIds.length === 1 ? mergeIds[0] : '';
    const peersLeft = singleGid
      ? heldMergePeers(singleGid).filter((h) => !selected.some((s) => s.shipNo === h.shipNo))
      : [];
    const anyPartial = selected.some((h) => {
      const max = heldStockQty(h);
      const qty = Number(proxyCtx.qty[h.shipNo]);
      return max && Number.isFinite(qty) && qty < max;
    });
    const destackRequired = proxyCtx.wholeMerge
      ? false
      : (proxyCtx.forceDestack || anyPartial || peersLeft.length > 0 || mergeIds.length > 1);
    if (proxyCtx.wholeMerge) {
      for (let i = 0; i < selected.length; i++) {
        const h = selected[i];
        const max = heldStockQty(h);
        const qty = Number(proxyCtx.qty[h.shipNo]);
        if (max && qty !== max) return showToast(h.shipNo + '：整板出库须出满实际件数（' + max + '）', 'warning');
      }
    }

    const lines = [];
    let splitCount = 0;
    for (let i = 0; i < selected.length; i++) {
      const h = selected[i];
      const max = heldStockQty(h);
      const qty = Number(proxyCtx.qty[h.shipNo]);
      if (!Number.isFinite(qty) || qty < 1 || !Number.isInteger(qty)) return showToast(h.shipNo + '：请填写有效的出库件数', 'warning');
      if (max && qty > max) return showToast(h.shipNo + '：出库件数不能大于实际件数（' + max + '）', 'warning');
      const pick = (key) => String(proxyCtx[key][h.shipNo] || '').trim();
      if (kind === 'fba') {
        if (!pick('fbaCode')) return showToast(h.shipNo + '：请选择 FBA Code', 'warning');
        if (!pick('fba')) return showToast(h.shipNo + '：请填写 FBA ID', 'warning');
        if (!pick('po')) return showToast(h.shipNo + '：请填写 PO', 'warning');
      }
      if (kind === 'pw' && !pick('address')) return showToast(h.shipNo + '：请填写 Address', 'warning');
      const fbaId = kind === 'pw' ? (h.fbaId || '') : pick('fba');
      const fbaCode = kind === 'pw' ? (h.fbaCode || '') : pick('fbaCode');
      const po = kind === 'pw' ? (h.po || '') : pick('po');
      const address = kind === 'pw' ? pick('address') : (h.address || '');
      const city = kind === 'pw' ? pick('city') : (h.city || '');
      const state = kind === 'pw' ? pick('state') : (h.state || '');
      const zipCode = kind === 'pw' ? pick('zip') : (h.zipCode || '');
      const companyName = kind === 'pw' ? pick('company') : (h.companyName || '');
      const contact = kind === 'pw' ? pick('contact') : (h.contact || '');
      const mobile = kind === 'pw' ? pick('mobile') : (h.mobile || '');
      const email = kind === 'pw' ? pick('email') : (h.email || '');
      const cnProductName = kind === 'pw' ? pick('cnName') : (h.cnProductName || '');
      const enProductName = kind === 'pw' ? pick('enName') : (h.enProductName || '');
      const note = pick('note');
      const attachments = (proxyCtx.files[h.shipNo] || []).map((f) => ({ name: f.name, size: f.size }));
      const isSplit = max && qty < max;
      let shipNo = h.shipNo;
      let systemNo = h.systemNo;
      let volCbm = h.volCbm;
      let gwKgs = h.gwKgs;
      let pallets = h.pallets;
      let chargePallets = h.chargePallets;
      const heldSnapshot = {
        shipNo: h.shipNo,
        systemNo: h.systemNo,
        qtyCtns: h.qtyCtns,
        actualQty: max,
        splitSeq: h.splitSeq || 0,
        moveType: h.moveType,
        arrivalAt: h.arrivalAt || h.arrivedAt || '',
        unpackAt: h.unpackAt || h.devannedAt || '',
        volCbm: h.volCbm,
        gwKgs: h.gwKgs,
        pallets: h.pallets,
        chargePallets: h.chargePallets,
        customer: h.customer,
        mergeGroupId: h.mergeGroupId || '',
      };
      if (isSplit) {
        const n = peekSplit(h.shipNo) + 1;
        h.splitSeq = n;
        shipNo = h.shipNo + '-' + n;
        systemNo = h.systemNo ? h.systemNo + '-' + n : '';
        volCbm = '';
        gwKgs = '';
        pallets = '';
        chargePallets = '';
        h.actualQty = max - qty;
        splitCount += 1;
      }
      lines.push({
        shipNo,
        parentShipNo: isSplit ? h.shipNo : '',
        parentId: h.shipNo,
        isSplit: !!isSplit,
        destackRequired: !!(destackRequired || isSplit),
        customerRefNo: h.customerRefNo,
        systemNo,
        containerNo: h.containerNo,
        qtyCtns: qty,
        forecastQty: h.qtyCtns,
        actualQty: max,
        outboundQty: qty,
        outQty: qty,
        volCbm,
        gwKgs,
        pallets,
        chargePallets,
        fbaId,
        po,
        fbaCode,
        address,
        city,
        state,
        zipCode,
        companyName,
        contact,
        mobile,
        email,
        cnProductName,
        enProductName,
        note,
        attachments,
        outboundAttachments: attachments,
        originMoveType: h.moveType || '留仓',
        arrivalAt: h.arrivalAt || h.arrivedAt || '',
        unpackAt: h.unpackAt || h.devannedAt || '',
        originMergeGroupId: h.mergeGroupId || singleGid || '',
        heldSnapshot,
      });
    }
    const mergeGroupId = (!destackRequired && singleGid && selected.every((h) => String(h.mergeGroupId || '').trim() === singleGid))
      ? singleGid
      : '';
    const seq = state.oiSeq++;
    const instructionNo = 'OI-2026-' + String(seq).padStart(4, '0');
    const id = 'OI-' + String(seq).padStart(3, '0');
    const first = selected[0];
    state.rows.unshift({
      id: id,
      instructionNo: instructionNo,
      customer: first.customer,
      moveType: method,
      status: '待处理',
      source: '仓库发起',
      createdBy: '张伟',
      address: (lines[0] && lines[0].address) || first.address || '',
      mergeGroupId: mergeGroupId,
      note: lines.map((ln) => ln.note).filter(Boolean).join('\n'),
      attachments: lines.reduce((acc, ln) => acc.concat(ln.attachments || []), []),
      createdAt: nowStamp(),
      lines: lines,
      plates: buildPlatesFromLines(lines, id),
      logs: [{
        t: nowStamp(),
        s: '发起出库指令',
        by: '张伟（仓库）',
        desc: '仓库发起 · ' + method + (destackRequired ? '（需拆板）' : (mergeGroupId ? '（合板整组不拆板）' : (splitCount ? '（含拆票）' : ''))),
      }],
    });
    const fullIds = new Set(lines.filter((ln) => !ln.isSplit).map((ln) => ln.parentId || ln.shipNo));
    state.heldPool = state.heldPool.filter((h) => !fullIds.has(h.shipNo));
    try {
      const patchStore = 'meekoo-wms-held-patches';
      const data = JSON.parse(localStorage.getItem(patchStore) || '{}') || {};
      lines.forEach((ln) => {
        const origin = ln.parentId || ln.parentShipNo || ln.shipNo;
        if (!origin) return;
        if (ln.isSplit) {
          const held = heldByShip(origin);
          data[origin] = {
            actualQty: held ? heldStockQty(held) : Math.max(0, (Number(ln.actualQty) || 0) - (Number(ln.outboundQty) || 0)),
            splitSeq: (held && held.splitSeq) || peekSplit(origin),
          };
        } else {
          data[origin] = Object.assign({}, data[origin] || {}, { actualQty: 0, instructionNo: instructionNo });
        }
      });
      localStorage.setItem(patchStore, JSON.stringify(data));
    } catch (e) {}
    proxyCtx.selected.clear();
    persistOiRow(state.rows[0]);
    closeModal('modal-oi-proxy');
    const msg = destackRequired
      ? (splitCount
        ? (selected.length === 1 ? '已发起出库指令（需拆板），部分件数已拆出新货件ID' : ('已发起出库指令（需拆板 · ' + selected.length + ' 票）'))
        : (selected.length > 1 ? ('已发起出库指令（需拆板 · ' + selected.length + ' 票）') : '已发起出库指令（需拆板）'))
      : (mergeGroupId ? '已发起出库指令（合板整组不拆板）' : (selected.length > 1 ? ('已发起出库指令（' + selected.length + ' 票）') : '已发起出库指令'));
    showToast(msg, 'success');
    runSearch();
  }
  function bindProxyDrop() {
    const host = document.getElementById('oi-px-cards');
    if (!host) return;
    host.addEventListener('change', (e) => {
      const chk = e.target.closest('[data-px-ship]');
      if (chk) {
        captureProxyCards();
        toggleProxyShip(chk.getAttribute('data-px-ship'), chk.checked);
        renderProxyPool();
        return;
      }
      if (!e.target.closest('[data-px-file]')) captureProxyCards();
      const input = e.target.closest('[data-px-file]');
      if (input) {
        addProxyFiles(input.getAttribute('data-px-file'), input.files);
        input.value = '';
      }
    });
    host.addEventListener('input', () => {
      captureProxyCards();
    });
    host.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-px-rm-ship]');
      if (rm) {
        const shipNo = rm.getAttribute('data-px-rm-ship');
        const idx = Number(rm.getAttribute('data-px-rm'));
        if (proxyCtx.files[shipNo]) proxyCtx.files[shipNo].splice(idx, 1);
        renderProxyShipFiles(shipNo);
        return;
      }
      const drop = e.target.closest('[data-px-drop]');
      if (!drop || e.target.closest('input[type="file"]')) return;
      const shipNo = drop.getAttribute('data-px-drop');
      if (shipNo !== '__shared__' && !proxyCtx.selected.has(shipNo)) return;
      const input = drop.querySelector('input[type="file"]');
      if (input) input.click();
    });
    host.addEventListener('keydown', (e) => {
      const drop = e.target.closest('[data-px-drop]');
      if (!drop) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const input = drop.querySelector('input[type="file"]');
        if (input && !input.disabled) input.click();
      }
    });
    ['dragenter', 'dragover'].forEach((ev) => {
      host.addEventListener(ev, (e) => {
        const drop = e.target.closest('[data-px-drop]');
        if (!drop) return;
        e.preventDefault();
        e.stopPropagation();
        drop.classList.add('is-drag');
      });
    });
    host.addEventListener('dragleave', (e) => {
      const drop = e.target.closest('[data-px-drop]');
      if (!drop) return;
      if (!drop.contains(e.relatedTarget)) drop.classList.remove('is-drag');
    });
    host.addEventListener('drop', (e) => {
      const drop = e.target.closest('[data-px-drop]');
      if (!drop) return;
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove('is-drag');
      const shipNo = drop.getAttribute('data-px-drop');
      if (shipNo !== '__shared__' && !proxyCtx.selected.has(shipNo)) return showToast('请先勾选该票', 'warning');
      addProxyFiles(shipNo, e.dataTransfer && e.dataTransfer.files);
    });
  }
  function consumeQuery() {
    const params = new URLSearchParams(location.search || '');
    const openNo = String(params.get('open') || '').trim();
    const proxy = params.get('proxy') === '1';
    const ship = String(params.get('ship') || '').trim();
    if (openNo) {
      const row = state.rows.find((r) => r.instructionNo === openNo || r.id === openNo);
      if (!row) return showToast('未找到指令 ' + openNo, 'warning');
      if (row.status === '处理中') openComplete(row.id);
      else if (row.status === '待处理') openDetail(row.id);
      else openDetail(row.id);
      return;
    }
    if (proxy) openProxy(ship);
  }

  document.getElementById('btnExport').addEventListener('click', exportCsv);
  document.getElementById('btnBatchStart').addEventListener('click', batchStart);
  document.getElementById('btnOiPxSubmit').addEventListener('click', submitProxy);
  const oiPxMethod = document.getElementById('oi-px-method');
  if (oiPxMethod) oiPxMethod.addEventListener('change', () => syncOiFormMode('oi-px-form', oiPxMethod.value));
  bindProxyDrop();
  document.addEventListener('click', (e) => {
    const menuItem = e.target.closest('.dropdown-menu .dropdown-item[data-act]');
    if (menuItem) {
      const id = menuItem.getAttribute('data-id');
      const act = menuItem.getAttribute('data-act');
      closeOiDropdowns();
      if (act === 'cancel') cancelInstruction(id);
      else if (act === 'edit') openEdit(id);
      else if (act === 'log') showInstructionLog(id);
      return;
    }
    if (e.target.closest('.btn-with-dropdown') || e.target.closest('.dropdown-menu')) return;
    closeOiDropdowns();
  });
  const oiTableWrap = document.querySelector('.table-wrap');
  if (oiTableWrap) oiTableWrap.addEventListener('scroll', closeOiDropdowns);
  window.addEventListener('resize', closeOiDropdowns);

  initCommon();
  runSearch();
  consumeQuery();
})();
</script>
</body>
