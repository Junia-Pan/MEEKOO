<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 供应商管理</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>基础数据</span><span class="sep">›</span><span class="current">供应商管理</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">🚚</div>供应商管理</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">供应商名称</label><input class="search-input" placeholder="请输入供应商名称"></div>
        <div class="search-field"><label class="search-label">分类</label><select class="search-select"><option>全部</option><option>卡派公司</option><option>船司</option></select></div>
        <div class="search-field"><label class="search-label">状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card"><div class="table-toolbar"><button class="btn btn-primary">＋ 新增供应商</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>供应商名称</th><th>分类</th><th>联系人</th><th>联系电话</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody><tr><td>快马物流</td><td>卡派公司</td><td>Tom Driver</td><td>+1-310-555-0123</td><td>启用</td><td>洛杉矶线路</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr><tr><td>ZIM（以星航运）</td><td>船司</td><td>—</td><td>—</td><td>启用</td><td>海运供应商</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr></tbody></table></div></div>
  </div>
</div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
