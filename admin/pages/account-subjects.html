<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 财务科目</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>基础数据</span><span class="sep">›</span><span class="current">财务科目</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">💰</div>财务科目</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">科目名称</label><input class="search-input" placeholder="请输入科目名称"></div>
        <div class="search-field"><label class="search-label">科目代码</label><input class="search-input" placeholder="请输入科目代码"></div>
        <div class="search-field"><label class="search-label">类型</label><select class="search-select"><option>全部</option><option>收入</option><option>成本</option><option>费用</option></select></div>
        <div class="search-field"><label class="search-label">状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card"><div class="table-toolbar"><button class="btn btn-primary">＋ 新增科目</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>科目名称</th><th>科目代码</th><th>类型</th><th>状态</th><th>说明</th><th>操作</th></tr></thead><tbody><tr><td>卡派收入</td><td>INC-TRUCK</td><td>收入</td><td>启用</td><td>卡派业务收入</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr><tr><td>提柜成本</td><td>COST-PULL</td><td>成本</td><td>启用</td><td>运输成本</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr></tbody></table></div></div>
  </div>
</div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
