<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 客户管理</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.highlight { color: var(--primary); font-weight: 600; }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>基础数据</span><span class="sep">›</span><span class="current">客户管理</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">👥</div>客户管理</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">客户名称</label><input class="search-input" placeholder="请输入客户名称"></div>
        <div class="search-field"><label class="search-label">客户代码</label><input class="search-input" placeholder="请输入客户代码"></div>
        <div class="search-field"><label class="search-label">状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card">
      <div class="table-toolbar"><button class="btn btn-primary">＋ 新增客户</button><button class="btn btn-default">导入</button><button class="btn btn-default">导出</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>客户名称</th><th>客户代码</th><th>联系人</th><th>联系电话</th><th>邮箱</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody><tr><td>ABC Trading Co.</td><td>ABC</td><td>John Smith</td><td>+1-310-555-0198</td><td>john@abc.com</td><td><span class="highlight">启用</span></td><td>美国大客户</td><td><button class="btn btn-default btn-xs">编辑</button><button class="btn btn-default btn-xs">停用</button></td></tr><tr><td>XYZ Imports LLC</td><td>XYZ</td><td>Mary Liu</td><td>+1-626-555-0234</td><td>mary@xyz.com</td><td><span class="highlight">启用</span></td><td>长期合作</td><td><button class="btn btn-default btn-xs">编辑</button><button class="btn btn-default btn-xs">停用</button></td></tr></tbody></table></div>
    </div>
  </div>
</div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
