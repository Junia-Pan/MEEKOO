<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 派送仓库配置</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>基础数据</span><span class="sep">›</span><span class="current">派送仓库配置</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">🏠</div>派送仓库配置</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">仓库名称</label><input class="search-input" placeholder="请输入仓库名称"></div>
        <div class="search-field"><label class="search-label">FBA Code</label><input class="search-input" placeholder="请输入 FBA Code"></div>
        <div class="search-field"><label class="search-label">州</label><input class="search-input" placeholder="请输入州"></div>
        <div class="search-field"><label class="search-label">状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card"><div class="table-toolbar"><button class="btn btn-primary">＋ 新增仓库</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>仓库名称</th><th>FBA Code</th><th>地址</th><th>州</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>Amazon ONT8</td><td>ONT8</td><td>1234 Warehouse Blvd, Ontario CA</td><td>CA</td><td>启用</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr><tr><td>Amazon DTM1</td><td>DTM1</td><td>890 Commerce Dr, Atlanta GA</td><td>GA</td><td>启用</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr></tbody></table></div></div>
  </div>
</div>
</div>
<script src="../js/common.js"></script>
</body>
</html>
