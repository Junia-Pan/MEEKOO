<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>提货预约</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  :root {
    --sp-ink: #0f172a;
    --sp-muted: #64748b;
    --sp-line: rgba(15, 23, 42, 0.12);
    --sp-surface: #ffffff;
    --sp-bg: #f6f7fb;
    --sp-accent: #2563eb;
    --sp-accent-deep: #1d4ed8;
    --sp-accent-weak: #eff6ff;
    --sp-ok: #059669;
    --sp-danger: #dc2626;
    --sp-chip: #f1f5f9;
  }
  html, body { height: 100%; background: var(--sp-bg); }
  .sp-m {
    margin: 0;
    min-height: 100%;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--sp-ink);
    background: var(--sp-bg);
  }
  .sp-m-app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .sp-m-nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(217, 226, 236, 0.9);
  }
  .sp-m-nav__center { text-align: center; }
  .sp-m-nav__title {
    display: block;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .sp-m-main {
    flex: 1;
    padding: 14px 14px 10px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sp-m-step.is-off { display: none; }
  .sp-m-foot.is-off { display: none; }

  .sp-m-scan-error {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100dvh - 120px);
    padding: 24px 8px;
  }
  .sp-m-scan-error.is-off { display: none; }
  .sp-m-scan-error__card {
    width: 100%;
    max-width: 320px;
    padding: 28px 20px 24px;
    border-radius: 16px;
    background: var(--sp-surface);
    border: 1px solid var(--sp-line);
    box-shadow: 0 14px 40px rgba(2, 6, 23, 0.05);
    text-align: center;
  }
  .sp-m-scan-error__icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #fef3c7;
    color: #b45309;
    font-size: 28px;
    line-height: 56px;
  }
  .sp-m-scan-error__title {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: 800;
    color: var(--sp-ink);
    line-height: 1.4;
  }
  .sp-m-scan-error__desc {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--sp-muted);
  }
  .sp-m-scan-error__detail {
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--sp-danger);
    line-height: 1.45;
  }
  .sp-m-scan-error__detail.is-off { display: none; }

  .sp-m-foot {
    position: sticky;
    bottom: 0;
    z-index: 20;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--sp-line);
    box-shadow: 0 -8px 24px rgba(2, 6, 23, 0.06);
  }
  .sp-m-btn {
    display: flex;
    width: 100%;
    min-height: 50px;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .sp-m-btn-primary {
    color: #fff;
    background: var(--sp-accent);
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
  }
  .sp-m-btn-primary:active { background: var(--sp-accent-deep); }
  .sp-m-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .sp-m-btn-ghost {
    margin-top: 8px;
    color: var(--sp-ink);
    background: #fff;
    border: 1px solid rgba(15, 23, 42, 0.16);
    font-weight: 600;
  }
  .sp-m-btn-danger {
    margin-top: 8px;
    color: var(--sp-danger);
    background: #fff;
    border: 1px solid rgba(220, 38, 38, 0.28);
    font-weight: 600;
  }

  .sp-m-lead-notice {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 16px 6px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #fffbe6;
    border: 1px solid #ffe58f;
    font-size: 12px;
    line-height: 1.4;
    color: #d48806;
    box-sizing: border-box;
  }
  .sp-m-acc__body .sp-m-lead-notice {
    margin: 0 0 8px;
  }
  .sp-m-lead-notice__ico {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    color: #d48806;
  }
  .sp-m-lead-notice__ico svg { display: block; width: 14px; height: 14px; }
  .sp-m-lead-notice__text {
    flex: 1;
    min-width: 0;
  }
  .sp-m-bind-tip {
    margin: 0 0 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    font-size: 13px;
    line-height: 1.5;
    color: #1e40af;
  }
  .sp-m-bind-tip.is-off { display: none; }

  .sp-m-summary {
    position: relative;
    margin-bottom: 12px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
    color: #fff;
    box-shadow: 0 16px 40px rgba(37, 99, 235, 0.28);
  }
  .sp-m-summary__status {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    background: rgba(15, 23, 42, 0.18);
  }
  .sp-m-summary__status--none {
    background: rgba(15, 23, 42, 0.14);
  }
  .sp-m-summary__status--booked {
    background: rgba(15, 23, 42, 0.22);
  }
  .sp-m-summary__status--overdue {
    background: rgba(120, 53, 15, 0.35);
  }
  .sp-m-summary__status--done {
    background: rgba(15, 23, 42, 0.2);
  }
  .sp-m-summary__body { padding: 14px 16px 16px; }
  .sp-m-summary__row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    font-size: 14px;
  }
  .sp-m-summary__row + .sp-m-summary__row { margin-top: 6px; }
  .sp-m-summary__label { flex-shrink: 0; width: 72px; opacity: 0.82; font-size: 13px; }
  .sp-m-summary__strong { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; text-align: right; word-break: break-all; }
  .sp-m-summary__strong.is-code { letter-spacing: 0.08em; font-size: 16px; }
  .sp-m-copy {
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
  }


  .sp-m-card {
    background: var(--sp-surface);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid var(--sp-line);
    box-shadow: 0 14px 40px rgba(2, 6, 23, 0.05);
  }
  .sp-m-sec-hd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px 8px;
  }
  .sp-m-sec-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--sp-ink);
  }
  .sp-m-sec-sub {
    font-size: 12px;
    color: var(--sp-muted);
  }
  .sp-m-row {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 10px 16px;
    gap: 12px;
    margin: 0;
    border: 0;
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 0;
    outline: none;
    box-shadow: none;
    background: #fff;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .sp-m-row:focus, .sp-m-row:focus-visible { outline: none; box-shadow: none; }
  .sp-m-row:last-child { border-bottom: none; }
  .sp-m-row:active { background: #f8fafc; }
  .sp-m-row.is-err .sp-m-row__v {
    color: #ef4444;
    font-weight: 500;
  }
  .sp-m-row.is-disabled { opacity: 0.45; pointer-events: none; }
  .sp-m-row__k { flex-shrink: 0; width: 88px; font-size: 14px; font-weight: 700; color: var(--sp-muted); }
  .sp-m-row__req { color: var(--sp-danger); margin-left: 2px; }
  .sp-m-row__v {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 400;
    color: #94a3b8;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sp-m-row__v.is-on { color: var(--sp-ink); font-weight: 600; }
  .sp-m-row.is-err .sp-m-row__v.is-on { color: var(--sp-ink); font-weight: 600; }
  .sp-m-row__chev { flex-shrink: 0; color: #cbd5e1; font-size: 18px; line-height: 1; }

  .sp-m-acc > summary {
    appearance: none; -webkit-appearance: none; list-style: none;
    display: flex; align-items: center; justify-content: space-between;
    min-height: 52px; padding: 0 16px; border: 0; outline: none;
    background: transparent; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .sp-m-acc > summary::-webkit-details-marker { display: none; }
  .sp-m-acc > summary::after {
    content: '›'; color: #cbd5e1; font-size: 20px; transform: rotate(90deg);
  }
  .sp-m-acc[open] > summary::after { transform: rotate(-90deg); }
  .sp-m-acc__body { padding: 0 16px 12px; }

  .sp-m-ship-group {
    margin-bottom: 10px;
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }
  .sp-m-ship-group--merge {
    border-color: #bfdbfe;
    background: #f8fbff;
  }
  .sp-m-ship-group__hd {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 10px 12px;
    background: #eff6ff;
    border-bottom: 1px solid #dbeafe;
    font-size: 12px;
    color: #475569;
  }
  .sp-m-ship-group__hd strong {
    font-size: 15px;
    font-weight: 800;
    color: var(--sp-ink);
  }
  .sp-m-ship-group__cntr {
    font-size: 12px;
    font-weight: 600;
    color: var(--sp-ink);
  }
  .sp-m-merge-tag {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #1d4ed8;
    background: #fff;
    border: 1px solid #bfdbfe;
  }
  .sp-m-ship {
    padding: 10px 0;
    border-top: 1px solid rgba(15, 23, 42, 0.08);
  }
  .sp-m-ship:first-child { border-top: none; padding-top: 2px; }
  .sp-m-ship--in-group {
    padding-left: 12px;
    border-top: 1px solid rgba(15, 23, 42, 0.06);
    box-shadow: inset 3px 0 0 #93c5fd;
  }
  .sp-m-ship__row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    min-height: 28px;
    padding: 4px 0;
    font-size: 13px;
    line-height: 1.45;
  }
  .sp-m-ship__k {
    flex-shrink: 0;
    width: 108px;
    color: var(--sp-muted);
    font-weight: 600;
  }
  .sp-m-ship__v {
    flex: 1;
    min-width: 0;
    color: var(--sp-ink);
    font-weight: 600;
    text-align: right;
    word-break: break-all;
  }
  .sp-m-ship-total {
    margin: 0 0 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #f1f5f9;
    font-size: 12px;
    font-weight: 700;
    color: var(--sp-ink);
    line-height: 1.6;
  }
  .sp-m-ta {
    display: block;
    width: 100%;
    min-height: 88px;
    padding: 12px 14px;
    box-sizing: border-box;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #fff;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.55;
    color: var(--sp-ink);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .sp-m-ta::placeholder {
    color: #94a3b8;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.55;
    opacity: 1;
  }
  .sp-m-ta::-webkit-input-placeholder {
    color: #94a3b8;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.55;
    opacity: 1;
  }
  .sp-m-ta:focus {
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .sp-m-ta:disabled {
    opacity: 0.55;
    background: #f8fafc;
    color: #64748b;
  }


  .sp-m-file-upload {
    position: relative;
  }
  .sp-m-file-upload.is-disabled { opacity: 0.45; pointer-events: none; }
  .sp-m-file-drop {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    border: 1.5px dashed #93c5fd;
    border-radius: 12px;
    background: #f8fbff;
    cursor: pointer;
    box-sizing: border-box;
    transition: border-color 0.15s, background 0.15s;
  }
  .sp-m-file-drop:active,
  .sp-m-file-drop.is-active {
    border-color: #2563eb;
    background: #eff6ff;
  }
  .sp-m-file-drop__ico {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #eff6ff;
    color: var(--sp-accent);
  }
  .sp-m-file-drop__ico svg { display: block; }
  .sp-m-file-drop__main { flex: 1; min-width: 0; }
  .sp-m-file-drop__title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--sp-ink);
    line-height: 1.35;
  }
  .sp-m-file-drop__hint {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--sp-muted);
    line-height: 1.4;
  }
  .sp-m-files { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .sp-m-file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
  }
  .sp-m-file-row__info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sp-m-file-row__name {
    font-size: 14px;
    font-weight: 500;
    color: var(--sp-ink);
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sp-m-file-row__size {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.35;
  }
  .sp-m-file-row__acts {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sp-m-file-link {
    appearance: none;
    border: none;
    background: none;
    padding: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--sp-accent);
    cursor: pointer;
  }
  .sp-m-file-link.is-del { color: var(--sp-danger); }

  .sp-m-mask {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(15, 23, 42, 0.45);
  }
  .sp-m-mask.is-on { display: block; }
  .sp-m-sheet {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 430px; max-height: 78vh; background: #fff;
    border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sp-m-sheet__bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 8px 8px 16px; font-size: 16px; font-weight: 800;
  }
  .sp-m-sheet__x {
    width: 44px; height: 44px; border: 0; background: none;
    font-size: 22px; color: #94a3b8; cursor: pointer;
  }
  .sp-m-sheet__body { padding: 0 16px 12px; overflow: auto; }
  .sp-m-sheet__lab { margin: 4px 0 8px; font-size: 12px; font-weight: 700; color: var(--sp-muted); }
  .sp-m-grid-h { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .sp-m-grid-s { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sp-m-chip {
    min-height: 44px; border: 1px solid var(--sp-line); border-radius: 10px;
    background: #fff; font-size: 15px; font-weight: 700; color: var(--sp-ink); cursor: pointer;
  }
  .sp-m-chip.is-on { border-color: var(--sp-accent); background: var(--sp-accent-weak); color: var(--sp-accent); }
  .sp-m-chip:disabled { color: #cbd5e1; background: #f8fafc; }
  .sp-m-sheet__foot { padding: 8px 16px 12px; }

  .sp-m-cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .sp-m-cal-nav__title {
    font-size: 16px;
    font-weight: 800;
    color: var(--sp-ink);
  }
  .sp-m-cal-nav button {
    appearance: none;
    width: 40px;
    height: 40px;
    border: 1px solid var(--sp-line);
    border-radius: 10px;
    background: #fff;
    font-size: 18px;
    color: var(--sp-ink);
    cursor: pointer;
  }
  .sp-m-cal-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--sp-muted);
  }
  .sp-m-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .sp-m-cal-day {
    appearance: none;
    min-height: 44px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    font-size: 15px;
    font-weight: 600;
    color: var(--sp-ink);
    cursor: pointer;
  }
  .sp-m-cal-day.is-muted { color: #cbd5e1; }
  .sp-m-cal-day.is-disabled { color: #cbd5e1; cursor: not-allowed; }
  .sp-m-cal-day.is-today { box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.35); }
  .sp-m-cal-day.is-on { background: var(--sp-accent); color: #fff; }

  .sp-m-preview {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.92); flex-direction: column;
  }
  .sp-m-preview.is-on { display: flex; }
  .sp-m-preview__bar {
    display: flex; justify-content: flex-end; padding: 8px 8px 0;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
  }
  .sp-m-preview__x {
    width: 44px; height: 44px; border: 0; border-radius: 22px;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; cursor: pointer;
  }
  .sp-m-preview__body {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px;
  }
  .sp-m-preview__body img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;
  }
  .sp-m-preview__body iframe {
    width: 100%; height: 100%; border: 0; border-radius: 8px; background: #fff;
  }
</style>
</head>
<body class="sp-m">
  <div class="sp-m-app">
    <header class="sp-m-nav">
      <div class="sp-m-nav__center">
        <span class="sp-m-nav__title">提货预约</span>
      </div>
    </header>

    <main class="sp-m-main">
      <section class="sp-m-scan-error" id="sp-m-scan-error">
        <div class="sp-m-scan-error__card">
          <div class="sp-m-scan-error__icon" aria-hidden="true">⌁</div>
          <h2 class="sp-m-scan-error__title">请扫描提货二维码进入</h2>
          <p class="sp-m-scan-error__desc">请使用自提单或通知中的二维码打开本页面；若无法扫码，可在电脑端进行预约。</p>

<script src="../js/common.js"></script>
<script src="../js/self-pickup-core.js"></script>
<script src="../js/self-pickup-book-data.js"></script>
<script src="../js/self-pickup-appt.js"></script>
<script>
  var SP_M_SESSION_KEY = 'meekoo_sp_book_session';
  var BD = window.SpPickupBookData;
  var spMSession = null;
  var spMFiles = [];
  var spMFilePreviewUrl = '';

  var SP_M_H0 = 9;
  var SP_M_H1 = 18;
  var SP_M_SEGS = [0, 10, 20, 30, 40, 50];
  var spMPick = { hour: null, seg: null };
  var spMDraft = { hour: null, seg: null };
  var spMDateDraft = '';
  var spMCalCursor = null;

  function spMPad(n) { return n < 10 ? '0' + n : String(n); }
  function spMHm(min) { return spMPad(Math.floor(min / 60)) + ':' + spMPad(min % 60); }
  function spMEsc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }
  function spMSlotVal(hour, seg) {
    if (hour == null || seg == null) return '';
    var start = hour * 60 + seg;
    var end = start + 10;
    if (start < SP_M_H0 * 60 || end > SP_M_H1 * 60) return '';
    return spMHm(start).replace(':', '') + '-' + spMHm(end).replace(':', '');
  }
  function spMSlotLabel(v) {
    var m = String(v || '').match(/^(\d{2})(\d{2})-(\d{2})(\d{2})$/);
    return m ? (m[1] + ':' + m[2] + '-' + m[3] + ':' + m[4]) : '';
  }
  function spMParseSlotValue(v) {
    var m = String(v || '').match(/^(\d{2})(\d{2})-(\d{2})(\d{2})$/);
    if (!m) return null;
    return { hour: parseInt(m[1], 10), seg: parseInt(m[2], 10) };
  }
  function spMTomorrow() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 1);
    return d;
  }
  function spMFmtDate(d) {
    return d.getFullYear() + '-' + spMPad(d.getMonth() + 1) + '-' + spMPad(d.getDate());
  }
  function spMParseDate(str) {
    var m = String(str || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    var d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    d.setHours(0, 0, 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }
  function spMMinDateStr() { return spMFmtDate(spMTomorrow()); }

  function spMLoadSession() {
    if (spMSession) return spMSession;
    try {
      var raw = sessionStorage.getItem(SP_M_SESSION_KEY);
      if (!raw) return null;
      spMSession = JSON.parse(raw);
      return spMSession;
    } catch (e) {
      return null;
    }
  }
  function spMSaveSession() {
    if (!spMSession) return;
    try { sessionStorage.setItem(SP_M_SESSION_KEY, JSON.stringify(spMSession)); } catch (e) {}
  }
  function spMSessionId() {
    var s = spMLoadSession();
    if (!s) return '';
    if (s.pickCode) return s.pickCode;
    return (s.zt || 'session') + ':' + (s.queries ? s.queries.join(',') : '');
  }
  function spMGetZtFromSession(sess) {
    if (!sess) return '';
    if (sess.zt) return sess.zt;
    if (sess.rows && sess.rows[0] && sess.rows[0].zt) return sess.rows[0].zt;
    return '';
  }
  function spMApptStorageKey(code) {
    return 'meekoo_sp_book_appt_' + encodeURIComponent(String(code || '').trim());
  }
  function spMLoadAppt(code) {
    var zt = spMGetZtFromSession(spMLoadSession());
    if (window.SpPickupAppt && zt) {
      var stored = SpPickupAppt.getAppt(zt);
      if (stored) return stored;
    }
    try {
      var raw = sessionStorage.getItem(spMApptStorageKey(code));
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function spMSaveAppt(code, data) {
    try { sessionStorage.setItem(spMApptStorageKey(code), JSON.stringify(data)); } catch (e) {}
  }
  function spMCustomerOrderStatus(code) {
    var sess = spMLoadSession();
    var appt = spMLoadAppt(code || spMSessionId());
    if (appt && appt.status === '已提货') return '已提货';
    if (appt && (appt.status === '待提货' || appt.status === '已预约')) return '待提货';
    if (appt && appt.status === '已过期') return '已过期';
    if (sess && sess.status === '已提货') return '已提货';
    if (sess && (sess.status === '待提货' || sess.status === '已预约')) return '待提货';
    if (sess && (sess.status === '已过期' || sess.status === '预约已过期')) return '已过期';
    return '未预约';
  }
  function spMGetRows() {
    var sess = spMLoadSession();
    return (sess && sess.rows && sess.rows.length) ? sess.rows : [];
  }
  function spMDemoDocNo() {
    var rows = spMGetRows();
    if (!rows.length) return '—';
    var zt = rows[0].zt;
    return (zt && String(zt).trim()) ? String(zt).trim() : '—';
  }

  function spMReadPickCodeFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('code') || params.get('pickCode') || '';
    return BD ? BD.normCode(raw) : String(raw || '').trim().toUpperCase();
  }

  function spMShowScanError(detail) {
    var errEl = document.getElementById('sp-m-scan-error');
    var fillEl = document.getElementById('sp-m-step-fill');
    var footEl = document.getElementById('sp-m-foot');
    var detailEl = document.getElementById('sp-m-scan-error-detail');
    if (errEl) errEl.classList.remove('is-off');
    if (fillEl) fillEl.classList.add('is-off');
    if (footEl) footEl.classList.add('is-off');
    if (detailEl) {
      if (detail) {
        detailEl.textContent = detail;
        detailEl.classList.remove('is-off');
      } else {
        detailEl.textContent = '';
        detailEl.classList.add('is-off');
      }
    }
  }

  function spMShowFillView() {
    var errEl = document.getElementById('sp-m-scan-error');
    var fillEl = document.getElementById('sp-m-step-fill');
    var footEl = document.getElementById('sp-m-foot');
    if (errEl) errEl.classList.add('is-off');
    if (fillEl) fillEl.classList.remove('is-off');
    if (footEl) footEl.classList.remove('is-off');
  }

  function spMInitFromScan() {
    if (!BD) {
      spMShowScanError();
      return;
    }
    var code = spMReadPickCodeFromUrl();
    if (!code) {
      spMShowScanError();
      return;
    }
    var result = BD.bootstrapSessionFromPickCode(code);
    if (!result.ok) {
      spMShowScanError();
      showToast(result.message || (BD.PICK_CODE_FAIL_MSG || '提货码无效或不可用，请核对后重试'));
      return;
    }
    spMSession = result.session;
    spMSaveSession();
    spMEnterFillStep();
  }

  function spMEnterFillStep() {
    spMShowFillView();
    var sess = spMLoadSession();
    if (!sess || !sess.rows || !sess.rows.length) {
      spMShowScanError();
      return;
    }
    var code = spMSessionId();
    if (BD && BD.syncSessionRowsAppt) {
      BD.syncSessionRowsAppt(sess, spMLoadAppt(code));
      spMSession = sess;
      spMSaveSession();
    }
    var bindTip = document.getElementById('sp-m-bind-tip');
    if (bindTip) {
      if (sess.bindAutoCount > 0) {
        bindTip.classList.remove('is-off');
        bindTip.textContent = '同板须一并预约：已自动带出同板其余 ' + sess.bindAutoCount + ' 票，出库时只扫板标。';
      } else {
        bindTip.classList.add('is-off');
        bindTip.textContent = '';
      }
    }
    spMRenderSummary(code);
    spMRenderShips(code);
    spMInitFormFromAppt(code);
    spMApplyFillMode(code);
    spMSetFormDisabled(spMCustomerOrderStatus(code) === '已提货');
  }

  function spMStatusClass(label) {
    if (label === '已提货') return 'sp-m-summary__status--done';
    if (label === '已过期') return 'sp-m-summary__status--overdue';
    if (label === '待提货') return 'sp-m-summary__status--booked';
    return 'sp-m-summary__status--none';
  }

  function spMRenderSummary(code) {
    var orderStatus = spMCustomerOrderStatus(code);
    var appt = spMLoadAppt(code);
    var sess = spMLoadSession();
    var statusBlock = document.getElementById('sp-m-sum-status-block');
    var statusTxt = document.getElementById('sp-m-sum-status');
    var codeEl = document.getElementById('sp-m-sum-code');
    var copyBtn = document.getElementById('sp-m-copy-code');
    var ztEl = document.getElementById('sp-m-sum-zt');
    var apptRow = document.getElementById('sp-m-sum-appt-row');
    var apptEl = document.getElementById('sp-m-sum-appt');
    var displayCode = (sess && sess.pickCode) || (orderStatus === '未预约' ? '—' : code) || '—';
    if (statusBlock) statusBlock.className = 'sp-m-summary__status ' + spMStatusClass(orderStatus);
    if (statusTxt) statusTxt.textContent = orderStatus;
    if (codeEl) codeEl.textContent = displayCode || '—';
    if (copyBtn) copyBtn.hidden = !(displayCode && displayCode !== '—');
    if (ztEl) ztEl.textContent = spMDemoDocNo();
    if (apptRow && apptEl) {
      var date = appt && appt.date ? appt.date : '';
      var slot = appt && appt.slot ? appt.slot : '';
      var hasAppt = !!(date && slot);
      apptRow.hidden = !hasAppt;
      apptEl.textContent = hasAppt ? (date + ' ' + spMSlotLabel(slot)) : '—';
    }
  }

  function spMApplyFillMode(code) {
    var status = spMCustomerOrderStatus(code);
    var submitBtn = document.getElementById('sp-m-submit');
    var cancelBtn = document.getElementById('sp-m-cancel');
    if (submitBtn) {
      if (status === '已提货') {
        submitBtn.textContent = '提货完成';
        submitBtn.disabled = true;
      } else if (status === '待提货' || status === '已过期') {
        submitBtn.textContent = '确认修改';
        submitBtn.disabled = false;
      } else {
        submitBtn.textContent = '确认提交';
        submitBtn.disabled = false;
      }
    }
    if (cancelBtn) {
      var showCancel = status === '待提货' || status === '已过期';
      cancelBtn.style.display = showCancel ? 'flex' : 'none';
    }
  }

  function spMSetFormDisabled(disabled) {
    ['sp-m-date-row', 'sp-m-slot-row'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.toggle('is-disabled', !!disabled);
    });
    var note = document.getElementById('sp-m-note');
    var drop = document.getElementById('sp-m-file-upload');
    var input = document.getElementById('sp-m-file-input');
    if (note) note.disabled = !!disabled;
    if (drop) drop.classList.toggle('is-disabled', !!disabled);
    if (input) input.disabled = !!disabled;
  }

  function spMInitFormFromAppt(code) {
    var appt = spMLoadAppt(code);
    var status = spMCustomerOrderStatus(code);
    var dateEl = document.getElementById('sp-m-date');
    var dateTxt = document.getElementById('sp-m-date-txt');
    var slotEl = document.getElementById('sp-m-slot');
    var slotTxt = document.getElementById('sp-m-slot-txt');
    var noteEl = document.getElementById('sp-m-note');
    if (!appt || (status !== '待提货' && status !== '已过期')) {
      if (dateEl) dateEl.value = '';
      if (dateTxt) { dateTxt.textContent = '请选择'; dateTxt.classList.remove('is-on'); }
      spMPick.hour = null;
      spMPick.seg = null;
      if (slotEl) slotEl.value = '';
      if (slotTxt) { slotTxt.textContent = '请选择'; slotTxt.classList.remove('is-on'); }
      if (noteEl) noteEl.value = '';
      spMFiles = [];
      spMRenderFiles();
      return;
    }
    if (dateEl && appt.date) dateEl.value = appt.date;
    if (dateTxt) {
      dateTxt.textContent = appt.date || '请选择';
      dateTxt.classList.toggle('is-on', !!appt.date);
    }
    var parsed = spMParseSlotValue(appt.slot || '');
    if (parsed) {
      spMPick.hour = parsed.hour;
      spMPick.seg = parsed.seg;
    } else {
      spMPick.hour = null;
      spMPick.seg = null;
    }
    if (slotEl) slotEl.value = appt.slot || '';
    if (slotTxt) {
      var lbl = spMSlotLabel(appt.slot || '');
      slotTxt.textContent = lbl || '请选择';
      slotTxt.classList.toggle('is-on', !!lbl);
    }
    if (noteEl) noteEl.value = appt.remark || '';
    spMFiles = (appt.files || []).map(function (f) {
      return { name: f.name, size: f.size != null ? f.size : null, file: null };
    });
    spMRenderFiles();
  }

  function spMSetDateTxt() {
    var dateEl = document.getElementById('sp-m-date');
    var txt = document.getElementById('sp-m-date-txt');
    var v = dateEl ? dateEl.value : '';
    if (txt) {
      txt.textContent = v || '请选择';
      txt.classList.toggle('is-on', !!v);
    }
  }
  function spMSetSlotTxt() {
    var slotEl = document.getElementById('sp-m-slot');
    var txt = document.getElementById('sp-m-slot-txt');
    var v = slotEl ? slotEl.value : '';
    var lbl = spMSlotLabel(v);
    if (txt) {
      txt.textContent = lbl || '请选择';
      txt.classList.toggle('is-on', !!lbl);
    }
  }

  function spMParseNum(str) {
    var n = parseFloat(String(str || '').replace(/,/g, '').trim());
    return isNaN(n) ? 0 : n;
  }
  function spMGetRowPalletGroup(r) {
    return String(r && r.palletGroup ? r.palletGroup : '').trim();
  }
  function spMGetGroupPhysicalPlt(groupRows) {
    if (!groupRows || !groupRows.length) return 0;
    var pallets = groupRows[0].pallets;
    if (pallets && pallets.length) return pallets.length;
    return spMParseNum(groupRows[0].plt);
  }
  function spMBuildShipUnits(rows) {
    var units = [];
    var i = 0;
    while (i < rows.length) {
      var r = rows[i];
      var pg = spMGetRowPalletGroup(r);
      if (!pg) {
        units.push({ type: 'single', rows: [r] });
        i += 1;
        continue;
      }
      var group = [r];
      var j = i + 1;
      while (j < rows.length && spMGetRowPalletGroup(rows[j]) === pg) {
        group.push(rows[j]);
        j += 1;
      }
      units.push({ type: 'merge', rows: group });
      i = j;
    }
    return units;
  }
  function spMComputeShipTotals(rows) {
    var sumQty = 0;
    var sumVol = 0;
    var sumGw = 0;
    var sumPlt = 0;
    if (!rows || !rows.length) {
      return { qty: sumQty, vol: sumVol, gw: sumGw, plt: sumPlt };
    }
    rows.forEach(function (r) {
      sumQty += spMParseNum(r.qty);
      sumVol += spMParseNum(r.vol);
      sumGw += spMParseNum(r.gw);
    });
    spMBuildShipUnits(rows).forEach(function (unit) {
      if (unit.type === 'single') {
        sumPlt += spMParseNum(unit.rows[0].plt);
        return;
      }
      sumPlt += spMGetGroupPhysicalPlt(unit.rows);
    });
    return { qty: sumQty, vol: sumVol, gw: sumGw, plt: sumPlt };
  }
  function spMCntrSysCell(r) {
    var cntr = String(r.cntr || '').trim();
    var sys = String(r.sysNo || '').trim();
    return cntr || sys || '—';
  }
  function spMShipCard(r, inGroup) {
    function row(k, v) {
      return '<div class="sp-m-ship__row"><span class="sp-m-ship__k">' + k + '</span><span class="sp-m-ship__v">' + v + '</span></div>';
    }
    var cls = 'sp-m-ship' + (inGroup ? ' sp-m-ship--in-group' : '');
    var pltRow = inGroup ? '' : row('实际板数', spMEsc(r.plt != null ? String(r.plt) : '—'));
    return '<div class="' + cls + '">' +
      (inGroup ? '' : row('柜号/单号', spMEsc(spMCntrSysCell(r)))) +
      row('Customer Ref No', spMEsc(r.cust || '—')) +
      row('QTY / Vol / GW', spMEsc(r.qty || '—') + ' CTNS · ' + spMEsc(r.vol || '—') + ' CBM · ' + spMEsc(r.gw || '—') + ' LBS') +
      pltRow +
      row('到仓日期', spMEsc(r.whIn || '—')) +
      '</div>';
  }
  function spMRenderShips(code) {
    var box = document.getElementById('sp-m-ships');
    if (!box) return;
    var rows = spMGetRows();
    if (!rows.length) {
      box.innerHTML = '<div class="sp-m-ship">暂无货件</div>';
      return;
    }
    var units = spMBuildShipUnits(rows);
    var totals = spMComputeShipTotals(rows);
    var html = [];
    units.forEach(function (unit) {
      if (unit.type === 'single') {
        html.push(spMShipCard(unit.rows[0], false));
        return;
      }
      var physical = spMGetGroupPhysicalPlt(unit.rows);
      var pallets = (unit.rows[0] && unit.rows[0].pallets) ? unit.rows[0].pallets : [];
      var tip = pallets.length ? ('合板 · ' + pallets.join('、')) : ('合板 · 共 ' + unit.rows.length + ' 票货件');
      html.push(
        '<div class="sp-m-ship-group sp-m-ship-group--merge">' +
        '<div class="sp-m-ship-group__hd" title="' + spMEsc(tip) + '">' +
        '<span class="sp-m-merge-tag">合板</span>' +
        '<span class="sp-m-ship-group__cntr">柜号/单号 ' + spMEsc(spMCntrSysCell(unit.rows[0])) + '</span>' +
        '<strong>' + physical + '</strong> 板' +
        '</div>' +
        unit.rows.map(function (r) { return spMShipCard(r, true); }).join('') +
        '</div>'
      );
    });
    var totalHtml =
      '<div class="sp-m-ship-total">合计：' +
      totals.qty + ' CTNS · ' + totals.vol.toFixed(2) + ' CBM · ' + totals.gw.toFixed(0) + ' LBS · ' + totals.plt + ' 板</div>';
    box.innerHTML = totalHtml + html.join('');
  }

  function spMFormatFileSize(bytes) {
    var n = Number(bytes);
    if (!isFinite(n) || n < 0) return '';
    if (n < 1024) return Math.round(n) + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10 * 1024 ? 1 : 0) + ' KB';
    return (n / (1024 * 1024)).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + ' MB';
  }
  function spMGetFilePreviewKind(name) {
    var n = String(name || '').toLowerCase();
    if (/\.(jpg|jpeg|png|gif|webp|bmp)$/.test(n)) return 'image';
    if (/\.pdf$/.test(n)) return 'pdf';
    return 'other';
  }
  function spMCanPreviewFileName(name) {
    var kind = spMGetFilePreviewKind(name);
    return kind === 'image' || kind === 'pdf';
  }
  function spMRevokeFilePreviewUrl() {
    if (!spMFilePreviewUrl) return;
    try { URL.revokeObjectURL(spMFilePreviewUrl); } catch (e) {}
    spMFilePreviewUrl = '';
  }
  function spMClosePreview() {
    spMRevokeFilePreviewUrl();
    var overlay = document.getElementById('sp-m-preview');
    var body = document.getElementById('sp-m-preview-body');
    if (body) body.innerHTML = '';
    if (overlay) overlay.classList.remove('is-on');
  }
  function spMPreviewFile(index) {
    var f = spMFiles[index];
    if (!f) return;
    if (!spMCanPreviewFileName(f.name)) return showToast('该文件类型暂不支持预览', 'warning');
    spMRevokeFilePreviewUrl();
    var overlay = document.getElementById('sp-m-preview');
    var body = document.getElementById('sp-m-preview-body');
    if (!body || !overlay) return;
    var kind = spMGetFilePreviewKind(f.name);
    var html = '';
    if (f.file instanceof File) {
      var mime = String(f.file.type || '');
      if (kind === 'other' && mime.indexOf('image/') !== 0 && mime !== 'application/pdf') {
        return showToast('该文件类型暂不支持预览', 'warning');
      }
      var url = URL.createObjectURL(f.file);
      spMFilePreviewUrl = url;
      if (kind === 'image' || mime.indexOf('image/') === 0) {
        html = '<img src="' + url + '" alt="' + spMEsc(f.name) + '">';
      } else {
        html = '<iframe src="' + url + '" title="' + spMEsc(f.name) + '"></iframe>';
      }
    } else if (kind === 'image') {
      html = '<img src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720"><rect width="100%" height="100%" fill="#F1F5F9"/><text x="480" y="360" text-anchor="middle" font-size="24" fill="#64748B">演示预览</text></svg>') + '" alt="' + spMEsc(f.name) + '">';
    } else {
      html = '<div style="color:#fff;text-align:center;padding:20px;"><p><strong>' + spMEsc(f.name) + '</strong></p><p>演示环境暂无 PDF 原件</p></div>';
    }
    body.innerHTML = html;
    overlay.classList.add('is-on');
  }
  function spMRemoveFile(index) {
    if (!spMFiles[index]) return;
    spMFiles.splice(index, 1);
    spMRenderFiles();
  }
  function spMAddFiles(fileList) {
    var list = fileList ? Array.prototype.slice.call(fileList) : [];
    list.forEach(function (file) {
      if (!spMFiles.some(function (x) { return x.name === file.name; })) {
        spMFiles.push({ name: file.name, size: file.size, file: file });
      }
    });
    spMRenderFiles();
  }
  function spMRenderFiles() {
    var box = document.getElementById('sp-m-files');
    if (!box) return;
    if (!spMFiles.length) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML = spMFiles.map(function (f, i) {
      var sizeText = spMFormatFileSize(f.size);
      var acts = '';
      if (spMCanPreviewFileName(f.name)) {
        acts += '<button type="button" class="sp-m-file-link" data-act="preview" data-id="' + i + '">预览</button>';
      }
      acts += '<button type="button" class="sp-m-file-link is-del" data-act="del" data-id="' + i + '">删除</button>';
      return '<div class="sp-m-file-row">' +
        '<div class="sp-m-file-row__info" title="' + spMEsc(f.name) + '">' +
        '<span class="sp-m-file-row__name">' + spMEsc(f.name) + '</span>' +
        (sizeText ? '<span class="sp-m-file-row__size">' + spMEsc(sizeText) + '</span>' : '') +
        '</div>' +
        '<div class="sp-m-file-row__acts">' + acts + '</div>' +
        '</div>';
    }).join('');
  }

  function spMBindFileUpload() {
    var wrap = document.getElementById('sp-m-file-upload');
    var panel = document.getElementById('sp-m-file-panel');
    var input = document.getElementById('sp-m-file-input');
    if (!wrap || !input || wrap.dataset.bound === '1') return;
    wrap.dataset.bound = '1';
    var openPicker = function () {
      if (wrap.classList.contains('is-disabled')) return;
      input.click();
    };
    if (panel) {
      panel.addEventListener('click', openPicker);
      panel.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); }
      });
    }
    input.addEventListener('change', function () {
      if (this.files && this.files.length) spMAddFiles(this.files);
      this.value = '';
    });
  }

  function spMBindCalendar() {
    var prev = document.getElementById('sp-m-cal-prev');
    var next = document.getElementById('sp-m-cal-next');
    if (prev) prev.addEventListener('click', function () {
      if (!spMCalCursor) return;
      spMCalCursor.setMonth(spMCalCursor.getMonth() - 1);
      spMPaintCalendar();
    });
    if (next) next.addEventListener('click', function () {
      if (!spMCalCursor) return;
      spMCalCursor.setMonth(spMCalCursor.getMonth() + 1);
      spMPaintCalendar();
    });
  }
  function spMPaintCalendar() {
    var grid = document.getElementById('sp-m-cal-grid');
    var title = document.getElementById('sp-m-cal-title');
    if (!grid || !spMCalCursor) return;
    var y = spMCalCursor.getFullYear();
    var m = spMCalCursor.getMonth();
    if (title) title.textContent = y + '-' + spMPad(m + 1);
    var first = new Date(y, m, 1);
    var startPad = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var minStr = spMMinDateStr();
    var todayStr = spMFmtDate(new Date());
    var selected = spMDateDraft || '';
    var html = [];
    var i;
    for (i = 0; i < startPad; i++) html.push('<span class="sp-m-cal-day is-muted"></span>');
    for (i = 1; i <= daysInMonth; i++) {
      var ds = y + '-' + spMPad(m + 1) + '-' + spMPad(i);
      var cls = 'sp-m-cal-day';
      if (ds < minStr) cls += ' is-disabled';
      if (ds === todayStr) cls += ' is-today';
      if (ds === selected) cls += ' is-on';
      html.push('<button type="button" class="' + cls + '" data-date="' + ds + '"' + (ds < minStr ? ' disabled' : '') + '>' + i + '</button>');
    }
    grid.innerHTML = html.join('');
    grid.querySelectorAll('.sp-m-cal-day[data-date]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        spMDateDraft = btn.getAttribute('data-date');
        spMPaintCalendar();
      });
    });
  }
  function spMOpenDatePicker() {
    if (document.getElementById('sp-m-date-row').classList.contains('is-disabled')) return;
    var dateEl = document.getElementById('sp-m-date');
    spMDateDraft = (dateEl && dateEl.value) ? dateEl.value : spMMinDateStr();
    spMCalCursor = spMParseDate(spMDateDraft) || spMTomorrow();
    spMPaintCalendar();
    document.getElementById('sp-m-date-mask').classList.add('is-on');
  }
  function spMCloseDateSheet(e) {
    if (e && e.target && e.target.id !== 'sp-m-date-mask') return;
    document.getElementById('sp-m-date-mask').classList.remove('is-on');
  }
  function spMConfirmDate() {
    if (!spMDateDraft || spMDateDraft < spMMinDateStr()) return;
    document.getElementById('sp-m-date').value = spMDateDraft;
    spMSetDateTxt();
    document.getElementById('sp-m-date-row').classList.remove('is-err');
    document.getElementById('sp-m-date-mask').classList.remove('is-on');
  }

  function spMPaintSheet() {
    document.querySelectorAll('#sp-m-hours .sp-m-chip').forEach(function (btn) {
      btn.classList.toggle('is-on', parseInt(btn.getAttribute('data-h'), 10) === spMDraft.hour);
    });
    document.querySelectorAll('#sp-m-segs .sp-m-chip').forEach(function (btn) {
      var seg = parseInt(btn.getAttribute('data-s'), 10);
      var ok = !!spMSlotVal(spMDraft.hour, seg);
      btn.disabled = !ok;
      btn.textContent = ok
        ? (spMHm(spMDraft.hour * 60 + seg) + '-' + spMHm(spMDraft.hour * 60 + seg + 10))
        : (spMPad(seg) + '-' + spMPad(seg + 10));
      btn.classList.toggle('is-on', ok && spMDraft.seg === seg);
    });
    document.getElementById('sp-m-sheet-ok').disabled = !spMSlotVal(spMDraft.hour, spMDraft.seg);
  }
  function spMBuildSheet() {
    var hours = document.getElementById('sp-m-hours');
    var segs = document.getElementById('sp-m-segs');
    var h, html = [];
    for (h = SP_M_H0; h < SP_M_H1; h++) {
      html.push('<button type="button" class="sp-m-chip" data-h="' + h + '">' + spMPad(h) + ':00</button>');
    }
    hours.innerHTML = html.join('');
    segs.innerHTML = SP_M_SEGS.map(function (s) {
      return '<button type="button" class="sp-m-chip" data-s="' + s + '" disabled>' + spMPad(s) + '-' + spMPad(s + 10) + '</button>';
    }).join('');
    hours.addEventListener('click', function (e) {
      var btn = e.target.closest('.sp-m-chip');
      if (!btn) return;
      spMDraft.hour = parseInt(btn.getAttribute('data-h'), 10);
      spMDraft.seg = null;
      spMPaintSheet();
    });
    segs.addEventListener('click', function (e) {
      var btn = e.target.closest('.sp-m-chip');
      if (!btn || btn.disabled) return;
      spMDraft.seg = parseInt(btn.getAttribute('data-s'), 10);
      spMPaintSheet();
    });
  }
  function spMOpenSheet() {
    if (document.getElementById('sp-m-slot-row').classList.contains('is-disabled')) return;
    spMDraft.hour = spMPick.hour != null ? spMPick.hour : SP_M_H0;
    spMDraft.seg = spMPick.seg;
    document.getElementById('sp-m-mask').classList.add('is-on');
    spMPaintSheet();
  }
  function spMCloseSheet(e) {
    if (e && e.target && e.target.id !== 'sp-m-mask') return;
    document.getElementById('sp-m-mask').classList.remove('is-on');
  }
  function spMConfirmSlot() {
    if (!spMSlotVal(spMDraft.hour, spMDraft.seg)) return;
    spMPick.hour = spMDraft.hour;
    spMPick.seg = spMDraft.seg;
    var val = spMSlotVal(spMPick.hour, spMPick.seg);
    document.getElementById('sp-m-slot').value = val;
    spMSetSlotTxt();
    document.getElementById('sp-m-slot-row').classList.remove('is-err');
    document.getElementById('sp-m-mask').classList.remove('is-on');
  }

  function spMNewPickCode(apptDate) {
    if (window.SpPickupCore && typeof SpPickupCore.allocatePickCode === 'function') {
      return SpPickupCore.allocatePickCode({ apptDate: apptDate || '' });
    }
    var chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    var body = '';
    for (var i = 0; i < 6; i++) body += chars.charAt(Math.floor(Math.random() * chars.length));
    return 'SP' + body;
  }

  function spMSubmit() {
    var dateEl = document.getElementById('sp-m-date');
    var slotEl = document.getElementById('sp-m-slot');
    var dateOk = !!(dateEl && dateEl.value && dateEl.value >= spMMinDateStr());
    var slotOk = !!(slotEl && slotEl.value);
    document.getElementById('sp-m-date-row').classList.toggle('is-err', !dateOk);
    document.getElementById('sp-m-slot-row').classList.toggle('is-err', !slotOk);
    if (!dateOk || !slotOk) {
      if (!dateOk && !slotOk) showToast('请选择日期和时段', 'warning');
      else if (!dateOk) showToast('请选择日期', 'warning');
      else showToast('请选择时段', 'warning');
      return;
    }
    var sess = spMLoadSession();
    if (!sess) {
      showToast('查询已失效，请重新扫描二维码');
      spMShowScanError();
      return;
    }
    var prevStatus = spMCustomerOrderStatus(spMSessionId());
    var isEdit = prevStatus === '待提货' || prevStatus === '已过期';
    if (isEdit) {
      openSharedConfirm(
        '确认修改',
        '确认修改当前预约？修改后预约时段、备注及货件信息将同步更新。'
      ).then(function (ok) {
        if (!ok) return;
        spMDoSubmit(sess, dateEl, slotEl, true);
      });
      return;
    }
    spMDoSubmit(sess, dateEl, slotEl, false);
  }

  function spMDoSubmit(sess, dateEl, slotEl, isEdit) {
    if (!sess.pickCode) sess.pickCode = spMNewPickCode(dateEl.value);
    sess.status = '待提货';
    if (BD && BD.patchRowsAppt) {
      sess.rows = BD.patchRowsAppt(sess.rows, {
        date: dateEl.value,
        slot: slotEl.value,
        status: '待提货'
      });
    }
    spMSession = sess;
    spMSaveSession();
    var code = sess.pickCode;
    var zt = spMGetZtFromSession(sess);
    var noteEl = document.getElementById('sp-m-note');
    spMSaveAppt(code, {
      status: '待提货',
      date: dateEl.value,
      slot: slotEl.value,
      remark: noteEl ? noteEl.value.trim() : '',
      files: spMFiles.map(function (f) {
        return { name: f.name, size: f.size != null ? f.size : null };
      }),
      updatedAt: Date.now()
    });
    if (window.SpPickupAppt && zt) {
      SpPickupAppt.applyBookingFromClient(zt, {
        pickCode: code,
        date: dateEl.value,
        slot: slotEl.value,
        remark: noteEl ? noteEl.value.trim() : '',
        files: spMFiles.map(function (f) {
          return { name: f.name, size: f.size != null ? f.size : null };
        })
      });
    }
    showToast(isEdit ? '预约修改已保存' : '预约已提交');
    spMRenderSummary(code);
    spMRenderShips(code);
    spMApplyFillMode(code);
  }

  function spMAskCancel() {
    var sess = spMLoadSession();
    if (!sess) return;
    openSharedConfirm('取消预约', '确认取消当前预约？取消后预约时段将清空，需重新预约自提时间。').then(function (ok) {
      if (!ok) return;
      var oldCode = sess.pickCode || '';
      var zt = spMGetZtFromSession(sess);
      if (window.SpPickupAppt && zt) SpPickupAppt.clearApptBooking(zt, oldCode);
      if (oldCode) {
        try { sessionStorage.removeItem(spMApptStorageKey(oldCode)); } catch (e) {}
      }
      sess.status = '未预约';
      if (BD && BD.patchRowsAppt) {
        sess.rows = BD.patchRowsAppt(sess.rows, { date: '', slot: '', status: '未预约' });
      }
      spMSession = sess;
      spMSaveSession();
      showToast('已取消预约');
      var code = spMSessionId();
      spMInitFormFromAppt(code);
      spMRenderSummary(code);
      spMRenderShips(code);
      spMApplyFillMode(code);
      spMSetFormDisabled(false);
    });
  }

  function spMCopyCode() {
    var code = document.getElementById('sp-m-sum-code').textContent;
    if (!code || code === '—') return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () { showToast('提货码已复制'); }).catch(function () { showToast(code); });
    } else showToast(code);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('sp-m-date-row').addEventListener('click', spMOpenDatePicker);
    document.getElementById('sp-m-slot-row').addEventListener('click', spMOpenSheet);
    document.getElementById('sp-m-copy-code').addEventListener('click', spMCopyCode);
    document.getElementById('sp-m-submit').addEventListener('click', spMSubmit);
    document.getElementById('sp-m-cancel').addEventListener('click', spMAskCancel);
    spMBindFileUpload();
    document.getElementById('sp-m-files').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      var id = parseInt(btn.getAttribute('data-id'), 10);
      if (btn.getAttribute('data-act') === 'del') spMRemoveFile(id);
      if (btn.getAttribute('data-act') === 'preview') spMPreviewFile(id);
    });
    spMBindCalendar();
    spMBuildSheet();
    spMInitFromScan();
  });
</script>
</body>
</html>
