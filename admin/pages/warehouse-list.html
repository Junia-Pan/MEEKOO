<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 仓库列表</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>配置</span><span class="sep">›</span><span class="current">仓库列表</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">🏬</div>仓库列表</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">仓库代码</label><input class="search-input" placeholder="请输入"></div>
        <div class="search-field"><label class="search-label">仓库状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card">
      <div class="table-toolbar"><button class="btn btn-primary">添加</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>NO.</th><th>ID</th><th>仓库代码</th><th>仓库名称</th><th>状态</th><th>类型</th><th>国家/地区</th><th>州/省</th><th>区域</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>
      <tr><td>1</td><td>46</td><td>CS01</td><td>测试仓</td><td>启用</td><td>标准</td><td>US 美国</td><td>GA</td><td>美东</td><td>创建:2025-10-11<br>更新:2026-03-17</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr>
      <tr><td>2</td><td>42</td><td>GA1530</td><td>GA1530</td><td>启用</td><td>标准</td><td>US 美国</td><td>GA</td><td>美东南</td><td>创建:--<br>更新:2026-01-29</td><td><button class="btn btn-default btn-xs">编辑</button></td></tr>
      </tbody></table></div>
    </div>
  </div>
</div></div>
<script src="../js/common.js"></script>
</body></html>
