<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEEKOO 员工端 · 仓库列表</title>
<link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"></nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>首页</span><span class="sep">›</span><span>配置</span><span class="sep">›</span><span class="current">仓库列表</span></div></div></div>
  <div class="page-content">
    <div class="page-header"><div class="page-title"><div class="page-title-icon">🏬</div>仓库列表</div></div>
    <div class="search-card">
      <div class="search-grid-5">
        <div class="search-field"><label class="search-label">仓库代码</label><input class="search-input" placeholder="请输入"></div>
        <div class="search-field"><label class="search-label">仓库状态</label><select class="search-select"><option>全部</option><option>启用</option><option>停用</option></select></div>
      </div>
      <div class="search-actions"><button class="btn btn-primary">查询</button><button class="btn btn-default">重置</button></div>
    </div>
    <div class="table-card">
      <div class="table-toolbar"><button class="btn btn-primary" onclick="openWarehouseModal('create')">＋ 添加</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>NO.</th><th>ID</th><th>仓库代码</th><th>仓库名称</th><th>状态</th><th>类型</th><th>国家/地区</th><th>州/省</th><th>区域</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>
      <tr><td>1</td><td>46</td><td>CS01</td><td>测试仓</td><td><span style="color:#16A34A;background:#F0FDF4;padding:2px 6px;border-radius:4px;font-size:11px;">启用</span></td><td>标准</td><td>US 美国</td><td>GA</td><td>美东</td><td>创建:2025-10-11<br>更新:2026-03-17</td><td><button class="btn btn-default btn-xs" onclick="openWarehouseModal('edit')">编辑</button></td></tr>
      <tr><td>2</td><td>42</td><td>GA1530</td><td>GA1530</td><td><span style="color:#16A34A;background:#F0FDF4;padding:2px 6px;border-radius:4px;font-size:11px;">启用</span></td><td>标准</td><td>US 美国</td><td>GA</td><td>美东南</td><td>创建:--<br>更新:2026-01-29</td><td><button class="btn btn-default btn-xs" onclick="openWarehouseModal('edit')">编辑</button></td></tr>
      </tbody></table></div>
    </div>
  </div>
</div></div>

<div id="modal-warehouse" class="modal-overlay" onclick="closeModalOutside(event,'modal-warehouse')">
  <div class="modal" style="width: 640px;">
    <div class="modal-header">
      <span class="modal-title" id="warehouse-modal-title">新增仓库</span>
      <button class="modal-close" onclick="closeModal('modal-warehouse')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-field"><label class="form-label">仓库代码 <span class="req">*</span></label><input class="form-input" placeholder="例如：LA1150"></div>
        <div class="form-field"><label class="form-label">仓库名称 <span class="req">*</span></label><input class="form-input" placeholder="请输入仓库名称"></div>
        <div class="form-field"><label class="form-label">仓库类型</label><select class="form-select"><option>标准仓</option><option>虚拟仓</option><option>中转仓</option></select></div>
        <div class="form-field"><label class="form-label">状态</label><select class="form-select"><option>启用</option><option>停用</option></select></div>
        <div class="form-field"><label class="form-label">国家/地区</label><select class="form-select"><option>US 美国</option><option>CA 加拿大</option></select></div>
        <div class="form-field"><label class="form-label">州/省</label><input class="form-input" placeholder="例如：CA"></div>
        <div class="form-field"><label class="form-label">区域</label><select class="form-select"><option>美西</option><option>美东</option><option>美南</option><option>美中</option></select></div>
        <div class="form-field"><label class="form-label">邮编</label><input class="form-input" placeholder="请输入邮政编码"></div>
        <div class="form-field"><label class="form-label">联系人</label><input class="form-input" placeholder="仓库负责人姓名"></div>
        <div class="form-field"><label class="form-label">联系电话</label><input class="form-input" placeholder="仓库联系电话"></div>
        <div class="form-field" style="grid-column: span 2;"><label class="form-label">详细地址</label><input class="form-input" placeholder="请输入完整街道地址"></div>
        <div class="form-field" style="grid-column: span 2;"><label class="form-label">备注</label><textarea class="form-textarea" rows="2" placeholder="请输入其他说明信息"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('modal-warehouse')">取消</button>
      <button class="btn btn-primary" onclick="showToast('保存成功'); closeModal('modal-warehouse')">保存</button>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script>
  function openWarehouseModal(mode) {
    const title = document.getElementById('warehouse-modal-title');
    if (title) title.textContent = mode === 'edit' ? '修改仓库' : '新增仓库';
    showModal('modal-warehouse');
  }
</script>
</body></html>
