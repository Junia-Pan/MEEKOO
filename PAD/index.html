<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meekoo 美库转运系统 - PAD 登录</title>
  <link rel="stylesheet" href="pad.css">
</head>
<body class="pad-login">
  <div class="pad-login-shell">
    <section class="pad-login-brand" aria-label="品牌">
      <div>
        <div class="pad-login-brand-kicker">MEEKOO WMS · PAD</div>
        <h1>MEEKOO</h1>
        <p>海外转运协同系统 · 平板作业</p>
        <ul class="pad-login-points">
          <li><i></i><span>横屏分栏操作，扫码、选目的地、录入件数同屏完成。</span></li>
          <li><i></i><span>拆柜打板沿用 PDA 流程：定位柜号、选择目的地、满板确认。</span></li>
          <li><i></i><span>适合拆柜工位固定平板，触控区域按手指操作放大。</span></li>
        </ul>
      </div>
      <div class="pad-login-brand-foot">仓库现场平板 · 当前开放拆柜打板</div>
    </section>

    <section class="pad-login-panel">
      <header class="pad-login-toolbar">
        <span class="pad-login-time" id="loginTime">09:41</span>
        <div class="pad-login-lang">
          <button type="button" class="pad-login-lang-btn" id="loginLangBtn" aria-expanded="false" aria-haspopup="true">
            <span id="loginLangLabel">中文</span> ▾
          </button>
          <div class="pad-login-lang-pop" id="loginLangPop" role="menu" hidden>
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
      </header>
      <div class="pad-login-form-wrap">
        <form id="loginForm" class="pad-login-form" novalidate>
          <h2>登录</h2>
          <p class="pad-login-lead">使用仓库账号进入平板作业台</p>
          <div class="pad-field">
            <label for="loginUser">账号</label>
            <input type="text" id="loginUser" name="username" placeholder="请输入您的账号" autocomplete="username">
          </div>
          <div class="pad-field">
            <label for="loginPwd">密码</label>
            <div class="pad-pwd">
              <input type="password" id="loginPwd" name="password" placeholder="请输入您的密码" autocomplete="current-password">
              <button type="button" class="pad-pwd-toggle" id="pwdToggle" aria-label="显示或隐藏密码">显示</button>
            </div>
          </div>
          <div class="pad-login-row">
            <label>
              <input type="checkbox" id="loginRemember" checked>
              <span>记住密码</span>
            </label>
            <a href="#" id="forgotPwd">忘记密码？</a>
          </div>
          <button type="submit" class="pad-login-submit">登录</button>
        </form>
      </div>
    </section>
  </div>
  <script>
(function () {
  var form = document.getElementById('loginForm');
  var userEl = document.getElementById('loginUser');
  var rememberEl = document.getElementById('loginRemember');
  var pwdEl = document.getElementById('loginPwd');
  var pwdToggle = document.getElementById('pwdToggle');
  var langBtn = document.getElementById('loginLangBtn');
  var langPop = document.getElementById('loginLangPop');
  var langLabel = document.getElementById('loginLangLabel');
  var timeEl = document.getElementById('loginTime');

  function refreshTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    timeEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  refreshTime();
  setInterval(refreshTime, 30000);

  try {
    var saved = localStorage.getItem('pad.login.username');
    if (saved) {
      userEl.value = saved;
      rememberEl.checked = true;
    }
  } catch (e) {}

  pwdToggle.addEventListener('click', function () {
    var show = pwdEl.type === 'password';
    pwdEl.type = show ? 'text' : 'password';
    pwdToggle.textContent = show ? '隐藏' : '显示';
  });

  document.getElementById('forgotPwd').addEventListener('click', function (e) { e.preventDefault(); });

  langBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var show = langPop.hidden;
    langPop.hidden = !show;
    langBtn.setAttribute('aria-expanded', show ? 'true' : 'false');
  });
  document.addEventListener('click', function () {
    langPop.hidden = true;
    langBtn.setAttribute('aria-expanded', 'false');
  });
  langPop.addEventListener('click', function (e) { e.stopPropagation(); });
  langPop.querySelectorAll('button[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      langPop.hidden = true;
      langBtn.setAttribute('aria-expanded', 'false');
      langLabel.textContent = b.getAttribute('data-lang') === 'en' ? 'English' : '中文';
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    try {
      var u = (userEl.value || '').trim();
      if (rememberEl.checked && u) localStorage.setItem('pad.login.username', u);
      else if (!rememberEl.checked) localStorage.removeItem('pad.login.username');
      if (u) localStorage.setItem('pad.login.display', u);
    } catch (x) {}
    window.location.href = 'home.html';
  });
})();
  </script>
</body>
</html>
