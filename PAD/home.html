<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meekoo PAD - 作业台</title>
  <link rel="stylesheet" href="pad.css">
</head>
<body class="pad-home">
  <header class="pad-topbar">
    <div class="pad-topbar-mark" aria-hidden="true">M</div>
    <div>
      <div class="pad-topbar-title">仓库 PAD</div>
      <div class="pad-topbar-sub">MEEKOO · 平板作业</div>
    </div>
    <div class="pad-topbar-spacer"></div>
    <div class="pad-account">
      <div class="pad-account-avatar" id="padUserAvatar" aria-hidden="true">操</div>
      <div class="pad-account-meta">
        <div class="pad-account-name" id="padUserName">操作员</div>
        <div class="pad-account-wh">LA 仓</div>
      </div>
      <button type="button" class="pad-topbar-exit" id="padExit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>退出</span>
      </button>
    </div>
  </header>
  <main class="pad-home-main">
    <div class="pad-home-head">
      <div>
        <h1>入库作业</h1>
        <p>平板端先开放拆柜打板，其余作业仍在 PDA。</p>
      </div>
      <div class="pad-home-stats">
        <span>今日到仓 <strong>4</strong></span>
        <span>打板中 <strong>3</strong></span>
        <span>已拆 <strong>120</strong> 板</span>
      </div>
    </div>
    <button type="button" class="pad-module" id="goPallet">
      <span class="pad-module-ic" aria-hidden="true">📦</span>
      <span class="pad-module-name">拆柜打板</span>
      <span class="pad-module-desc">扫柜号或从任务清单进入，选择目的地后录入本板件数并生成板标。</span>
      <span class="pad-module-go">进入作业 →</span>
    </button>
  </main>
  <script>
(function () {
  var nameEl = document.getElementById('padUserName');
  var avatarEl = document.getElementById('padUserAvatar');
  try {
    var u = localStorage.getItem('pad.login.display') || localStorage.getItem('pad.login.username');
    if (u) {
      nameEl.textContent = u;
      avatarEl.textContent = u.slice(0, 1).toUpperCase();
    }
  } catch (e) {}
  document.getElementById('goPallet').addEventListener('click', function () {
    window.location.href = 'print-pallet.html';
  });
  document.getElementById('padExit').addEventListener('click', function () {
    window.location.href = 'index.html';
  });
})();
  </script>
</body>
</html>
