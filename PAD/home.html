<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meekoo PAD - 作业台</title>
  <link rel="stylesheet" href="pad.css?v=wh">
  <style>
    body.pad-home .pad-home-main {
      padding: 16px 24px 24px;
    }
    body.pad-home .pad-home-head {
      align-items: center;
      margin-bottom: 12px;
    }
    body.pad-home .pad-home-head h1 { font-size: 22px; }
    body.pad-home .pad-home-head p { margin-top: 4px; }
    body.pad-home .pad-work { padding: 14px 16px; }
    body.pad-home .pad-tasks { margin-top: 16px; }
    .pad-task-bits > span {
      grid-template-columns: 78px minmax(0, 1fr);
    }
  </style>
</head>
<body class="pad-home">
  <header class="pad-topbar">
    <div class="pad-topbar-mark" aria-hidden="true">M</div>
    <div>
      <div class="pad-topbar-title">Meekoo PAD</div>
    </div>
    <div class="pad-topbar-spacer"></div>
    <div class="pad-account">
      <div class="pad-account-avatar" id="padUserAvatar" aria-hidden="true">小</div>
      <div class="pad-account-name" id="padUserName">小明</div>
      <span class="pad-account-split" aria-hidden="true"></span>
      <button type="button" class="pad-menu-btn" id="padEdge" aria-expanded="false" aria-controls="padDrawer" aria-label="展开菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
      </button>
    </div>
  </header>
  <main class="pad-home-main">
    <div class="pad-home-head">
      <div>
        <h1>拆柜打板</h1>
        <p>输入柜号或从任务清单进入，选择目的地后再录入件数。</p>
      </div>
      <div class="pad-home-stats">
        <span>今日到仓 <strong id="statArrived">0</strong></span>
        <span>未拆 <strong id="statWaiting">0</strong></span>
        <span>拆柜中 <strong id="statWorking">0</strong></span>
        <span>今日已拆 <strong id="statDone">0</strong></span>
      </div>
    </div>

    <section class="pad-work" aria-label="拆柜打板">
      <form class="pad-scan" id="scanForm">
        <input id="cabInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="输入柜号 / 提单号 / 系统单号" aria-label="柜号">
        <button type="submit">开始拆柜</button>
      </form>
      <p class="pad-scan-hint" id="scanHint" hidden></p>
    </section>

    <section class="pad-tasks" aria-label="任务清单">
      <div class="pad-tasks-head">
        <h2>任务清单</h2>
        <strong class="pad-task-count" id="taskCount">0</strong>
      </div>
      <div class="pad-task-grid" id="taskGrid"></div>
    </section>
  </main>
  <div class="pad-drawer-mask" id="padDrawerMask" hidden></div>
  <nav class="pad-drawer" id="padDrawer" hidden aria-label="菜单">
    <div class="pad-drawer-panel">
      <div class="pad-drawer-user">
        <div class="pad-account-avatar" id="padDrawerAvatar" aria-hidden="true">小</div>
        <div class="pad-drawer-user-text">
          <div class="pad-drawer-user-name" id="padDrawerName">小明</div>
        </div>
      </div>
      <div class="pad-drawer-nav">
        <button type="button" class="pad-nav-item" data-nav="home.html">拆柜打板</button>
        <button type="button" class="pad-nav-item" data-nav="report.html">查看拆柜报告</button>
        <button type="button" class="pad-nav-item pad-nav-exit" data-nav="index.html">退出</button>
      </div>
    </div>
  </nav>
  <script>
(function () {
  var TASKS = [
    { mode: 'sea', cab: 'COSU628190', status: 'working', customer: '华东跨境贸易', size: '40HQ', elapsed: '1h 15m', pallets: 3, doneCtns: 15, forecastCtns: 43, forecastPlts: 4, ships: [{ type: 'FBA', n: 10 }, { type: 'WM', n: 10 }] },
    { mode: 'sea', cab: 'TGHU7654321', status: 'working', customer: '深圳进出口', size: '45HQ', elapsed: '3h 45m', pallets: 14, doneCtns: 298, forecastCtns: 320, forecastPlts: 16, ships: [{ type: 'FBA', n: 24 }, { type: 'WM', n: 8 }] },
    { mode: 'sea', cab: 'HLXU3312890', status: 'working', customer: '上海集运客户A', size: '40HQ', elapsed: '10m', pallets: 0, doneCtns: 2, forecastCtns: 85, forecastPlts: 6, ships: [{ type: 'FBA', n: 6 }, { type: 'WM', n: 2 }] },
    { mode: 'sea', cab: 'MSCU1234567', status: 'pending', customer: 'ABC Trading Co.', size: '20GP', elapsed: '—', pallets: 0, forecastCtns: 19, forecastPlts: 5, ships: [{ type: 'FBA', n: 4 }, { type: 'WM', n: 1 }] },
    { mode: 'sea', cab: 'CMAU8891234', status: 'pending', customer: '浙江外贸有限公司', size: '40HQ', elapsed: '—', pallets: 0, forecastCtns: 210, forecastPlts: 18, ships: [{ type: 'FBA', n: 18 }, { type: 'WM', n: 6 }] },
    { mode: 'air', bl: '999-12345678', status: 'pending', customer: 'Global Freight LLC', elapsed: '—', pallets: 0, forecastCtns: 45, forecastPlts: 4, ships: [{ type: 'FBA', n: 5 }, { type: 'WM', n: 3 }, { type: '私卡派', n: 2 }] }
  ];
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function taskNo(task) {
    return task.mode === 'air' ? (task.bl || '') : (task.cab || '');
  }
  function taskSub(task) {
    if (task.mode === 'air') return esc(task.customer || '') + ' · 空运';
    return esc(task.customer || '') + ' · ' + esc(task.size || '');
  }
  function shipsHtml(ships) {
    var list = ships || [];
    var total = list.reduce(function (n, x) { return n + (Number(x.n) || 0); }, 0);
    var detail = list.map(function (x) { return esc(x.type) + ' ' + (Number(x.n) || 0); }).join(' · ');
    var text = detail ? (total + ' · ' + detail) : String(total);
    return '<span><span class="pad-task-k">地址数量</span><strong>' + text + '</strong></span>';
  }

  var nameEl = document.getElementById('padUserName');
  var avatarEl = document.getElementById('padUserAvatar');
  var who = '小明';
  try {
    var u = localStorage.getItem('pad.login.display') || localStorage.getItem('pad.login.username') || '';
    if (/[\u4e00-\u9fff]/.test(u)) who = u.trim();
  } catch (e) {}
  nameEl.textContent = who;
  avatarEl.textContent = who.slice(0, 1);
  document.getElementById('padDrawerName').textContent = who;
  document.getElementById('padDrawerAvatar').textContent = who.slice(0, 1);

  function go(no) {
    window.location.href = 'print-pallet.html?cab=' + encodeURIComponent(no);
  }

  document.getElementById('taskCount').textContent = String(TASKS.length);
  document.getElementById('statArrived').textContent = String(TASKS.length);
  document.getElementById('statWaiting').textContent = String(TASKS.filter(function (t) { return t.status !== 'working'; }).length);
  document.getElementById('statWorking').textContent = String(TASKS.filter(function (t) { return t.status === 'working'; }).length);
  document.getElementById('statDone').textContent = '0';

  var grid = document.getElementById('taskGrid');
  TASKS.forEach(function (task) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pad-task' + (task.status === 'working' ? ' is-working' : '');
    var no = taskNo(task);
    var elapsed = task.status === 'working'
      ? '<span class="pad-task-elapsed">' + task.elapsed + '</span>'
      : '';
    var doneLine = task.status === 'working'
      ? '<span><span class="pad-task-k">实际</span><strong>' + task.doneCtns + '件/' + task.pallets + '板</strong></span>'
      : '';
    btn.innerHTML =
      '<span class="pad-task-head">' +
        '<span class="pad-task-main">' +
          '<span class="pad-task-cab">' + esc(no) + '</span>' +
          '<span class="pad-task-who">' + taskSub(task) + '</span>' +
        '</span>' +
        '<span class="pad-task-status">' +
          '<span class="pad-task-tag">' + (task.status === 'working' ? '拆柜中' : '未拆') + '</span>' +
          elapsed +
        '</span>' +
      '</span>' +
      '<span class="pad-task-bits">' +
        doneLine +
        '<span><span class="pad-task-k">预报</span><strong>' + task.forecastCtns + '件/' + task.forecastPlts + '板</strong></span>' +
        shipsHtml(task.ships) +
      '</span>';
    btn.addEventListener('click', function () { go(no); });
    grid.appendChild(btn);
  });

  var input = document.getElementById('cabInput');
  var hint = document.getElementById('scanHint');
  document.getElementById('scanForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var cab = (input.value || '').trim();
    if (!cab) {
      hint.hidden = false;
      hint.textContent = '请输入柜号';
      input.focus();
      return;
    }
    go(cab);
  });
  input.addEventListener('input', function () {
    hint.hidden = true;
    hint.textContent = '';
  });

  input.focus();
  bindPadDrawer();
})();

function bindPadDrawer() {
  var edge = document.getElementById('padEdge');
  var mask = document.getElementById('padDrawerMask');
  var drawer = document.getElementById('padDrawer');
  var page = (location.pathname.split('/').pop() || 'home.html');
  function setOpen(open) {
    mask.hidden = !open;
    drawer.hidden = !open;
    edge.setAttribute('aria-expanded', open ? 'true' : 'false');
    edge.setAttribute('aria-label', open ? '收起菜单' : '展开菜单');
  }
  edge.addEventListener('click', function () { setOpen(drawer.hidden); });
  mask.addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });
  drawer.querySelectorAll('.pad-nav-item').forEach(function (btn) {
    var href = btn.getAttribute('data-nav');
    var here = href === page;
    btn.classList.toggle('is-current', here);
    btn.addEventListener('click', function () {
      if (here) { setOpen(false); return; }
      window.location.href = href;
    });
  });
}
  </script>
</body>
</html>
