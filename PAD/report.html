          '<div><span>清点人员</span><strong>' + esc(report.people) + '</strong></div>' +
          '<div><span>装柜混乱</span><strong>' + yn(report.messy) + '</strong></div>' +
          '<div><span>柜子异常</span><strong>' + yn(report.abnormal) + '</strong></div>' +
          '<div><span>件数（预报 / 实际）</span>' + pairHtml(report.forecastCtns, actual.ctns) + '</div>' +
          '<div><span>板数（预报 / 实际）</span>' + pairHtml(report.forecastPlts, actual.plts, '', false) + '</div>' +
          '<div><span>预报重量</span><strong>' + measure.lbs.toFixed(2) + ' ' + weightUnit(measure.lbs) + '</strong></div>' +
          '<div><span>预报方数</span><strong>' + measure.cbm.toFixed(3) + ' m³</strong></div>' +
          '<div class="is-wide"><span>备注</span><strong>' + dash(report.remark) + '</strong></div>' +
          '<div class="is-wide"><span>附件</span>' + attachHtml + '</div>' +
        '</div></section>' +
        '<section class="pad-report-section">' +
          '<div class="pad-report-section-head">' +
            '<h4>拆柜清单</h4>' +
            '<span class="pad-report-ship-count">共 ' + shipCount + ' 个货件</span>' +
          '</div>' +
          shipHtml +
        '</section>' +
      '</div>';
    browse.hidden = true;
    boards.hidden = true;
    detail.hidden = false;
    document.body.classList.add('is-report-detail');
    document.getElementById('reportBack').addEventListener('click', closeReport);
    document.getElementById('reportDownload').addEventListener('click', function () {
      reportConfirm('下载明细', '确认下载拆柜明细？', function (ok) {
        if (!ok) return;
        reportToast('已开始下载实际拆柜明细（演示）');
      });
    });
    detail.querySelectorAll('[data-attach-i]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openReportPreview(files[Number(btn.getAttribute('data-attach-i'))]);
      });
    });
    bindShipBoards(detail);
    var scroll = detail.querySelector('.pad-report-detail-scroll');
    if (scroll) scroll.scrollTop = 0;
  }
  function closeReportPreview() {
    document.getElementById('reportPreview').hidden = true;
  }
  function openReportPreview(file) {
    if (!file) return;
    var body = document.getElementById('reportPreviewBody');
    document.getElementById('reportPreviewTitle').textContent = file.name || '附件';
    body.className = 'pad-report-preview-body' + (file.kind === 'image' ? ' is-image' : '');
    body.textContent = file.kind === 'image' ? '图片预览' : '文件预览';
    document.getElementById('reportPreview').hidden = false;
  }
  function closeReport() {
    closeReportPreview();
    closeBoardsPage();
    activeReport = null;
    detail.hidden = true;
    detail.innerHTML = '';
    browse.hidden = false;
    document.body.classList.remove('is-report-detail');
    document.querySelector('.pad-home-main').scrollTop = 0;
  }
  function renderList() {
    var cab = (document.getElementById('qCab').value || '').trim().toUpperCase();
    var provider = (providerEl.value || '').trim();
    var from = (document.getElementById('qFrom').value || '').trim();
    var to = (document.getElementById('qTo').value || '').trim();
    var rows = REPORTS.filter(function (r) {
      if (cab && r.cab.toUpperCase().indexOf(cab) < 0) return false;
      if (provider && r.provider !== provider) return false;
      if (datePreset === 'today') return r.date === today;
      if (datePreset === 'yesterday') return r.date === yesterday;
      return dayOk(r.date, from, to);
    });
    rows.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    countEl.textContent = '共 ' + rows.length + ' 个';
    if (!rows.length) {
      list.innerHTML = '<div class="pad-report-empty">没有符合条件的拆柜报告</div>';
      return;
    }
    list.innerHTML = '';
    rows.forEach(function (report) {
      var actual = actualOf(report);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pad-report-card';
      btn.innerHTML =
        '<span class="pad-report-cab">' + esc(report.cab) + '</span>' +
        '<span class="pad-report-bits">' +
          '<span class="is-date-row"><span class="pad-report-k">拆柜日期</span><strong>' + esc(report.date) + '</strong><span class="pad-report-dur"><em>时长</em>' + durationOf(report) + '</span></span>' +
          '<span><span class="pad-report-k">拆柜服务商</span><strong>' + esc(report.provider) + '</strong></span>' +
          '<span><span class="pad-report-k">拆柜数据</span><strong>' + actual.ctns + '件｜' + actual.plts + '板</strong></span>' +
          '<span><span class="pad-report-k">地址数量</span><strong>' + addrsText(report) + '</strong></span>' +
        '</span>';
      btn.addEventListener('click', function () { openReport(report); });
      list.appendChild(btn);
    });
  }
  document.getElementById('qCab').addEventListener('input', renderList);
  providerBtn.addEventListener('click', openProviderPick);
  document.getElementById('cab-pick-close').addEventListener('click', closeProviderPick);
  document.getElementById('cab-pick-mask').addEventListener('click', closeProviderPick);
  document.getElementById('cab-pick-search').addEventListener('click', function () {
    document.getElementById('cab-pick-query').focus();
  });
  document.getElementById('cab-pick-query').addEventListener('input', renderProviderPickList);
  document.getElementById('cab-pick-list').addEventListener('click', function (e) {
    var btn = e.target.closest('.cab-pick-opt');
    if (!btn) return;
    chooseProvider(btn.getAttribute('data-value') || '');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('cab-pick-sheet').hidden) closeProviderPick();
  });
  ['qFrom', 'qTo'].forEach(function (id) {
    var input = document.getElementById(id);
    function onDate() {
      paintDateField(input);
      if (fillingDates) return;
      if (datePreset) {
        datePreset = '';
        paintDayChips();
      }
      renderList();
    }
    input.addEventListener('input', onDate);
    input.addEventListener('change', onDate);
  });
  document.querySelector('.pad-report-date-ico').addEventListener('click', function () {
    var from = document.getElementById('qFrom');
    var to = document.getElementById('qTo');
    var target = !from.value ? from : to;
    target.focus();
    if (typeof target.showPicker === 'function') {
      try { target.showPicker(); } catch (e) {}
    }
  });
  document.querySelectorAll('.pad-report-days button').forEach(function (btn) {
    btn.addEventListener('click', function () { setDayPreset(btn.getAttribute('data-day') || ''); });
  });
  document.getElementById('reportPreviewClose').addEventListener('click', closeReportPreview);
  document.getElementById('reportPreviewMask').addEventListener('click', closeReportPreview);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('reportPreview').hidden) {
      closeReportPreview();
      return;
    }
  });
  paintProvider();
  renderList();
  bindPadDrawer();
})();

function bindPadDrawer() {
  var edge = document.getElementById('padEdge');
  var mask = document.getElementById('padDrawerMask');
  var drawer = document.getElementById('padDrawer');
  var page = (location.pathname.split('/').pop() || 'home.html');
  function setOpen(open) {
    mask.hidden = !open;
    drawer.hidden = !open;
    edge.setAttribute('aria-expanded', open ? 'true' : 'false');
    edge.setAttribute('aria-label', open ? '收起菜单' : '展开菜单');
  }
  edge.addEventListener('click', function () { setOpen(drawer.hidden); });
  mask.addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });
  drawer.querySelectorAll('.pad-nav-item').forEach(function (btn) {
    var href = btn.getAttribute('data-nav');
    var here = href === page;
    btn.classList.toggle('is-current', here);
    btn.addEventListener('click', function () {
      if (here) { setOpen(false); return; }
      window.location.href = href;
    });
  });
}
  </script>
</body>
</html>
